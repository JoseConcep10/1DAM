/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Creador de examen LND — mismo estilo que el menú de repaso y los otros creadores ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  /* Color de LND (portada de EVAGD), el mismo que en el menú de repaso. En claro lleva tinta blanca; en oscuro se aclara. */
  --asig: #C83C3B;
  --asig-tinta: #FFFFFF;
}
.concep-dark { --asig: #E2645F; --asig-tinta: #0B0B0C; }
/* Contraste AA para texto pequeño (los tokens de marca se quedan algo cortos a 11–13 px) */
.concep { --text-3: #62626E; --ok-txt: #0B7A55; --warn-txt: #8A5500; --err-txt: #B00D4A; }
.concep-dark { --text-3: #8A8A98; --ok-txt: var(--ok); --warn-txt: var(--warn); --err-txt: var(--error); }
#app > div { --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text)); --focus: var(--asig); --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent); --err-bg: color-mix(in srgb, var(--error) 10%, transparent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), filter var(--dur-1); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--asig); border-color: transparent; color: var(--asig-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--asig); }
.btn--primary:hover { background: var(--asig); filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { color: var(--err-txt); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: transparent; }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--asig); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.progreso { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- página ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 58ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, color-mix(in srgb, var(--asig) 28%, transparent), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--asig); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; font-family: var(--f-prosa); line-height: 1.5; }
.lbl { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.reglas { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.reglas li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); font: 400 13.5px/1.5 var(--f-prosa); }
.reglas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--asig); flex: none; transform: translateY(-2px); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
.check input { accent-color: var(--asig); width: 16px; height: 16px; margin: 0; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hist { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.nota-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 600 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.nota-chip.ap { color: var(--ok-txt); }
.nota-chip.su { color: var(--err-txt); }
.vacio-txt { color: var(--text-3); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.lista-fallos { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.lista-fallos li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 400 13px/1.45 var(--f-prosa); color: var(--text); }
.lista-fallos li .ok { display: block; margin-top: 4px; color: var(--ok-txt); font-size: 12px; }
.lista-fallos li .x { float: right; margin-left: 8px; font: 600 11px var(--f-ui); color: var(--err-txt); }
textarea.copia { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 400 11.5px/1.4 var(--f-ui); resize: vertical; }
.msg { font-size: 12px; color: var(--text-3); }

/* ---------- examen ---------- */
.examen-page { max-width: 820px; margin: 0 auto; padding: 26px 24px 120px; }
.q { padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; scroll-margin-top: 80px; }
.q .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.q .meta .n { color: var(--acento-texto); font-weight: 600; }
.q h3 { font: 600 17px/1.35 var(--f-titulo); letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--f-prosa); cursor: pointer; transition: border-color var(--dur-1), background-color var(--dur-1); }
.opt:hover { border-color: var(--border-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-strong); font: 600 12px var(--f-ui); color: var(--text-2); }
.opt .t { padding-top: 2px; }
.opt:has(input:checked) { border-color: var(--asig); background: color-mix(in srgb, var(--asig) 9%, var(--bg)); }
.opt:has(input:checked) .l { background: var(--asig); border-color: var(--asig); color: var(--asig-tinta); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.q.hecha .opt { cursor: default; }
.q.hecha .opt.bien { border-color: var(--ok); background: var(--ok-bg); }

  { t: 'Valores por defecto', q: 'Explica la diferencia entre #REQUIRED, #IMPLIED y #FIXED en un atributo.', modelo: '#REQUIRED significa que el atributo es obligatorio. #IMPLIED significa que es opcional. #FIXED "valor" significa que, si aparece, solo puede tener ese valor.', ideas: ['#REQUIRED: obligatorio', '#IMPLIED: opcional', '#FIXED "valor": si aparece, debe valer eso'] },
  { t: 'Cardinalidad', q: '¿Qué significan los símbolos ?, + y * en una DTD?', modelo: 'Indican cuántas veces puede aparecer un elemento. ? significa cero o una vez, + significa una o más veces y * significa cero o más. Si no lleva ningún símbolo, debe aparecer exactamente una vez.', ideas: ['? es cero o una vez', '+ es una o más veces', '* es cero o más; sin símbolo, exactamente una'] },
  { t: 'EMPTY y ANY', q: '¿Qué diferencia hay entre declarar un elemento como EMPTY y como ANY?', modelo: 'EMPTY indica que el elemento no puede tener contenido, como <salto/>. ANY indica que puede contener cualquier cosa: texto y otros elementos declarados. Ninguno de los dos lleva paréntesis.', ideas: ['EMPTY: elemento vacío, sin contenido', 'ANY: puede contener cualquier cosa', 'Se escriben sin paréntesis'] },
  { t: 'DTD interna y externa', q: '¿Qué diferencia hay entre una DTD interna y una externa?', modelo: 'La interna se escribe dentro del propio XML, entre corchetes en el DOCTYPE. La externa está en un fichero .dtd aparte y se enlaza con SYSTEM; así se puede reutilizar en varios documentos. El fichero .dtd no lleva DOCTYPE.', ideas: ['Interna: dentro del XML, entre corchetes', 'Externa: fichero .dtd enlazado con SYSTEM', 'La externa se puede reutilizar'] },
  { t: 'SYSTEM y PUBLIC', q: '¿Qué diferencia hay entre SYSTEM y PUBLIC en un DOCTYPE?', modelo: 'SYSTEM apunta a una DTD propia mediante su ruta o URL, por ejemplo SYSTEM "tienda.dtd". PUBLIC se usa con DTD públicas y estándar, como la de XHTML, y lleva un identificador público además de una URL.', ideas: ['SYSTEM: DTD propia, con su ruta o URL', 'PUBLIC: DTD estándar con identificador público', 'Ejemplo de cada uno'] },
  { t: 'Espacios de nombres', q: '¿Para qué sirven los espacios de nombres en XML?', modelo: 'Sirven para mezclar en un mismo documento etiquetas de distintos vocabularios que se llaman igual sin que haya conflicto. Cada vocabulario se identifica con un prefijo asociado a una URI.', ideas: ['Evitan conflictos entre nombres iguales', 'Permiten mezclar vocabularios en un documento', 'Cada uno se identifica con un prefijo y una URI'] },
  { t: 'Declarar un espacio de nombres', q: '¿Cómo se declara y se usa un espacio de nombres? Pon un ejemplo.', modelo: 'Se declara con el atributo xmlns:prefijo="URI", normalmente en el raíz, y se usa escribiendo el prefijo delante de la etiqueta. Ejemplo: xmlns:geo="http://ejemplo.com/geografia" y después <geo:capital>. La URI no tiene que existir en la web.', ideas: ['Atributo xmlns:prefijo="URI"', 'Se usa como prefijo:etiqueta', 'La URI solo identifica, no tiene que existir'] },
  { t: 'DOM', q: '¿Qué es DOM en relación con XML?', modelo: 'DOM (Document Object Model) es una forma de representar el documento en memoria como un árbol de nodos, con el raíz arriba y los elementos, atributos y textos como ramas. Los programas lo recorren y lo modifican a través de esa estructura.', ideas: ['Representa el documento como un árbol de nodos', 'Lo carga el analizador en memoria', 'Permite recorrer y modificar el documento desde un programa'] },
  { t: 'Elemento vacío', q: '¿Cómo se escribe un elemento vacío en XML? Pon dos formas.', modelo: 'Se puede escribir con apertura y cierre seguidos, como <br></br>, o con la forma abreviada <br/>. Lo que no vale es dejarlo sin cerrar, como <br>.', ideas: ['Forma <br></br>', 'Forma abreviada <br/>', 'No vale dejarlo sin cerrar'] },
  { t: 'Coma y barra', q: 'En una DTD, ¿qué diferencia hay entre separar con coma y separar con barra vertical?', modelo: 'La coma indica una secuencia: aparecen todos los elementos y en ese orden. La barra | indica una elección: aparece uno u otro. Por ejemplo, (nombre, email) exige los dos y (telefono | email) solo uno.', ideas: ['Coma: todos y en el orden indicado', 'Barra: uno u otro', 'Ejemplo de cada uno'] },
  { t: 'ATTLIST', q: 'Explica las partes de esta línea: <!ATTLIST libro isbn ID #REQUIRED>.', modelo: 'ATTLIST declara atributos. libro es el elemento al que pertenecen, isbn es el nombre del atributo, ID es su tipo (identificador único) y #REQUIRED indica que es obligatorio.', ideas: ['libro es el elemento y isbn el atributo', 'ID es el tipo del atributo', '#REQUIRED indica que es obligatorio'] },
  { t: 'Entidades', q: '¿Qué es una entidad general en una DTD y cómo se usa?', modelo: 'Es un nombre abreviado para un texto que se repite. Se declara con <!ENTITY centro "CIFP César Manrique"> y se usa en el XML como &centro;, que el analizador sustituye por el texto completo.', ideas: ['Nombre que sustituye a un texto', 'Se declara con <!ENTITY nombre "texto">', 'Se usa como &nombre;'] },
  { t: 'Etiquetas cruzadas', q: '¿Qué es anidar bien las etiquetas en XML? Da un ejemplo de error.', modelo: 'Es cerrar siempre primero la última etiqueta que se abrió, sin cruzarlas. Por ejemplo, <b><i>hola</b></i> es incorrecto y <b><i>hola</i></b> es correcto.', ideas: ['Se cierra primero la última etiqueta abierta', 'Ejemplo de cruce incorrecto', 'Ejemplo correcto'] },
  { t: 'Comillas en atributos', q: '¿Cómo deben escribirse los valores de los atributos en XML? ¿Y si el valor lleva comillas dobles?', modelo: 'Siempre entre comillas, dobles o simples. Si el valor contiene comillas dobles, se pueden usar comillas simples por fuera (frase=\'Dijo "hola"\') o escribir la entidad &quot; dentro.', ideas: ['Los valores siempre van entre comillas', 'Se pueden usar simples o dobles', 'Si lleva comillas dobles, usar simples por fuera o &quot;'] },
  { t: 'IDREFS', q: '¿En qué se diferencia IDREFS de IDREF?', modelo: 'IDREF contiene la referencia a un único ID. IDREFS contiene varias referencias a ID separadas por espacios, por ejemplo "m1 m3".', ideas: ['IDREF: una sola referencia', 'IDREFS: varias referencias', 'Van separadas por espacios'] },
  { t: 'Contenido mixto', q: '¿Qué es un contenido mixto y cómo se declara en una DTD?', modelo: 'Es un elemento que mezcla texto con otros elementos, como un párrafo con negritas. Se declara con #PCDATA en primer lugar, las barras y el asterisco final: <!ELEMENT p (#PCDATA | b | i)*>.', ideas: ['Mezcla texto con elementos hijos', '#PCDATA va el primero', 'El grupo termina en )*'] },
  { t: 'Analizador', q: '¿Qué hace un analizador (parser) de XML y en qué se diferencia uno validador de otro que no lo es?', modelo: 'Un analizador lee el documento XML y comprueba que está bien formado. Uno validador, además, lo comprueba contra la DTD y dice si es válido. Si el documento no está bien formado, ninguno puede procesarlo.', ideas: ['Lee el XML y comprueba que está bien formado', 'El validador comprueba además la DTD', 'Con un error de sintaxis no se procesa'] },
  { t: 'DOCTYPE', q: '¿Qué indica el nombre que se escribe tras DOCTYPE y dónde se coloca la declaración?', modelo: 'El nombre debe ser el del elemento raíz del documento. La declaración se coloca después de <?xml ...?> y antes del elemento raíz.', ideas: ['Es el nombre del elemento raíz', 'Va después de la declaración <?xml?>', 'Va antes del elemento raíz'] }
];

</script>
<script>
// Creador de examen · Lenguajes de marcas y sistemas de gestión de información (LND).
// Mismo formato que el examen real de UT1–UT2: 5 ejercicios de 2 puntos.
//   1. Qué es HTML, qué es XML y en qué se diferencian (se corrige marcando ideas).
//   2. XML corto con 5 fallos: marcar la línea (0,2, automático) + arreglo (0,2, marcando si coincide).
//   3. Una DTD y 4 XML: valida o no (automático). En los que no validan, 0,25 por acertar y 0,25 por el porqué.
//   4. DTD con 5 huecos (0,4 cada uno, automático).
//   5. Tres preguntas cortas de teoría (se corrigen marcando ideas).
// CONFIG (id, unidades, titulo) lo pone build.js; EJ1…EJ5 vienen del banco.
'use strict';
const app = document.getElementById('app');
const ASIG = 'Lenguajes de Marcas';
const P_EJ = 2, N_FALLOS = 5, P_LINEA = 0.2, P_ARREGLO = 0.2, P_HUECO = 0.4, N_CORTAS = 3;
const LETRA = ['A', 'B', 'C', 'D'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const fmtc = n => fmt(n).replace(/,?0+$/, '') || '0';
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
// Respuesta de un hueco: sin espacios, comillas simples = dobles y, en las listas (a|b) o (#PCDATA|a|b)*, da igual el orden.
const norm = s => {
  const t = String(s).replace(/\s+/g, '').replace(/'([^'"]*)'/g, '"$1"');   // solo pares de comillas simples
  const m = t.match(/^\(([^(),]+\|[^(),]+)\)(\*?)$/);
  if (!m) return t;
  const it = m[1].split('|');
  // en el contenido mixto #PCDATA tiene que ir el primero: solo se ordena lo que va detrás
  if (it.includes('#PCDATA')) return it[0] === '#PCDATA' ? '(#PCDATA|' + it.slice(1).sort().join('|') + ')' + m[2] : t;
  return '(' + it.sort().join('|') + ')' + m[2];
};
const sinTildes = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const fichero = (d, ext) => sinTildes((d.tema || 'documento').toLowerCase()).replace(/\s+/g, '_') + ext;

// ---------- almacenamiento ----------
const K = s => CONFIG.id + '_' + s;
const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
const seenMap = () => store(K('seen')) || {};
const historial = () => store(K('hist')) || [];
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

// Clave estable de cada elemento del banco (para rotar lo menos visto)
const clave = (ej, d, i) => ej + ':' + (d.q || d.tema || '') + ':' + i;
EJ1.forEach((d, i) => d._k = clave('ej1', d, i));
EJ2.forEach((d, i) => d._k = clave('ej2', d, i));
EJ3.forEach((d, i) => d._k = clave('ej3', d, i));
EJ4.forEach((d, i) => d._k = clave('ej4', d, i));
EJ5.forEach((d, i) => d._k = clave('ej5', d, i));

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>'
};
const LOCKUP = '<a class="c-lockup" href="#" data-ir="inicio" aria-label="Inicio"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#concep-simbolo"/></svg><span class="c-wordmark">Concep</span></a>';
const NOMBRE = 'Creador de examen ' + CONFIG.unidades;

function mount(html) {
  document.body.classList.toggle('claro', tema === 'light');
  const root = document.createElement('div');
  root.className = tema === 'light' ? 'concep' : 'concep-dark';
  root.innerHTML = html;
  app.replaceChildren(root);
  window.scrollTo(0, 0);
}
function topBar(centro, derecha) {
  return '<header class="top">' + LOCKUP + '<span class="sep" aria-hidden="true"></span>' + centro + '<div class="grow"></div><div class="acc">' + (derecha || '') +
    '<button class="btn btn--ghost icon-btn" data-tema title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">' + (tema === 'light' ? IC.moon : IC.sun) + '</button></div></header>';
}
const MODULO = '<div class="modulo"><b>' + ASIG + '</b><span>' + NOMBRE + '</span></div>';
const bloque = (fich, texto) => '<div class="codigo">' + (fich ? '<div class="fich">' + esc(fich) + '</div>' : '') + '<pre>' + esc(texto) + '</pre></div>';

// ---------- inicio ----------
const DESCR = [
  ['1', 'Qué es HTML, qué es XML y en qué se diferencian.'],
  ['2', 'Un XML corto con 5 fallos: marca las líneas y escribe cómo se arreglan.'],
  ['3', 'Una DTD y 4 XML: di cuáles validan y, en los que no, por qué.'],
  ['4', 'Una DTD con 5 huecos (+, *, ?, IDREF, #REQUIRED…): complétala mirando el XML.'],
  ['5', 'Tres preguntas cortas de teoría básica.']
];
function vistaInicio() {
  const h = historial();
  const media = h.length ? h.reduce((s, x) => s + x, 0) / h.length : null;
  const total = EJ1.length + EJ2.length + EJ3.length + EJ4.length + EJ5.length;
  mount(topBar(MODULO) +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">Concep · ' + ASIG + ' · ' + esc(CONFIG.unidades) + '</span>' +
    '<h1>' + esc(NOMBRE) + '</h1><p>' + esc(CONFIG.titulo) + '. Cinco ejercicios como los del examen real, de 2 puntos cada uno. Lo que se puede corregir solo se corrige solo; lo que escribes lo comparas tú con la solución.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + total + '</div><div class="l">Ejercicios en el banco</div></div><div class="stat"><div class="v">' + h.length + '</div><div class="l">' + (h.length === 1 ? 'Examen' : 'Exámenes') + '</div></div><div class="stat"><div class="v">' + (media === null ? '—' : fmt(media)) + '</div><div class="l">Nota media</div></div></div></section>' +
    '<div class="grid2">' +
    '<section class="card card--accent" aria-labelledby="h-nuevo"><h2 id="h-nuevo">Nuevo examen</h2><p class="sub">Cada examen sale con otras versiones de los ejercicios, primero las que menos has visto.</p>' +
    '<ul class="reglas"><li>5 ejercicios de 2 puntos: nota sobre 10.</li><li>Se corrigen solos las líneas con fallo, si cada XML valida y los huecos de la DTD.</li><li>Las respuestas escritas las corriges tú marcando las ideas de la solución.</li></ul>' +
    '<div class="fila"><button class="btn btn--primary btn--lg" data-empezar>' + IC.play + 'Empezar examen</button></div>' +
    (h.length ? '<div class="hist"><span>Últimos intentos</span>' + h.slice(-8).map(x => '<span class="nota-chip ' + (x >= 5 ? 'ap' : 'su') + '">' + fmt(x) + '</span>').join('') + '</div>' : '') +
    '</section>' +
    '<section class="card" aria-labelledby="h-como"><h2 id="h-como">Cómo es el examen</h2><p class="sub">El mismo orden y el mismo tipo de ejercicios que el examen de UT1–UT2.</p>' +
    '<ol class="lista-ej">' + DESCR.map(([n, t]) => '<li><span class="n">' + n + '</span><span>' + esc(t) + '</span><span class="p">2 p</span></li>').join('') + '</ol></section>' +
    '</div></main>');
  document.title = NOMBRE + ' · ' + ASIG;
}

// ---------- examen ----------
let examen = null;
function porVistas(pool) { const seen = seenMap(); return shuffle(pool).sort((a, b) => (seen[a._k] || 0) - (seen[b._k] || 0)); }
const nueva = d => ({ d, texto: '', marcadas: new Set() });
function empezar() {
  const e3 = porVistas(EJ3)[0];
  examen = {
    corregido: false, guardado: false,
    ej1: nueva(porVistas(EJ1)[0]),
    ej2: { d: porVistas(EJ2)[0], lineas: new Map(), ok: new Set() },          // lineas: nº → texto del arreglo; ok: arreglos que coinciden
    ej3: { d: e3, orden: shuffle([0, 1, 2, 3]), resp: [null, null, null, null], porque: ['', '', '', ''], ok: new Set() },
    ej4: { d: porVistas(EJ4)[0], resp: ['', '', '', '', ''] },
    ej5: porVistas(EJ5).slice(0, N_CORTAS).map(nueva)
  };
  vistaExamen();
}
const hecho = [
  () => examen.ej1.texto.trim() !== '',
  () => examen.ej2.lineas.size === N_FALLOS,
  () => examen.ej3.resp.every(r => r !== null),
  () => examen.ej4.resp.every(r => r.trim() !== ''),
  () => examen.ej5.every(x => x.texto.trim() !== '')
];

// ----- puntos -----
const pIdeas = (x, max) => x.d.ideas.length ? max * x.marcadas.size / x.d.ideas.length : 0;
// Un fallo puede marcarse en su línea o en una alternativa (p. ej. apertura o cierre de una etiqueta que no coincide).
const lineasDe = f => [f.linea, ...(f.alt || [])];
const fallosLineas = () => new Set(examen.ej2.d.fallos.flatMap(lineasDe));
const marcadaDe = f => lineasDe(f).find(n => examen.ej2.lineas.has(n));   // línea con la que el alumno encontró el fallo
function puntos() {
  const e = examen;
  const p1 = pIdeas(e.ej1, P_EJ);
  const encontrados = e.ej2.d.fallos.filter(f => marcadaDe(f) !== undefined);
  const aciertosL = encontrados.length;
  const arreglos = encontrados.filter(f => e.ej2.ok.has(f.linea)).length;
  const p2 = aciertosL * P_LINEA + arreglos * P_ARREGLO;
  const pXml = P_EJ / 4;
  const p3 = e.ej3.d.xmls.reduce((s, x, i) => {
    const r = e.ej3.resp[i];
    if (r === null || r !== x.valido) return s;
    return s + (x.valido ? pXml : pXml / 2 + (e.ej3.ok.has(i) ? pXml / 2 : 0));
  }, 0);
  const p4 = e.ej4.d.huecos.reduce((s, h, i) => s + (huecoBien(h, e.ej4.resp[i]) ? P_HUECO : 0), 0);
  const p5 = e.ej5.reduce((s, x) => s + pIdeas(x, P_EJ / N_CORTAS), 0);
  const parts = [p1, p2, p3, p4, p5];
  return { parts, total: parts.reduce((s, x) => s + x, 0), aciertosL, arreglos };
}
const huecoBien = (h, r) => r.trim() !== '' && h.ok.some(o => norm(o) === norm(r));

// ----- vistas de cada ejercicio -----
function cab(n, titulo, c) {
  return '<div class="meta"><span class="n">Ejercicio ' + n + '</span><span>· ' + titulo + '</span><span class="pts" id="pe' + n + '">' + (c ? fmt(puntos().parts[n - 1]) + ' / ' : '') + P_EJ + ' p</span></div>';
}
function ideasHtml(x, id, max) {
  return '<div class="ideas" role="group" aria-labelledby="ideas-' + id + '"><span class="lbl" id="ideas-' + id + '">Marca las ideas que has puesto en tu respuesta</span>' +
    x.d.ideas.map((idea, k) => '<label class="idea"><input type="checkbox" data-idea="' + id + ':' + k + '"' + (x.marcadas.has(k) ? ' checked' : '') + (examen.guardado ? ' disabled' : '') + '><span>' + esc(idea) + '</span></label>').join('') +
    '<div class="puntos-dev" id="pi-' + id + '">' + fmt(pIdeas(x, max)) + ' de ' + fmtc(max) + ' puntos</div></div>';
}
function htmlEj1(c) {
  const x = examen.ej1;
  return '<article class="q' + (c ? ' hecha' : '') + '" id="p0">' + cab(1, 'HTML y XML', c) +
    '<h3 id="h-ej1">' + esc(x.d.q) + '</h3>' +
    '<textarea class="resp" data-txt="ej1" aria-labelledby="h-ej1" placeholder="Escribe tu respuesta…"' + (c ? ' readonly' : '') + '>' + esc(x.texto) + '</textarea>' +
    (c ? '<div class="modelo"><b>Respuesta modelo</b><br>' + esc(x.d.modelo) + '</div>' + ideasHtml(x, 'ej1', P_EJ) : '') + '</article>';
}
function htmlEj2(c) {
  const e = examen.ej2, fl = fallosLineas();
  const encontrado = n => e.d.fallos.some(f => marcadaDe(f) !== undefined && lineasDe(f).includes(n));
  const lineas = e.d.xml.map((txt, i) => {
    const n = i + 1, marc = e.lineas.has(n);
    const cls = c ? (marc && fl.has(n) ? ' bien' : marc ? ' mal' : e.d.fallos.some(f => f.linea === n) && !encontrado(n) ? ' falta' : '') : '';
    return '<label class="ln' + cls + '"><input type="checkbox" data-ln="' + n + '"' + (marc ? ' checked' : '') + (c ? ' disabled' : '') + ' aria-label="Línea ' + n + '"><span class="num">' + n + '</span><code>' + esc(txt) + '</code></label>';
  }).join('');
  let pie;
  if (!c) {
    pie = '<p class="ayuda">Pulsa una línea para marcarla (máximo ' + N_FALLOS + ') y escribe debajo qué falla y cómo se arregla. <span id="aviso-ej2" role="status"></span></p><div class="marcadas" id="marcadas">' + htmlMarcadas() + '</div>';
  } else {
    pie = '<div class="leyenda"><span class="b">Fallo encontrado</span><span class="m">Marcada sin fallo</span><span class="f">Fallo sin marcar</span></div>' +
      '<div class="sol">' + e.d.fallos.slice().sort((a, b) => a.linea - b.linea).map(f => {
        const m = marcadaDe(f), marc = m !== undefined, tuyo = marc ? e.lineas.get(m) : '';
        return '<div class="sol-it"><div class="cab">Línea ' + f.linea + (f.alt ? ' (o ' + f.alt.join(', ') + ')' : '') + (marc ? '<span class="estado bien">Encontrado · +' + fmtc(P_LINEA) + '</span>' : '<span class="estado blanco">No la marcaste</span>') + '</div>' +
          esc(f.que) + '<br>Queda así: <code>' + esc(f.arreglo.trim()) + '</code>' +
          (marc ? '<div class="tuyo">Tu respuesta: ' + (tuyo.trim() ? esc(tuyo) : '<i>(vacía)</i>') + '</div>' +
            '<label class="idea"><input type="checkbox" data-arreglo="' + f.linea + '"' + (e.ok.has(f.linea) ? ' checked' : '') + (examen.guardado ? ' disabled' : '') + '><span>Mi arreglo coincide (+' + fmtc(P_ARREGLO) + ')</span></label>' : '') + '</div>';
      }).join('') +
      [...e.lineas.keys()].filter(n => !fl.has(n)).sort((a, b) => a - b).map(n => '<div class="sol-it"><div class="cab">Línea ' + n + '<span class="estado mal">Esta línea está bien · 0</span></div><code>' + esc(e.d.xml[n - 1].trim()) + '</code></div>').join('') + '</div>';
  }
  return '<article class="q' + (c ? ' hecha' : '') + '" id="p1">' + cab(2, 'Encuentra los fallos', c) +
    '<h3>Este XML tiene ' + N_FALLOS + ' fallos que hacen que no esté bien formado. Encuéntralos y corrígelos.</h3>' +
    '<div class="codigo"><div class="fich">' + esc(fichero(e.d, '.xml')) + '</div><div class="lineas" role="group" aria-label="Líneas del XML">' + lineas + '</div></div>' + pie + '</article>';
}
function htmlMarcadas() {
  const e = examen.ej2;
  if (!e.lineas.size) return '';
  return [...e.lineas.keys()].sort((a, b) => a - b).map(n => '<div class="marcada"><b>Línea ' + n + '</b><input class="campo" data-arr="' + n + '" value="' + esc(e.lineas.get(n)) + '" placeholder="Qué falla y cómo queda" aria-label="Arreglo de la línea ' + n + '"></div>').join('');
}
function htmlEj3(c) {
  const e = examen.ej3, pXml = P_EJ / 4;
  const items = e.orden.map((i, pos) => {
    const x = e.d.xmls[i], r = e.resp[i], L = LETRA[pos];
    const op = (val, txt) => {
      const cls = c ? (val === x.valido ? ' bien' : r === val ? ' mal' : '') : '';
      return '<label class="' + cls.trim() + '"><input type="radio" name="v' + i + '" data-v="' + i + '" value="' + val + '"' + (r === val ? ' checked' : '') + (c ? ' disabled' : '') + '>' + txt + '</label>';
    };
    let sol = '';
    if (c) {
      const bien = r === x.valido;
      const est = r === null ? '<span class="estado blanco">En blanco · 0</span>' : bien ? '<span class="estado bien">' + (x.valido ? 'Correcto · +' + fmtc(pXml) : 'Correcto · +' + fmtc(pXml / 2)) + '</span>' : '<span class="estado mal">Incorrecto · 0</span>';
      sol = '<div class="expl"><b>' + (x.valido ? 'Valida' : 'No valida') + '.</b> ' + esc(x.motivo) + ' ' + est + '</div>' +
        (!x.valido && bien ? '<label class="idea"><input type="checkbox" data-porque="' + i + '"' + (e.ok.has(i) ? ' checked' : '') + (examen.guardado ? ' disabled' : '') + '><span>Mi explicación coincide (+' + fmtc(pXml / 2) + ')</span></label>' : '');
    }
    return '<div class="xml-it">' + bloque(L + '.xml', x.xml) +
      '<div class="vnv" role="radiogroup" aria-label="¿Valida ' + L + '.xml?">' + op(true, 'Valida') + op(false, 'No valida') + '</div>' +
      '<textarea class="resp" data-porque-txt="' + i + '" placeholder="Si no valida, explica por qué" aria-label="Por qué no valida ' + L + '.xml"' + (c ? ' readonly' : '') + '>' + esc(e.porque[i]) + '</textarea>' + sol + '</div>';
  }).join('');
  return '<article class="q' + (c ? ' hecha' : '') + '" id="p2">' + cab(3, 'Valida o no valida', c) +
    '<h3>Los cuatro XML usan esta DTD. Di cuáles son válidos y, en los que no, explica por qué.</h3>' +
    '<p class="enun">Todos están bien formados: el fallo, si lo hay, es contra la DTD. Cada XML vale ' + fmtc(pXml) + ' (en los que no validan, la mitad es el porqué).</p>' +
    bloque(e.d.archivo, e.d.dtd) + '<div class="xmls">' + items + '</div></article>';
}
function htmlEj4(c) {
  const e = examen.ej4;
  let k = 0;
  const dtd = esc(e.d.dtd).replace(/__(\d)__/g, (_, d) => {
    const i = +d - 1, h = e.d.huecos[i], r = e.resp[i];
    const cls = c ? (huecoBien(h, r) ? ' bien' : ' mal') : '';
    k++;
    return '<input class="hueco' + cls + '" data-hueco="' + i + '" value="' + esc(r) + '" size="' + Math.max(5, (r || '').length + 1) + '" autocomplete="off" spellcheck="false" aria-label="Hueco ' + d + '"' + (c ? ' readonly' : '') + '><span class="hueco-n" aria-hidden="true">' + d + '</span>';
  });
  const sol = c ? '<div class="sol">' + e.d.huecos.map((h, i) => {
    const bien = huecoBien(h, e.resp[i]);
    return '<div class="sol-it"><div class="cab">Hueco ' + (i + 1) + ': <code>' + esc(h.ok[0]) + '</code>' + (bien ? '<span class="estado bien">Correcto · +' + fmtc(P_HUECO) + '</span>' : e.resp[i].trim() ? '<span class="estado mal">Pusiste ' + esc(e.resp[i]) + ' · 0</span>' : '<span class="estado blanco">En blanco · 0</span>') + '</div>' +
      esc(h.explicacion) + (h.ok.length > 1 ? '<div class="tuyo">También vale: ' + h.ok.slice(1).map(o => '<code>' + esc(o) + '</code>').join(' ') + '</div>' : '') + '</div>';
  }).join('') + '</div>' : '';
  return '<article class="q' + (c ? ' hecha' : '') + '" id="p3">' + cab(4, 'Completa la DTD', c) +
    '<h3>A esta DTD le faltan 5 cosas. Complétala para que el XML sea válido.</h3>' +
    '<p class="enun">Cada hueco vale ' + fmtc(P_HUECO) + '. Puede faltar un símbolo (+, *, ?, |), un tipo (#PCDATA, ID, IDREF, CDATA…) o un modificador (#REQUIRED, #IMPLIED…).</p>' +
    '<div class="dos">' + bloque(fichero(e.d, '.xml'), e.d.xml) +
    '<div class="codigo"><div class="fich">' + esc(e.d.archivo) + '</div><pre>' + dtd + '</pre></div></div>' + sol + '</article>';
}
function htmlEj5(c) {
  const max = P_EJ / N_CORTAS;
  return '<article class="q' + (c ? ' hecha' : '') + '" id="p4">' + cab(5, 'Preguntas cortas', c) +
    examen.ej5.map((x, i) => '<div class="corta"><h4 id="h-c' + i + '">' + String.fromCharCode(97 + i) + ') ' + esc(x.d.q) + '</h4>' +
      '<textarea class="resp" data-txt="ej5:' + i + '" aria-labelledby="h-c' + i + '" placeholder="Respuesta corta…"' + (c ? ' readonly' : '') + '>' + esc(x.texto) + '</textarea>' +
      (c ? '<div class="modelo"><b>Respuesta modelo</b><br>' + esc(x.d.modelo) + '</div>' + ideasHtml(x, 'ej5-' + i, max) : '') + '</div>').join('') + '</article>';
}
const EJS = [htmlEj1, htmlEj2, htmlEj3, htmlEj4, htmlEj5];

function vistaExamen() {
  mount(topBar('<button class="btn btn--ghost btn--sm" data-salir>' + IC.back + 'Salir</button><div class="modulo"><b>Examen</b><span>5 ejercicios · 10 puntos</span></div>',
    '<span class="progreso" id="prog" aria-live="polite"></span>') +
    '<main class="examen-page fade-in">' + EJS.map(f => f(false)).join('') + '</main>' +
    '<div class="barra-fija"><div class="in"><button class="btn btn--primary" data-corregir>' + IC.check + 'Corregir examen</button><nav class="puntos" aria-label="Ir a un ejercicio" id="puntos"></nav><span class="aviso" id="aviso" role="status"></span></div></div>');
  progreso();
}
function progreso() {
  const r = hecho.filter(f => f()).length;
  const p = document.getElementById('prog'); if (p) p.textContent = r + '/5';
  const pt = document.getElementById('puntos');
  if (pt) pt.innerHTML = hecho.map((f, n) => '<a href="#p' + n + '" class="' + (f() ? 'r' : '') + '" aria-label="Ejercicio ' + (n + 1) + (f() ? ', hecho' : '') + '">' + (n + 1) + '</a>').join('');
}

// ---------- corrección ----------
function corregir() {
  examen.corregido = true;
  const seen = seenMap();
  [examen.ej1.d, examen.ej2.d, examen.ej3.d, examen.ej4.d, ...examen.ej5.map(x => x.d)].forEach(d => { seen[d._k] = (seen[d._k] || 0) + 1; });
  store(K('seen'), seen);
  vistaResultado();
}
// definitiva = false: guardado provisional al ocultar la pestaña; se puede seguir corrigiendo
// y el siguiente guardado sustituye esa misma entrada del historial en vez de añadir otra.
function guardarNota(definitiva = true) {
  if (examen.guardado) return;
  const h = historial(), nota = Math.round(puntos().total * 100) / 100;
  if (examen.enHist && h.length) h[h.length - 1] = nota; else h.push(nota);
  examen.enHist = true;
  if (definitiva) examen.guardado = true;
  store(K('hist'), h.slice(-20));
}
const NOMBRES = ['HTML y XML', 'Fallos', 'Valida', 'Huecos', 'Cortas'];
function htmlCabecera() {
  const p = puntos(), nota = p.total, ap = nota >= 5;
  return '<div class="resultado"><div class="big">' + fmt(nota) + '<small> /10</small></div>' +
    '<div><div class="veredicto ' + (ap ? 'ap' : 'su') + '">' + (nota >= 9 ? 'Sobresaliente' : nota >= 7 ? 'Notable' : nota >= 6 ? 'Bien' : ap ? 'Aprobado' : 'Suspenso') + (!examen.guardado ? ' (falta tu parte de la corrección)' : '') + '</div><div class="medidor"><div style="width:' + Math.min(100, nota * 10) + '%"></div></div>' +
    '<div class="resumen">Ej. 2: ' + pl(p.aciertosL, 'línea encontrada', 'líneas encontradas') + ' de ' + N_FALLOS + ' · Ej. 4: ' + examen.ej4.d.huecos.filter((h, i) => huecoBien(h, examen.ej4.resp[i])).length + ' de 5 huecos</div></div></div>' +
    '<div class="desglose">' + p.parts.map((x, i) => '<div><div class="v">' + fmt(x) + '</div><div class="l">' + (i + 1) + ' · ' + NOMBRES[i] + '</div></div>').join('') + '</div>';
}
function vistaResultado() {
  mount(topBar('<button class="btn btn--ghost btn--sm" data-ir="inicio">' + IC.back + 'Inicio</button><div class="modulo"><b>Resultado</b><span>' + NOMBRE + '</span></div>') +
    '<main class="examen-page fade-in"><section class="card card--accent"><div id="cab">' + htmlCabecera() + '</div>' +
    '<div class="fila" style="margin-top:16px"><button class="btn btn--primary" data-guardar' + (examen.guardado ? ' disabled' : '') + '>' + IC.save + (examen.guardado ? 'Nota guardada' : 'Guardar nota') + '</button>' +
    '<button class="btn" data-empezar>' + IC.play + 'Nuevo examen</button></div></section>' +
    (!examen.guardado ? '<p class="pendiente" style="margin-top:18px"><b>Termina tú la corrección.</b> En los ejercicios 1 y 5 marca las ideas de la solución que hayas puesto; en el 2 y el 3, marca si tu arreglo o tu explicación coinciden. Cuando acabes, pulsa «Guardar nota».</p>' : '') +
    '<h2 class="seccion-t">Corrección</h2>' + EJS.map(f => f(true)).join('') + '</main>');
}
function refrescarPuntos() {
  const p = puntos();
  p.parts.forEach((x, i) => { const el = document.getElementById('pe' + (i + 1)); if (el) el.textContent = fmt(x) + ' / ' + P_EJ + ' p'; });
  document.getElementById('cab').innerHTML = htmlCabecera();
}

// ---------- eventos ----------
function armar(b, texto, alDesarmar) {
  if (b.dataset.c) return false;
  const antes = b.innerHTML;
  b.dataset.c = '1'; b.lastChild.textContent = texto;
  setTimeout(() => { if (b.isConnected && b.dataset.c) { delete b.dataset.c; b.innerHTML = antes; if (alDesarmar) alDesarmar(); } }, 4000);
  return true;
}
function cambiarTema(btn) {
  tema = tema === 'light' ? 'dark' : 'light';
  const root = app.firstElementChild; root.classList.remove('concep', 'concep-dark'); root.classList.add(tema === 'light' ? 'concep' : 'concep-dark');
  document.body.classList.toggle('claro', tema === 'light'); btn.innerHTML = tema === 'light' ? IC.moon : IC.sun;
}
app.addEventListener('input', ev => {
  const t = ev.target;
  if (!examen || examen.corregido) return;
  const d = t.dataset;
  if (d.txt === 'ej1') examen.ej1.texto = t.value;
  else if (d.txt && d.txt.startsWith('ej5:')) examen.ej5[+d.txt.slice(4)].texto = t.value;
  else if (d.arr) examen.ej2.lineas.set(+d.arr, t.value);
  else if (d.porqueTxt !== undefined) examen.ej3.porque[+d.porqueTxt] = t.value;
  else if (d.hueco !== undefined) { examen.ej4.resp[+d.hueco] = t.value; t.size = Math.max(5, t.value.length + 1); }
  else return;
  progreso();
});
app.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (examen && !examen.corregido) {
    if (d.ln) {
      const n = +d.ln, e = examen.ej2, av = document.getElementById('aviso-ej2');
      av.textContent = '';
      if (t.checked) {
        if (e.lineas.size >= N_FALLOS) { t.checked = false; av.textContent = 'Ya tienes ' + N_FALLOS + ' líneas marcadas: desmarca una antes.'; return; }
        e.lineas.set(n, '');
      } else e.lineas.delete(n);
      document.getElementById('marcadas').innerHTML = htmlMarcadas();
      if (t.checked) { const inp = document.querySelector('[data-arr="' + n + '"]'); if (inp) inp.focus({ preventScroll: true }); }
      progreso(); return;
    }
    if (d.v !== undefined) { examen.ej3.resp[+d.v] = t.value === 'true'; progreso(); return; }
  }
  if (examen && examen.corregido && !examen.guardado) {
    if (d.idea) {
      const [id, k] = d.idea.split(':'), x = id === 'ej1' ? examen.ej1 : examen.ej5[+id.split('-')[1]];
      t.checked ? x.marcadas.add(+k) : x.marcadas.delete(+k);
      document.getElementById('pi-' + id).textContent = fmt(pIdeas(x, id === 'ej1' ? P_EJ : P_EJ / N_CORTAS)) + ' de ' + fmtc(id === 'ej1' ? P_EJ : P_EJ / N_CORTAS) + ' puntos';
    } else if (d.arreglo) { t.checked ? examen.ej2.ok.add(+d.arreglo) : examen.ej2.ok.delete(+d.arreglo); }
    else if (d.porque) { t.checked ? examen.ej3.ok.add(+d.porque) : examen.ej3.ok.delete(+d.porque); }
    else return;
    refrescarPuntos();
  }
});
app.addEventListener('click', ev => {
  const b = ev.target.closest('button, a[data-ir]');
  if (!b) return;
  if (b.hasAttribute('data-tema')) return cambiarTema(b);
  if (b.dataset.ir === 'inicio') {
    ev.preventDefault();
    if (examen && !examen.corregido) {   // en pleno examen el logotipo no lo descarta: se sale con «Salir»
      const s = document.querySelector('[data-salir]'), a = document.getElementById('aviso');
      if (a) a.textContent = 'Para dejar el examen pulsa «Salir».';
      if (s) s.focus();
      return;
    }
    if (examen && examen.corregido && !examen.guardado) guardarNota();
    examen = null; return vistaInicio();
  }
  if (b.hasAttribute('data-empezar')) { if (examen && examen.corregido && !examen.guardado) guardarNota(); return empezar(); }
  if (b.hasAttribute('data-guardar')) { guardarNota(); return vistaResultado(); }
  if (b.hasAttribute('data-salir')) {
    if (armar(b, '¿Seguro?')) return;
    examen = null; return vistaInicio();
  }
  if (b.hasAttribute('data-corregir')) {
    const faltan = hecho.filter(f => !f()).length;
    const aviso = document.getElementById('aviso');
    if (faltan && armar(b, 'Corregir igualmente', () => { aviso.textContent = ''; })) { aviso.textContent = (faltan === 1 ? 'Te queda 1 ejercicio' : 'Te quedan ' + faltan + ' ejercicios') + ' sin terminar.'; return; }
    return corregir();
  }
});
const guardarAlSalir = () => { if (examen && examen.corregido && !examen.guardado) guardarNota(false); };
window.addEventListener('beforeunload', guardarAlSalir);
window.addEventListener('pagehide', guardarAlSalir);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarAlSalir(); });
vistaInicio();

</script>
</body>
</html>
