/* Coloca los atributos sin posición (dx/dy null) de los diagramas del banco para que no se pisen con
   entidades, rombos, líneas, cardinalidades ni otros atributos. Usa las mismas medidas que dibujo.js.
   ER.colocar(er) cambia er y devuelve cuántos solapes quedan; ER.solapes(er) solo los cuenta. */
(function () {
  'use strict';
  const entSize = e => ({ w: Math.max(120, (e.name || '').length * 9.5 + 34), h: 46 });
  const relSize = r => ({ w: Math.max(124, (r.name || '').length * 9 + 60), h: 68 });
  const attrR = n => ({ rx: Math.max(40, (n || '').length * 4.2 + 16), ry: 17 });
  const caja = (x, y, w2, h2, tag) => ({ x1: x - w2, y1: y - h2, x2: x + w2, y2: y + h2, tag });
  const choca = (a, b) => a.x1 < b.x2 && b.x1 < a.x2 && a.y1 < b.y2 && b.y1 < a.y2;

  function fijos(er) {
    const E = Object.fromEntries(er.entities.map(e => [e.id, e])), out = [];
    er.entities.forEach(e => { const s = entSize(e); out.push(caja(e.x, e.y, s.w / 2 + 8, s.h / 2 + 8, 'e:' + e.id)); });
    er.rels.forEach(r => {
      const s = relSize(r); out.push(caja(r.x, r.y, s.w / 2 + 4, s.h / 2 + 4, 'r:' + r.id));
      r.parts.forEach(p => {
        const e = E[p.eid]; if (!e) return;
        const len = Math.hypot(r.x - e.x, r.y - e.y) || 1;
        for (let t = 0; t <= len; t += 14) { const k = t / len; out.push(caja(e.x + (r.x - e.x) * k, e.y + (r.y - e.y) * k, 7, 7, 'l')); }
        // cardinalidad, cerca de la entidad
        const k = Math.min(0.9, (entSize(e).w / 2 + 30) / len);
        out.push(caja(e.x + (r.x - e.x) * k, e.y + (r.y - e.y) * k, 30, 16, 'c'));
      });
    });
    (er.hier || []).forEach(h => {
      out.push(caja(h.x, h.y, 34, 30, 'h'));
      const s = E[h.sup]; if (s) { const len = Math.hypot(h.x - s.x, h.y - s.y) || 1; for (let t = 0; t <= len; t += 14) out.push(caja(s.x + (h.x - s.x) * t / len, s.y + (h.y - s.y) * t / len, 7, 7, 'l')); }
      h.subs.forEach(id => { const e = E[id]; if (!e) return; const len = Math.hypot(h.x - e.x, h.y - e.y) || 1; for (let t = 0; t <= len; t += 14) out.push(caja(e.x + (h.x - e.x) * t / len, e.y + (h.y - e.y) * t / len, 7, 7, 'l')); });
    });
    return out;
  }
  // cajas de un atributo ya colocado (con sus partes si es compuesto) y su línea al dueño
  function cajasAttr(owner, a, dx, dy) {
    const ax = owner.x + dx, ay = owner.y + dy, R = attrR(a.name), m = a.multi ? 4 : 0, out = [caja(ax, ay, R.rx + m + 5, R.ry + m + 4, 'a')];
    const parts = (a.parts || []).filter(Boolean), side = dx < 0 ? -1 : 1;
    parts.forEach((p, j) => { const pr = attrR(p); out.push(caja(ax + side * (R.rx + 26 + pr.rx), ay + (j - (parts.length - 1) / 2) * 35, pr.rx + 4, 18, 'a')); });
    return out;
  }
  function linea(owner, dx, dy) {
    const out = [], len = Math.hypot(dx, dy) || 1;
    for (let t = 40; t < len - 20; t += 14) out.push(caja(owner.x + dx * t / len, owner.y + dy * t / len, 5, 5, 'l'));
    return out;
  }

  function colocar(er) {
    const obst = fijos(er);
    const owners = [...er.entities.map(o => ['e', o]), ...er.rels.map(o => ['r', o])];
    // primero se registran los que ya tienen sitio
    owners.forEach(([, o]) => o.attrs.forEach(a => { if (a.dx != null) obst.push(...cajasAttr(o, a, a.dx, a.dy)); }));
    const E = Object.fromEntries(er.entities.map(e => [e.id, e]));
    for (const [k, o] of owners) {
      const vecinos = k === 'e'
        ? er.rels.filter(r => r.parts.some(p => p.eid === o.id)).map(r => [r.x, r.y]).concat((er.hier || []).filter(h => h.sup === o.id || h.subs.includes(o.id)).map(h => [h.x, h.y]))
        : o.parts.map(p => E[p.eid]).filter(Boolean).map(e => [e.x, e.y]);
      let pref = -Math.PI / 2;
      if (vecinos.length) {
        let vx = 0, vy = 0; vecinos.forEach(([x, y]) => { const l = Math.hypot(x - o.x, y - o.y) || 1; vx += (x - o.x) / l; vy += (y - o.y) / l; });
        if (Math.hypot(vx, vy) > 0.2) pref = Math.atan2(-vy, -vx);
        else if (k === 'r') { const [x, y] = vecinos[0]; pref = Math.atan2(y - o.y, x - o.x) + Math.PI / 2; }
      }
      const propios = o.attrs.filter(a => a.dx == null).sort((a, b) => (b.key ? 1 : 0) - (a.key ? 1 : 0));
      const yo = caja(o.x, o.y, 0, 0, '');
      for (const a of propios) {
        let mejor = null;
        for (const rad of [92, 118, 148, 182, 220, 262]) {
          const angs = [];
          for (let d = 0; d <= 180; d += 12) { angs.push(pref + d * Math.PI / 180); if (d && d < 180) angs.push(pref - d * Math.PI / 180); }
          for (const ang of angs) {
            const dx = Math.cos(ang) * rad * 1.5, dy = Math.sin(ang) * rad;
            const cs = cajasAttr(o, a, dx, dy), ls = linea(o, dx, dy);
            const libre = cs.every(c => !obst.some(b => choca(c, b))) && ls.every(c => !obst.some(b => b.tag !== 'l' && b.tag !== 'e:' + o.id && b.tag !== 'r:' + o.id && choca(c, b)));
            if (libre) { mejor = [dx, dy]; break; }
          }
          if (mejor) break;
        }
        if (!mejor) { const d = window.D ? window.D.attrDefault(o.attrs.indexOf(a), o.attrs.length, k === 'r') : { dx: 0, dy: -120 }; mejor = [d.dx, d.dy]; }
        a.dx = Math.round(mejor[0]); a.dy = Math.round(mejor[1]);
        obst.push(...cajasAttr(o, a, a.dx, a.dy), ...linea(o, a.dx, a.dy));
        void yo;
      }
    }
    return solapes(er);
  }

  function solapes(er) {
    const obst = fijos(er).filter(b => b.tag !== 'l'), lista = [];
    const owners = [...er.entities, ...er.rels];
    const attrs = [];
    owners.forEach(o => o.attrs.forEach(a => { const d = a.dx == null ? { dx: 0, dy: -120 } : a; attrs.push([o, a, cajasAttr(o, a, d.dx, d.dy)]); }));
    attrs.forEach(([o, a, cs], i) => {
      cs.forEach(c => obst.forEach(b => { if (b.tag !== 'e:' + o.id && b.tag !== 'r:' + o.id && choca(c, b)) lista.push(o.name + '.' + a.name + ' pisa ' + b.tag); }));
      attrs.slice(i + 1).forEach(([o2, a2, cs2]) => { if (cs.some(c => cs2.some(c2 => choca(c, c2)))) lista.push(o.name + '.' + a.name + ' pisa ' + o2.name + '.' + a2.name); });
    });
    return lista;
  }

  window.ER = window.ER || {};
  window.ER.colocar = colocar;
  window.ER.solapes = solapes;
})();

</script>
<script>
/* Corrector del examen UT5. Cada ejercicio vale 1,25 puntos y la nota sale de la proporción de comprobaciones
   superadas (redondeada a 0,05). Usa la lógica del CuadernoBD (window.L).
   - corrigeER(erAlumno, item): compara el diagrama dibujado con item.er.
   - parseRelacional(texto) y corrigeRel(texto, item): modelo relacional escrito, contra erToRel(item.er).
   - corrigeNorm(resp, item): clave, forma normal y tablas normalizadas. */
(function () {
  'use strict';
  const L = window.L;
  const PUNTOS = 1.25;
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---------- nombres ---------- */
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ñ/g, 'n').replace(/[^a-z0-9]/g, '');
  const sing = s => (s.length > 4 && s.endsWith('es') ? s.slice(0, -2) : s.length > 3 && s.endsWith('s') ? s.slice(0, -1) : s);
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  // ¿El nombre del alumno vale por el de la solución? Tolera mayúsculas, tildes, plurales, erratas y el
  // nombre de la entidad pegado (nombre_programa ↔ nombre, id_producto ↔ id).
  function mismo(u, s, alias, dueno) {
    const cands = [s].concat((alias && alias[s]) || []);
    const own = norm(dueno), nu = norm(u);
    if (!nu) return false;
    const vari = x => { const v = [x, sing(x)]; if (own && x !== own) { const y = x.replace(own, '').replace(sing(own), ''); if (y && y !== x) v.push(y, sing(y)); } return v; };
    const U = vari(nu);
    return cands.some(c => {
      const C = vari(norm(c));
      if (U.some(x => C.includes(x))) return true;
      const a = sing(nu), b = sing(norm(c));
      return (Math.min(a.length, b.length) >= 5 && lev(a, b) <= 1) || (Math.min(a.length, b.length) >= 9 && lev(a, b) <= 2);
    });
  }
  const isN = m => !['1'].includes(String(m).trim());
  const nota = (ok, total) => (total ? Math.round(PUNTOS * ok / total * 20) / 20 : PUNTOS);
  function resultado(items) {
    // peso: lo que falta entero cuenta como todas las comprobaciones que habría tenido
    const t = items.filter(i => i.ok !== null), w = i => (i.peso == null ? 1 : i.peso);
    const ok = t.reduce((s, i) => s + w(i) * (i.val != null ? i.val : i.ok ? 1 : 0), 0), total = t.reduce((s, i) => s + w(i), 0);
    return { items, ok, total, puntos: nota(ok, total), max: PUNTOS };
  }

  /* ================= Diagrama E/R ================= */

  function corrigeER(user, item) {
    const sol = item.er, al = item.alias || {}, items = [];
    const U = { entities: (user && user.entities) || [], rels: (user && user.rels) || [], hier: (user && user.hier) || [] };
    if (!U.entities.length) return resultado([{ ok: false, g: 'Entidades', text: 'No has dibujado nada.' }]);
    const mapE = {}, usados = new Set();
    // 1. entidades
    for (const e of sol.entities) {
      const u = U.entities.find(x => !usados.has(x.id) && mismo(x.name, e.name, al));
      if (u) { mapE[e.id] = u; usados.add(u.id); }
    }
    const subtipos = new Set((sol.hier || []).flatMap(h => h.subs));
    for (const e of sol.entities) {
      const u = mapE[e.id];
      if (!u) { items.push({ ok: false, g: 'Entidades', peso: 1 + (e.attrs.some(a => a.key) ? 1 : 0) + (e.attrs.some(a => !a.key) ? 1.5 : 0) + (e.weak ? 2 : 0), text: 'Falta la entidad ' + e.name + '.' }); continue; }
      items.push({ ok: true, g: 'Entidades', text: 'Entidad ' + e.name + '.' });
      // clave
      const sk = e.attrs.filter(a => a.key), uk = u.attrs.filter(a => a.key);
      if (sk.length || uk.length) {
        const okK = sk.length === uk.length && sk.every(a => uk.some(b => mismo(b.name, a.name, al, e.name)));
        items.push({ ok: okK, g: 'Entidades', text: e.name + (okK ? ': clave ' + sk.map(a => a.name).join(' + ') + ' bien marcada.'
          : sk.length ? ': la clave es ' + sk.map(a => a.name).join(' + ') + (uk.length ? ', no ' + uk.map(a => a.name).join(' + ') : ' y no la has marcado') + '.'
            : ': no lleva clave propia' + (subtipos.has(e.id) ? ' (hereda la del supertipo).' : '.')) });
      } else if (!subtipos.has(e.id)) items.push({ ok: null, g: 'Entidades', text: e.name + ' sin clave.' });
      // atributos
      const falta = [], marca = [];
      for (const a of e.attrs.filter(x => !x.key)) {
        const b = u.attrs.find(x => mismo(x.name, a.name, al, e.name));
        const parts = (a.parts || []).filter(Boolean);
        if (!b) {
          if (parts.length && parts.every(p => u.attrs.some(x => mismo(x.name, p, al, e.name))))
            marca.push(a.name + ' es un atributo compuesto (' + parts.join(', ') + '): dibújalo como una elipse de la que salen sus partes');
          else falta.push(a.name);
          continue;
        }
        if (a.multi && !b.multi) marca.push(a.name + ' admite varios valores: es multivaluado (doble elipse)');
        if (!a.multi && b.multi) marca.push(a.name + ' no es multivaluado');
        if (a.derived && !b.derived) marca.push(a.name + ' se calcula: es derivado (elipse discontinua)');
        if (parts.length && !(b.parts || []).length) marca.push(a.name + ' es compuesto: le faltan sus partes (' + parts.join(', ') + ')');
      }
      const otras = sol.entities.filter(x => x.id !== e.id);
      const comoRel = u.attrs.filter(b => !e.attrs.some(a => mismo(b.name, a.name, al, e.name)) &&
        otras.some(o => mismo(b.name, o.name, al) || o.attrs.some(k => k.key && norm(b.name) === norm(k.name))));
      comoRel.forEach(b => marca.push(b.name + ' sobra: ese dato sale de una relación, no es un atributo de ' + e.name));
      if (e.attrs.some(a => !a.key) || comoRel.length) {
        const okA = !falta.length && !marca.length;
        items.push({ ok: okA, peso: 1.5, g: 'Atributos', text: e.name + (okA ? ': atributos completos.' : ': ' + [falta.length ? 'faltan ' + falta.join(', ') : '', ...marca].filter(Boolean).join('; ') + '.') });
      }
      if (e.weak) {
        const okW = !!u.weak && U.rels.some(r => r.ident && r.parts.some(p => p.eid === u.id));
        items.push({ ok: okW, peso: 2, g: 'Entidades', text: e.name + (okW ? ' es débil y depende por identificación.' : ' es una entidad débil (doble rectángulo) unida con una relación de dependencia.') });
      }
    }
    U.entities.filter(x => !usados.has(x.id)).forEach(x => {
      const deAtrib = sol.entities.some(e => e.attrs.some(a => mismo(x.name, a.name, al)));
      items.push({ ok: false, peso: 2, g: 'Entidades', text: 'Sobra la entidad ' + (x.name || 'sin nombre') + (deAtrib ? ': en la solución es un atributo.' : '.') });
    });
    // 2. relaciones
    const inv = {}; Object.entries(mapE).forEach(([sid, u]) => { inv[u.id] = sid; });
    const usadasR = new Set();
    const clave = (ids) => ids.slice().sort().join('|');
    const minFijo = new Set(item.minFijo || []);
    for (const r of sol.rels) {
      const sp = r.parts;
      const pesoR = 4 + (sp.length === 2 && sp[0].eid === sp[1].eid && sp.every(p => p.role) ? 1 : 0) + (sp.some(p => minFijo.has(r.id + '.' + p.eid) || (String(p.min) === '1' && !isN(p.max))) ? 1 : 0) + ((r.attrs || []).length ? 1 : 0) + (r.ident ? 1 : 0); const nombres = sp.map(p => (sol.entities.find(e => e.id === p.eid) || {}).name).join(' – ');
      if (sp.some(p => !mapE[p.eid])) { items.push({ ok: false, g: 'Relaciones', peso: pesoR, text: 'Relación «' + r.name + '» (' + nombres + '): falta alguna de sus entidades.' }); continue; }
      const want = clave(sp.map(p => mapE[p.eid].id));
      const cands = U.rels.filter(x => !usadasR.has(x.id) && clave(x.parts.map(p => p.eid)) === want);
      const u = cands.find(x => mismo(x.name, r.name, al)) || cands[0];
      if (!u) { items.push({ ok: false, g: 'Relaciones', peso: pesoR, text: 'Falta la relación «' + r.name + '» entre ' + nombres + '.' }); continue; }
      usadasR.add(u.id);
      items.push({ ok: true, g: 'Relaciones', text: 'Relación entre ' + nombres + '.' });
      // emparejar participantes (en las reflexivas, probar los dos órdenes)
      let pares = sp.map(p => [p, u.parts.find(q => q.eid === mapE[p.eid].id)]);
      if (sp.length === 2 && sp[0].eid === sp[1].eid && u.parts.length === 2) {
        const o1 = [[sp[0], u.parts[0]], [sp[1], u.parts[1]]], o2 = [[sp[0], u.parts[1]], [sp[1], u.parts[0]]];
        const conPapel = sp.every(p => p.role) && u.parts.every(p => (p.role || '').trim());
        if (conPapel) {
          // se emparejan por el papel: así las cardinalidades cambiadas de lado se notan

          const okP = casa(pares) === 2;
          items.push({ ok: okP, g: 'Relaciones', text: '«' + r.name + '» es reflexiva: ' + (okP ? 'papeles bien (' + sp.map(p => p.role).join(' / ') + ').' : 'los papeles son ' + sp.map(p => p.role).join(' y ') + '.') });
        } else {
          const fit = o => o.filter(([a, b]) => isN(a.max) === isN(b.max)).length + o.filter(([a, b]) => String(a.min) === String(b.min)).length / 10;
          pares = fit(o1) >= fit(o2) ? o1 : o2;
          if (sp.every(p => p.role)) items.push({ ok: false, g: 'Relaciones', text: '«' + r.name + '» es reflexiva: pon el papel de cada lado (' + sp.map(p => p.role).join(' y ') + ') para que se sepa qué cardinalidad es de cuál.' });
        }
      }
      const tipoS = L.relType(r), tipoU = L.relType(u);
      const okT = pares.every(([a, b]) => b && isN(a.max) === isN(b.max));
      const card = p => '(' + p.min + ',' + p.max + ')';
      items.push({ ok: okT, peso: 3, g: 'Relaciones', text: '«' + r.name + '» es ' + tipoS + (okT ? '.' : ' y la tienes como ' + tipoU + ': ' + pares.map(([a]) => (sol.entities.find(e => e.id === a.eid) || {}).name + ' ' + card(a) + (a.role ? ' (' + a.role + ')' : '')).join(', ') + '.') });
      const graded = pares.filter(([a]) => minFijo.has(r.id + '.' + a.eid) || (String(a.min) === '1' && !isN(a.max)));
      if (graded.length) {

        items.push({ ok: !mal.length, g: 'Relaciones', text: '«' + r.name + '»: ' + (mal.length ? 'revisa la mínima de ' + mal.map(([a]) => (sol.entities.find(e => e.id === a.eid) || {}).name + ', que es ' + a.min).join(' y ') + '.' : 'cardinalidades mínimas bien.') });
      }
      if ((r.attrs || []).length) {
        const falta = r.attrs.filter(a => !(u.attrs || []).some(b => mismo(b.name, a.name, al)));
        // si los ha puesto en una de las entidades, se explica
        items.push({ ok: !falta.length, g: 'Relaciones', text: '«' + r.name + '»: ' + (falta.length ? 'le faltan sus atributos ' + falta.map(a => a.name).join(', ') + ' (dependen de las dos entidades a la vez).' : 'atributos de la relación bien.') });

    U.rels.filter(x => !usadasR.has(x.id)).forEach(x => items.push({ ok: false, g: 'Relaciones', text: 'Sobra la relación «' + (x.name || 'sin nombre') + '» o une entidades que no son.' }));

    for (const h of sol.hier || []) {

      const u = sup && U.hier.find(x => x.sup === sup.id);
      const okH = !!u && subs.every(s => s && u.subs.includes(s.id)) && u.subs.length === subs.length;
      items.push({ ok: okH, peso: okH ? 2 : 6, g: 'Jerarquías', text: okH ? 'Jerarquía de ' + name + ' con sus subtipos.' : 'Falta la jerarquía (es un) de ' + name + ' con ' + h.subs.map(s => (sol.entities.find(e => e.id === s) || {}).name).join(' y ') + '.' });
      if (okH) {
        const okC = !!u.total === !!h.total && !!u.exclusive === !!h.exclusive;
        const tx = x => (x.total ? 'total' : 'parcial') + ' y ' + (x.exclusive ? 'exclusiva' : 'solapada');
        items.push({ ok: okC, peso: 2, g: 'Jerarquías', text: 'La jerarquía de ' + name + ' es ' + tx(h) + (okC ? '.' : ', no ' + tx(u) + '.') });

  /* ================= Modelo relacional escrito ================= */

  // Divide por comas que no estén dentro de paréntesis.
  function trocear(s) {
    const out = []; let d = 0, cur = '';
    for (const ch of s) {
      if (ch === '(') d++;
      if (ch === ')') d--;
      if (ch === ',' && d === 0) { out.push(cur); cur = ''; } else cur += ch;
    }
    if (cur.trim()) out.push(cur);
    return out.map(x => x.trim()).filter(Boolean);
  }
  const RE_FK = /^(.*?)\s*(?:→|->|=>)\s*([A-Za-zÁÉÍÓÚÑáéíóúñ_][\wÁÉÍÓÚÑáéíóúñ]*)\s*(?:\(\s*([01])\s*,\s*([1nNmM*])\s*\))?\s*$/;
  function parseCol(raw) {
    let s = raw.trim(), target = null, card = null;
    const m = RE_FK.exec(s);
    if (m) { s = m[1].trim(); target = m[2]; if (m[3]) card = '(' + m[3] + ',' + m[4].toLowerCase().replace(/[m*]/, 'n') + ')'; }
    let fk = !!target, pk = false;
    if (s.endsWith('*')) { fk = true; s = s.replace(/\*+$/, '').trim(); }
    if (s.startsWith('*')) { fk = true; s = s.replace(/^\*+/, '').trim(); }
    if (/^_.*_$/.test(s) && s.length > 2) { pk = true; s = s.slice(1, -1); }
    else if (s.startsWith('#')) { pk = true; s = s.slice(1); }
    if (s.endsWith('*')) { fk = true; s = s.replace(/\*+$/, ''); }
    s = s.trim().replace(/\s+/g, '_');
    return { name: s, pk, fk, target, card };
  }
  function parseRelacional(text) {
    const tablas = [], errores = [];
    (text || '').split(/\n/).forEach((line0, i) => {
      let line = line0.trim();
      if (!line || /^(--|\/\/)/.test(line)) return;
      let coment = '';
      const ci = line.indexOf('--');
      if (ci > 0) { coment = line.slice(ci + 2); line = line.slice(0, ci).trim(); }
      const a = line.indexOf('('), b = line.lastIndexOf(')');
      if (a < 1 || b < a) { errores.push('Línea ' + (i + 1) + ': escribe TABLA(columna, columna, …).'); return; }
      const name = line.slice(0, a).trim().replace(/\s+/g, '_');
      const cols = trocear(line.slice(a + 1, b)).map(parseCol).filter(c => c.name);
      // «-- col* → TABLA (1,1)» en el comentario, como en el resumen
      trocear(coment.replace(/·/g, ',')).forEach(x => {
        const c = parseCol(x); if (!c.target) return;
        const col = cols.find(k => norm(k.name) === norm(c.name)); if (col) { col.fk = true; col.target = c.target; col.card = c.card || col.card; }
      });
      if (!cols.length) { errores.push('La tabla ' + name + ' no tiene columnas.'); return; }
      tablas.push({ name, cols });
    });
    // destino de las foráneas sin flecha: la tabla cuya clave se llama igual
    for (const t of tablas) for (const c of t.cols) {
      if (!c.fk) continue;
      let dest = c.target ? tablas.find(x => norm(x.name) === norm(c.target) || sing(norm(x.name)) === sing(norm(c.target))) : null;
      if (c.target && !dest) errores.push(t.name + ': la tabla ' + c.target + ' a la que apunta ' + c.name + ' no existe.');
      let ambiguo = false;
      if (!dest) {
        const nc = norm(c.name), nt = norm(t.name);
        const pkPropia = x => x.cols.filter(k => k.pk && !k.fk);
        // lo que queda del nombre de la columna quitando la clave a la que se parece (cuit_cliente → cliente)
        const resto = x => { const k = x.cols.find(k => k.pk && nc.includes(norm(k.name))); return k ? nc.replace(norm(k.name), '') : nc; };
        const pista = x => (resto(x) && resto(x).includes(sing(norm(x.name)))) || nt.includes(sing(norm(x.name)));
        // 1) la clave de otra tabla se llama igual que la columna
        let cand = tablas.filter(x => x !== t && pkPropia(x).some(k => norm(k.name) === nc));
        // con el nombre de la clave de un supertipo también puede ir a sus subtipos (salvo la clave del propio subtipo)
        const subtipo = t.cols.filter(k => k.pk).length === 1 && c.pk;
        if (cand.length && !subtipo) cand = cand.concat(tablas.filter(x => x !== t && !cand.includes(x) && x.cols.filter(k => k.pk).length === 1 && x.cols.some(k => k.pk && k.fk && norm(k.name) === nc)));
        // 2) la columna contiene el nombre de la clave (cuit_cliente, id_jefe → id) o el de la tabla
        if (!cand.length) cand = tablas.filter(x => pkPropia(x).some(k => nc.includes(norm(k.name)) && (x !== t || nc !== norm(k.name))));
        if (!cand.length) cand = tablas.filter(x => x !== t && nc.includes(sing(norm(x.name))));
        if (cand.length > 1 && cand.filter(pista).length) cand = cand.filter(pista);
        if (cand.length > 1 && cand.includes(t)) cand = [t];
        if (cand.length === 1) dest = cand[0];
        else if (cand.length > 1) ambiguo = cand;
      }
      c.dest = dest ? dest.name : null;
      if (ambiguo) errores.push(t.name + ': ' + c.name + '* puede apuntar a ' + ambiguo.map(x => x.name).join(' o ') + '. Escríbelo así: ' + c.name + '* → TABLA.');
      else if (!dest && !c.target) errores.push(t.name + ': no sé a qué tabla apunta ' + c.name + '*. Escríbelo así: ' + c.name + '* → TABLA.');
    }
    return { tablas, errores };
  }

  function esperado(item) {
    const r = L.erToRel(clone(item.er)).rel, byId = Object.fromEntries(r.tables.map(t => [t.id, t]));
    return r.tables.map(t => ({
      name: t.name,
      cols: t.cols.map(c => ({ name: c.name, pk: c.pk, uq: c.uq, dest: c.fk ? byId[c.fk.t].name : null, far: c.fk ? c.fk.far : null }))
    }));
  }

  function corrigeRel(text, item) {
    const al = item.alias || {}, exp = esperado(item), P = parseRelacional(text), items = [];
    if (!P.tablas.length) return resultado([{ ok: false, g: 'Tablas', text: 'No has escrito ninguna tabla.' }]);
    P.errores.forEach(t => items.push({ ok: null, g: 'Avisos', text: t }));
    const plain = t => t.cols.filter(c => !c.dest && !c.fk).map(c => c.name);
    // emparejar tablas: nombre + columnas propias en común
    const puntua = (e, u) => {
      const comunes = e.cols.filter(c => !c.dest).filter(c => u.cols.some(k => !k.fk && mismo(k.name, c.name, al, e.name))).length;
      const destinos = e.cols.filter(c => c.dest).filter(c => u.cols.some(k => k.dest && sing(norm(k.dest)) === sing(norm(c.dest)))).length;
      return (mismo(u.name, e.name, al) ? 3 : 0) + comunes + destinos * 0.5;
    };
    const pares = [];
    exp.forEach(e => P.tablas.forEach(u => pares.push([puntua(e, u), e, u])));
    pares.sort((a, b) => b[0] - a[0]);
    const mE = new Map(), mU = new Map();
    for (const [s, e, u] of pares) { if (s < 1 || mE.has(e) || mU.has(u)) continue; mE.set(e, u); mU.set(u, e); }
    const nombreExp = u => (mU.get(u) || {}).name; // tabla de la solución que corresponde a una del alumno
    const destExp = c => { if (!c.dest) return null; const u = P.tablas.find(x => x.name === c.dest); return u ? nombreExp(u) || '?' + c.dest : null; };
    // 1:1: la foránea puede ir en cualquiera de los dos lados

      if (!tieneAqui && alReves) { e.cols = e.cols.filter(x => x !== c); otra.cols.push(Object.assign({}, c, { name: c.name, dest: e.name })); }
    }

    const pesoT = e => (e.cols.filter(c => c.pk).length > 1 && e.cols.some(c => c.pk && c.dest) ? 1.5 : 1) + 0.5 * e.cols.filter(c => c.dest && !c.pk).length;
    for (const e of exp) {
      const u = mE.get(e), W = pesoT(e);
      const desc = e.name + '(' + e.cols.map(c => (c.pk ? '_' + c.name + '_' : c.name) + (c.dest ? '*' : '')).join(', ') + ')';
      if (!u) { items.push({ ok: false, g: 'Tablas', peso: W, text: 'Falta la tabla ' + desc + '.' }); continue; }
      items.push({ ok: true, g: 'Tablas', peso: 0, text: 'Tabla ' + e.name + (norm(u.name) === norm(e.name) ? '' : ' (la tuya: ' + u.name + ')') + '.' });

      const i0 = items.length;

      items.push({ ok: okPK, peso: 0.25 * W, g: 'Claves primarias', text: e.name + ': clave ' + (okPK ? 'bien' : 'mal; es ' + pkE.map(c => c.name + (c.dest ? '*' : '')).join(' + ') + (pkU.length ? ', no ' + pkU.map(c => c.name).join(' + ') : ' y no has subrayado ninguna (_columna_)')) + '.' });
      // columnas normales
      const colE = e.cols.filter(c => !c.dest && !c.pk), colU = u.cols.filter(c => !c.fk && !c.pk);
      const falta = colE.filter(c => !colU.some(k => mismo(k.name, c.name, al, e.name))).map(c => c.name);
      const sobra = colU.filter(k => !colE.some(c => mismo(k.name, c.name, al, e.name)) && !e.cols.some(c => c.pk && mismo(k.name, c.name, al, e.name)));
      const sinMarca = sobra.filter(k => exp.some(x => x !== e && x.cols.some(c => c.pk && !c.dest && norm(c.name) === norm(k.name))));
      const fkE0 = e.cols.filter(c => c.dest && !c.pk), fkU0 = u.cols.filter(k => k.fk && !k.pk);
      const pCol = fkE0.length || fkU0.length ? 0.25 : 0.75; // sin foráneas, las columnas pesan lo de las foráneas

          sinMarca.length ? sinMarca.map(k => k.name).join(', ') + ' es clave foránea: márcala con *' : '',
          sobra.filter(k => !sinMarca.includes(k)).length ? 'sobran ' + sobra.filter(k => !sinMarca.includes(k)).map(k => k.name).join(', ') : ''].filter(Boolean).join('; ') + '.') });

        items.push({ ok, val: bien / Math.max(fkE.length, fkU.length), peso: 0.5 * W, g: 'Claves foráneas', text: e.name + ': ' + (ok ? 'claves foráneas bien (' + (fkE.join(', ') || '—') + ').' :

      }

  }

  /* ================= Normalización ================= */

  const FN_TXT = { '0': 'no está en 1FN', '1FN': '1FN', '2FN': '2FN', '3FN': '3FN', 'FNBC': 'FNBC' };
  const RANK = { '0': -1, '1FN': 0, '2FN': 1, '3FN': 2, 'FNBC': 3 };
  function datosNorm(item) {
    const p = L.parseNorm({ name: item.tabla, attrs: item.cols.join(', '), fds: item.fds, multi: item.multi || '', pk: '' });
    const A = L.analyze(p.attrs, p.fds, p.multi);

    const canon = x => p.attrs.find(a => norm(a) === norm(x)) || p.attrs.find(a => mismo(x, a));
    const multi = p.multi || [];
    // claves válidas: las de la tabla y, si hay celdas con varios valores, también la de la tabla tal como se ve

    if (multi.length) L.candidateKeys(p.attrs.filter(a => !multi.includes(a)), p.fds).forEach(k => { if (!keysOK.some(x => L.eq(x, k))) keysOK.push(k); });

    else if (keysOK.some(k => L.eq(k, [...new Set(kc)]))) {

      const vista = !A.keys.some(k => L.eq(k, [...new Set(kc)]));
      items.push({ ok: true, g: 'Clave', text: 'Clave ' + L.fmt(kc) + ' correcta' + (vista ? ' para la tabla tal como está; al separar los valores de ' + multi.join(', ') + ' en filas, la clave pasa a ser ' + A.keys.map(L.fmt).join(' o ') : '') + '.' });
    } else {
      const base = multi.length ? p.attrs.filter(a => !multi.includes(a)) : p.attrs;
      const cl = L.closure(kc, p.fds), miss = base.filter(a => !cl.includes(a));
      items.push({ ok: false, g: 'Clave', text: (miss.length ? 'Con ' + L.fmt(kc) + ' no se sabe ' + miss.join(', ') : L.fmt(kc) + ' identifica las filas pero le sobra algo: una clave es mínima') + '. La clave es ' + claveTxt + '.' });
    }

    if (!resp.fn) items.push({ ok: false, g: 'Forma normal', text: 'No has dicho en qué forma normal está. La tabla ' + fnFrase(A.nf) + '.' });
    else if (resp.fn === A.nf) { ptsF = 0.25; items.push({ ok: true, g: 'Forma normal', text: 'Bien: la tabla ' + fnFrase(A.nf) + '.' }); }
    else {
      const por = A.nf === '0' ? 'hay celdas con varios valores (' + multi.join(', ') + ')' : A.nf === '1FN' ? L.fdText(A.partial[0]) + ' depende de solo una parte de la clave'
        : A.nf === '2FN' ? 'hay una dependencia transitiva: ' + L.fdText(A.trans[0]) : A.nf === '3FN' ? L.fdText(A.bc[0]) + ' tiene a la izquierda algo que no es clave candidata' : 'no hay ninguna dependencia que la rompa';
      items.push({ ok: false, g: 'Forma normal', text: 'Has marcado ' + fnMarca(resp.fn) + ', pero la tabla ' + fnFrase(A.nf) + ', porque ' + por + '.' });
    }
    // tablas (0,75): proporción de tablas buenas y 0,25 menos por cada dependencia que se pierde
    let ptsT = 0;
    const obj = item.objetivo || '3FN';
    if (!String(resp.tablas || '').trim()) items.push({ ok: false, g: 'Tablas', text: 'No has escrito las tablas normalizadas.' });
    else {

      P.tablas.forEach(t => {
        const attrs = [];
        t.cols.forEach(c => { const a = canon(c.name); if (a) { if (!attrs.includes(a)) attrs.push(a); } else items.push({ ok: null, g: 'Avisos', text: t.name + ': «' + c.name + '» no es una columna de la tabla original; no se tiene en cuenta.' }); });
        if (attrs.length) rels.push({ name: t.name, attrs });
      });
      P.errores.filter(e => e.startsWith('Línea')).forEach(t => items.push({ ok: null, g: 'Avisos', text: t }));
      if (rels.length) {
        const all = [...new Set(rels.flatMap(r => r.attrs))], missing = p.attrs.filter(a => !all.includes(a));
        const ll = L.lossless(p.attrs, p.fds, rels.map(r => r.attrs));
        if (missing.length) items.push({ ok: false, g: 'Tablas', text: 'Se pierden columnas: ' + missing.join(', ') + '.' });
        else if (!ll) items.push({ ok: false, g: 'Tablas', text: 'Al unir tus tablas no sale la tabla original: falta una columna común que sea clave en alguna (la foránea).' });
        else {
          const sup = rels.map(r => p.attrs.filter(a => r.attrs.includes(a)));
          let buenas = 0;
          rels.forEach((r, i) => {
            const I = L.analyze(r.attrs, p.fds), okNF = RANK[I.nf] >= RANK[obj];
            const bad = I.partial[0] || I.trans[0] || I.bc[0];
            const dentro = sup.findIndex((s, j) => j !== i && L.sub(r.attrs, s) && (s.length > r.attrs.length || j < i));
            const todoClave = I.keys.length === 1 && I.keys[0].length === r.attrs.length;
            const sinSentido = todoClave && !A.keys.some(k => L.sub(k, r.attrs)) && !dec.final.some(f => L.eq(f.attrs, r.attrs));
            const ok = okNF && dentro < 0 && !sinSentido;
            if (ok) buenas++;
            items.push({ ok, g: 'Tablas', text: r.name + '(' + r.attrs.join(', ') + '): ' + (dentro >= 0 ? 'sobra, sus columnas ya están en ' + rels[dentro].name + '.'
              : sinSentido ? 'no guarda ninguna dependencia: sus columnas no tienen relación entre sí.'
                : 'clave ' + I.keys.map(L.fmt).join(' o ') + ', ' + fnFrase(I.nf).replace('está en ', '') + (okNF ? '.' : ' (falla por ' + L.fdText(bad) + ').')) });
          });
          const firma = f => [...f.l].sort().join(',') + '>' + [...f.r].sort().join(',');
          const perdSol = new Set(L.lostFDs(p.fds, dec.final.map(r => r.attrs)).map(firma));
          const perd = L.lostFDs(p.fds, rels.map(r => r.attrs)).filter(f => !perdSol.has(firma(f)));
          perd.forEach(f => items.push({ ok: false, g: 'Tablas', text: 'Se pierde la dependencia ' + L.fdText(f) + ': ninguna tabla la recoge, así que ese dato se seguirá repitiendo.' }));
          ptsT = Math.max(0, Math.round((0.75 * buenas / rels.length - 0.25 * perd.length) * 20) / 20);
        }
      }
    }
    const puntos = Math.round((ptsK + ptsF + ptsT) * 100) / 100;
    return { items, ok: items.filter(i => i.ok).length, total: items.filter(i => i.ok !== null).length, puntos, max: PUNTOS, sol: { keys: A.keys, nf: A.nf, dec } };
  }

  window.Corrector = { PUNTOS, norm, mismo, corrigeER, parseRelacional, corrigeRel, esperado, corrigeNorm, datosNorm, FN_TXT };
})();

<script>
/* Editor de diagramas E/R dentro del examen. Es el del CuadernoBD (fichas, arrastre, cardinalidades)
   adaptado para editar un diagrama cualquiera: EditorER.montar(caja, er, alCambiar). */
(function () {
  'use strict';
  const L = window.L, D = window.D;

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k in n && k !== 'list') n[k] = v;

    for (const c of kids.flat(3)) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(c)); }
    return n;
  }
  const put = (box, ...kids) => box.append(...kids.flat(3).filter(k => k != null && k !== false));
  const btn = (label, fn, cls, title) => el('button', { type: 'button', class: 'btn btn--sm ' + (cls || ''), onclick: fn, title }, label);

  function montar(host, er, cambio, opts) {
    opts = opts || {};
    er.entities = er.entities || []; er.rels = er.rels || []; er.hier = er.hier || [];
    let sel = null;
    const hist = [];
    const snap = () => JSON.stringify(er);
    const mark = () => { const s = snap(); if (hist[hist.length - 1] !== s) { hist.push(s); if (hist.length > 80) hist.shift(); } };
    const avisa = () => cambio && cambio(er);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'er-svg'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Tu diagrama entidad-relación');
    const vacio = el('div', { class: 'er-vacio' }, el('b', {}, 'Lienzo vacío'), el('span', {}, 'Empieza con «+ Entidad». Pulsa una figura para editarla y arrástrala para moverla.'));
    const lienzo = el('div', { class: 'er-lienzo', tabindex: '0' }, svg, vacio);
    const ficha = el('div', { class: 'er-ficha' });
    const avisos = el('div', { class: 'er-avisos' });
    const barra = el('div', { class: 'er-barra' },
      btn('+ Entidad', () => add('e'), 'btn--primary'), btn('+ Relación', () => add('r')), btn('+ Jerarquía', () => add('h')),
      el('span', { class: 'er-sep' }),
      btn('Deshacer', undo, 'btn--ghost', 'Deshacer (Ctrl+Z)'), btn('Colocar', colocar, 'btn--ghost', 'Recolocar el diagrama'),
      btn('Comprobar reglas', comprobar, 'btn--ghost'), btn('Vaciar', vaciar, 'btn--ghost btn--danger'));
    host.replaceChildren(barra, avisos, el('div', { class: 'er-zona' }, lienzo, ficha));

    function draw() {
      const d = D.erSVG(er, sel);
      const w = Math.max(900, d.box.x + d.box.w + 260), h = Math.max(560, d.box.y + d.box.h + 200);
      svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      svg.innerHTML = d.markup;
      vacio.hidden = er.entities.length + er.rels.length > 0;
    }
    const soft = () => { draw(); avisa(); };
    const hard = () => { draw(); renderFicha(); avisa(); };

    const eName = id => { const e = er.entities.find(x => x.id === id); return e ? (e.name || 'sin nombre') : '—'; };
    const find = d => {
      if (d.k === 'e') return er.entities.find(x => x.id === d.id);
      if (d.k === 'r') return er.rels.find(x => x.id === d.id);
      if (d.k === 'h') return er.hier.find(x => x.id === d.id);
      if (d.k === 'a') { const own = (d.ok === 'e' ? er.entities : er.rels).find(x => x.id === d.owner); return own && own.attrs.find(a => a.id === d.id); }
    };

    function add(kind) {
      mark();
      const n = er.entities.length + er.rels.length;
      const x = lienzo.scrollLeft + 180 + (n % 3) * 300, y = lienzo.scrollTop + 170 + (Math.floor(n / 3) % 3) * 220;
      if (kind === 'e') {
        const e = { id: L.uid(), name: 'ENTIDAD' + (er.entities.length + 1), weak: false, x, y, attrs: [] };
        er.entities.push(e); sel = { k: 'e', id: e.id };
      } else if (kind === 'r') {
        if (!er.entities.length) { aviso(['Crea primero una entidad.']); return; }
        const from = sel && sel.k === 'e' ? er.entities.find(e => e.id === sel.id) : null;
        const r = { id: L.uid(), name: 'relacion', ident: false, x: from ? from.x + 220 : x, y: from ? from.y : y, parts: [], attrs: [] };
        if (from) r.parts.push({ eid: from.id, min: '1', max: '1', role: '' });
        er.rels.push(r); sel = { k: 'r', id: r.id };
      } else {
        if (er.entities.length < 2) { aviso(['Una jerarquía necesita un supertipo y al menos un subtipo: crea antes las entidades.']); return; }
        const sup = sel && sel.k === 'e' ? er.entities.find(e => e.id === sel.id) : er.entities[0];
        const h = { id: L.uid(), sup: sup.id, subs: [], total: false, exclusive: true, x: sup.x, y: sup.y + 95 };
        er.hier.push(h); sel = { k: 'h', id: h.id };
      }
      hard();
      const first = ficha.querySelector('input[type=text]'); if (first) { first.focus(); first.select(); }
    }
    function borrar() {
      if (!sel) return;
      mark();
      if (sel.k === 'e') {
        er.entities = er.entities.filter(e => e.id !== sel.id);
        er.rels.forEach(r => { r.parts = r.parts.filter(p => p.eid !== sel.id); });
        er.hier = er.hier.filter(h => h.sup !== sel.id);
        er.hier.forEach(h => { h.subs = h.subs.filter(x => x !== sel.id); });
      } else if (sel.k === 'r') er.rels = er.rels.filter(r => r.id !== sel.id);
      else er.hier = er.hier.filter(h => h.id !== sel.id);
      sel = null; hard();
    }
    function undo() {
      const c = snap();
      while (hist.length && hist[hist.length - 1] === c) hist.pop();
      if (!hist.length) { aviso(['No hay nada que deshacer.']); return; }
      const prev = JSON.parse(hist.pop());
      er.entities = prev.entities; er.rels = prev.rels; er.hier = prev.hier; sel = null; hard();
    }
    function colocar() {
      mark(); er.entities.concat(er.rels).forEach(o => o.attrs.forEach(a => { a.dx = null; a.dy = null; }));
      L.layoutER(er); hard(); lienzo.scrollTo(0, 0);
    }
    function vaciar() {
      if (!er.entities.length) return;
      if (!vaciar.pend) { vaciar.pend = true; aviso(['Pulsa otra vez «Vaciar» para borrar todo el diagrama (se puede deshacer).']); setTimeout(() => { vaciar.pend = false; }, 4000); return; }
      vaciar.pend = false; mark(); er.entities = []; er.rels = []; er.hier = []; sel = null; avisos.innerHTML = ''; hard();
    }
    function aviso(list, okMsg) {
      avisos.replaceChildren(el('div', { class: 'aviso-er ' + (list.length ? 'mal' : 'bien') },
        el('button', { type: 'button', class: 'x', 'aria-label': 'Cerrar', onclick: () => { avisos.innerHTML = ''; } }, '×'),
        list.length ? el('ul', {}, list.map(t => el('li', {}, t))) : el('span', {}, okMsg)));
    }
    function comprobar() {
      const subs = new Set(er.hier.flatMap(h => h.subs));
      const sinSub = er.entities.filter(e => subs.has(e.id)).map(e => (e.name || '(sin nombre)') + ' no tiene clave primaria');
      const w = L.validateER(er).filter(t => !sinSub.some(s => t.startsWith(s)));
      aviso(w, er.entities.length ? 'El diagrama cumple las reglas del modelo. Que esté bien diseñado lo dirá la corrección.' : 'Todavía no hay nada que comprobar.');
    }

    /* ---------- campos ---------- */
    const inText = (val, set, o) => {
      o = o || {};
      return el('input', { type: 'text', value: val || '', placeholder: o.ph, class: 'inp ' + (o.cls || ''), 'aria-label': o.label || o.ph,
        onfocus: mark, oninput: e => { set(e.target.value); (o.after || soft)(); },
        onkeydown: o.enter ? e => { if (e.key === 'Enter') { e.preventDefault(); o.enter(); } } : null });
    };
    const inCheck = (label, val, set) => el('label', { class: 'chk' },
      el('input', { type: 'checkbox', checked: !!val, onchange: e => { mark(); set(e.target.checked); hard(); } }), label);
    const inSel = (opts, val, set, label) => el('select', { class: 'inp', 'aria-label': label, onchange: e => { mark(); set(e.target.value); hard(); } },
      opts.map(o => el('option', { value: o[0], selected: String(o[0]) === String(val) }, o[1])));
    const campo = (label, control) => el('label', { class: 'campo' }, el('span', {}, label), control);

    function attrRows(owner, flags) {
      const rows = owner.attrs.map((a, i) => el('div', { class: 'attr' },
        el('div', { class: 'fila-in' },
          inText(a.name, v => { a.name = v; }, { ph: 'Nombre del atributo', enter: () => addAttr(owner) }),
          el('button', { type: 'button', class: 'x', title: 'Quitar atributo', 'aria-label': 'Quitar atributo ' + a.name, onclick: () => { mark(); owner.attrs.splice(i, 1); hard(); } }, '×')),
        flags && el('div', { class: 'marcas' },
          inCheck('Clave', a.key, v => { a.key = v; }), inCheck('Multivaluado', a.multi, v => { a.multi = v; }), inCheck('Derivado', a.derived, v => { a.derived = v; })),
        flags && inText((a.parts || []).join(', '), v => { a.parts = v.split(',').map(x => x.trim()).filter(Boolean); }, { ph: 'Si es compuesto, sus partes: calle, numero…', cls: 'mini' })));
      return [el('h4', {}, 'Atributos'), rows.length ? rows : el('p', { class: 'nota' }, 'Todavía no tiene atributos.'), btn('+ Atributo', () => addAttr(owner))];
    }
    function addAttr(owner) {
      mark(); owner.attrs.forEach(a => { a.dx = null; a.dy = null; });
      owner.attrs.push({ id: L.uid(), name: '', key: false, multi: false, derived: false, parts: [] }); hard();
      const ins = ficha.querySelectorAll('.attr .fila-in input'); if (ins.length) ins[ins.length - 1].focus();
    }
    function lectura(r) {
      if (r.parts.length !== 2) return null;
      const [p, q] = r.parts, A = eName(p.eid), B = eName(q.eid);
      const many = m => (String(m) === '1' ? '1' : 'varias');
      const line = (x, c, y) => 'Un/a ' + x + ' → como mínimo ' + c.min + ' y como máximo ' + many(c.max) + ' ' + y + '.';
      return el('div', { class: 'lectura' }, el('b', {}, 'Se lee así'), el('p', {}, line(A, q, B)), el('p', {}, line(B, p, A)));
    }

    function renderFicha() {
      ficha.innerHTML = '';
      const o = sel && find(sel);
      if (!o) {
        sel = null;
        put(ficha, el('h3', {}, 'Cómo se dibuja'), el('ul', { class: 'leyenda' },
          el('li', {}, el('b', {}, 'Rectángulo: '), 'entidad. Doble borde si es débil.'),
          el('li', {}, el('b', {}, 'Rombo: '), 'relación (un verbo). Doble si identifica a una débil.'),
          el('li', {}, el('b', {}, 'Elipse: '), 'atributo. Subrayada si es clave, doble si es multivaluado, discontinua si es derivado.'),
          el('li', {}, el('b', {}, '(mín,máx): '), 'junto a cada entidad: cuántas de ESA entidad corresponden a una de la otra.'),
          el('li', {}, el('b', {}, 'Triángulo: '), 'jerarquía (es un).')),
          el('p', { class: 'nota' }, 'Pulsa una figura para editarla aquí. Supr borra la seleccionada.'));

      }
      if (sel.k === 'e') {
        put(ficha, el('h3', {}, 'Entidad'),
          campo('Nombre', inText(o.name, v => { o.name = v; })),
          inCheck('Entidad débil (depende de otra)', o.weak, v => { o.weak = v; }),
          attrRows(o, true), el('hr', {}), btn('Eliminar entidad', borrar, 'btn--danger'));
      } else if (sel.k === 'r') {
        const ents = er.entities.map(e => [e.id, e.name || 'sin nombre']);
        put(ficha, el('h3', {}, 'Relación ', el('span', { class: 'tipo' }, L.relType(o))),
          campo('Nombre', inText(o.name, v => { o.name = v; })),
          inCheck('De dependencia: identifica a una entidad débil', o.ident, v => { o.ident = v; }),
          el('h4', {}, 'Participantes'),
          o.parts.map((p, i) => el('div', { class: 'attr' },
            el('div', { class: 'fila-in' }, inSel(ents, p.eid, v => { p.eid = v; }, 'Entidad'),
              el('button', { type: 'button', class: 'x', title: 'Quitar participante', 'aria-label': 'Quitar participante', onclick: () => { mark(); o.parts.splice(i, 1); hard(); } }, '×')),
            el('div', { class: 'fila-in card' }, el('span', {}, '('), inSel([['0', '0'], ['1', '1']], p.min, v => { p.min = v; }, 'Mínima'),
              el('span', {}, ','), inSel([['1', '1'], ['n', 'n']], p.max, v => { p.max = v; }, 'Máxima'), el('span', {}, ')')),
            inText(p.role, v => { p.role = v; }, { ph: 'Papel (en reflexivas): jefe, empleado…', cls: 'mini' }))),
          btn('+ Participante', () => {

            const used = o.parts.map(p => p.eid), free = er.entities.find(e => !used.includes(e.id)) || er.entities[0];
            o.parts.push({ eid: free.id, min: '0', max: 'n', role: '' }); hard();
          }),
          lectura(o), attrRows(o, false), el('hr', {}), btn('Eliminar relación', borrar, 'btn--danger'));
      } else {
        const ents = er.entities.map(e => [e.id, e.name || 'sin nombre']);
        put(ficha, el('h3', {}, 'Jerarquía'),
          campo('Supertipo', inSel(ents, o.sup, v => { o.sup = v; o.subs = o.subs.filter(x => x !== v); })),
          el('h4', {}, 'Subtipos'),
          er.entities.filter(e => e.id !== o.sup).map(e => inCheck(e.name || 'sin nombre', o.subs.includes(e.id), v => { o.subs = v ? [...o.subs, e.id] : o.subs.filter(x => x !== e.id); })),
          campo('Cobertura', inSel([['0', 'Parcial'], ['1', 'Total']], o.total ? '1' : '0', v => { o.total = v === '1'; })),
          campo('Solapamiento', inSel([['1', 'Exclusiva'], ['0', 'Solapada']], o.exclusive ? '1' : '0', v => { o.exclusive = v === '1'; })),
          el('hr', {}), btn('Eliminar jerarquía', borrar, 'btn--danger'));
      }
    }

    /* ---------- arrastre ---------- */
    let st = null;
    svg.addEventListener('pointerdown', e => {
      const g = e.target.closest('[data-k]');
      if (!g) { if (sel) { sel = null; draw(); renderFicha(); } return; }
      const d = Object.assign({}, g.dataset), obj = find(d);
      if (!obj) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      mark();
      const s = d.k === 'a' ? { k: d.ok, id: d.owner } : { k: d.k, id: d.id };
      if (JSON.stringify(s) !== JSON.stringify(sel)) { sel = s; draw(); renderFicha(); }
      let p;
      if (d.k === 'a') { const own = find({ k: d.ok, id: d.owner }); if (obj.dx == null) Object.assign(obj, D.attrDefault(own.attrs.indexOf(obj), own.attrs.length, d.ok === 'r')); p = { x: obj.dx, y: obj.dy }; }
      else p = { x: obj.x, y: obj.y };
      st = { obj, d, sx: e.clientX, sy: e.clientY, ox: p.x, oy: p.y, moved: false };
      svg.setPointerCapture(e.pointerId); e.preventDefault();
    });
    svg.addEventListener('pointermove', e => {
      if (!st) return;
      const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
      if (!st.moved && Math.hypot(dx, dy) < 3) return;
      st.moved = true;
      if (st.d.k === 'a') { st.obj.dx = st.ox + dx; st.obj.dy = st.oy + dy; } else { st.obj.x = Math.max(70, st.ox + dx); st.obj.y = Math.max(50, st.oy + dy); }
      draw();
    });
    const end = () => { if (st && st.moved) avisa(); st = null; };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    host.addEventListener('keydown', e => {
      const typing = e.target.matches('input, textarea, select');
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
      if (e.key === 'Delete' && !typing && sel) { e.preventDefault(); borrar(); }
    });

    draw(); renderFicha();
    return { redibujar: () => { draw(); renderFicha(); } };
  }

  window.EditorER = { montar, el };
})();

<script>
// Creador de examen · Bases de datos (BAE) UT5: diseño E/R, modelo relacional y normalización.
// 8 ejercicios de 1,25 puntos: 3 diagramas E/R desde un enunciado, 2 pasos de E/R a tablas y 3 normalizaciones.
// Bancos: BANCO_ER y BANCO_NORM (bancos/*.js). Corrección: Corrector (corrector.js) sobre la lógica del CuadernoBD (L, D).
'use strict';
const app = document.getElementById('app');
const { el } = window.EditorER;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const clone = o => JSON.parse(JSON.stringify(o));
const rich = t => esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const REPARTO = [['er', 3], ['rel', 2], ['norm', 3]];
const TIPO = {
  er: { t: 'Diagrama E/R', pide: 'Dibuja el diagrama entidad-relación: entidades con sus atributos y su clave, relaciones con las cardinalidades (mín,máx) y los atributos especiales (compuestos, multivaluados, derivados).' },
  rel: { t: 'Paso a tablas', pide: 'Pasa este diagrama E/R al modelo relacional. Escribe una tabla por línea, con la clave primaria entre guiones bajos y las claves foráneas con asterisco.' },
  norm: { t: 'Normalización', pide: 'Indica la clave de la tabla y en qué forma normal está, y normalízala.' }
};
const FN_OPC = [['0', 'No 1FN'], ['1FN', '1FN'], ['2FN', '2FN'], ['3FN', '3FN'], ['FNBC', 'FNBC']];

// ---------- almacenamiento ----------
const K = s => 'bae_ut5_' + s;
const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
BANCO_ER.forEach(b => ER.colocar(b.er));
const POR_ID = { er: new Map(BANCO_ER.map(b => [b.id, b])), norm: new Map(BANCO_NORM.map(b => [b.id, b])) };
const banco = ej => (ej.tipo === 'norm' ? POR_ID.norm : POR_ID.er).get(ej.ref);
const historial = () => store(K('hist')) || [];
const visto = () => store(K('seen')) || {};
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

if (EX && !EX.ejercicios.every(e => banco(e))) EX = null;

}

function svgRel(rel, label) { colores(); return figura(D.relSVG(rel), label || 'Modelo relacional'); }

// ---------- generar examen ----------
function elegir(lista, n, evitar) {
  const v = visto();
  const libres = lista.filter(b => !evitar.has(b.id));
  // primero los menos vistos, al azar entre iguales
  return shuffle(libres).sort((a, b) => (v[a.id] || 0) - (v[b.id] || 0)).slice(0, n);
}
function nuevoExamen(modo) {
  const usados = new Set();
  const er = elegir(BANCO_ER, 3, usados); er.forEach(b => usados.add(b.id));
  const rel = elegir(BANCO_ER, 2, usados);
  // normalización: intentar formas normales de partida distintas
  // los menos vistos primero; entre ellos, que no repitan forma normal de partida si se puede
  const v = visto(), orden = shuffle(BANCO_NORM).sort((a, b) => (v[a.id] || 0) - (v[b.id] || 0)), norm = [], fns = new Set();
  const fnDe = b => Corrector.datosNorm(b).A.nf;
  for (const b of orden.slice(0, 7)) if (norm.length < 3 && !fns.has(fnDe(b))) { norm.push(b); fns.add(fnDe(b)); }
  for (const b of orden) if (norm.length < 3 && !norm.includes(b)) norm.push(b);
  const ej = [...er.map(b => ({ tipo: 'er', ref: b.id, resp: { entities: [], rels: [], hier: [] } })),
    ...rel.map(b => ({ tipo: 'rel', ref: b.id, resp: '' })),
    ...norm.map(b => ({ tipo: 'norm', ref: b.id, resp: { clave: '', fn: '', tablas: '' } }))];
  EX = { id: Date.now(), modo, creado: new Date().toISOString(), actual: 0, entregado: false, ejercicios: ej };
  guardar(); examen();
}
const respondido = e => e.tipo === 'er' ? (e.resp.entities || []).length > 0 : e.tipo === 'rel' ? !!String(e.resp).trim() : !!(e.resp.clave || e.resp.fn || e.resp.tablas);
function corregir(e) {
  const b = banco(e);
  return e.tipo === 'er' ? Corrector.corrigeER(e.resp, b) : e.tipo === 'rel' ? Corrector.corrigeRel(e.resp, b) : Corrector.corrigeNorm(e.resp, b);
}

// ================= Inicio =================

  const html = topBar(MODULO) + '<main class="page fade-in">' +

    '<h1>Del enunciado al diagrama y a las tablas</h1><p>Un examen práctico de 8 ejercicios: dibujas tres diagramas E/R, pasas dos a modelo relacional y normalizas tres tablas. Todo se corrige solo y te enseña la solución.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + BANCO_ER.length + '</div><div class="l">Enunciados E/R</div></div><div class="stat"><div class="v">' + BANCO_NORM.length + '</div><div class="l">Tablas</div></div><div class="stat"><div class="v">' + (media === null ? '—' : fmt(media)) + '</div><div class="l">Tu media</div></div></div></section>' +
    '<div class="grid2">' +
    '<section class="card card--accent"><h2>Nuevo examen</h2><p class="sub">Cada ejercicio vale 1,25 puntos. La nota de cada uno sale de las comprobaciones que superas, y la normalización reparte 0,25 la clave, 0,25 la forma normal y 0,75 las tablas.</p>' +
    '<ul class="reglas"><li>Ejercicios 1–3: lees un enunciado y dibujas su E/R en el editor.</li><li>Ejercicios 4–5: te dan un E/R y escribes sus tablas.</li><li>Ejercicios 6–8: tabla con datos → clave, forma normal y normalización.</li></ul>' +
    '<label class="check"><input type="checkbox" id="modo-practica"> Modo práctica: corregir cada ejercicio al momento</label>' +

    (EX && !EX.entregado ? '<button class="btn btn--lg" data-seguir>Seguir el que dejaste</button>' : '') + '</div></section>' +

    '<pre class="code">CLIENTE(_dni_, nombre, calle, ciudad)\nVENTA(_num_factura_, fecha, dni_cliente* → CLIENTE)\nDETALLE(_num_factura_*, _id_producto_*, cantidad)</pre>' +
    '<ul class="reglas" style="margin-top:14px"><li><code>_columna_</code> es clave primaria (subrayada en el papel).</li><li><code>columna*</code> es clave foránea. Si no se ve a qué tabla apunta, añade <code>→ TABLA</code>.</li><li>Las cardinalidades se pueden apuntar detrás: <code>dni* → CLIENTE (1,1)</code>.</li></ul>' +
    (h.length ? '<div class="hist"><span>Últimas notas:</span>' + h.slice(-8).reverse().map(x => '<span class="nota-chip ' + (x.nota >= 5 ? 'ap' : 'su') + '">' + fmt(x.nota) + '</span>').join('') + '</div>' : '') +
    '</section></div></main>';
  const root = mount(html);
  root.querySelector('[data-nuevo]').onclick = () => nuevoExamen(root.querySelector('#modo-practica').checked ? 'practica' : 'examen');
  const s = root.querySelector('[data-seguir]'); if (s) s.onclick = examen;
  enlaces(root);
  window.scrollTo(0, 0);
}

function enlaces(root) {
  root.querySelectorAll('[data-ir="inicio"]').forEach(a => a.onclick = ev => { ev.preventDefault(); inicio(); });
  root.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => { tema = tema === 'light' ? 'dark' : 'light'; refrescar(); });
}
let refrescar = inicio;

// ================= Examen =================
function examen() {
  refrescar = examen;
  const i = EX.actual, e = EX.ejercicios[i], b = banco(e), practica = EX.modo === 'practica';
  const n = EX.ejercicios.filter(respondido).length;
  const html = topBar(MODULO, '<span class="progreso" title="Ejercicios empezados">' + n + '/8</span>') +
    '<main class="examen-page ancho fade-in">' +
    '<nav class="pasos" aria-label="Ejercicios">' + EX.ejercicios.map((x, k) => '<button class="paso' + (k === i ? ' actual' : '') + (respondido(x) ? ' hecho' : '') + '" data-ir-ej="' + k + '" aria-current="' + (k === i ? 'step' : 'false') + '"><b>' + (k + 1) + '</b><span>' + TIPO[x.tipo].t + '</span></button>').join('') + '</nav>' +
    '<article class="q" id="ej"><div class="meta"><span class="n">Ejercicio ' + (i + 1) + ' de 8</span><span class="tipo">' + TIPO[e.tipo].t + '</span><span>1,25 puntos</span>' + (practica ? '<span class="tipo">práctica</span>' : '') + '</div>' +
    '<h3>' + esc(b.titulo || b.tabla) + '</h3><p class="pide">' + TIPO[e.tipo].pide + (e.tipo === 'norm' ? ' Llega hasta <b>' + (b.objetivo || '3FN') + '</b>.' : '') + '</p>' +
    '<div id="cuerpo"></div><div id="fb"></div></article></main>' +
    '<div class="barra-fija"><div class="in">' +
    '<button class="btn" data-ant aria-label="Anterior"' + (i === 0 ? ' disabled' : '') + '>' + IC.back + '<span class="lb-opc">Anterior</span></button>' +
    (i < 7 ? '<button class="btn" data-sig aria-label="Siguiente"><span class="lb-opc">Siguiente</span>' + IC.next + '</button>' : '') +
    (practica ? '<button class="btn" data-corr>' + IC.check + 'Corregir<span class="lb-opc"> este</span></button>' : '') +
    '<div class="grow"></div><span class="aviso" id="aviso-ent"></span>' +
    '<button class="btn btn--primary" data-entregar>' + IC.check + 'Entregar examen</button></div></div>';
  const root = mount(html);
  enlaces(root);
  const cuerpo = root.querySelector('#cuerpo');
  if (e.tipo === 'er') cuerpoER(cuerpo, e, b);
  else if (e.tipo === 'rel') cuerpoRel(cuerpo, e, b);
  else cuerpoNorm(cuerpo, e, b);
  const ir = k => { EX.actual = k; guardar(); examen(); window.scrollTo(0, 0); };
  root.querySelectorAll('[data-ir-ej]').forEach(x => x.onclick = () => ir(+x.dataset.irEj));
  root.querySelector('[data-ant]').onclick = () => i > 0 && ir(i - 1);
  const sig = root.querySelector('[data-sig]'); if (sig) sig.onclick = () => ir(i + 1);
  const corr = root.querySelector('[data-corr]');
  if (corr) corr.onclick = () => { const r = corregir(e); root.querySelector('#fb').innerHTML = bloqueCorreccion(e, r, true); root.querySelector('#fb').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  let confirmar = false;
  root.querySelector('[data-entregar]').onclick = () => {
    const faltan = EX.ejercicios.map((x, k) => respondido(x) ? null : k + 1).filter(Boolean);
    if (faltan.length && !confirmar) {
      confirmar = true;
      root.querySelector('#aviso-ent').textContent = 'Sin empezar: ' + faltan.join(', ') + '. Pulsa otra vez para entregar.';
      return;
    }

  };
}

function cuerpoER(box, e, b) {

function vistaTablas(P) {
  if (!P.tablas.length) return '<p class="nota">Aquí verás cómo se lee lo que escribes.</p>';
  return '<ul class="rel-prev">' + P.tablas.map(t => '<li><b>' + esc(t.name) + '</b> (' + t.cols.map(c =>

    (P.errores.length ? '<ul class="errores">' + P.errores.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '');

    b.filas.map(f => '<tr>' + f.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function cuerpoNorm(box, e, b) {

// ================= Corrección y soluciones =================
function listaItems(r) {
  const grupos = [];
  r.items.forEach(it => { let g = grupos.find(x => x.g === it.g); if (!g) grupos.push(g = { g: it.g, l: [] }); g.l.push(it); });
  return grupos.map(g => '<div class="grupo"><div class="g-t">' + esc(g.g) + '</div><ul class="corr">' + g.l.map(i =>
    '<li class="' + (i.ok === true ? 'ok' : i.ok === false ? 'ko' : 'na') + '"><span class="marca" aria-hidden="true">' + (i.ok === true ? '✓' : i.ok === false ? '✗' : '·') + '</span><span>' + esc(i.text) + '</span></li>').join('') + '</ul></div>').join('');
}
function relDesdeEsperado(exp, er) {
  const r = L.erToRel(clone(er)).rel; L.layoutRel(r); return r;
}
function solucion(e) {
  const b = banco(e);
  if (e.tipo === 'er') {
    return '<div class="sol"><div class="g-t">Solución</div>' + svgER(b.er, 'Solución E/R') +
      '<details class="enun-box"><summary>Decisiones de diseño</summary>' + (b.decisiones || []).map(t => '<p>' + rich(t) + '</p>').join('') + '</details>' +
      '<p class="nota">En un E/R cabe más de una solución válida. Si la tuya es distinta pero la puedes justificar, cuéntalo en el examen.</p></div>';
  }
  if (e.tipo === 'rel') {
    const r = L.erToRel(clone(b.er)); L.layoutRel(r.rel);
    const exp = Corrector.esperado(b);
    return '<div class="sol"><div class="g-t">Solución</div><pre class="code">' + esc(exp.map(t => t.name + '(' + t.cols.map(c => (c.pk ? '_' + c.name + '_' : c.name) + (c.dest ? '* → ' + c.dest + (c.far ? ' ' + c.far : '') : '')).join(', ') + ')').join('\n')) + '</pre>' +
      svgRel(r.rel, 'Modelo relacional solución') +
      '<details class="enun-box"><summary>Transformaciones paso a paso</summary><ol class="pasos-sol">' + r.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></details></div>';
  }
  const { A, dec } = Corrector.datosNorm(b);
  const relTxt = r => r.name + '(' + r.attrs.map(a => r.key.includes(a) ? '_' + a + '_' : a).join(', ') + ')';
  return '<div class="sol"><div class="g-t">Solución</div><p><b>Clave:</b> ' + esc(A.keys.map(L.fmt).join(' o ')) + ' · <b>Forma normal:</b> ' + esc(Corrector.FN_TXT[A.nf]) + '</p>' +
    '<p class="nota">Dependencias: ' + esc(L.parseNorm({ name: b.tabla, attrs: b.cols.join(', '), fds: b.fds, multi: b.multi || '', pk: '' }).fds.map(L.fdText).join(' · ')) + '</p>' +
    '<ol class="pasos-sol">' + dec.steps.map(s => '<li><b>¿' + s.nf + '? ' + (s.ok ? 'Sí' : 'No') + '.</b> ' + esc(s.text.filter(t => t !== 'No.').join(' ')) + '</li>').join('') + '</ol>' +
    '<pre class="code">' + esc(dec.final.map(relTxt).join('\n')) + '</pre></div>';
}
function bloqueCorreccion(e, r, conSol) {
  return '<div class="correccion"><div class="cab"><span class="estado ' + (r.puntos >= r.max ? 'bien' : r.puntos > 0 ? 'medio' : 'mal') + '">' + fmt(r.puntos) + ' / 1,25</span>' +
    (r.total ? '<span class="nota">' + r.ok + ' de ' + r.total + ' comprobaciones</span>' : '') + '</div>' + listaItems(r) + (conSol ? solucion(e) : '') + '</div>';
}

function entregar() {
  const res = EX.ejercicios.map(corregir);
  const nota = Math.round(res.reduce((s, r) => s + r.puntos, 0) * 100) / 100;
  EX.entregado = true; EX.nota = nota; EX.puntos = res.map(r => r.puntos); guardar();
  const h = historial(); h.push({ fecha: new Date().toISOString(), nota, modo: EX.modo }); store(K('hist'), h.slice(-50));
  const v = visto(); EX.ejercicios.forEach(x => { v[x.ref] = (v[x.ref] || 0) + 1; }); store(K('seen'), v);
  resultado(res);
}
function resultado(res) {
  res = res || EX.ejercicios.map(corregir);
  refrescar = () => resultado(res);
  const nota = EX.nota != null ? EX.nota : res.reduce((s, r) => s + r.puntos, 0);
  const html = topBar(MODULO) + '<main class="examen-page ancho fade-in">' +
    '<section class="resultado"><div class="big">' + fmt(nota) + '<small> / 10</small></div><div><div class="veredicto ' + (nota >= 5 ? 'ap' : 'su') + '">' + (nota >= 9 ? 'Sobresaliente' : nota >= 7 ? 'Notable' : nota >= 5 ? 'Aprobado' : 'Suspenso') + '</div>' +
    '<div class="medidor"><div style="width:' + (nota * 10) + '%"></div></div>' +
    '<div class="resumen">' + REPARTO.map(([t]) => TIPO[t].t + ': ' + fmt(res.filter((r, k) => EX.ejercicios[k].tipo === t).reduce((s, r) => s + r.puntos, 0)) + ' / ' + fmt(1.25 * res.filter((r, k) => EX.ejercicios[k].tipo === t).length)).join(' · ') + '</div></div></section>' +
    '<div class="fila"><button class="btn btn--primary" data-otro>' + IC.redo + 'Otro examen</button><button class="btn" data-inicio>Inicio</button></div>' +
    '<div class="seccion-t">Corrección ejercicio a ejercicio</div>' +
    EX.ejercicios.map((e, k) => {
      const b = banco(e), r = res[k];
      let tuya = '';
      if (e.tipo === 'er' && (e.resp.entities || []).length) tuya = '<details class="enun-box"><summary>Tu diagrama</summary>' + svgER(e.resp, 'Tu diagrama') + '</details>';
      if (e.tipo === 'rel' && String(e.resp).trim()) tuya = '<details class="enun-box"><summary>Tu respuesta</summary><pre class="code">' + esc(e.resp) + '</pre></details>';
      if (e.tipo === 'norm') tuya = '<details class="enun-box"><summary>Tu respuesta y la tabla</summary>' + tablaDatos(b) + '<pre class="code">Clave: ' + esc(e.resp.clave || '—') + '\nForma normal: ' + esc(e.resp.fn ? Corrector.FN_TXT[e.resp.fn] : '—') + '\n\n' + esc(e.resp.tablas || '') + '</pre></details>';
      return '<details class="q res-ej"' + (r.puntos < 1.25 ? ' open' : '') + '><summary><span class="n">' + (k + 1) + '</span><span class="t">' + TIPO[e.tipo].t + ' · ' + esc(b.titulo || b.tabla) + '</span><span class="estado ' + (r.puntos >= 1.25 ? 'bien' : r.puntos > 0 ? 'medio' : 'mal') + '">' + fmt(r.puntos) + '</span></summary>' +
        tuya + bloqueCorreccion(e, r, true) + '</details>';
    }).join('') + '</main>';
  const root = mount(html);
  enlaces(root);
  root.querySelector('[data-otro]').onclick = () => nuevoExamen(EX.modo);
  root.querySelector('[data-inicio]').onclick = inicio;
  window.scrollTo(0, 0);
}

// ---------- arranque ----------
if (EX && EX.entregado) inicio(); else inicio();

</script>
</body>
</html>
