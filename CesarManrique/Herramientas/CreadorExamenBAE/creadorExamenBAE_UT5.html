/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Creador de examen BAE UT5 — mismo estilo que el menú de repaso y el creador de Java ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  /* Color de BAE (portada de EVAGD), el mismo que en el menú de repaso */
  --asig: #75B6F9;
  --asig-tinta: #0B0B0C;
}
/* Contraste AA para texto pequeño (los tokens de marca se quedan algo cortos a 11–13 px) */
.concep { --text-3: #62626E; --ok-txt: #0B7A55; --warn-txt: #8A5500; --err-txt: #B00D4A; }
.concep-dark { --text-3: #8A8A98; --ok-txt: var(--ok); --warn-txt: var(--warn); --err-txt: var(--error); }
#app > div { --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text)); --focus: var(--asig); --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent); --err-bg: color-mix(in srgb, var(--error) 10%, transparent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), filter var(--dur-1); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--asig); border-color: transparent; color: var(--asig-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--asig); }
.btn--primary:hover { background: var(--asig); filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { color: var(--err-txt); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: transparent; }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--asig); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.progreso { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- página ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 58ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, color-mix(in srgb, var(--asig) 28%, transparent), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--asig); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; font-family: var(--f-prosa); line-height: 1.5; }
.lbl { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.reglas { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.reglas li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); font: 400 13.5px/1.5 var(--f-prosa); }
.reglas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--asig); flex: none; transform: translateY(-2px); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
.check input { accent-color: var(--asig); width: 16px; height: 16px; margin: 0; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hist { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.nota-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 600 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.nota-chip.ap { color: var(--ok-txt); }
.nota-chip.su { color: var(--err-txt); }
.vacio-txt { color: var(--text-3); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.lista-fallos { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.lista-fallos li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 400 13px/1.45 var(--f-prosa); color: var(--text); }
.lista-fallos li .ok { display: block; margin-top: 4px; color: var(--ok-txt); font-size: 12px; }
.lista-fallos li .x { float: right; margin-left: 8px; font: 600 11px var(--f-ui); color: var(--err-txt); }
textarea.copia { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 400 11.5px/1.4 var(--f-ui); resize: vertical; }
.msg { font-size: 12px; color: var(--text-3); }

/* ---------- examen ---------- */
.examen-page { max-width: 820px; margin: 0 auto; padding: 26px 24px 120px; }
.q { padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; scroll-margin-top: 80px; }
.q .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.q .meta .n { color: var(--acento-texto); font-weight: 600; }
.q h3 { font: 600 17px/1.35 var(--f-titulo); letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--f-prosa); cursor: pointer; transition: border-color var(--dur-1), background-color var(--dur-1); }
.opt:hover { border-color: var(--border-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-strong); font: 600 12px var(--f-ui); color: var(--text-2); }
.opt .t { padding-top: 2px; }
.opt:has(input:checked) { border-color: var(--asig); background: color-mix(in srgb, var(--asig) 9%, var(--bg)); }
.opt:has(input:checked) .l { background: var(--asig); border-color: var(--asig); color: var(--asig-tinta); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.q.hecha .opt { cursor: default; }
.q.hecha .opt.bien { border-color: var(--ok); background: var(--ok-bg); }
.q.hecha .opt.bien .l { background: var(--ok); border-color: var(--ok); color: #0B0B0C; }

<script>
/* Lógica y dibujo del CuadernoBD (Herramientas/CuadernoBD.html) */
/* Lógica pura del cuaderno: dependencias funcionales, formas normales y
   conversiones entre modelo E/R, modelo relacional y normalización.
   Sigue las reglas de la teoría de la UT5 (1º DAM, CIFP César Manrique). */
(function () {
  'use strict';

  const uid = () => 'x' + Math.random().toString(36).slice(2, 9);
  const uniq = a => [...new Set(a)];
  const sub = (a, b) => a.every(x => b.includes(x));
  const eq = (a, b) => a.length === b.length && sub(a, b);
  const fmt = a => (a.length > 1 ? '(' + a.join(', ') + ')' : a.join(''));
  const ident = s => (s || '').trim().replace(/\s+/g, '_');

  /* ---------- Dependencias funcionales ---------- */

  function closure(X, fds) {
    const c = [...X];
    let ch = true;
    while (ch) {
      ch = false;
      for (const f of fds) {
        if (sub(f.l, c)) for (const a of f.r) if (!c.includes(a)) { c.push(a); ch = true; }
      }
    }
    return c;
  }

  function combos(arr, k) {
    const out = [];
    (function rec(s, cur) {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = s; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    })(0, []);
    return out;
  }

  function minimalCover(fds) {
    let F = [];
    fds.forEach(f => f.r.forEach(a => { if (!f.l.includes(a)) F.push({ l: [...f.l], r: [a] }); }));
    F.forEach(f => {
      for (const x of [...f.l]) {
        if (f.l.length < 2) break;
        const l2 = f.l.filter(y => y !== x);
        if (closure(l2, F).includes(f.r[0])) f.l = l2;
      }
    });
    const seen = new Set();
    F = F.filter(f => {
      const k = [...f.l].sort().join(',') + '>' + f.r[0];
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    for (let i = F.length - 1; i >= 0; i--) {
      const rest = F.filter((_, j) => j !== i);
      if (closure(F[i].l, rest).includes(F[i].r[0])) F = rest;
    }
    return F;
  }

  const popcount = m => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };

  /* Dependencias que siguen valiendo dentro de un subconjunto de atributos. */
  function projectFDs(S, fds) {
    if (S.length > 12) {
      return minimalCover(fds.filter(f => sub(f.l, S))
        .map(f => ({ l: f.l, r: f.r.filter(a => S.includes(a)) })).filter(f => f.r.length));
    }
    const n = S.length, det = {}, out = [], masks = [];
    S.forEach(a => (det[a] = []));
    for (let m = 1; m < (1 << n); m++) masks.push(m);
    masks.sort((a, b) => popcount(a) - popcount(b));
    for (const m of masks) {
      const X = S.filter((_, i) => (m >> i) & 1);
      const c = closure(X, fds);
      for (const a of S) {
        if (X.includes(a) || !c.includes(a)) continue;
        if (det[a].some(d => (d & m) === d)) continue;
        det[a].push(m);
        out.push({ l: X, r: [a] });
      }
    }
    return minimalCover(out);
  }

  function candidateKeys(attrs, fds) {
    const F = fds.filter(f => sub(f.l, attrs)).map(f => ({ l: f.l, r: f.r.filter(a => attrs.includes(a)) }));
    const rhs = uniq(F.flatMap(f => f.r)), lhs = uniq(F.flatMap(f => f.l));
    const core = attrs.filter(a => !rhs.includes(a));
    if (sub(attrs, closure(core, F))) return [core];
    const mid = attrs.filter(a => rhs.includes(a) && lhs.includes(a)).slice(0, 16);
    const keys = [];
    for (let k = 1; k <= mid.length; k++) {
      for (const cb of combos(mid, k)) {
        const cand = [...core, ...cb];
        if (keys.some(key => sub(key, cand))) continue;
        if (sub(attrs, closure(cand, F))) keys.push(cand);
      }
    }
    return keys.length ? keys : [attrs.slice()];
  }

  /* Diagnóstico de una relación: claves y dependencias que rompen cada forma normal. */
  function analyze(attrs, fds, multi) {
    const cov = projectFDs(attrs, fds);
    const keys = candidateKeys(attrs, cov);
    const prime = uniq(keys.flat());
    const partial = [], trans = [], bc = [];
    for (const f of cov) {
      if (sub(attrs, closure(f.l, cov))) continue;
      const a = f.r[0];
      if (prime.includes(a)) { bc.push(f); continue; }
      if (keys.some(k => sub(f.l, k) && f.l.length < k.length)) partial.push(f); else trans.push(f);
    }
    const m = (multi || []).filter(a => attrs.includes(a));
    const nf = m.length ? '0' : partial.length ? '1FN' : trans.length ? '2FN' : bc.length ? '3FN' : 'FNBC';
    return { cov, keys, prime, partial, trans, bc, nf, multi: m };
  }

  const snap = rels => rels.map((r, i) => ({ name: 'R' + (i + 1), attrs: r.attrs.slice(), key: r.key.slice() }));

  /* Normalización paso a paso, como en los ejemplos de la teoría. */
  function decompose(name, attrs, fds, multi, pkIn) {
    const A = analyze(attrs, fds);
    const keys = A.keys;
    const pk = pkIn && pkIn.length && keys.some(k => eq(k, pkIn)) ? pkIn : keys[0];
    const steps = [];
    multi = (multi || []).filter(a => attrs.includes(a));

    steps.push({
      nf: '1FN', ok: !multi.length,
      text: multi.length
        ? ['No. ' + multi.join(', ') + (multi.length > 1 ? ' pueden' : ' puede') + ' tener varios valores en una misma fila.',
          'Se crea una fila para cada valor del atributo. A partir de aquí cada atributo tiene un solo valor por fila y la clave pasa a ser ' + fmt(pk) + '.']
        : ['Sí. Cada atributo tiene un solo valor en cada fila.'],
      rels: [{ name: name || 'R', attrs: attrs.slice(), key: pk.slice() }]
    });

    const moved = [], extra = [], t2 = [];
    const subs = [];
    for (let k = 1; k < pk.length; k++) subs.push(...combos(pk, k));
    for (const X of subs) {
      const dep = closure(X, fds).filter(a => attrs.includes(a) && !X.includes(a) && !A.prime.includes(a) && !moved.includes(a));
      if (!dep.length) continue;
      moved.push(...dep);
      extra.push({ attrs: [...X, ...dep], key: X.slice() });
      t2.push(fmt(X) + ' → ' + dep.join(', ') + '. ' + (dep.length > 1 ? 'Son atributos no principales que dependen' : 'Es un atributo no principal que depende') +
        ' de una parte de la clave ' + fmt(pk) + ', no de toda ella.');
    }
    const cur = [{ attrs: attrs.filter(a => !moved.includes(a)), key: pk.slice() }, ...extra];
    steps.push({
      nf: '2FN', ok: !extra.length,
      text: extra.length
        ? ['No.', ...t2, 'Se divide la tabla para que todos los atributos no principales tengan dependencia funcional completa de su clave.']
        : [pk.length === 1 ? 'Sí. La clave es un único atributo, así que está automáticamente en 2FN.'
          : 'Sí. Todos los atributos no principales dependen de la clave completa.'],
      rels: snap(cur)
    });

    const loop = (pick, describe) => {
      const notes = [];
      let guard = 0, changed = true;
      while (changed && guard++ < 60) {
        changed = false;
        for (let i = 0; i < cur.length; i++) {
          const r = cur[i];
          const I = analyze(r.attrs, fds);
          if (!I.keys.some(k => eq(k, r.key))) r.key = I.keys[0];
          const f = pick(I)[0];
          if (!f) continue;
          let Z = closure(f.l, fds).filter(a => r.attrs.includes(a) && !f.l.includes(a) && !I.prime.includes(a));
          if (!Z.length) Z = closure(f.l, fds).filter(a => r.attrs.includes(a) && !f.l.includes(a));
          if (!Z.length) continue;
          notes.push(describe('R' + (i + 1), r, f, Z));
          r.attrs = r.attrs.filter(a => !Z.includes(a));
          cur.push({ attrs: [...f.l, ...Z], key: f.l.slice() });
          changed = true;
          break;
        }
      }
      for (const r of cur) {
        const I = analyze(r.attrs, fds);
        if (!I.keys.some(k => eq(k, r.key))) r.key = I.keys[0];
      }
      return notes;
    };

    const t3 = loop(I => I.trans.concat(I.partial), (n, r, f, Z) =>
      'En ' + n + ': ' + fmt(r.key) + ' → ' + fmt(f.l) + ' y ' + fmt(f.l) + ' → ' + Z.join(', ') + ', luego ' +
      Z.join(', ') + (Z.length > 1 ? ' dependen' : ' depende') + ' transitivamente de la clave ' + fmt(r.key) + '.');
    steps.push({
      nf: '3FN', ok: !t3.length,
      text: t3.length
        ? ['No.', ...t3, 'Se descompone la relación para eliminar la dependencia transitiva.']
        : ['Sí. Ningún atributo no principal depende transitivamente de una clave.'],
      rels: snap(cur)
    });

    const tb = loop(I => I.bc, (n, r, f, Z) =>
      'En ' + n + ': ' + fmt(f.l) + ' → ' + Z.join(', ') + ', pero ' + fmt(f.l) + ' es un determinante que no es clave candidata.');
    const lost = lostFDs(fds, cur.map(r => r.attrs));
    steps.push({
      nf: 'FNBC', ok: !tb.length,
      text: tb.length
        ? ['No.', ...tb, 'Se separa cada determinante con lo que determina.',
          ...(lost.length ? ['Ojo: al llegar a FNBC ya no se puede comprobar dentro de una sola tabla ' + lost.map(fdText).join('; ') + '.'] : [])]
        : ['Sí. En todas las relaciones, todo determinante es clave candidata.'],
      rels: snap(cur)
    });

    return { keys, pk, nf: analyze(attrs, fds, multi).nf, steps, final: snap(cur) };
  }

  const fdText = f => f.l.join(', ') + ' → ' + f.r.join(', ');

  function lostFDs(fds, parts) {
    const lost = [];
    for (const f of minimalCover(fds)) {
      let Z = [...f.l], ch = true;
      while (ch) {
        ch = false;
        for (const R of parts) {
          const add = closure(Z.filter(a => R.includes(a)), fds).filter(a => R.includes(a) && !Z.includes(a));
          if (add.length) { Z.push(...add); ch = true; }
        }
      }
      if (!sub(f.r, Z)) lost.push(f);
    }
    return lost;
  }

  /* Prueba de la tabla (chase): ¿se puede recomponer la relación original sin filas de más? */
  function lossless(attrs, fds, parts) {
    const rows = parts.map((R, i) => Object.fromEntries(attrs.map(a => [a, R.includes(a) ? 'a' : 'b' + i])));
    let ch = true, guard = 0;
    while (ch && guard++ < 500) {
      ch = false;
      for (const f of fds) {
        for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) {
          if (!f.l.every(a => rows[i][a] === rows[j][a])) continue;
          for (const a of f.r) {
            if (rows[i][a] === rows[j][a]) continue;
            const from = rows[i][a] === 'a' ? rows[j][a] : rows[i][a];
            const to = rows[i][a] === 'a' ? 'a' : rows[j][a];
            rows.forEach(r => { if (r[a] === from) r[a] = to; });
            ch = true;
          }
        }
      }
    }
    return rows.some(r => attrs.every(a => r[a] === 'a'));
  }

  /* Corrige la descomposición que propone el alumno. */
  function checkAnswer(attrs, fds, userRels) {
    const items = [];
    const all = uniq(userRels.flatMap(r => r.attrs));
    const missing = attrs.filter(a => !all.includes(a));
    items.push(missing.length
      ? { ok: false, text: 'Faltan atributos de la relación original: ' + missing.join(', ') + '.' }
      : { ok: true, text: 'Aparecen todos los atributos de la relación original.' });
    let worst = 3;
    const rank = { '0': -1, '1FN': 0, '2FN': 1, '3FN': 2, 'FNBC': 3 };
    for (const r of userRels) {
      const I = analyze(r.attrs, fds);
      worst = Math.min(worst, rank[I.nf]);
      const bad = I.partial[0] || I.trans[0] || I.bc[0];
      items.push({
        ok: rank[I.nf] >= 2,
        text: r.name + ': clave ' + I.keys.map(fmt).join(' o ') + '. Está en ' + I.nf +
          (bad && I.nf !== 'FNBC' ? ' (se queda ahí por ' + fdText(bad) + ').' : '.')
      });
    }
    const ll = lossless(attrs, fds, userRels.map(r => r.attrs));
    items.push(ll
      ? { ok: true, text: 'Al unir tus tablas se recupera exactamente la información original.' }
      : { ok: false, text: 'Al unir tus tablas no se recupera la relación original: falta un atributo común que sea clave en alguna de ellas.' });
    const lost = lostFDs(fds, userRels.map(r => r.attrs));
    items.push(lost.length
      ? { ok: false, text: 'Hay dependencias que ya no se pueden comprobar dentro de una sola tabla: ' + lost.map(fdText).join('; ') + '.' }
      : { ok: true, text: 'Se conservan todas las dependencias funcionales.' });
    const good = !missing.length && worst >= 2 && ll;
    return { items, good, nf: ['1FN', '2FN', '3FN', 'FNBC'][Math.max(worst, 0)] };
  }

  /* ---------- Lectura de texto ---------- */

  const splitList = s => uniq((s || '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean));

  function canon(name, attrs) {
    const n = name.trim().toLowerCase();
    return attrs.find(a => a.toLowerCase() === n) || null;
  }

  function parseNorm(n) {
    const errors = [];
    const attrs = splitList(n.attrs);
    const pick = (list, what) => list.map(x => {
      const c = canon(x, attrs);
      if (!c) errors.push('«' + x + '» (' + what + ') no está en la lista de atributos.');
      return c;
    }).filter(Boolean);
    const multi = pick(splitList(n.multi), 'multivaluado');
    const pk = pick(splitList(n.pk), 'clave');
    const fds = [];
    (n.fds || '').split(/\n|;/).map(l => l.trim()).filter(Boolean).forEach(line => {
      const m = line.split(/->|→|=>/);
      if (m.length !== 2) { errors.push('No entiendo «' + line + '». Escribe, por ejemplo: dni -> nombre'); return; }
      const l = pick(splitList(m[0]), 'dependencia'), r = pick(splitList(m[1]), 'dependencia');
      if (l.length && r.length) fds.push({ l, r });
    });
    return { name: (n.name || 'R').trim() || 'R', attrs, multi, pk, fds, errors };
  }

  function parseRels(text, attrs) {
    const rels = [], errors = [];
    (text || '').split(/\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
      const m = line.match(/^([^()]*)\((.*)\)\s*$/);
      const name = m && m[1].trim() ? m[1].trim() : 'R' + (i + 1);
      const list = splitList(m ? m[2] : line).map(x => {
        const c = canon(x.replace(/[_*]+$/, '').replace(/^[_*]+/, ''), attrs) || canon(x, attrs);
        if (!c) errors.push('«' + x + '» no es un atributo de la relación original.');
        return c;
      }).filter(Boolean);
      if (list.length) rels.push({ name, attrs: uniq(list) });
    });
    return { rels, errors };
  }

  /* ---------- E/R → relacional ---------- */

  function guessType(n) {
    n = (n || '').toLowerCase();
    if (/fecha/.test(n)) return 'date';
    if (/hora/.test(n)) return 'time';
    if (/precio|monto|importe|total|descuento|salario|sueldo|nota/.test(n)) return 'decimal(10,2)';
    if (/^(id|cod|num)|_id$|codigo|stock|cantidad|año|anio|edad|unidades/.test(n)) return 'int';
    if (/descrip|contenido|texto|historia|resumen|caracter/.test(n)) return 'varchar(500)';
    return 'varchar(50)';
  }

  const isN = m => String(m).trim() !== '1';
  const card = (min, max) => '(' + min + ',' + max + ')';

  function relType(r) {
    if (r.parts.length < 2) return 'incompleta';
    if (r.parts.length > 2) return r.parts.length === 3 ? 'ternaria' : 'n-aria';
    const [p, q] = r.parts;
    const t = isN(p.max) && isN(q.max) ? 'N:M' : !isN(p.max) && !isN(q.max) ? '1:1' : '1:N';
    return t + (p.eid === q.eid ? ' reflexiva' : '');
  }

  function erToRel(er) {
    const steps = [], warn = [], tables = [], T = {};
    const E = Object.fromEntries(er.entities.map(e => [e.id, e]));
    const col = (name, o = {}) => ({
      id: uid(), name: ident(name), type: o.type || guessType(name),
      pk: !!o.pk, nn: !!o.pk || !!o.nn, uq: !!o.uq, fk: o.fk || null
    });
    const pkCols = t => t.cols.filter(c => c.pk);

    for (const e of er.entities) {
      const t = { id: uid(), name: ident(e.name) || 'TABLA', x: e.x - 90, y: e.y - 40, cols: [] };
      const notes = [];
      for (const a of e.attrs) {
        if (!a.name) continue;
        if (a.derived) { notes.push(a.name + ' es derivado: se puede calcular, así que no se guarda'); continue; }
        if (a.multi) continue;
        const parts = (a.parts || []).filter(Boolean);
        if (parts.length) {
          parts.forEach(p => t.cols.push(col(p, { pk: a.key })));
          notes.push(a.name + ' es compuesto: se guardan sus partes (' + parts.join(', ') + ')');
        } else t.cols.push(col(a.name, { pk: a.key }));
      }
      T[e.id] = t; tables.push(t);
      steps.push('Entidad ' + e.name + ' → tabla ' + t.name + ' con sus atributos' +
        (pkCols(t).length ? ' y la misma clave primaria (' + pkCols(t).map(c => c.name).join(', ') + ')' : '') +
        '.' + (notes.length ? ' ' + notes.join('; ') + '.' : ''));
    }

    const addFk = (t, target, o) => {
      const names = [];
      for (const pc of pkCols(target)) {
        let name = pc.name;
        if (t.cols.some(c => c.name === name)) name = pc.name + '_' + (ident(o.suffix) || target.name);
        let k = 2; const base = name;
        while (t.cols.some(c => c.name === name)) name = base + (k++);
        t.cols.push({ id: uid(), name, type: pc.type, pk: !!o.pk, nn: !!o.pk || !!o.nn, uq: !!o.uq, fk: { t: target.id, c: pc.id, far: o.far } });
        names.push(name);
      }
      return names;
    };

    /* Dependencias de identidad: subtipos de una jerarquía y entidades débiles. */
    const deps = [];
    const subIds = new Set();
    for (const h of er.hier || []) {
      if (!E[h.sup]) continue;
      for (const s of h.subs) if (E[s] && s !== h.sup) { deps.push({ child: s, parent: h.sup, kind: 'hier', h }); subIds.add(s); }
    }
    const identRels = new Set();
    for (const r of er.rels) {
      if (!r.ident || r.parts.length !== 2) continue;
      const [p, q] = r.parts;
      if (!E[p.eid] || !E[q.eid] || p.eid === q.eid) continue;
      let child = null;
      if (E[p.eid].weak && E[q.eid].weak) child = isN(p.max) ? p : q;
      else if (E[p.eid].weak) child = p;
      else if (E[q.eid].weak) child = q;
      if (!child) { warn.push('La relación ' + r.name + ' está marcada como de dependencia, pero ninguna de sus entidades es débil.'); continue; }
      const parent = child === p ? q : p;
      deps.push({ child: child.eid, parent: parent.eid, kind: 'weak', r, cp: child, pp: parent });
      identRels.add(r.id);
    }
    const depChild = new Set(deps.map(d => d.child));
    for (const e of er.entities) {
      const t = T[e.id];
      if (pkCols(t).length || depChild.has(e.id)) continue;
      if (e.weak) warn.push(e.name + ' es débil pero no tiene una relación de dependencia con la entidad de la que depende.');
      else warn.push(e.name + ' no tiene clave primaria. Se le añade una clave artificial.');
      t.cols.unshift(col('id_' + t.name.toLowerCase(), { pk: true, type: 'int' }));
      steps.push(t.name + ' no tenía clave: se crea la clave artificial ' + t.cols[0].name + '.');
    }
    let pending = deps.slice(), guard = 0;
    while (pending.length && guard++ < 200) {
      let d = pending.find(x => !pending.some(y => y !== x && y.child === x.parent));
      if (!d) { d = pending[0]; warn.push('Hay dependencias circulares entre entidades débiles o subtipos.'); }
      pending = pending.filter(x => x !== d);
      const c = T[d.child], p = T[d.parent];
      if (d.kind === 'hier') {
        const n = addFk(c, p, { pk: true, far: '(0,1)', suffix: p.name });
        steps.push('Jerarquía: el subtipo ' + c.name + ' hereda la clave del supertipo ' + p.name + ' (' + n.join(', ') +
          '), que es a la vez su clave primaria y clave foránea.');
      } else {
        const n = addFk(c, p, { pk: true, far: card(d.cp.min, d.cp.max), suffix: p.name });
        (d.r.attrs || []).forEach(a => a.name && c.cols.push(col(a.name)));
        steps.push('Entidad débil ' + c.name + ': su clave se completa con la de ' + p.name + ' (' + n.join(', ') +
          '), de la que depende a través de «' + d.r.name + '».');
      }
    }

    for (const e of er.entities) {
      for (const a of e.attrs.filter(a => a.multi && !a.derived && a.name)) {
        const owner = T[e.id];
        const t = { id: uid(), name: owner.name + '_' + ident(a.name), x: owner.x + 60, y: owner.y - 150, cols: [] };
        addFk(t, owner, { pk: true, far: '(0,n)' });
        t.cols.push(col(a.name, { pk: true }));
        tables.push(t);
        steps.push('Atributo multivaluado ' + a.name + ' de ' + e.name + ' → tabla aparte ' + t.name +
          ' con la clave primaria de ' + owner.name + ' y el atributo.');
      }
    }

    for (const r of er.rels) {
      if (identRels.has(r.id)) continue;
      const parts = r.parts.filter(p => E[p.eid]);
      const rn = r.name || 'relación';
      const ra = (r.attrs || []).filter(a => a.name);
      if (parts.length < 2) { warn.push('La relación «' + rn + '» necesita al menos dos participantes.'); continue; }
      if (parts.length > 2) {
        const t = { id: uid(), name: ident(r.name) || parts.map(p => T[p.eid].name).join('_'), x: r.x - 80, y: r.y - 30, cols: [] };
        parts.forEach(p => addFk(t, T[p.eid], { pk: true, far: '(0,n)', suffix: p.role }));
        ra.forEach(a => t.cols.push(col(a.name)));
        tables.push(t);
        steps.push('Relación «' + rn + '» entre ' + parts.length + ' entidades → tabla ' + t.name + ' con las claves de todas las entidades que participan.');
        continue;
      }
      const [p, q] = parts, A = T[p.eid], B = T[q.eid];
      const pn = isN(p.max), qn = isN(q.max);
      if (pn && qn) {
        const base = A === B ? A.name + '_' + (ident(r.name) || 'relacion') : A.name + '_' + B.name;
        const t = { id: uid(), name: tables.some(x => x.name === base) ? base + '_' + ident(r.name) : base, x: r.x - 80, y: r.y - 30, cols: [] };
        addFk(t, A, { pk: true, far: card(q.min, q.max), suffix: p.role });
        addFk(t, B, { pk: true, far: card(p.min, p.max), suffix: q.role || (A === B ? '2' : '') });
        ra.forEach(a => t.cols.push(col(a.name)));
        tables.push(t);
        steps.push('Relación N:M «' + rn + '» → tabla ' + t.name + ' (se nombra juntando las tablas que relaciona) con las claves primarias de ' + A.name +
          (A === B ? ' dos veces (una por cada papel)' : ' y ' + B.name) +
          (ra.length ? ' más los atributos propios de la relación (' + ra.map(a => a.name).join(', ') + ')' : '') +
          '. Genera dos claves foráneas.');
        continue;
      }
      let holder, target, hp, tp, kind;
      if (!pn && qn) { holder = B; target = A; hp = q; tp = p; kind = '1:N'; }
      else if (pn && !qn) { holder = A; target = B; hp = p; tp = q; kind = '1:N'; }
      else {
        kind = '1:1';
        if (String(p.min) === '1' || String(q.min) !== '1') { holder = B; target = A; hp = q; tp = p; }
        else { holder = A; target = B; hp = p; tp = q; }
      }
      const nullable = String(tp.min) === '0';
      const n = addFk(holder, target, { nn: !nullable, uq: kind === '1:1', far: card(hp.min, hp.max), suffix: tp.role || hp.role || r.name });
      ra.forEach(a => holder.cols.push(col(a.name)));
      if (kind === '1:N') {
        steps.push('Relación 1:N «' + rn + '» → la tabla del lado N (' + holder.name + ') recibe la clave de ' + target.name +
          ' como clave foránea (' + n.join(', ') + '). ' +
          (nullable ? 'Admite nulos porque la participación es opcional (mínima 0).' : 'No admite nulos porque la participación es obligatoria (mínima 1).'));
      } else {
        steps.push('Relación 1:1 «' + rn + '» → se añade a ' + holder.name + ' la clave de ' + target.name + ' (' + n.join(', ') +
          '), sin repetidos' + (nullable ? ' y admitiendo nulos.' : ' y obligatoria.') +
          (String(p.min) === '1' && String(q.min) === '1' ? ' Como es obligatoria en los dos sentidos, también se podrían unir las dos entidades en una sola tabla.' : ''));
      }
      if (ra.length) warn.push('La relación «' + rn + '» es ' + kind + ' y tiene atributos. Según la teoría solo las N:M los admiten; aquí se han pasado a ' + holder.name + '.');
    }

    return { rel: { tables }, steps, warn };
  }

  /* ---------- Relacional → E/R ---------- */

  function parseCard(s, dMin, dMax) {
    const m = /\(\s*(\w+)\s*,\s*(\w+)\s*\)/.exec(s || '');
    return m ? { min: m[1], max: m[2] } : { min: dMin, max: dMax };
  }

  function relToEr(rel) {
    const steps = [], warn = [];
    const byId = Object.fromEntries(rel.tables.map(t => [t.id, t]));
    const groups = t => {
      const g = {};
      t.cols.forEach(c => { if (c.fk && byId[c.fk.t]) (g[c.fk.t] = g[c.fk.t] || []).push(c); });
      return Object.entries(g).map(([tid, cols]) => ({ target: byId[tid], cols }));
    };
    const referenced = new Set(rel.tables.flatMap(t => t.cols.filter(c => c.fk).map(c => c.fk.t)));
    const kind = {};
    for (const t of rel.tables) {
      const pk = t.cols.filter(c => c.pk), g = groups(t);
      const pkG = g.filter(x => x.cols.some(c => c.pk));
      const pkFk = pk.length > 0 && pk.every(c => c.fk && byId[c.fk.t]);
      const twice = pkG.length === 1 && pkG[0].cols.filter(c => c.pk).length >= 2 &&
        new Set(pkG[0].cols.map(c => c.fk.c)).size < pkG[0].cols.length;
      if (pkFk && !referenced.has(t.id) && (pkG.length >= 2 || twice)) kind[t.id] = 'nm';
      else if (!referenced.has(t.id) && pk.length === t.cols.length && g.length === 1 && t.cols.filter(c => !c.fk).length === 1 &&
        (t.name || '').toLowerCase().includes((g[0].target.name || '').toLowerCase())) kind[t.id] = 'multi';
      else if (pkFk && pkG.length === 1) kind[t.id] = 'sub';
      else if (pkG.length >= 1) kind[t.id] = 'weak';
      else kind[t.id] = 'entity';
    }
    const isEnt = id => ['entity', 'weak', 'sub'].includes(kind[id]);
    for (const t of rel.tables) {
      if ((kind[t.id] === 'nm' || kind[t.id] === 'multi') && !groups(t).every(g => isEnt(g.target.id))) kind[t.id] = 'weak';
    }

    const er = { entities: [], rels: [], hier: [] }, Eof = {};
    for (const t of rel.tables) {
      if (!isEnt(t.id)) continue;
      const e = {
        id: uid(), name: t.name, weak: kind[t.id] === 'weak', x: 0, y: 0,
        attrs: t.cols.filter(c => !c.fk).map(c => ({ id: uid(), name: c.name, key: c.pk, multi: false, derived: false, parts: [] }))
      };
      Eof[t.id] = e; er.entities.push(e);
      steps.push('Tabla ' + t.name + ' → entidad' + (e.weak ? ' débil' : '') + ' ' + e.name +
        '. Sus columnas propias son los atributos; las claves foráneas no se dibujan como atributos porque salen de las relaciones.');
    }
    const mkRel = (name, parts, o = {}) => {
      const r = { id: uid(), name, x: 0, y: 0, ident: !!o.ident, parts, attrs: o.attrs || [] };
      er.rels.push(r); return r;
    };
    const part = (eid, c, role) => ({ eid, min: String(c.min), max: String(c.max), role: role || '' });
    const hierOf = {};

    for (const t of rel.tables) {
      const g = groups(t), k = kind[t.id];
      if (k === 'multi') {
        const own = Eof[g[0].target.id], c = t.cols.find(x => !x.fk);
        own.attrs.push({ id: uid(), name: c.name, key: false, multi: true, derived: false, parts: [] });
        steps.push('Tabla ' + t.name + ' (clave de ' + own.name + ' + un atributo) → atributo multivaluado ' + c.name + ' de ' + own.name + '.');
        continue;
      }
      if (k === 'nm') {
        let ps;
        if (g.length === 1) {
          const e = Eof[g[0].target.id];
          ps = [part(e.id, { min: 0, max: 'n' }), part(e.id, { min: 0, max: 'n' })];
        } else if (g.length === 2) {
          ps = [part(Eof[g[0].target.id].id, parseCard(g[1].cols[0].fk.far, 0, 'n')),
            part(Eof[g[1].target.id].id, parseCard(g[0].cols[0].fk.far, 0, 'n'))];
          ps.forEach(p => { p.max = 'n'; });
        } else ps = g.map(x => part(Eof[x.target.id].id, { min: 0, max: 'n' }));
        mkRel(t.name, ps, { attrs: t.cols.filter(c => !c.fk).map(c => ({ id: uid(), name: c.name })) });
        steps.push('Tabla ' + t.name + ' (su clave son solo claves foráneas) → relación N:M entre ' +
          uniq(g.map(x => x.target.name)).join(' y ') + '. Sus otras columnas son atributos de la relación.');
        continue;
      }
      const me = Eof[t.id];
      let identDone = false;
      for (const x of g) {
        const tgt = Eof[x.target.id];
        if (!tgt) continue;
        const inPk = x.cols.some(c => c.pk);
        if (k === 'sub' && inPk) {
          const h = hierOf[tgt.id] || (hierOf[tgt.id] = { id: uid(), sup: tgt.id, subs: [], total: false, exclusive: true, x: 0, y: 0 });
          h.subs.push(me.id);
          steps.push('Tabla ' + t.name + ' (su clave primaria es entera la clave de ' + x.target.name + ') → subtipo de ' + x.target.name + ' en una jerarquía.');
          continue;
        }
        const nn = x.cols.every(c => c.nn);
        const uq = x.cols.length === 1 && x.cols[0].uq;
        const far = parseCard(x.cols[0].fk.far, 0, uq ? '1' : 'n');
        if (k === 'weak' && inPk && !identDone) {
          identDone = true;
          mkRel('tiene', [part(tgt.id, { min: 1, max: 1 }), part(me.id, far)], { ident: true });
          steps.push('La clave de ' + t.name + ' incluye la de ' + x.target.name + ' → ' + t.name + ' es débil y depende de ' + x.target.name + ' (relación 1:N de dependencia).');
          continue;
        }
        const role = x.cols.length === 1 && !x.target.cols.some(c => c.name === x.cols[0].name) ? x.cols[0].name : '';
        mkRel('tiene', [part(tgt.id, { min: nn ? 1 : 0, max: 1 }, role), part(me.id, far)]);
        steps.push('Clave foránea ' + x.cols.map(c => c.name).join(', ') + ' de ' + t.name + ' → relación ' + (uq ? '1:1' : '1:N') + ' con ' + x.target.name +
          '. ' + (nn ? 'Es obligatoria (no admite nulos): mínima 1.' : 'Admite nulos: mínima 0.'));
      }
    }
    er.hier = Object.values(hierOf);
    if (er.rels.some(r => r.name === 'tiene')) warn.push('A las relaciones que salen de una clave foránea se les pone el nombre «tiene». Cámbialo por un verbo que encaje.');
    if (er.hier.length) warn.push('Las jerarquías se marcan como parciales y exclusivas. Las tablas no guardan ese dato: revísalo.');
    layoutER(er);
    return { er, steps, warn };
  }

  function layoutER(er) {
    const n = er.entities.length, per = Math.max(1, Math.ceil(Math.sqrt(n)));
    er.entities.forEach((e, i) => { e.x = 240 + (i % per) * 400; e.y = 200 + Math.floor(i / per) * 300; });
    const E = Object.fromEntries(er.entities.map(e => [e.id, e]));
    const used = {};
    er.rels.forEach(r => {
      const ps = r.parts.map(p => E[p.eid]).filter(Boolean);
      if (!ps.length) { r.x = 200; r.y = 100; return; }
      let x = ps.reduce((s, e) => s + e.x, 0) / ps.length, y = ps.reduce((s, e) => s + e.y, 0) / ps.length;
      if (new Set(ps).size === 1) { x += 190; y += 110; }
      const k = Math.round(x) + ',' + Math.round(y);
      used[k] = (used[k] || 0) + 1;
      r.x = x; r.y = y + (used[k] - 1) * 84;
    });
    (er.hier || []).forEach(h => { const s = E[h.sup]; if (s) { h.x = s.x; h.y = s.y + 95; } });
  }

  function layoutRel(rel) {
    const per = Math.max(1, Math.ceil(Math.sqrt(rel.tables.length)));
    let y = 50;
    for (let i = 0; i < rel.tables.length; i += per) {
      const row = rel.tables.slice(i, i + per);
      row.forEach((t, j) => { t.x = 60 + j * 330; t.y = y; });
      y += Math.max(...row.map(t => 34 + t.cols.length * 22)) + 90;
    }
  }

  /* ---------- Normalización → relacional ---------- */

  function normToRel(final, origName, origKey) {
    const tables = final.map((r, i) => {
      const isMain = eq(r.key, origKey) || i === 0;
      const name = isMain && i === 0 ? ident(origName).toUpperCase() || 'R1' : r.key.map(ident).join('_').toUpperCase();
      return {
        id: uid(), name, x: 0, y: 0, _r: r,
        cols: r.attrs.map(a => ({ id: uid(), name: ident(a), _a: a, type: guessType(a), pk: r.key.includes(a), nn: r.key.includes(a), uq: false, fk: null }))
      };
    });
    const names = {};
    tables.forEach(t => { names[t.name] = (names[t.name] || 0) + 1; if (names[t.name] > 1) t.name += '_' + names[t.name]; });
    for (const t of tables) for (const u of tables) {
      if (t === u || !sub(u._r.key, t._r.attrs) || eq(u._r.key, t._r.key)) continue;
      u._r.key.forEach(a => {
        const c = t.cols.find(x => x._a === a), pc = u.cols.find(x => x._a === a);
        if (c && !c.fk) { c.fk = { t: u.id, c: pc.id, far: '(0,n)' }; c.nn = true; }
      });
    }
    tables.forEach(t => { delete t._r; t.cols.forEach(c => delete c._a); });
    const rel = { tables };
    layoutRel(rel);
    return rel;
  }

  /* ---------- SQL (SQL Server) ---------- */

  function sqlFor(rel, withFk) {
    const byId = Object.fromEntries(rel.tables.map(t => [t.id, t]));
    let order = rel.tables.slice();
    if (withFk) {
      const done = new Set(); order = [];
      let left = rel.tables.slice(), guard = 0;
      while (left.length && guard++ < 500) {
        const i = left.findIndex(t => t.cols.every(c => !c.fk || c.fk.t === t.id || done.has(c.fk.t) || !byId[c.fk.t]));
        const t = left.splice(i < 0 ? 0 : i, 1)[0];
        done.add(t.id); order.push(t);
      }
    }
    return order.map(t => {
      const w = Math.max(...t.cols.map(c => c.name.length), 1);
      const lines = t.cols.map(c => '    ' + c.name.padEnd(w) + ' ' + (c.type || 'varchar(50)') + (c.nn || c.pk ? ' NOT NULL' : ' NULL'));
      const pk = t.cols.filter(c => c.pk);
      if (pk.length) lines.push('    CONSTRAINT PK_' + t.name + ' PRIMARY KEY (' + pk.map(c => c.name).join(', ') + ')');
      t.cols.filter(c => c.uq && !c.pk).forEach(c => lines.push('    CONSTRAINT UQ_' + t.name + '_' + c.name + ' UNIQUE (' + c.name + ')'));
      if (withFk) {
        const g = {};
        t.cols.forEach(c => { if (c.fk && byId[c.fk.t]) (g[c.fk.t] = g[c.fk.t] || []).push(c); });
        Object.entries(g).forEach(([tid, cols], i) => {
          const u = byId[tid];
          const refs = cols.map(c => (u.cols.find(x => x.id === c.fk.c) || {}).name).filter(Boolean);
          if (refs.length !== cols.length) return;
          lines.push('    CONSTRAINT FK_' + t.name + '_' + u.name + (i ? i + 1 : '') + ' FOREIGN KEY (' + cols.map(c => c.name).join(', ') +
            ') REFERENCES ' + u.name + ' (' + refs.join(', ') + ')');
        });
      }
      return 'CREATE TABLE ' + t.name + ' (\n' + lines.join(',\n') + '\n);';
    }).join('\n\n');
  }

  /* ---------- Comprobaciones ---------- */

  function validateER(er) {
    const out = [];
    const E = Object.fromEntries(er.entities.map(e => [e.id, e]));
    const names = er.entities.map(e => (e.name || '').trim().toLowerCase());
    er.entities.forEach((e, i) => {
      const n = e.name || '(sin nombre)';
      if (!(e.name || '').trim()) out.push('Hay una entidad sin nombre.');
      if (names.indexOf(names[i]) !== i) out.push('El nombre ' + n + ' está repetido.');
      if (!e.attrs.some(a => a.key)) out.push(e.weak
        ? n + ' es débil y no tiene ningún atributo marcado como clave. Marca el que la distingue dentro de la entidad de la que depende.'
        : n + ' no tiene clave primaria. El modelo exige una (se representa subrayada).');
      const inRel = er.rels.some(r => r.parts.some(p => p.eid === e.id)) || (er.hier || []).some(h => h.sup === e.id || h.subs.includes(e.id));
      if (!inRel) out.push(n + ' no participa en ninguna relación. Las entidades deben estar asociadas mediante una relación.');
      if (e.weak && !er.rels.some(r => r.ident && r.parts.some(p => p.eid === e.id)))
        out.push(n + ' es débil: marca como «de dependencia» la relación que la une a la entidad de la que depende.');
      e.attrs.forEach(a => { if (a.key && a.multi) out.push('En ' + n + ', ' + a.name + ' no puede ser clave y multivaluado a la vez.'); });
    });
    er.rels.forEach(r => {
      const n = '«' + (r.name || 'sin nombre') + '»';
      if (!(r.name || '').trim()) out.push('Hay una relación sin nombre. Suele ser un verbo.');
      const ps = r.parts.filter(p => E[p.eid]);
      if (ps.length < 2) out.push('La relación ' + n + ' une menos de dos entidades. Si es reflexiva, añade la misma entidad dos veces.');
      if (ps.length === 2 && (r.attrs || []).length && relType(r).indexOf('N:M') !== 0)
        out.push('La relación ' + n + ' tiene atributos y no es N:M. La N:M es el único caso que los admite.');
      if (ps.length > 2) out.push('La relación ' + n + ' une ' + ps.length + ' entidades. Se puede, pero normalmente se intenta que sean binarias.');
    });
    (er.hier || []).forEach(h => {
      if (!E[h.sup]) out.push('Hay una jerarquía sin supertipo.');
      if (h.subs.filter(s => E[s]).length < 1) out.push('Hay una jerarquía sin subtipos.');
    });
    return out;
  }

  function validateRel(rel) {
    const out = [];
    const byId = Object.fromEntries(rel.tables.map(t => [t.id, t]));
    const names = rel.tables.map(t => (t.name || '').toLowerCase());
    rel.tables.forEach((t, i) => {
      const n = t.name || '(sin nombre)';
      if (!(t.name || '').trim()) out.push('Hay una tabla sin nombre.');
      if (names.indexOf(names[i]) !== i) out.push('El nombre de tabla ' + n + ' está repetido.');
      if (!t.cols.length) out.push(n + ' no tiene columnas.');
      else if (!t.cols.some(c => c.pk)) out.push(n + ' no tiene clave primaria.');
      const cn = t.cols.map(c => (c.name || '').toLowerCase());
      t.cols.forEach((c, j) => {
        if (!(c.name || '').trim()) out.push('En ' + n + ' hay una columna sin nombre.');
        else if (cn.indexOf(cn[j]) !== j) out.push('En ' + n + ' la columna ' + c.name + ' está repetida.');
        if (!c.fk) return;
        const u = byId[c.fk.t], rc = u && u.cols.find(x => x.id === c.fk.c);
        if (!rc) { out.push('En ' + n + ', la clave foránea ' + c.name + ' apunta a una columna que ya no existe.'); return; }
        if (!rc.pk) out.push('En ' + n + ', ' + c.name + ' apunta a ' + u.name + '.' + rc.name + ', que no es clave primaria. Una clave foránea debe ser clave primaria en la otra tabla.');
        if ((rc.type || '').toLowerCase() !== (c.type || '').toLowerCase())
          out.push('En ' + n + ', ' + c.name + ' (' + c.type + ') no tiene el mismo tipo que ' + u.name + '.' + rc.name + ' (' + rc.type + ').');
      });
    });
    return out;
  }

  window.L = {
    uid, uniq, sub, eq, fmt, ident, closure, minimalCover, candidateKeys, analyze, decompose, checkAnswer,
    parseNorm, parseRels, fdText, guessType, relType, erToRel, relToEr, layoutER, layoutRel, normToRel,
    sqlFor, validateER, validateRel, lossless, lostFDs
  };
})();


</script>
<script>
/* Dibujo de los diagramas en SVG. Notación de Chen para el E/R (rectángulos,
   rombos, elipses y cardinalidades (mín,máx) junto a cada entidad) y cajas de
   tabla con cardinalidades para el modelo relacional, como en la teoría. */
(function () {
  'use strict';

  const C = {
    ink: '#2e2118', line: '#6b5440', ent: '#f1e3c6', rel: '#e6d2ab', attr: '#fffaf0',
    acc: '#8c2f1b', sel: '#b8641a', mut: '#7a6652', head: '#5a3a22', headTxt: '#fbf3e0', paper: '#fbf6ea'
  };
  const FONT = "Inter,'Segoe UI',system-ui,sans-serif";
  const MONO = "'JetBrains Mono',Consolas,'Courier New',monospace";
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const entSize = e => ({ w: Math.max(120, (e.name || '').length * 9.5 + 34), h: 46 });
  const relSize = r => ({ w: Math.max(124, (r.name || '').length * 9 + 60), h: 68 });
  const attrR = n => ({ rx: Math.max(40, (n || '').length * 4.2 + 16), ry: 17 });

  function edge(cx, cy, w, h, tx, ty) {
    const dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    const s = Math.min(dx ? (w / 2) / Math.abs(dx) : 1e9, dy ? (h / 2) / Math.abs(dy) : 1e9);
    return { x: cx + dx * s, y: cy + dy * s };
  }

  function attrDefault(i, n, below) {
    const step = n > 1 ? Math.min(44, 110 / (n - 1)) : 0;
    const ang = (-90 + (i - (n - 1) / 2) * step) * Math.PI / 180;
    const far = n > 4 && i % 2 ? 1.45 : 1;
    return { dx: Math.cos(ang) * 150 * (n > 4 ? 1.25 : 1), dy: Math.sin(ang) * 104 * far * (below ? -1 : 1) };
  }

  function txt(x, y, t, o) {
    o = o || {};
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + (o.anchor || 'middle') +
      '" dominant-baseline="central" font-family="' + (o.mono ? MONO : FONT) + '" font-size="' + (o.size || 14) +
      '" fill="' + (o.fill || C.ink) + '"' + (o.bold ? ' font-weight="bold"' : '') + (o.it ? ' font-style="italic"' : '') +
      (o.u ? ' text-decoration="underline"' : '') + ' style="pointer-events:none">' + esc(t) + '</text>';
  }
  const ln = (x1, y1, x2, y2, o) => '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
    '" stroke="' + C.line + '" stroke-width="' + ((o && o.w) || 1.4) + '"/>';

  function mkBox() {
    const b = { x1: 1e9, y1: 1e9, x2: -1e9, y2: -1e9 };
    b.add = (x, y, mx, my) => {
      mx = mx || 0; my = my == null ? mx : my;
      b.x1 = Math.min(b.x1, x - mx); b.y1 = Math.min(b.y1, y - my);
      b.x2 = Math.max(b.x2, x + mx); b.y2 = Math.max(b.y2, y + my);
    };
    b.done = () => (b.x1 > b.x2 ? { x: 0, y: 0, w: 400, h: 240 } :
      { x: Math.floor(b.x1 - 24), y: Math.floor(b.y1 - 24), w: Math.ceil(b.x2 - b.x1 + 48), h: Math.ceil(b.y2 - b.y1 + 48) });
    return b;
  }

  function erSVG(er, sel) {
    let under = '', top = '';
    const box = mkBox();
    const E = Object.fromEntries(er.entities.map(e => [e.id, e]));
    const isSel = (k, id) => sel && sel.k === k && sel.id === id;
    const stroke = on => 'stroke="' + (on ? C.sel : C.ink) + '" stroke-width="' + (on ? 2.6 : 1.5) + '"';

    function drawAttrs(owner, k, below) {
      const list = owner.attrs || [];
      list.forEach((a, i) => {
        const d = a.dx == null ? attrDefault(i, list.length, below) : a;
        const ax = owner.x + d.dx, ay = owner.y + d.dy, R = attrR(a.name);
        under += ln(owner.x, owner.y, ax, ay, { w: 1.1 });
        const parts = (a.parts || []).filter(Boolean);
        if (parts.length) {
          const side = d.dx < 0 ? -1 : 1;
          parts.forEach((p, j) => {
            const pr = attrR(p);
            const px = ax + side * (R.rx + 26 + pr.rx), py = ay + (j - (parts.length - 1) / 2) * 35;
            under += ln(ax, ay, px, py, { w: 1 });
            top += '<ellipse cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" rx="' + (pr.rx - 4) + '" ry="15" fill="' + C.attr + '" stroke="' + C.ink + '" stroke-width="1.1"/>' +
              txt(px, py, p, { size: 12 });
            box.add(px, py, pr.rx, 16);
          });
        }
        let g = '<g data-k="a" data-id="' + a.id + '" data-owner="' + owner.id + '" data-ok="' + k + '" style="cursor:grab">';
        if (a.multi) g += '<ellipse cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" rx="' + (R.rx + 4) + '" ry="' + (R.ry + 4) + '" fill="' + C.attr + '" stroke="' + C.ink + '" stroke-width="1.2"/>';
        g += '<ellipse cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" rx="' + R.rx + '" ry="' + R.ry + '" fill="' + C.attr + '" stroke="' + C.ink +
          '" stroke-width="1.2"' + (a.derived ? ' stroke-dasharray="5 4"' : '') + '/>';
        g += txt(ax, ay, a.name || '…', { size: 13, u: a.key, bold: a.key }) + '</g>';
        top += g;
        box.add(ax, ay, R.rx + 5, R.ry + 5);
      });
    }

    /* Relaciones: líneas hasta las entidades y cardinalidad junto a cada entidad. */
    er.rels.forEach(r => {
      const count = {}, seen = {};
      r.parts.forEach(p => { count[p.eid] = (count[p.eid] || 0) + 1; });
      r.parts.forEach(p => {
        const e = E[p.eid];
        if (!e) return;
        const j = seen[p.eid] = (seen[p.eid] || 0) + 1;
        const k = count[p.eid] > 1 ? (j - 1 - (count[p.eid] - 1) / 2) * 110 : 0;
        const dx = r.x - e.x, dy = r.y - e.y, len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        let nx = -uy, ny = ux;
        if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }
        const es = entSize(e);
        let lx, ly;
        if (!k) {
          under += ln(r.x, r.y, e.x, e.y);
          const p0 = edge(e.x, e.y, es.w, es.h, r.x, r.y);
          const sep = 11 + 11 * Math.abs(nx);
          lx = p0.x + ux * 27 + nx * sep; ly = p0.y + uy * 27 + ny * sep;
        } else {
          const mx = (r.x + e.x) / 2 - uy * k, my = (r.y + e.y) / 2 + ux * k;
          under += '<path d="M' + r.x + ' ' + r.y + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + e.x + ' ' + e.y + '" fill="none" stroke="' + C.line + '" stroke-width="1.4"/>';
          const t = 0.6, q = (a, b, c) => (1 - t) * (1 - t) * a + 2 * t * (1 - t) * b + t * t * c;
          lx = q(r.x, mx, e.x) - uy * Math.sign(k) * 16; ly = q(r.y, my, e.y) + ux * Math.sign(k) * 16;
        }
        top += txt(lx, ly, '(' + p.min + ',' + p.max + ')', { size: 13, fill: C.acc });
        box.add(lx, ly, 22, 10);
        if (p.role) {
          const mx2 = (r.x + e.x) / 2 - (k ? uy * k * 0.55 : 0) - nx * 11, my2 = (r.y + e.y) / 2 + (k ? ux * k * 0.55 : 0) - ny * 11;
          top += txt(mx2, my2, p.role, { size: 11.5, it: true, fill: C.mut });
        }
      });
    });

    /* Jerarquías: triángulo, círculo si es total y arco si es exclusiva. */
    (er.hier || []).forEach(h => {
      const s = E[h.sup];
      if (s) {
        under += ln(s.x, s.y, h.x, h.y - 16);
        const es = entSize(s), p0 = edge(s.x, s.y, es.w, es.h, h.x, h.y - 16);
        const dx = h.x - s.x, dy = h.y - 16 - s.y, len = Math.hypot(dx, dy) || 1;
        top += txt(p0.x + dx / len * 14 + 24, p0.y + dy / len * 14, '(1,1)', { size: 12, fill: C.acc });
        if (h.total) top += '<circle cx="' + (h.x - dx / len * 9).toFixed(1) + '" cy="' + (h.y - 16 - dy / len * 9).toFixed(1) + '" r="5" fill="' + C.paper + '" stroke="' + C.ink + '" stroke-width="1.4"/>';
      }
      h.subs.forEach(id => {
        const e = E[id];
        if (!e) return;
        under += ln(h.x, h.y + 2, e.x, e.y);
        const es = entSize(e), p0 = edge(e.x, e.y, es.w, es.h, h.x, h.y);
        const dx = h.x - e.x, dy = h.y - e.y, len = Math.hypot(dx, dy) || 1;
        top += txt(p0.x + dx / len * 14 + (dx >= 0 ? -24 : 24), p0.y + dy / len * 14, h.exclusive ? '(0,1)' : '(0,1) o (1,1)', { size: 12, fill: C.acc });
      });
      const on = isSel('h', h.id);
      top += '<g data-k="h" data-id="' + h.id + '" style="cursor:grab"><polygon points="' + (h.x - 30) + ',' + (h.y - 16) + ' ' + (h.x + 30) + ',' + (h.y - 16) + ' ' + h.x + ',' + (h.y + 18) +
        '" fill="' + C.rel + '" ' + stroke(on) + '/></g>';
      if (h.exclusive) top += '<path d="M' + (h.x - 40) + ' ' + (h.y + 20) + ' Q' + h.x + ' ' + (h.y + 46) + ' ' + (h.x + 40) + ' ' + (h.y + 20) + '" fill="none" stroke="' + C.ink + '" stroke-width="1.4"/>';
      top += txt(h.x + 38, h.y - 4, (h.total ? 'Total' : 'Parcial') + (h.exclusive ? ', exclusiva' : ', solapada'), { size: 11.5, it: true, fill: C.mut, anchor: 'start' });
      box.add(h.x, h.y, 150, 46);
    });

    er.entities.forEach(e => drawAttrs(e, 'e', false));
    er.rels.forEach(r => drawAttrs(r, 'r', true));

    er.rels.forEach(r => {
      const s = relSize(r), on = isSel('r', r.id);
      const pts = (w, h) => (r.x - w / 2) + ',' + r.y + ' ' + r.x + ',' + (r.y - h / 2) + ' ' + (r.x + w / 2) + ',' + r.y + ' ' + r.x + ',' + (r.y + h / 2);
      top += '<g data-k="r" data-id="' + r.id + '" style="cursor:grab">';
      if (r.ident) top += '<polygon points="' + pts(s.w + 16, s.h + 12) + '" fill="' + C.rel + '" ' + stroke(on) + '/>';
      top += '<polygon points="' + pts(s.w, s.h) + '" fill="' + C.rel + '" ' + stroke(on && !r.ident) + '/>' +
        txt(r.x, r.y, r.name || '…', { size: 13.5, it: true }) + '</g>';
      box.add(r.x, r.y, s.w / 2 + 10, s.h / 2 + 8);
    });

    er.entities.forEach(e => {
      const s = entSize(e), on = isSel('e', e.id);
      top += '<g data-k="e" data-id="' + e.id + '" style="cursor:grab">';
      if (e.weak) top += '<rect x="' + (e.x - s.w / 2 - 5) + '" y="' + (e.y - s.h / 2 - 5) + '" width="' + (s.w + 10) + '" height="' + (s.h + 10) + '" fill="' + C.ent + '" ' + stroke(on) + '/>';
      top += '<rect x="' + (e.x - s.w / 2) + '" y="' + (e.y - s.h / 2) + '" width="' + s.w + '" height="' + s.h + '" fill="' + C.ent + '" ' + stroke(on && !e.weak) + '/>' +
        txt(e.x, e.y, (e.name || '…').toUpperCase(), { size: 14, bold: true }) + '</g>';
      box.add(e.x, e.y, s.w / 2 + 6, s.h / 2 + 6);
    });

    return { markup: under + top, box: box.done() };
  }

  /* ---------- Modelo relacional ---------- */

  function tableSize(t) {
    const rows = Math.max(t.cols.length, 1);
    const w = Math.max(180, (t.name || '').length * 9.5 + 40, ...t.cols.map(c => ((c.name || '').length + (c.type || '').length) * 7.4 + 78));
    return { w: Math.ceil(w), h: 30 + rows * 22 + 8 };
  }

  function relSVG(rel, selId) {
    let under = '', top = '';
    const box = mkBox();
    const byId = Object.fromEntries(rel.tables.map(t => [t.id, t]));
    const size = Object.fromEntries(rel.tables.map(t => [t.id, tableSize(t)]));
    const pairs = {};

    rel.tables.forEach(t => {
      const g = {};
      t.cols.forEach(c => { if (c.fk && byId[c.fk.t]) (g[c.fk.t] = g[c.fk.t] || []).push(c); });
      Object.entries(g).forEach(([tid, cols]) => {
        const u = byId[tid], st = size[t.id], su = size[u.id];
        const uq = cols.length === 1 && cols[0].uq;
        const far = cols[0].fk.far || (uq ? '(0,1)' : '(0,n)');
        const near = '(' + (cols.every(c => c.nn) ? 1 : 0) + ',1)';
        if (u === t) {
          const x = t.x + st.w, y1 = t.y + 22, y2 = t.y + st.h - 14;
          under += '<path d="M' + x + ' ' + y1 + ' C' + (x + 70) + ' ' + (y1 - 14) + ' ' + (x + 70) + ' ' + (y2 + 14) + ' ' + x + ' ' + y2 + '" fill="none" stroke="' + C.line + '" stroke-width="1.4"/>';
          top += txt(x + 26, y1 - 14, near, { size: 12, fill: C.acc }) + txt(x + 26, y2 + 16, far, { size: 12, fill: C.acc });
          box.add(x + 60, (y1 + y2) / 2, 20, (y2 - y1) / 2 + 26);
          return;
        }
        const key = [t.id, u.id].sort().join('|');
        const n = pairs[key] = (pairs[key] || 0) + 1;
        const off = (n - 1) * 22 * (n % 2 ? 1 : -1);
        const a = { x: t.x + st.w / 2, y: t.y + st.h / 2 + off }, b = { x: u.x + su.w / 2, y: u.y + su.h / 2 + off };
        const pa = edge(a.x, a.y, st.w, st.h, b.x, b.y), pb = edge(b.x, b.y, su.w, su.h, a.x, a.y);
        under += ln(pa.x, pa.y, pb.x, pb.y);
        const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
        let nx = -uy, ny = ux;
        if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }
        const d = Math.min(26, len / 3), sep = 10 + 10 * Math.abs(nx);
        top += txt(pa.x + ux * d + nx * sep, pa.y + uy * d + ny * sep, far, { size: 12, fill: C.acc }) +
          txt(pb.x - ux * d + nx * sep, pb.y - uy * d + ny * sep, near, { size: 12, fill: C.acc });
      });
    });

    rel.tables.forEach(t => {
      const s = size[t.id], on = selId === t.id;
      let g = '<g data-k="t" data-id="' + t.id + '" style="cursor:grab">' +
        '<rect x="' + t.x + '" y="' + t.y + '" width="' + s.w + '" height="' + s.h + '" fill="' + C.attr + '" stroke="' + (on ? C.sel : C.ink) + '" stroke-width="' + (on ? 2.6 : 1.5) + '"/>' +
        '<rect x="' + t.x + '" y="' + t.y + '" width="' + s.w + '" height="28" fill="' + C.head + '"/>' +
        txt(t.x + s.w / 2, t.y + 14.5, t.name || '…', { size: 14, bold: true, fill: C.headTxt });
      t.cols.forEach((c, i) => {
        const y = t.y + 30 + i * 22 + 13;
        const tag = c.pk && c.fk ? 'PF' : c.pk ? 'PK' : c.fk ? 'FK' : '';
        if (tag) g += txt(t.x + 9, y, tag, { size: 10.5, bold: true, fill: C.acc, anchor: 'start' });
        g += txt(t.x + 34, y, c.name || '…', { size: 13, anchor: 'start', u: c.pk, bold: c.pk }) +
          txt(t.x + s.w - 9, y, c.type || '', { size: 11.5, anchor: 'end', fill: C.mut, mono: true });
      });
      if (!t.cols.length) g += txt(t.x + s.w / 2, t.y + 43, 'sin columnas', { size: 12, it: true, fill: C.mut });
      top += g + '</g>';
      box.add(t.x + s.w / 2, t.y + s.h / 2, s.w / 2 + 4, s.h / 2 + 4);
    });

    return { markup: under + top, box: box.done() };
  }

  window.D = { erSVG, relSVG, attrDefault, tableSize, esc, C };
})();

<script>
/* Ayudas para escribir los bancos. Mismo formato de diagrama que el CuadernoBD:
   entidad { id, name, x, y, weak, attrs }, relación { id, name, x, y, ident, parts: [{ eid, min, max, role }], attrs },
   jerarquía { id, sup, subs, total, exclusive, x, y }, atributo { id, name, dx, dy, key, multi, derived, parts }.
   La cardinalidad (min,max) de cada participante va junto a esa entidad: cuántas de ESA entidad
   corresponden a una de la otra. */
(function () {
  'use strict';
  let n = 0;
  window.BANCO_ER = window.BANCO_ER || [];
  window.BANCO_NORM = window.BANCO_NORM || [];
  window.ER = {
    // dx/dy opcionales: sin ellos el atributo se coloca solo alrededor de su dueño
    a: (name, dx, dy, o) => Object.assign({ id: 'a' + (n++), name, dx: dx == null ? null : dx, dy: dy == null ? null : dy, key: false, multi: false, derived: false, parts: [] }, o || {}),
    K: { key: true }, M: { multi: true }, DER: { derived: true },
    C: (...parts) => ({ parts }),
    ent: (id, name, x, y, attrs, o) => Object.assign({ id, name, x, y, weak: false, attrs }, o || {}),
    rel: (id, name, x, y, parts, attrs, o) => Object.assign({
      id, name, x, y, ident: false, attrs: attrs || [],
      parts: parts.map(p => ({ eid: p[0], min: String(p[1]), max: String(p[2]), role: p[3] || '' }))
    }, o || {}),
    hier: (id, sup, subs, x, y, o) => Object.assign({ id, sup, subs, total: false, exclusive: true, x, y }, o || {})
  };
})();

/* Soluciones de los tres ejercicios de la actividad de la UT5.

   en una página vertical) y la justificación de las decisiones de diseño.

   con las mismas reglas del conversor. */
(function () {
  'use strict';
  let n = 0;

  });
  const DIR = { parts: ['calle', 'numero', 'comuna', 'ciudad'] };

  const ventas = {

        ent('cli', 'CLIENTE', 250, 1090, [a('cuit', -150, 62, K), a('nombre', -55, 115), a('telefono', 75, 115, M), a('direccion', 185, 5, DIR)])
      ],

        rel('r4', 'realiza', 250, 870, [['cli', 1, 1], ['ven', 0, 'n']])
      ]
    },
    relPos: { CATEGORIA: [60, 60], PRODUCTO: [560, 60], VENTA_PRODUCTO: [250, 300], PROVEEDOR: [600, 470], VENTA: [60, 550], CLIENTE: [60, 830], CLIENTE_telefono: [420, 870] },

  const blogs = {

        ent('prog', 'PROGRAMA', 260, 220, [a('nombre_programa', -135, -92, K), a('descripcion', 20, -128), a('conductores', 150, -80, M), a('horario', 70, 112, { parts: ['hora_inicio', 'hora_fin'] })]),

        ent('cat', 'CATEGORIA', 760, 670, [a('nombre_categoria', 185, -55, K), a('descripcion', 185, 5), a('imagen', 165, 62)]),
        ent('com', 'COMENTARIO', 260, 670, [a('id_comentario', -150, -70, K), a('texto', -165, 10)]),
        ent('usu', 'USUARIO', 260, 1080, [a('username', -150, 62, K), a('password', -45, 115), a('fecha_registro', 110, 118), a('avatar', 185, 55), a('email', 180, -25)])
      ],
      rels: [
        rel('r1', 'escribe', 510, 220, [['prog', 1, 1], ['nota', 0, 'n']]),
        rel('r2', 'se_clasifica', 760, 445, [['nota', 0, 'n'], ['cat', 0, 'n']]),

        rel('r4', 'recibe', 510, 445, [['nota', 1, 1], ['com', 0, 'n']]),
        rel('r5', 'realiza', 260, 875, [['usu', 1, 1], ['com', 0, 'n']])
      ]
    },
    relPos: { PROGRAMA: [50, 60], PROGRAMA_conductores: [50, 250], NOTA: [540, 60], NOTA_CATEGORIA: [600, 300], CATEGORIA: [540, 480], COMENTARIO: [50, 480], USUARIO: [50, 740] },
    decisiones: [
      '**Entidades.** PROGRAMA, NOTA, CATEGORIA, USUARIO y COMENTARIO. De todas se guardan varios datos y todas tienen un identificador propio, así que son fuertes. COMENTARIO podría verse como débil respecto a NOTA, pero tiene su propio número de id, que lo identifica sin ayuda.',
      '**Claves primarias.** El nombre del programa, el título de la nota y el nombre de la categoría son únicos según el enunciado. El comentario se identifica por su id y el usuario por su username.',
      '**Email.** Solo puede registrarse una vez, así que es una clave candidata. Queda como clave alternativa: no se puede repetir, pero la clave primaria es el username. Es una restricción que el diagrama no refleja y hay que anotar aparte.',
      '**Conductores.** Un programa tiene una lista de conductores: es un atributo multivaluado (doble elipse).',
      '**Horario.** Es un atributo compuesto de hora_inicio y hora_fin.',
      '**escribe (PROGRAMA – NOTA), 1:N.** Un programa puede escribir muchas notas (0,n) y cada nota está escrita por un solo programa (1,1).',

    db: 'CentroCultural',
    er: {
