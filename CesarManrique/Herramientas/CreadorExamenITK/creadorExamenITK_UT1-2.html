<style>
/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Creador de examen ITK — mismo estilo que el menú de repaso y el creador de Java ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  /* Color de ITK (portada de EVAGD), el mismo que en el menú de repaso */
  --asig: #A8864D;
  --asig-tinta: #0B0B0C;
}
/* Contraste AA para texto pequeño (los tokens de marca se quedan algo cortos a 11–13 px) */
.concep { --text-3: #62626E; --ok-txt: #0B7A55; --warn-txt: #8A5500; --err-txt: #B00D4A; }
.concep-dark { --text-3: #8A8A98; --ok-txt: var(--ok); --warn-txt: var(--warn); --err-txt: var(--error); }
#app > div { --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text)); --focus: var(--asig); --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent); --err-bg: color-mix(in srgb, var(--error) 10%, transparent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), filter var(--dur-1); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--asig); border-color: transparent; color: var(--asig-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--asig); }
.btn--primary:hover { background: var(--asig); filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { color: var(--err-txt); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: transparent; }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--asig); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.progreso { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- página ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 58ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, color-mix(in srgb, var(--asig) 28%, transparent), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--asig); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; font-family: var(--f-prosa); line-height: 1.5; }
.lbl { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.reglas { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.reglas li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); font: 400 13.5px/1.5 var(--f-prosa); }
.reglas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--asig); flex: none; transform: translateY(-2px); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
.check input { accent-color: var(--asig); width: 16px; height: 16px; margin: 0; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hist { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.nota-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 600 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.nota-chip.ap { color: var(--ok-txt); }
.nota-chip.su { color: var(--err-txt); }
.vacio-txt { color: var(--text-3); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.lista-fallos { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.lista-fallos li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 400 13px/1.45 var(--f-prosa); color: var(--text); }
.lista-fallos li .ok { display: block; margin-top: 4px; color: var(--ok-txt); font-size: 12px; }
.lista-fallos li .x { float: right; margin-left: 8px; font: 600 11px var(--f-ui); color: var(--err-txt); }
textarea.copia { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 400 11.5px/1.4 var(--f-ui); resize: vertical; }
.msg { font-size: 12px; color: var(--text-3); }

/* ---------- examen ---------- */
.examen-page { max-width: 820px; margin: 0 auto; padding: 26px 24px 120px; }
.q { padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; scroll-margin-top: 80px; }
.q .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.q .meta .n { color: var(--acento-texto); font-weight: 600; }
.q h3 { font: 600 17px/1.35 var(--f-titulo); letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--f-prosa); cursor: pointer; transition: border-color var(--dur-1), background-color var(--dur-1); }
.opt:hover { border-color: var(--border-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-strong); font: 600 12px var(--f-ui); color: var(--text-2); }
.opt .t { padding-top: 2px; }
.opt:has(input:checked) { border-color: var(--asig); background: color-mix(in srgb, var(--asig) 9%, var(--bg)); }
.opt:has(input:checked) .l { background: var(--asig); border-color: var(--asig); color: var(--asig-tinta); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.q.hecha .opt { cursor: default; }
.q.hecha .opt.bien { border-color: var(--ok); background: var(--ok-bg); }
.q.hecha .opt.bien .l { background: var(--ok); border-color: var(--ok); color: #0B0B0C; }

<script>
const CONFIG = {"id":"itk_ut12","unidades":"UT1–UT2","titulo":"Salud laboral y gestión de la prevención"};
</script>
<script>
// Banco ITK · PRL UT1–UT2 (Salud laboral y gestión de la prevención). Fuente: apuntes UT1-2_T01.
// BANK: tipo test. o[0] es SIEMPRE la correcta (se barajan al mostrar). e: explicación breve con el dato de los apuntes.
const BANK = [
// ---------- Cultura preventiva y salud ----------
{t:"Cultura preventiva y salud",q:"¿Qué es la cultura preventiva?",o:["El conjunto de actitudes y creencias compartidas por todos los miembros de una empresa sobre la salud, los riesgos y las medidas preventivas","El conjunto de sanciones y recargos que impone la Autoridad Laboral a las empresas que incumplen la normativa de prevención en todas sus actividades","El curso de formación anual que imparte el servicio de prevención a la plantilla","El documento donde se recogen la estructura organizativa y las funciones de la empresa"],e:"Los apuntes la definen como las actitudes y creencias compartidas por todos los miembros de la empresa sobre salud, riesgos, accidentes, enfermedades y medidas preventivas."},
{t:"Cultura preventiva y salud",q:"¿Qué dos condiciones son imprescindibles para cambiar la forma de actuar frente a los riesgos del trabajo?",o:["El compromiso de la dirección y la participación de todas las personas trabajadoras","La vigilancia de la Autoridad Laboral y el aumento de las sanciones económicas","La contratación obligatoria de un servicio de prevención ajeno acreditado y la compra de equipos de protección nuevos para toda la plantilla","La actuación exclusiva de los delegados de prevención y del comité de empresa"],e:"Para el cambio de conducta se necesita el compromiso de la dirección y la participación de todas las personas trabajadoras."},
{t:"Cultura preventiva y salud",q:"¿Qué meta del Objetivo de Desarrollo Sostenible 8 se relaciona con la cultura preventiva?",o:["Promover un entorno de trabajo seguro y sin riesgos","Eliminar el trabajo a turnos en todas las empresas","Reducir las horas de la jornada laboral a la mitad","Garantizar el acceso a la vivienda de los trabajadores"],e:"Una meta del ODS 8 es promover un entorno de trabajo seguro y sin riesgos para las personas que prestan servicio en las empresas."},
{t:"Cultura preventiva y salud",q:"Según la OMS, la salud es…",o:["un estado completo de bienestar físico, mental y social, y no solo la ausencia de enfermedades","la ausencia de enfermedades y lesiones en una persona","el estado físico y mental que permite a una persona desempeñar con normalidad las tareas de un puesto de trabajo concreto, sin límite de tiempo","el equilibrio entre las horas de trabajo y las horas de descanso"],e:"Concepto de la OMS recogido en los apuntes: bienestar físico, mental y social, no solo ausencia de afecciones o enfermedades."},
{t:"Cultura preventiva y salud",q:"¿Qué aspecto de la salud se refiere a la integridad corporal?",o:["La salud física","La salud psíquica","La salud social","La salud ambiental"],e:"La salud física es la referida a la integridad corporal."},
{t:"Cultura preventiva y salud",q:"La salud psíquica o mental es el indicativo de…",o:["un equilibrio emocional","la integridad del cuerpo","la calidad de las relaciones con los demás","la ausencia de enfermedades infecciosas"],e:"La salud psíquica o mental indica un equilibrio emocional."},
// ---------- Conceptos básicos ----------
{t:"Conceptos básicos",q:"¿En qué artículo de la Ley de Prevención de Riesgos Laborales se definen los conceptos básicos en materia preventiva?",o:["En el artículo 4","En el artículo 15","En el artículo 22","En el artículo 40"],e:"El artículo 4 de la LPRL establece las definiciones de los conceptos básicos (el 15 recoge los principios y el 22 la vigilancia de la salud)."},
{t:"Conceptos básicos",q:"Según la LPRL, la prevención es…",o:["el conjunto de actividades o medidas adoptadas o previstas en todas las fases de actividad de la empresa para evitar o disminuir los riesgos derivados del trabajo","la reparación económica de los daños que sufre un trabajador con motivo de su actividad, una vez producidos, mediante una indemnización a cargo de la empresa y de la Seguridad Social","la posibilidad de que un trabajador sufra un determinado daño derivado del trabajo","el conjunto de equipos que lleva el trabajador para protegerse de los riesgos"],e:"Art. 4 LPRL: conjunto de actividades o medidas adoptadas o previstas en todas las fases de actividad de la empresa para evitar o disminuir los riesgos."},
{t:"Conceptos básicos",q:"El riesgo laboral se define como…",o:["la posibilidad de que un trabajador sufra un determinado daño derivado del trabajo","la lesión o enfermedad que sufre un trabajador con motivo u ocasión del trabajo y que le impide desempeñar su puesto con normalidad","cualquier máquina, aparato o instalación usada en el trabajo","el conjunto de medidas que adopta la empresa para evitar accidentes"],e:"Riesgo laboral: la posibilidad de que un trabajador sufra un determinado daño derivado del trabajo."},
{t:"Conceptos básicos",q:"¿Qué dos factores se valoran conjuntamente para calificar un riesgo desde el punto de vista de su gravedad?",o:["La probabilidad de que se produzca el daño y su severidad","El coste de las medidas y el número de delegados de prevención","La antigüedad del trabajador y el tipo de contrato","La existencia de EPI y la temperatura del lugar de trabajo"],e:"La gravedad del riesgo se califica valorando conjuntamente la probabilidad del daño y la severidad del mismo."},
{t:"Conceptos básicos",q:"Los daños derivados del trabajo son…",o:["las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo","la probabilidad de que un trabajador sufra un accidente en su puesto de trabajo cuando se expone a un agente peligroso sin protección","las sanciones económicas impuestas a la empresa por incumplir la ley","las condiciones del puesto que pueden influir en la generación de riesgos"],e:"Art. 4 LPRL: enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo."},
{t:"Conceptos básicos",q:"Un riesgo laboral grave e inminente es aquel que…",o:["es probable racionalmente que se materialice en un futuro inmediato y pueda suponer un daño grave para la salud de los trabajadores","tiene una probabilidad baja de producirse y consecuencias leves, aunque pueda materializarse en un futuro inmediato en cualquier puesto de la empresa","ya ha causado un accidente y obliga a abrir un expediente a la empresa","solo aparece en las empresas con más de quinientos trabajadores"],e:"Riesgo grave e inminente: probable racionalmente en un futuro inmediato y con posible daño grave para la salud."},
{t:"Conceptos básicos",q:"Según la LPRL, un equipo de trabajo es…",o:["cualquier máquina, aparato, instrumento o instalación utilizada en el trabajo","el grupo de personas que desempeña las mismas funciones en un taller o sección y que está bajo las órdenes de un mismo responsable","el equipo que lleva el trabajador para protegerse de un riesgo","el servicio de prevención formado por varias empresas"],e:"Equipo de trabajo: cualquier máquina, aparato, instrumento o instalación utilizada en el trabajo."},
{t:"Conceptos básicos",q:"Una condición de trabajo es…",o:["cualquier característica del trabajo que pueda tener una influencia significativa en la generación de riesgos para la seguridad y la salud","el salario, la duración de la jornada y el resto de aspectos que se pactan en el contrato de trabajo y en el convenio colectivo aplicable","el conjunto de derechos que reconoce el convenio colectivo al trabajador","la autorización de la empresa para paralizar la actividad ante un peligro"],e:"Condición de trabajo: cualquier característica del trabajo con influencia significativa en la generación de riesgos."},
{t:"Conceptos básicos",q:"¿Qué es un equipo de protección individual (EPI)?",o:["Cualquier equipo destinado a ser llevado o sujetado por el trabajador para protegerse de uno o varios riesgos, incluidos sus complementos o accesorios","Una instalación fija del centro de trabajo, como una barandilla o un sistema de extracción, que protege a toda la plantilla a la vez frente a un riesgo concreto","Un servicio especializado que asesora a la empresa en materia preventiva","El plan donde la empresa recoge las medidas de emergencia"],e:"EPI: equipo que lleva o sujeta el trabajador para protegerse de riesgos, así como sus complementos y accesorios."},
{t:"Conceptos básicos",q:"El ruido, la iluminación, la temperatura y las vibraciones son, dentro de las condiciones de trabajo, agentes…",o:["físicos","químicos","biológicos","organizativos"],e:"Agentes físicos: condiciones acústicas, de iluminación, temperatura, humedad, vibraciones, radiaciones, etc."},
{t:"Conceptos básicos",q:"Los virus, las bacterias y los hongos son agentes…",o:["biológicos","químicos","físicos","ergonómicos"],e:"Agentes biológicos: virus, bacterias, hongos, etc."},
{t:"Conceptos básicos",q:"¿Cuál de los siguientes elementos forma parte de la carga de trabajo según los apuntes?",o:["La manipulación manual de cargas y las posturas inadecuadas","La existencia de un comité de seguridad y salud","El número de delegados de prevención elegidos y la existencia de un comité de seguridad y salud en el centro","El importe de las sanciones aplicadas a la empresa"],e:"La carga de trabajo incluye exigencias físicas y mentales: movimientos repetitivos, posturas inadecuadas, manipulación manual de cargas, ritmo elevado, etc."},
// ---------- Gestión y plan de prevención ----------
{t:"Gestión y plan de prevención",q:"La gestión preventiva consiste en…",o:["el conjunto de medidas integradas en la organización de la empresa, en todas sus actividades y niveles, para prevenir los daños para la salud antes de que se produzcan","la reparación de los daños para la salud una vez producidos los accidentes y la compensación económica de los trabajadores afectados por parte del servicio de prevención y de la Seguridad Social","la contratación obligatoria de un servicio de prevención ajeno","la revisión médica anual de todos los trabajadores de la empresa"],e:"La gestión preventiva integra las medidas en la organización de la empresa para prevenir los daños antes de que se produzcan."},
{t:"Gestión y plan de prevención",q:"¿Cuántos elementos fundamentales tiene un sistema de gestión de la prevención según los apuntes?",o:["Seis","Tres","Cinco","Nueve"],e:"Seis: política de prevención, organización, identificación y evaluación de riesgos, planificación, ejecución y coordinación, y auditoría."},
{t:"Gestión y plan de prevención",q:"¿Qué elemento del sistema de gestión consiste en establecer unas directrices y unos objetivos generales en materia de prevención?",o:["La política de prevención","La auditoría","La ejecución y coordinación","La planificación de la actividad preventiva"],e:"La política de prevención establece las directrices y los objetivos generales en materia de PRL."},
{t:"Gestión y plan de prevención",q:"El Plan de Prevención es la herramienta a través de la cual…",o:["se integra la actividad preventiva en el sistema general de gestión de la empresa","se sanciona a los trabajadores que incumplen las normas","se pagan los honorarios a los servicios de prevención ajenos y se reparten las tareas preventivas entre los trabajadores","se eligen los delegados de prevención"],e:"El Plan de Prevención integra la actividad preventiva en el sistema general de gestión y fija una política de PRL específica para cada empresa."},
{t:"Gestión y plan de prevención",q:"¿Para qué empresas es obligatorio el Plan de Prevención?",o:["Para todas las empresas","Solo para las que tienen más de 25 trabajadores","Solo para las que realizan actividades peligrosas","Solo para las que tienen servicio de prevención propio"],e:"El Plan de Prevención es obligatorio para todas las empresas."},
{t:"Gestión y plan de prevención",q:"El Plan de Prevención se conserva a disposición de…",o:["la Autoridad Laboral, las autoridades sanitarias y los representantes de los trabajadores","las empresas de la competencia y los clientes que lo soliciten para comparar las condiciones de seguridad de los centros","los medios de comunicación y las asociaciones de consumidores","únicamente el propio empresario y su servicio de prevención"],e:"Se conserva a disposición de la Autoridad Laboral, de las autoridades sanitarias y de los representantes de los trabajadores."},
{t:"Gestión y plan de prevención",q:"¿Qué elementos incluye el Plan de Prevención?",o:["La estructura organizativa, la definición de funciones y los procedimientos, procesos y recursos necesarios","El listado de sanciones y el calendario de vacaciones","Las nóminas y los contratos de la plantilla, junto con el calendario de vacaciones y los horarios de cada puesto de trabajo","Los resultados médicos individuales de cada trabajador"],e:"Incluye la estructura organizativa, la definición de funciones y los procedimientos, procesos y recursos para la acción preventiva."},
{t:"Gestión y plan de prevención",q:"¿Cuáles son los dos instrumentos del Plan de Prevención?",o:["La evaluación de los riesgos laborales y la planificación de la acción preventiva","La vigilancia de la salud de los trabajadores y la auditoría externa que realiza la Autoridad Laboral cada año","La política de prevención y el comité de seguridad y salud","El servicio de prevención y los equipos de protección individual"],e:"Los instrumentos del plan son la evaluación de riesgos y la planificación de la acción preventiva."},
// ---------- Modalidades de organización ----------
{t:"Modalidades de organización",q:"¿Cuántas modalidades de organización de la prevención permite la LPRL?",o:["Cinco","Dos","Tres","Siete"],e:"Cinco: el propio empresario, trabajadores designados, servicio de prevención propio, ajeno y mancomunado."},
{t:"Modalidades de organización",q:"¿Hasta cuántos trabajadores puede tener una empresa para que el empresario asuma personalmente la actividad preventiva?",o:["Hasta veinticinco","Hasta quince","Hasta cincuenta","Hasta doscientos cincuenta"],e:"El empresario puede asumir la prevención si la empresa tiene hasta 25 trabajadores (y se cumplen el resto de condiciones)."},
{t:"Modalidades de organización",q:"¿Qué actividad preventiva no puede asumir nunca personalmente el empresario?",o:["La vigilancia de la salud de los trabajadores","La planificación de la acción preventiva","La evaluación inicial de los riesgos","La información a los trabajadores sobre los riesgos"],e:"El empresario puede asumir la prevención con excepción de la vigilancia de la salud; las funciones no asumidas las cubre una entidad externa."},
{t:"Modalidades de organización",q:"Los trabajadores designados por la empresa para la actividad preventiva deben…",o:["tener la capacidad necesaria, disponer del tiempo y de los medios precisos y ser suficientes en número","ser siempre delegados de prevención elegidos por los trabajadores","pertenecer a una empresa externa especializada y estar acreditados por la autoridad laboral para realizar tareas de prevención","dedicarse en exclusiva a la prevención en todo caso"],e:"Capacidad, tiempo, medios, número suficiente y acceso a la información y documentación sobre riesgos y medidas preventivas."},
{t:"Modalidades de organización",q:"¿Cuántas especialidades preventivas debe tener como mínimo un servicio de prevención propio?",o:["Dos","Una","Tres","Cinco"],e:"Contará como mínimo con dos de las especialidades: seguridad en el trabajo, higiene industrial, ergonomía, psicosociología y medicina del trabajo."},
{t:"Modalidades de organización",q:"El servicio de prevención propio está constituido por…",o:["personal de la empresa que se dedica de manera exclusiva a esta actividad","entidades especializadas externas que están acreditadas por la autoridad laboral y asesoran a las empresas","el propio empresario junto con los delegados de prevención","varias empresas que comparten el mismo centro comercial"],e:"Está constituido por personal de la empresa, con dedicación exclusiva y medios materiales y humanos necesarios."},
{t:"Modalidades de organización",q:"¿En cuál de estos casos la empresa está obligada a constituir un servicio de prevención propio?",o:["Cuando tiene más de 500 trabajadores","Cuando tiene más de 100 trabajadores","Cuando tiene menos de 25 trabajadores","Cuando comparte centro de trabajo con otra empresa"],e:"Es obligatorio con más de 500 trabajadores; con 250–500 si hay actividades peligrosas; o si lo decide la autoridad laboral."},
{t:"Modalidades de organización",q:"Los servicios de prevención ajenos son…",o:["entidades especializadas que apoyan y asesoran a las empresas en prevención y que deben estar acreditadas por la autoridad laboral","trabajadores de la empresa designados por el empresario, que disponen de capacidad, tiempo y medios para ocuparse de la prevención de forma habitual","servicios creados por varias empresas del mismo edificio","órganos formados por delegados de prevención y por el empresario"],e:"Son entidades especializadas dedicadas al apoyo y asesoramiento de las empresas, acreditadas por la autoridad laboral."},
{t:"Modalidades de organización",q:"Cuando varias empresas desempeñan actividades a la vez en un mismo centro de trabajo, edificio o centro comercial, pueden constituir un servicio de prevención…",o:["mancomunado","propio de una sola empresa","ajeno","designado"],e:"El servicio mancomunado tiene la consideración de servicio de prevención propio de las empresas que lo constituyen."},
// ---------- Evaluación de riesgos ----------
{t:"Evaluación de riesgos",q:"La evaluación de riesgos es un proceso destinado a…",o:["detectar y estimar la importancia de los riesgos, determinar los que no se pueden eliminar y actuar sobre ellos","sancionar a los trabajadores que provocan accidentes y determinar qué medidas disciplinarias debe aplicar la empresa en cada caso","comprobar la capacidad profesional de los trabajadores designados","elegir al servicio de prevención ajeno más barato"],e:"La evaluación detecta y estima los riesgos, determina los que no se pueden eliminar y actúa sobre ellos."},
{t:"Evaluación de riesgos",q:"¿Qué debe permitir identificar la evaluación de riesgos?",o:["Los elementos peligrosos, los trabajadores expuestos y la magnitud de los riesgos","Los salarios de la plantilla, las horas extra trabajadas y las vacaciones pendientes de cada persona trabajadora","Los delegados de prevención y sus créditos horarios","Los servicios de prevención acreditados de la zona"],e:"La evaluación identifica los elementos peligrosos, los trabajadores expuestos a ellos y la magnitud de los riesgos."},
{t:"Evaluación de riesgos",q:"Además de la evaluación inicial, la evaluación de riesgos debe repetirse…",o:["periódicamente, cuando lo disponga una norma específica o cuando cambien los equipos o sustancias o se incorporen trabajadores especialmente sensibles","únicamente cuando se produzca un accidente mortal","solo cuando lo pida por escrito un delegado de prevención","nunca, porque la evaluación inicial es válida durante toda la vida de la empresa aunque cambien los equipos, las sustancias o las personas contratadas"],e:"Se repite periódicamente, por disposición específica, por cambios en equipos o sustancias o por incorporación de trabajadores especialmente sensibles."},
{t:"Evaluación de riesgos",q:"¿Cuál de estos colectivos NO aparece como especialmente vulnerable o sensible en los apuntes?",o:["Las personas con contrato indefinido","Las personas con discapacidad","Las personas migrantes","El personal de empresas de trabajo temporal (ETT)"],e:"Los colectivos sensibles son: discapacidad, maternidad y lactancia, jóvenes y mayores, temporales y de ETT, y migrantes."},
{t:"Evaluación de riesgos",q:"Respecto al personal temporal y de ETT, la ley exige…",o:["el mismo nivel de protección que las demás personas trabajadoras de la empresa","un nivel de protección inferior, dado que su contrato tiene menor duración que el del resto de la plantilla","una protección distinta según lo decida la ETT","que no se les informe de los riesgos hasta pasado un mes"],e:"Deben tener el mismo nivel de protección, sin distinción entre contratados con la ETT y los que no lo son."},
{t:"Evaluación de riesgos",q:"¿Cuáles son las dos fases de la evaluación de riesgos?",o:["El análisis y la valoración del riesgo","La planificación de la acción y la ejecución de las medidas","La auditoría y la coordinación","La información y la formación"],e:"La evaluación comprende dos fases: el análisis del riesgo y la valoración del riesgo."},
{t:"Evaluación de riesgos",q:"En el análisis del riesgo, ¿qué tres niveles de severidad de las consecuencias se distinguen?",o:["Ligeramente dañino, dañino y extremadamente dañino","Leve, grave y mortal","Trivial, tolerable y moderado, según el nivel de riesgo que resulta de la matriz del INSHT","Bajo, medio y alto"],e:"La severidad se clasifica en ligeramente dañino, dañino y extremadamente dañino (la probabilidad es baja, media o alta)."},
{t:"Evaluación de riesgos",q:"¿Qué consiste en establecer la tolerabilidad o no del riesgo?",o:["La valoración del riesgo","El análisis del riesgo","La planificación de la acción preventiva","La vigilancia de la salud"],e:"La valoración del riesgo consiste en establecer si el riesgo es tolerable o no, en función de probabilidad y gravedad."},
// ---------- Niveles de riesgo y planificación ----------
{t:"Niveles de riesgo y planificación",q:"¿Cuáles son los cinco niveles de riesgo de la valoración?",o:["Trivial, tolerable, moderado, importante e intolerable","Leve, medio, alto, grave y mortal, según los daños que pueda producir","Bajo, normal, elevado, crítico y extremo","Trivial, leve, moderado, grave e inminente"],e:"Trivial (T), tolerable (TO), moderado (MO), importante (I) e intolerable (IN)."},
{t:"Niveles de riesgo y planificación",q:"Según la matriz de niveles de riesgo del INSHT, probabilidad baja y consecuencias ligeramente dañinas dan un riesgo…",o:["trivial","tolerable","moderado","importante"],e:"Baja + ligeramente dañino = riesgo trivial (T)."},
{t:"Niveles de riesgo y planificación",q:"Según la matriz del INSHT, probabilidad media y consecuencias dañinas dan un riesgo…",o:["moderado","trivial","importante","intolerable"],e:"Media + dañino = riesgo moderado (MO)."},
{t:"Niveles de riesgo y planificación",q:"Según la matriz del INSHT, probabilidad media y consecuencias extremadamente dañinas dan un riesgo…",o:["importante","moderado","tolerable","intolerable"],e:"Media + extremadamente dañino = riesgo importante (I)."},
{t:"Niveles de riesgo y planificación",q:"Según la matriz del INSHT, probabilidad alta y consecuencias extremadamente dañinas dan un riesgo…",o:["intolerable","importante","moderado","tolerable"],e:"Alta + extremadamente dañino = riesgo intolerable (IN)."},
{t:"Niveles de riesgo y planificación",q:"¿Qué debe incluir en todo caso la planificación de la actividad preventiva?",o:["Los medios humanos y materiales, las medidas de emergencia, la vigilancia de la salud, la formación e información y la coordinación","Las nóminas de los trabajadores, la política salarial y el calendario de vacaciones de la plantilla, junto con los costes de producción","El reparto de beneficios y el calendario de vacaciones","Únicamente la lista de equipos de protección individual"],e:"Medios humanos y materiales, asignación de recursos, medidas de emergencia, vigilancia de la salud, formación e información y coordinación."},
{t:"Niveles de riesgo y planificación",q:"Ante un riesgo trivial, ¿qué actuación se requiere?",o:["Ninguna acción específica","Reducir el riesgo en un plazo determinado","Paralizar de inmediato la actividad","Realizar una inversión considerable para controlarlo"],e:"Riesgo trivial: no se requiere acción específica."},
{t:"Niveles de riesgo y planificación",q:"Ante un riesgo tolerable, la empresa…",o:["no necesita mejorar la acción preventiva, pero debe hacer comprobaciones periódicas de que las medidas siguen siendo eficaces","debe reducir el riesgo de inmediato con inversiones elevadas y fijar un plazo máximo para implantar las medidas correctoras en toda la empresa","debe prohibir el trabajo hasta reducirlo","no debe realizar ninguna comprobación posterior"],e:"Riesgo tolerable: no se necesita mejorar, pero se estudian soluciones rentables y se hacen comprobaciones periódicas."},
{t:"Niveles de riesgo y planificación",q:"Ante un riesgo moderado, ¿qué se debe hacer?",o:["Esforzarse en reducir el riesgo e implantar las medidas en un período determinado","Prohibir el trabajo hasta que desaparezca el riesgo","No hacer nada, porque es un riesgo aceptable","Remediarlo en un tiempo inferior al de los riesgos importantes, antes de que se inicie ninguna otra actividad"],e:"Riesgo moderado: hacer esfuerzos para reducirlo, determinando las inversiones precisas, y implantar las medidas en un período determinado."},
{t:"Niveles de riesgo y planificación",q:"Ante un riesgo importante, ¿puede comenzarse el trabajo?",o:["No, no debe comenzarse hasta que se haya reducido el riesgo","Sí, siempre que se haga una comprobación al año","Sí, porque solo se prohíbe en los riesgos moderados","Sí, siempre que el trabajador firme un documento de aceptación"],e:"Riesgo importante: no debe comenzarse el trabajo hasta reducir el riesgo; si ya se realiza, se remedia en menos tiempo que los moderados."},
{t:"Niveles de riesgo y planificación",q:"Si un riesgo intolerable no puede reducirse ni contando con recursos ilimitados, ¿qué ocurre?",o:["Debe prohibirse el trabajo","Se permite el trabajo con equipos de protección individual","Se traslada el riesgo a una empresa contratista","Se mantiene el trabajo con revisiones médicas mensuales"],e:"Riesgo intolerable: no debe comenzar ni continuar el trabajo; si no es posible reducirlo, debe prohibirse."},
// ---------- Marco normativo y principios ----------
{t:"Marco normativo y principios",q:"¿Qué artículo de la Constitución de 1978 ordena a los poderes públicos velar por la seguridad e higiene en el trabajo?",o:["El artículo 40.2","El artículo 15 de la LPRL","El artículo 22 de la LPRL","El artículo 4 de la LPRL"],e:"La Constitución de 1978, art. 40.2, ordena a los poderes públicos velar por la seguridad e higiene en el trabajo."},
{t:"Marco normativo y principios",q:"¿Qué directiva comunitaria obligó a España a actualizar su legislación en materia de prevención?",o:["La Directiva 89/391/CEE","La Directiva 31/95/CEE","La Directiva 78/40/CEE","La Directiva 22/2004/CEE"],e:"En 1989, la Directiva 89/391/CEE obliga a España a actualizar la legislación existente en prevención."},
{t:"Marco normativo y principios",q:"¿Cuál es la norma que sienta las bases normativas de la seguridad y la salud de los trabajadores en España?",o:["La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales","La Constitución española de 1978, que establece el reparto de competencias entre el Estado y las comunidades autónomas","La Directiva 89/391/CEE","El Reglamento de Servicios de Prevención"],e:"La Ley 31/95 de Prevención de Riesgos Laborales sienta las bases y ha sido desarrollada por diversos decretos."},
{t:"Marco normativo y principios",q:"¿En qué artículo de la Ley 31/95 se establecen los principios de la acción preventiva?",o:["En el artículo 15","En el artículo 4","En el artículo 22","En el artículo 40"],e:"El artículo 15 de la Ley 31/95 recoge los principios de la acción preventiva."},
{t:"Marco normativo y principios",q:"¿Cuál es el primer principio de la acción preventiva?",o:["Evitar los riesgos","Evaluar los riesgos que no se pueden evitar","Combatir los riesgos en su origen","Dar las instrucciones necesarias a los trabajadores"],e:"Principio 1: evitar los riesgos; después, evaluar los que no se puedan evitar."},
{t:"Marco normativo y principios",q:"Según los principios de la acción preventiva, ¿qué tipo de protección debe anteponerse?",o:["La protección colectiva a la individual","La protección individual a la colectiva","La protección económica a la física","La protección de los directivos a la del resto"],e:"Principio 8: adoptar medidas que antepongan la protección colectiva a la individual."},
{t:"Marco normativo y principios",q:"El principio de «adaptar el trabajo a la persona» pretende, entre otras cosas…",o:["atenuar el trabajo monótono y repetitivo y reducir sus efectos en la salud","aumentar el ritmo de trabajo para mejorar la producción y reducir el número de personas expuestas","sustituir a los trabajadores por máquinas","reducir el número de delegados de prevención"],e:"Adaptar el puesto, los equipos y los métodos de trabajo para intentar atenuar el trabajo monótono y repetitivo y reducir sus efectos en la salud."},
// ---------- Derechos y deberes ----------
{t:"Derechos y deberes",q:"¿Quién debe asumir el coste de las medidas de seguridad y salud?",o:["La empresa","Los trabajadores","Los delegados de prevención","La Seguridad Social"],e:"Entre los deberes generales de la empresa está asumir el coste de las medidas de seguridad y salud."},
{t:"Derechos y deberes",q:"Ante un riesgo grave e inminente, la empresa tiene el deber de…",o:["paralizar la actividad","mantener la actividad con equipos de protección","consultar primero al comité de empresa antes de actuar","esperar a que la Autoridad Laboral lo ordene"],e:"Deber de la empresa respecto a los trabajadores: paralizar la actividad en caso de riesgo grave e inminente (y es también un derecho de ellos)."},
{t:"Derechos y deberes",q:"La empresa tiene el deber de informar y formar a los trabajadores sobre…",o:["los riesgos del centro de trabajo y de su puesto, las medidas de prevención, la actuación en emergencias y el uso de los EPI","los resultados económicos de la empresa, los salarios de los compañeros y el contenido del convenio colectivo aplicable al sector","el salario de sus compañeros de puesto","los datos médicos de los demás trabajadores"],e:"Información y formación sobre riesgos, medidas de prevención y protección, emergencias, uso de EPI y manejo de máquinas y dispositivos de seguridad."},
{t:"Derechos y deberes",q:"¿Qué colectivos requieren una protección especial por parte de la empresa según los deberes con los trabajadores?",o:["Embarazadas, menores de edad, trabajadores temporales y de ETT","Los directivos y los mandos intermedios que tienen personas a su cargo","Los trabajadores con más de veinte años de antigüedad","Los delegados de prevención y los miembros del comité"],e:"La empresa debe proporcionar especial protección a embarazadas, menores de edad, temporales y de ETT."},
{t:"Derechos y deberes",q:"¿Qué debe hacer la empresa cuando varias empresas coinciden en un mismo centro de trabajo o existen contratas y subcontratas?",o:["Coordinarse en materia de prevención","Cada empresa actúa por su cuenta sin informar a las demás","Dejar la prevención solo en manos de la empresa contratista","Prohibir la actividad de las empresas subcontratadas"],e:"Deber de la empresa respecto al centro de trabajo: coordinarse en materia de prevención con otras empresas del mismo centro, contratas y subcontratas."},
{t:"Derechos y deberes",q:"¿Cuál de estos es un derecho de los trabajadores en materia de prevención?",o:["El derecho de consulta y participación","El derecho a elegir libremente su servicio de prevención","El derecho a decidir qué sanciones se aplican a la empresa","El derecho a no usar los EPI cuando sean incómodos"],e:"Derechos: información, formación, paralización de la actividad ante riesgo grave e inminente, vigilancia periódica de la salud, consulta y participación."},
{t:"Derechos y deberes",q:"¿Cuál de las siguientes es una obligación de los trabajadores en materia de prevención?",o:["Informar de inmediato al superior jerárquico de cualquier situación que entrañe un riesgo para la salud","Pagar los equipos de protección individual que utilicen en el puesto y reponerlos cuando se deterioren por el uso","Elaborar el plan de prevención de la empresa","Elegir a los delegados de prevención entre los directivos"],e:"Obligaciones: respetar las normas, usar correctamente máquinas y equipos, informar de inmediato al superior de los riesgos, velar por la seguridad y cooperar con el empresario."},
// ---------- Vigilancia de la salud y responsabilidades ----------
{t:"Vigilancia de la salud y responsabilidades",q:"¿Qué artículo de la LPRL trata sobre la vigilancia de la salud?",o:["El artículo 22","El artículo 4","El artículo 15","El artículo 40.2"],e:"El art. 22 de la LPRL trata sobre la vigilancia de la salud y el reconocimiento médico."},
{t:"Vigilancia de la salud y responsabilidades",q:"Como regla general, la vigilancia de la salud de los trabajadores es…",o:["voluntaria: solo se lleva a cabo con el consentimiento del trabajador","obligatoria para todos los trabajadores desde su incorporación a la empresa, con revisiones anuales","decidida libremente por el empresario","obligatoria solo para los trabajadores jóvenes"],e:"La vigilancia solo podrá llevarse a cabo cuando el trabajador preste su consentimiento."},
{t:"Vigilancia de la salud y responsabilidades",q:"¿En cuál de estos supuestos la vigilancia de la salud puede ser obligatoria, previo informe de los representantes de los trabajadores?",o:["Cuando el estado de salud del trabajador pueda constituir un peligro para él, para los demás o para otras personas relacionadas con la empresa","Cuando la empresa quiera conocer los hábitos de vida y los antecedentes médicos familiares del trabajador para ajustar su póliza de seguros","Cuando el trabajador lleve más de cinco años en la empresa","Cuando el empresario tenga dudas sobre su productividad"],e:"Excepciones: si es imprescindible para evaluar los efectos de las condiciones de trabajo, si hay peligro para el trabajador o terceros, o si lo establece una disposición legal."},
{t:"Vigilancia de la salud y responsabilidades",q:"Los datos de la vigilancia de la salud…",o:["no pueden usarse con fines discriminatorios ni en perjuicio del trabajador","pueden usarse para decidir despidos y cambios de puesto sin más trámites que el aviso al trabajador","se entregan completos al empresario en todo caso","pueden publicarse en el tablón de la empresa"],e:"Se respeta la intimidad, la dignidad y la confidencialidad; los datos no pueden usarse con fines discriminatorios ni en perjuicio del trabajador."},
{t:"Vigilancia de la salud y responsabilidades",q:"¿Quién puede acceder a la información médica de carácter personal derivada de la vigilancia de la salud?",o:["El personal médico y las autoridades sanitarias","El empresario y los mandos intermedios","Todos los compañeros del trabajador","Los delegados de prevención y el comité de empresa"],e:"El acceso se limita al personal médico y las autoridades sanitarias, sin facilitarlo a la empresa sin consentimiento expreso del trabajador."},
{t:"Vigilancia de la salud y responsabilidades",q:"¿Qué información sobre los reconocimientos sí se comunica a la empresa?",o:["Las conclusiones sobre la aptitud del trabajador para el puesto y la necesidad de mejorar las medidas de prevención","El historial clínico completo del trabajador, con los diagnósticos y los resultados de todas las pruebas realizadas durante la vigilancia de la salud","Los diagnósticos de enfermedades previas al contrato","Los resultados de todas las analíticas realizadas"],e:"La empresa es informada de las conclusiones sobre aptitud para el puesto y sobre la necesidad de introducir o mejorar medidas preventivas."},
{t:"Vigilancia de la salud y responsabilidades",q:"¿Qué consecuencias puede tener la responsabilidad administrativa de la empresa?",o:["Sanción económica, suspensión temporal, paralización de trabajos o cierre del centro","Privación de libertad, multa e inhabilitación para quienes dirigen la empresa y ponen en peligro a los trabajadores","Indemnización por daños y perjuicios al trabajador","Amonestación verbal al delegado de prevención"],e:"La responsabilidad administrativa implica sanción económica, suspensión temporal, paralización de trabajos o cierre del centro."},
{t:"Vigilancia de la salud y responsabilidades",q:"¿De qué porcentaje es el recargo en las prestaciones de la Seguridad Social cuando hay un accidente por falta de medidas preventivas?",o:["Del 30 % al 50 %","Del 5 % al 10 %","Del 10 % al 20 %","Del 60 % al 80 %"],e:"Recargo del 30 % al 50 % a pagar por el empresario en caso de incapacidades por contingencia profesional."},
{t:"Vigilancia de la salud y responsabilidades",q:"La responsabilidad civil de la empresa en prevención es la que…",o:["repara el daño causado por una conducta culposa o negligente mediante una indemnización por daños y perjuicios","castiga con privación de libertad y multa a quien pone en peligro grave la vida de los trabajadores de la empresa","impone multas por incumplir la normativa de prevención","obliga a pagar un recargo en las prestaciones"],e:"Civil: reparadora del daño causado por una conducta culposa o negligente, con indemnización por daños y perjuicios."},
{t:"Vigilancia de la salud y responsabilidades",q:"La responsabilidad penal de la empresa se aplica cuando…",o:["se pone en peligro grave la vida, la salud o la integridad física de los trabajadores","se incumple cualquier norma de prevención, aunque no se ponga en peligro a ningún trabajador ni se produzca daño alguno","el trabajador no usa el equipo de protección","la empresa no tiene comité de seguridad y salud"],e:"Penal: por poner en peligro grave la vida, salud o integridad física; con privación de libertad, multa e inhabilitación."},
// ---------- Representación y participación ----------
{t:"Representación y participación",q:"¿Cuántos delegados de prevención corresponden a una empresa de 30 trabajadores?",o:["Uno","Dos","Tres","Cuatro"],e:"De 1 a 49 trabajadores corresponde 1 delegado de prevención."},
{t:"Representación y participación",q:"¿Cuántos delegados de prevención corresponden a una empresa de 80 trabajadores?",o:["Dos","Uno","Tres","Cuatro"],e:"De 50 a 100 trabajadores corresponden 2 delegados de prevención."},
{t:"Representación y participación",q:"¿Cuál es el número máximo de delegados de prevención de la escala, y a partir de cuántos trabajadores se alcanza?",o:["Ocho, a partir de 4001 trabajadores","Seis, a partir de 2001 trabajadores","Siete, a partir de 3001 trabajadores","Diez, a partir de 5000 trabajadores"],e:"De 4001 trabajadores en adelante corresponden 8 delegados de prevención."},
{t:"Representación y participación",q:"Los delegados de prevención son…",o:["los representantes de los trabajadores con funciones específicas en materia de prevención, elegidos por y entre los representantes de los trabajadores","los técnicos que designa el empresario para evaluar los riesgos y elaborar el plan de prevención de la empresa, con dedicación exclusiva","los inspectores de la Autoridad Laboral destinados en cada empresa","los miembros del servicio de prevención ajeno"],e:"Son representantes de los trabajadores con funciones específicas en PRL, elegidos por y entre los representantes de los trabajadores."},
{t:"Representación y participación",q:"¿Cuál es una competencia de los delegados de prevención?",o:["Vigilar y controlar que se cumpla la normativa sobre prevención de riesgos laborales","Imponer sanciones a la empresa que incumple la normativa y ordenar el cierre del centro de trabajo","Realizar los reconocimientos médicos a la plantilla","Acreditar a los servicios de prevención ajenos"],e:"Competencias: colaborar con la dirección, promover la cooperación de los trabajadores, ser consultados y vigilar el cumplimiento de la normativa."},
{t:"Representación y participación",q:"¿Cuál de estas es una garantía de los delegados de prevención en el ejercicio de su cargo?",o:["No ser sancionados ni despedidos durante el ejercicio de sus funciones","Cobrar un recargo del 50 % sobre su salario por cada hora dedicada a sus funciones","Decidir la paralización del Comité de Seguridad y Salud","Elegir al empresario que presida el comité"],e:"Garantías: medios y formación, no ser sancionado ni despedido, prioridad de permanencia en la empresa y crédito horario."},
{t:"Representación y participación",q:"El Comité de Seguridad y Salud se constituirá en todos los centros de trabajo que cuenten con…",o:["50 o más trabajadores","25 o más trabajadores","10 o más trabajadores","250 o más trabajadores"],e:"Se constituirá en todos los centros de trabajo que cuenten con 50 o más trabajadores."},
{t:"Representación y participación",q:"Se dice que el Comité de Seguridad y Salud es un órgano paritario porque…",o:["debe haber el mismo número de delegados de prevención que de representantes de la empresa","sus miembros pertenecen a un colegio profesional y deben estar acreditados por la Autoridad Laboral","solo se reúne con un número par de trabajadores","lo preside siempre el delegado de prevención de más edad"],e:"Es paritario porque tiene el mismo número de delegados de prevención que de empresarios o sus representantes."},
{t:"Representación y participación",q:"Se dice que el Comité de Seguridad y Salud es un órgano colegiado porque…",o:["sus miembros actúan conjuntamente","sus miembros pertenecen a un colegio profesional","solo participan trabajadores sanitarios","está formado exclusivamente por delegados"],e:"Es un órgano colegiado, es decir, sus miembros actúan conjuntamente."},
{t:"Representación y participación",q:"Los trabajadores tienen derecho a ser consultados con antelación y a participar en decisiones como…",o:["la planificación del trabajo según las consecuencias de introducir nuevas tecnologías para la seguridad y la salud","la fijación del precio de venta de los productos y de los servicios que la empresa ofrece a sus clientes habituales y a las empresas colaboradoras","la elección del cliente al que se atiende primero","la distribución de los beneficios de la empresa"],e:"Participan en la planificación del trabajo y nuevas tecnologías, la organización de la prevención, la designación de los encargados de emergencias y la formación e información en prevención."},
];
// DESARROLLO: preguntas cortas (3–6 líneas de respuesta). ideas: 3–5 ideas clave que debe contener una buena respuesta, cada una comprobable por el alumno.
const DESARROLLO = [
{t:"Cultura preventiva y salud",q:"Define la cultura preventiva y explica qué se necesita para cambiar la forma de actuar frente a los riesgos laborales.",modelo:"La cultura preventiva es el conjunto de actitudes y creencias compartidas por todos los miembros de una empresa sobre la salud, los riesgos, los accidentes, las enfermedades y las medidas preventivas. Para cambiar la forma de actuar ante los riesgos hace falta el compromiso de la dirección y la participación de todas las personas trabajadoras. Como estrategia empresarial, permite mejorar los altos porcentajes de siniestralidad con un comportamiento preventivo colectivo, sea cual sea el cargo de cada uno.",ideas:["Son actitudes y creencias compartidas por todos los miembros de la empresa","Se refieren a salud, riesgos, accidentes, enfermedades y medidas preventivas","Requiere el compromiso de la dirección","Requiere la participación de todas las personas trabajadoras"]},
{t:"Cultura preventiva y salud",q:"Explica el concepto de salud según la OMS y los tres aspectos que hay que tener en cuenta al analizar los riesgos del trabajo.",modelo:"Según la OMS, la salud es un estado completo de bienestar físico, mental y social, y no solo la ausencia de afecciones o enfermedades. Por eso los riesgos se analizan con una perspectiva integral que incluye tres aspectos: la salud física, referida a la integridad corporal; la salud psíquica o mental, que indica un equilibrio emocional; y la salud social, que alude al bienestar en las relaciones con los demás.",ideas:["Estado completo de bienestar, no solo ausencia de enfermedad","Salud física: integridad corporal","Salud psíquica o mental: equilibrio emocional","Salud social: bienestar en las relaciones con los demás"]},
{t:"Conceptos básicos",q:"Define los siguientes conceptos del artículo 4 de la LPRL: prevención, riesgo laboral, daños derivados del trabajo y riesgo grave e inminente.",modelo:"La prevención es el conjunto de actividades o medidas adoptadas en todas las fases de la actividad de la empresa para evitar o disminuir los riesgos del trabajo. El riesgo laboral es la posibilidad de que un trabajador sufra un daño derivado del trabajo, y su gravedad se valora con la probabilidad y la severidad del daño. Los daños derivados del trabajo son enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo. El riesgo grave e inminente es el que es racionalmente probable que se materialice en un futuro inmediato y pueda causar un daño grave a la salud.",ideas:["Prevención: medidas en todas las fases de la actividad para evitar o disminuir riesgos","Riesgo laboral: posibilidad de sufrir un daño derivado del trabajo; se valora con probabilidad y severidad","Daños derivados del trabajo: enfermedades, patologías o lesiones con motivo u ocasión del trabajo","Riesgo grave e inminente: probable en un futuro inmediato y con posible daño grave"]},
{t:"Conceptos básicos",q:"¿Qué se entiende por condición de trabajo y qué elementos incluye?",modelo:"Es cualquier característica del trabajo que pueda tener una influencia significativa en la generación de riesgos para la seguridad y la salud. Incluye las características de los locales, instalaciones, equipos y productos; los agentes físicos (ruido, iluminación, temperatura), químicos (polvo, gases) y biológicos (virus, bacterias, hongos) del ambiente y su intensidad o concentración; los procedimientos de uso de esos agentes; y la organización y ordenación del trabajo, incluida la carga de trabajo física y mental.",ideas:["Característica del trabajo con influencia significativa en la generación de riesgos","Características de locales, instalaciones, productos y equipos","Agentes físicos, químicos y biológicos con sus ejemplos","Organización del trabajo y carga de trabajo física y mental"]},
{t:"Gestión y plan de prevención",q:"Enumera los seis elementos fundamentales de un sistema de gestión de la prevención.",modelo:"Son: 1) la política de prevención, con las directrices y objetivos generales; 2) la organización de la prevención, que incluye elegir una modalidad y organizar la representación de los trabajadores; 3) la identificación y evaluación de los riesgos que no han podido eliminarse; 4) la planificación de la actividad preventiva a partir de la evaluación inicial; 5) la ejecución y coordinación de todo lo anterior; y 6) la auditoría, ya que el sistema debe estar documentado y auditado.",ideas:["Política de prevención","Organización de la prevención","Identificación y evaluación de los riesgos","Planificación de la actividad preventiva","Ejecución y coordinación, y auditoría"]},
{t:"Gestión y plan de prevención",q:"Explica qué es el Plan de Prevención, a quién obliga, qué incluye y a disposición de quién se conserva.",modelo:"El Plan de Prevención es la herramienta que integra la actividad preventiva en el sistema general de gestión de la empresa y establece su política de prevención específica. Es obligatorio para todas las empresas. Incluye la estructura organizativa, la definición de funciones y los procedimientos, procesos y recursos necesarios para la acción preventiva. Se conserva a disposición de la Autoridad Laboral, de las autoridades sanitarias y de los representantes de los trabajadores.",ideas:["Integra la prevención en la gestión general de la empresa","Es obligatorio para todas las empresas","Incluye estructura organizativa, funciones y procedimientos, procesos y recursos","Está a disposición de la Autoridad Laboral, las autoridades sanitarias y los representantes de los trabajadores"]},
{t:"Modalidades de organización",q:"Explica las modalidades de organización de la prevención en la empresa.",modelo:"Hay cinco. El propio empresario puede asumirla si la empresa tiene hasta 25 trabajadores, no realiza actividades peligrosas, trabaja habitualmente en el centro y tiene capacidad; nunca asume la vigilancia de la salud. También puede designar a uno o varios trabajadores con capacidad, tiempo y medios. El servicio propio lo forma personal de la empresa en exclusiva, con al menos dos especialidades, y es obligatorio con más de 500 trabajadores o 250–500 con actividad peligrosa. El servicio ajeno son entidades externas acreditadas por la autoridad laboral. El mancomunado lo crean varias empresas del mismo centro y cuenta como servicio propio.",ideas:["Empresario: hasta 25 trabajadores, actividad no peligrosa y sin vigilancia de la salud","Trabajadores designados con capacidad, tiempo y medios","Servicio propio: personal exclusivo, mínimo dos especialidades, obligatorio en ciertos casos","Servicio ajeno: entidades acreditadas por la autoridad laboral","Servicio mancomunado: varias empresas en un mismo centro"]},
{t:"Evaluación de riesgos",q:"Explica en qué consiste la evaluación de riesgos y sus dos fases.",modelo:"La evaluación de riesgos es un proceso para detectar y estimar la importancia de los riesgos presentes en la empresa, determinar los que no se pueden eliminar y actuar sobre ellos. Identifica los elementos peligrosos, los trabajadores expuestos y la magnitud del riesgo. Tiene dos fases: el análisis, donde se identifica el peligro y se estima el riesgo según la probabilidad (baja, media, alta) y la severidad (ligeramente dañino, dañino, extremadamente dañino); y la valoración, que establece si el riesgo es tolerable según cinco niveles, de trivial a intolerable.",ideas:["Detecta y estima los riesgos y actúa sobre los que no se pueden eliminar","Identifica elementos peligrosos, trabajadores expuestos y magnitud","Análisis: probabilidad y severidad de las consecuencias","Valoración: niveles trivial, tolerable, moderado, importante e intolerable"]},
{t:"Niveles de riesgo y planificación",q:"Explica la matriz de niveles de riesgo del INSHT y qué se debe hacer según el nivel de riesgo.",modelo:"La matriz cruza la probabilidad (baja, media, alta) con las consecuencias (ligeramente dañino, dañino, extremadamente dañino) para dar un nivel: por ejemplo, baja y ligeramente dañino es trivial, media y dañino es moderado y alta y extremadamente dañino es intolerable. Un riesgo trivial no requiere acción; el tolerable pide comprobaciones periódicas; el moderado se reduce en un plazo determinado; el importante impide empezar el trabajo hasta reducirlo; y el intolerable impide empezar o continuar el trabajo, que se prohíbe si no se puede reducir.",ideas:["Cruza la probabilidad con la severidad de las consecuencias","Da cinco niveles, de trivial a intolerable, con ejemplos","Trivial y tolerable: sin acción o con comprobaciones periódicas","Moderado: reducir el riesgo en un plazo determinado","Importante e intolerable: no se empieza el trabajo hasta reducirlo; se prohíbe si no es posible"]},
{t:"Marco normativo y principios",q:"Explica el marco normativo de la prevención de riesgos laborales en España y enumera cinco principios de la acción preventiva.",modelo:"La Constitución de 1978 (art. 40.2) ordena a los poderes públicos velar por la seguridad e higiene en el trabajo. La Directiva 89/391/CEE obligó a España a actualizar su legislación, y en 1995 apareció la Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, base normativa de la seguridad y salud laboral. Su artículo 15 recoge los principios de la acción preventiva, como evitar los riesgos, evaluar los que no se pueden evitar, combatirlos en su origen, adaptar el trabajo a la persona y anteponer la protección colectiva a la individual.",ideas:["Constitución de 1978, art. 40.2","Directiva 89/391/CEE","Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales","Artículo 15: principios de la acción preventiva","Al menos cinco principios citados correctamente"]},
{t:"Derechos y deberes",q:"Indica los derechos y las obligaciones de los trabajadores en materia de prevención de riesgos laborales.",modelo:"Los trabajadores tienen derecho a la información, a la formación, a paralizar la actividad ante un riesgo grave e inminente, a la vigilancia periódica de su salud y a la consulta y participación. Están obligados a respetar las normas de prevención, utilizar correctamente máquinas, herramientas y equipos de protección, informar de inmediato a su superior de cualquier situación que entrañe riesgo, velar por su seguridad y la de compañeros y terceros, y cooperar con el empresario.",ideas:["Derechos: información y formación","Derecho a paralizar la actividad ante riesgo grave e inminente","Derechos: vigilancia periódica de la salud y consulta y participación","Obligaciones: respetar las normas y usar correctamente máquinas y equipos","Obligaciones: informar al superior, velar por la seguridad propia y ajena y cooperar"]},
{t:"Vigilancia de la salud y responsabilidades",q:"Explica cómo regula el artículo 22 de la LPRL la vigilancia de la salud: carácter, excepciones y confidencialidad.",modelo:"La empresa garantiza la vigilancia periódica de la salud en función de los riesgos del trabajo, pero es voluntaria y requiere el consentimiento del trabajador. Se exceptúa, previo informe de los representantes de los trabajadores, cuando es imprescindible para evaluar los efectos de las condiciones de trabajo, cuando el estado de salud puede ser un peligro para el trabajador o para otros, o cuando lo establece una ley. Se respetan la intimidad, la dignidad y la confidencialidad: los datos no pueden usarse para discriminar y la empresa solo recibe las conclusiones sobre la aptitud para el puesto.",ideas:["Es periódica y en función de los riesgos del trabajo","Es voluntaria: requiere el consentimiento del trabajador","Excepciones: imprescindible para evaluar, peligro para sí u otros, o disposición legal","Se respeta la intimidad, dignidad y confidencialidad","La empresa solo conoce la aptitud para el puesto y las medidas a mejorar"]},
{t:"Vigilancia de la salud y responsabilidades",q:"Explica los tipos de responsabilidad en que puede incurrir la empresa por incumplir sus obligaciones en prevención.",modelo:"La empresa puede incurrir en responsabilidad administrativa por incumplir la normativa, con sanción económica, suspensión temporal, paralización de trabajos o cierre del centro. Si hay un accidente por falta de medidas preventivas, se aplica un recargo del 30 % al 50 % en las prestaciones de la Seguridad Social, que paga el empresario. La responsabilidad civil repara el daño causado por una conducta culposa o negligente con una indemnización. La penal se da por poner en peligro grave la vida, salud o integridad, con privación de libertad, multa e inhabilitación.",ideas:["Administrativa: sanción, suspensión, paralización o cierre","Recargo de prestaciones del 30 % al 50 % pagado por el empresario","Civil: indemnización por daños y perjuicios por conducta culposa o negligente","Penal: peligro grave para la vida, salud o integridad; prisión, multa o inhabilitación"]},
{t:"Representación y participación",q:"Describe a los delegados de prevención y al Comité de Seguridad y Salud: quiénes son, cuántos hay, sus competencias y características.",modelo:"Los delegados de prevención son representantes de los trabajadores con funciones específicas en prevención, elegidos por y entre los representantes del personal; su número va de 1 (hasta 49 trabajadores) a 8 (más de 4.000). Colaboran con la dirección, promueven la cooperación, son consultados y vigilan el cumplimiento de la norma; tienen medios, formación, crédito horario y garantías frente a sanciones y despidos. El Comité de Seguridad y Salud se constituye en centros con 50 o más trabajadores; es colegiado y paritario, con igual número de delegados que de representantes de la empresa.",ideas:["Delegados: representantes de los trabajadores elegidos por y entre los representantes","Escala según plantilla: 1 hasta 49, 2 de 50 a 100, 3 de 101 a 500 y así hasta 8","Competencias: colaborar, promover la cooperación, ser consultados y vigilar el cumplimiento","Garantías: medios y formación, no sanción ni despido, crédito horario","Comité: 50 o más trabajadores, colegiado y paritario"]},
];

</script>
<script>
// Creador de examen · Itinerario personal para la empleabilidad I (ITK), PRL.
// Examen como el real: 30 preguntas = 28 tipo test + 2 de desarrollo cortas.
// Cada pregunta vale 0,3; un fallo en el test resta 0,1; en blanco no resta. Máximo 9 puntos → la nota se pasa a 10.
// El desarrollo lo corrige el alumno marcando las ideas clave de la respuesta modelo.
// CONFIG (id, unidades, titulo) lo pone build.js; BANK y DESARROLLO vienen del banco de cada examen.
'use strict';
const app = document.getElementById('app');
const N_TEST = 28, N_DEV = 2, N_FALLOS = 10;
const P_OK = 0.3, P_MAL = 0.1, P_DEV = 0.3;
// Textos de las preguntas escritas: desarrollo (por defecto) o respuesta corta (CONFIG.corta, p. ej. «¿Qué es el PAU?»).
const DEV = CONFIG.corta
  ? { tipo: 'Respuesta corta', de: 'de respuesta corta', las: 'las respuestas cortas', tus: 'tus respuestas cortas', ph: 'Responde en una o dos líneas…' }
  : { tipo: 'Desarrollo', de: 'de desarrollo', las: 'el desarrollo', tus: 'tu desarrollo', ph: 'Escribe tu respuesta en unas pocas líneas…' };
const L = ['A', 'B', 'C', 'D'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

// ---------- almacenamiento (claves propias de cada examen) ----------
const K = s => CONFIG.id + '_' + s;
const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
const validas = new Set(BANK.map(q => q.q));
const seenMap = () => store(K('seen')) || {};
function failMap() { const f = store(K('fails')) || {}; Object.keys(f).forEach(k => { if (!validas.has(k)) delete f[k]; }); return f; }
const historial = () => store(K('hist')) || [];
// Tema: siempre claro al abrir; si lo abre el menú de repaso, usa el tema del menú (?tema=dark|light)
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>'
};
