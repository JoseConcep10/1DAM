/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== ConcepCode · Examen UT2 — sobre los tokens de ConcepDesign ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  --lh-code: 21px;
  --fs-code: 13.5px;
}
.concep-dark {
  --syn-kw: #B794FF; --syn-ctl: #FF6FAE; --syn-type: #7DA2FF; --syn-str: #8EE0B8; --syn-num: #F6C76B; --syn-com: #6F6F7C; --syn-fn: #F5F5F7; --syn-var: #D4D4DC; --syn-op: #A6A6B3; --syn-ann: #F6C76B;
  --ed-bg: #0E0E10; --ed-line: rgba(255,255,255,.035); --gutter: #4F4F5A; --gutter-on: #A6A6B3;
  --console-bg: #09090A; --in-echo: #8EE0B8; --sel: rgba(122, 34, 255, .38);
  --sq-err: #FF2E93; --sq-warn: #FBBF24; --sq-spell: #A274FF;
  --ok-bg: rgba(52, 211, 153, .1); --warn-bg: rgba(251, 191, 36, .1); --err-bg: rgba(255, 46, 147, .1); --info-bg: rgba(122, 34, 255, .12);
}
.concep {
  --syn-kw: #6A1FE0; --syn-ctl: #C8006A; --syn-type: #0047E0; --syn-str: #0B7A55; --syn-num: #9A5B00; --syn-com: #8A8A96; --syn-fn: #0B0B0C; --syn-var: #2A2A33; --syn-op: #4E4E5A; --syn-ann: #9A5B00;
  --ed-bg: #FFFFFF; --ed-line: rgba(11,11,12,.04); --gutter: #A8A8B3; --gutter-on: #4E4E5A;
  --console-bg: #F6F6F9; --in-echo: #0B7A55; --sel: rgba(122, 34, 255, .2);
  --sq-err: #E0115F; --sq-warn: #C27803; --sq-spell: #7A22FF;
  --ok-bg: rgba(14, 159, 110, .09); --warn-bg: rgba(194, 120, 3, .1); --err-bg: rgba(224, 17, 95, .08); --info-bg: rgba(122, 34, 255, .08);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
::selection { background: var(--sel); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 500 11px var(--f-ui); padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; color: var(--text-2); background: var(--surface); }
code { font-family: var(--f-ui); font-size: .92em; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }
.concep-dark ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.22); }
.concep-dark ::-webkit-scrollbar-corner { background: transparent; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--c-gradiente); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 6px 22px -10px rgba(122, 34, 255, .75); }
.btn--primary:hover { background: var(--c-gradiente); box-shadow: 0 8px 26px -8px rgba(255, 0, 122, .55); }
.btn--run { background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); font-weight: 600; }
.btn--run:hover { background: color-mix(in srgb, var(--ok) 22%, transparent); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.btn .k { font-size: 10.5px; opacity: .7; font-weight: 400; }
.icon-btn { width: 34px; padding: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); }
.top .modulo span { font-size: 11px; color: var(--text-3); }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.qtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.qtab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font: 500 12px var(--f-ui); }
.qtab:hover { background: var(--surface); color: var(--text); }
.qtab[aria-current="true"] { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.qtab[aria-current="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--c-gradiente-h); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.empezado { background: var(--warn); }
.dot.listo { background: var(--ok); }
.dot.error { background: var(--error); }
.timer { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }
.timer.poco { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.timer.nada { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); animation: latido 1s steps(2) infinite; }
@keyframes latido { 50% { opacity: .55; } }

/* ---------- inicio ---------- */
.home { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; display: grid; gap: 28px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 60ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; background: radial-gradient(closest-side, rgba(122, 34, 255, .22), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.home-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
.card--accent { position: relative; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; }
.field { display: grid; gap: 8px; margin-bottom: 18px; }
.field > .lbl { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; width: max-content; }
.stepper button { width: 42px; height: 42px; border: 0; background: transparent; font-size: 18px; color: var(--text-2); }
.stepper button:hover { background: var(--surface-2); color: var(--text); }
.stepper output { min-width: 56px; text-align: center; font: 600 20px var(--f-titulo); color: var(--text); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); font-size: 12px; }
.chip:hover { color: var(--text); background: var(--surface-2); }
.chip[aria-pressed="true"] { color: var(--text); border-color: color-mix(in srgb, var(--c-morado) 65%, transparent); background: color-mix(in srgb, var(--c-morado) 16%, transparent); }
.chip .n { color: var(--text-3); font-size: 11px; }
.switch-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
.switch-row:first-of-type { border-top: 0; }
.switch-row .txt { flex: 1; }
.switch-row .txt b { display: block; font-weight: 500; color: var(--text); font-size: 12.5px; }
.switch-row .txt span { color: var(--text-3); font-size: 11.5px; font-family: var(--f-prosa); }
.toggle { position: relative; flex: none; width: 36px; height: 20px; margin-top: 2px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border-strong); transition: background var(--dur-2); }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); transition: transform var(--dur-2) var(--ease-out), background var(--dur-2); }
input:checked + .toggle { background: color-mix(in srgb, var(--c-morado) 70%, transparent); border-color: transparent; }
input:checked + .toggle::after { transform: translateX(16px); background: #fff; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch-row input:focus-visible + .toggle { outline: 2px solid var(--focus); outline-offset: 2px; }
select.sel { height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 12.5px; }
.start-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.start-row .hint { color: var(--text-3); font-size: 11.5px; }
.resume { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--c-morado) 45%, transparent); background: var(--info-bg); margin-bottom: 4px; }
.resume .txt { flex: 1; font-family: var(--f-prosa); color: var(--text-2); font-size: 13px; }
.resume .txt b { color: var(--text); font-family: var(--f-ui); }

.bank-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.bank-head h2 { margin: 0; }
.bank-head .grow { flex: 1; }
.search { height: 34px; width: 200px; max-width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 12.5px; }
.search:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.tema-grupo { margin-top: 16px; }
.tema-grupo h3 { display: flex; align-items: baseline; gap: 10px; font: 600 11px var(--f-ui) !important; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: 0 0 8px; }
.tema-grupo h3 span { letter-spacing: 0; text-transform: none; font-weight: 400; }
.qlist { display: grid; gap: 2px; }
.qrow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 10px; border: 0; background: transparent; text-align: left; color: var(--text-2); }
.qrow:hover { background: var(--surface-2); color: var(--text); }
.qrow .t { color: var(--text); font-size: 13px; font-weight: 500; }
.qrow .o { display: block; color: var(--text-3); font-size: 11px; font-family: var(--f-prosa); margin-top: 1px; }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
.lvl i.on { background: var(--text-2); }
.nota-mini { min-width: 46px; text-align: right; font: 600 12px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text-3); }
.nota-mini.ap { color: var(--ok); }
.nota-mini.su { color: var(--error); }
.empty { padding: 18px; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-3); font-family: var(--f-prosa); font-size: 13px; text-align: center; }
.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.hist th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 8px 8px; }
.hist td { padding: 9px 8px; border-top: 1px solid var(--border); color: var(--text-2); font-variant-numeric: tabular-nums; }
.hist td.n { font-weight: 600; color: var(--text); text-align: right; }
.hist tr.clic { cursor: pointer; }
.hist tr.clic:hover td { background: var(--surface-2); }
.side-stack { display: grid; gap: 20px; }

/* ---------- espacio de trabajo ---------- */
.work { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); height: calc(100dvh - 56px - env(safe-area-inset-top, 0px)); min-height: 520px; }
.brief { border-right: 1px solid var(--border); overflow-y: auto; padding: 22px 22px 40px; }
.brief .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brief h1 { font: 600 21px/1.2 var(--f-titulo) !important; letter-spacing: -.02em; margin: 10px 0 14px !important; color: var(--text); }
.enunciado { font: 400 14.5px/1.65 var(--f-prosa); color: var(--text-2); }
.enunciado b { color: var(--text); font-weight: 600; }
.enunciado code { font-size: 12.5px; }
.nota-enun { margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--c-morado); background: var(--info-bg); border-radius: 0 10px 10px 0; color: var(--text-2); font: 400 13px/1.55 var(--f-prosa); }
.bloque { margin-top: 22px; }
.bloque > h2 { font: 600 11px var(--f-ui) !important; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: 0 0 10px !important; }
.ejemplo { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--console-bg); border: 1px solid var(--border); font: 400 12.5px/1.6 var(--f-ui); color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
.ejemplo .in { color: var(--in-echo); font-weight: 600; }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reqs li { display: flex; gap: 10px; align-items: baseline; font: 400 13px/1.5 var(--f-prosa); color: var(--text-2); }
.reqs li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; transform: translateY(-1px) rotate(45deg); background: var(--c-morado); }
.peso { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; color: var(--text-3); }
.peso b { color: var(--text-2); font-weight: 500; text-align: right; }

.ide { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto minmax(150px, var(--panel-h, 36%)); min-width: 0; min-height: 0; }
.ide-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.file-tab { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 12px; }
.file-tab svg { width: 14px; height: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); color: var(--text-2); background: transparent; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: var(--ok-bg); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: var(--warn-bg); }
.pill.err { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: var(--err-bg); }
.pill.spell { color: var(--sq-spell); border-color: color-mix(in srgb, var(--sq-spell) 40%, transparent); background: var(--info-bg); }
button.pill:hover { filter: brightness(1.15); }
.ide-bar .grow { flex: 1; }
.splitter { height: 7px; cursor: row-resize; border-top: 1px solid var(--border); background: transparent; position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; left: 50%; top: 2px; width: 36px; height: 3px; margin-left: -18px; border-radius: 2px; background: var(--border-strong); }
.splitter:hover::after, .splitter.drag::after { background: var(--c-morado); }

/* ---------- editor ---------- */
.ed { position: relative; min-height: 0; height: 100%; background: var(--ed-bg); }
.ed-scroll { position: absolute; inset: 0; overflow: auto; display: flex; align-items: flex-start; }
.ed-gutter { position: sticky; left: 0; z-index: 2; flex: none; min-height: 100%; padding: 12px 0 40vh; background: var(--ed-bg); border-right: 1px solid var(--border); text-align: right; user-select: none; font: 400 12px/var(--lh-code) var(--f-ui); color: var(--gutter); font-variant-numeric: tabular-nums; }
.ed-gutter div { padding: 0 12px 0 14px; position: relative; }
.ed-gutter div.on { color: var(--gutter-on); }
.ed-gutter div.e::before, .ed-gutter div.w::before, .ed-gutter div.s::before { content: ""; position: absolute; left: 4px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; }
.ed-gutter div.e::before { background: var(--sq-err); }
.ed-gutter div.w::before { background: var(--sq-warn); }
.ed-gutter div.s::before { background: var(--sq-spell); }
.ed-code { position: relative; flex: 1 0 auto; min-width: 0; padding: 12px 0 40vh; }
.ed-code pre, .ed-code textarea { margin: 0; padding: 0 24px 0 14px; border: 0; font: 400 var(--fs-code)/var(--lh-code) var(--f-ui); font-variant-ligatures: none; tab-size: 4; -moz-tab-size: 4; white-space: pre; letter-spacing: 0; }
.ed-hl { position: relative; color: var(--syn-var); pointer-events: none; min-width: 100%; display: inline-block; }
.ed-marks { position: absolute; left: 0; top: 12px; color: transparent; pointer-events: none; }
.ed-marks .m { text-decoration: underline wavy; text-decoration-skip-ink: none; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.ed-marks .m.e { text-decoration-color: var(--sq-err); }
.ed-marks .m.w { text-decoration-color: var(--sq-warn); }
.ed-marks .m.s { text-decoration-color: var(--sq-spell); }
.ed-marks .m.z { display: inline-block; min-width: .6ch; }
.ed-code textarea { position: absolute; left: 0; top: 12px; width: 100%; height: calc(100% - 12px - 40vh); resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--text); outline: none; z-index: 1; }
.ed-code textarea:focus-visible { outline: none; }
.ed-code textarea::selection { background: var(--sel); color: transparent; }
.ed-cur { position: absolute; left: 0; right: 0; height: var(--lh-code); background: var(--ed-line); pointer-events: none; }
.tk-kw { color: var(--syn-kw); }
.tk-ctl { color: var(--syn-ctl); }
.tk-type { color: var(--syn-type); }
.tk-str, .tk-chr { color: var(--syn-str); }
.tk-num { color: var(--syn-num); }
.tk-com { color: var(--syn-com); font-style: italic; }
.tk-fn { color: var(--syn-fn); font-weight: 500; }
.tk-op { color: var(--syn-op); }
.tk-ann { color: var(--syn-ann); }
.ed-lens { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); font-size: 12px; color: var(--text-2); }
.ed-lens .ico { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.ed-lens.e .ico { background: var(--sq-err); } .ed-lens.w .ico { background: var(--sq-warn); } .ed-lens.s .ico { background: var(--sq-spell); }
.ed-lens .msg { flex: 1; font-family: var(--f-prosa); font-size: 12.5px; min-width: 0; }
.ed-ac { position: absolute; z-index: 30; min-width: 240px; max-width: 420px; max-height: 236px; overflow-y: auto; padding: 4px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); box-shadow: var(--shadow); font: 400 12.5px var(--f-ui); }
.ed-ac div { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 8px; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.ed-ac div b { color: var(--text); font-weight: 500; }
.ed-ac div i { margin-left: auto; font-style: normal; color: var(--text-3); font-size: 11px; }
.ed-ac div.on { background: color-mix(in srgb, var(--c-morado) 24%, transparent); }
.ed-ac div.on b { color: var(--text); }
.ed-ac .kind { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--surface-2); color: var(--text-3); }
.ed-ac .kind.m { color: var(--syn-fn); } .ed-ac .kind.f { color: var(--syn-type); } .ed-ac .kind.k { color: var(--syn-kw); } .ed-ac .kind.p { color: var(--syn-ctl); }

/* ---------- panel inferior ---------- */
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.panel-tabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); min-height: 38px; }
.ptab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border: 0; background: transparent; color: var(--text-3); font: 500 11.5px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; }
.ptab:hover { color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); }
.ptab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--c-gradiente-h); }
.badge-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; letter-spacing: 0; background: var(--surface-2); color: var(--text-2); }
.badge-n.e { background: var(--err-bg); color: var(--error); }
.badge-n.s { background: var(--info-bg); color: var(--sq-spell); }
.panel-tabs .grow { flex: 1; }
.panel-body { flex: 1; min-height: 0; overflow: auto; }
.console { min-height: 100%; padding: 12px 16px 16px; background: var(--console-bg); font: 400 13px/1.6 var(--f-ui); color: var(--text); white-space: pre-wrap; word-break: break-word; }
.console .run { color: var(--text-3); }
.console .in { color: var(--in-echo); font-weight: 600; }
.console .exc { color: var(--error); }
.console .ok { color: var(--ok); }
.console .warn { color: var(--warn); }
.console .note { display: block; margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--warn); background: var(--warn-bg); border-radius: 0 8px 8px 0; color: var(--text-2); font-family: var(--f-prosa); font-size: 12.5px; white-space: normal; }
.console .cerr { color: var(--error); }
.console .cline { color: var(--text-2); }
.console .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; white-space: normal; }
.console input.stdin { display: inline-block; min-width: 12ch; width: 40%; padding: 0 4px; margin: 0; border: 0; border-bottom: 1px dashed var(--in-echo); background: transparent; color: var(--in-echo); font: 600 13px/1.6 var(--f-ui); outline: none; caret-color: var(--in-echo); }
.console .vacio { color: var(--text-3); font-family: var(--f-prosa); white-space: normal; }
.probs { list-style: none; margin: 0; padding: 6px; }
.prob { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.prob:hover { background: var(--surface-2); }
.prob .ico { margin-top: 5px; width: 8px; height: 8px; border-radius: 50%; }
.prob.e .ico { background: var(--sq-err); } .prob.w .ico { background: var(--sq-warn); } .prob.s .ico { background: var(--sq-spell); }
.prob .msg { font: 400 13px/1.5 var(--f-prosa); color: var(--text); }
.prob .where { font-size: 11px; color: var(--text-3); }
.prob .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-left: 6px; }
.probs-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 4px; color: var(--text-3); font-size: 12px; font-family: var(--f-prosa); }
.probs-head .grow { flex: 1; }
.tests { padding: 10px 14px 16px; display: grid; gap: 10px; }
.tests-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--text-3); font: 400 12.5px var(--f-prosa); }
.tests-head .grow { flex: 1; }
.tcase { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); }
.tcase > summary { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; list-style: none; font-size: 12.5px; }
.tcase > summary::-webkit-details-marker { display: none; }
.tcase > summary .grow { flex: 1; min-width: 0; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcase .res { font-weight: 600; font-variant-numeric: tabular-nums; }
.tcase.ok .res { color: var(--ok); } .tcase.mid .res { color: var(--warn); } .tcase.ko .res { color: var(--error); }
.tcase .body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 12px 12px; }
.tcase .body > div { min-width: 0; }
.tcase .body h4 { margin: 0 0 6px; font: 600 10.5px var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.tcase pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--console-bg); border: 1px solid var(--border); font: 400 12px/1.55 var(--f-ui); white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; color: var(--text-2); }
.toks { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; border: 1px solid var(--border); color: var(--text-2); }
.tok.ok { border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); }
.tok.ko { border-color: color-mix(in srgb, var(--error) 45%, transparent); color: var(--error); }
.tok.mid { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); }
.tcase .nota { grid-column: 1 / -1; font: 400 12.5px var(--f-prosa); color: var(--warn); }

/* ---------- resultados ---------- */
.results { max-width: 1060px; margin: 0 auto; padding: 32px 24px 72px; display: grid; gap: 22px; }
.score-hero { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center; padding: 26px 28px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.score-hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }
.score-big { font: 700 clamp(56px, 9vw, 88px)/0.9 var(--f-titulo); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.score-big small { font-size: .34em; letter-spacing: -.01em; color: var(--text-3); -webkit-text-fill-color: var(--text-3); margin-left: 6px; }
.score-hero h1 { margin: 0 0 6px !important; font: 600 22px/1.2 var(--f-titulo) !important; color: var(--text); }
.score-hero p { margin: 0; color: var(--text-2); font: 400 14px/1.6 var(--f-prosa); max-width: 56ch; }
.score-hero .acts { display: flex; flex-direction: column; gap: 8px; }
.verd { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
.verd.ap { color: var(--ok); background: var(--ok-bg); }
.verd.su { color: var(--error); background: var(--err-bg); }
.qres { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
.qres > summary { display: grid; grid-template-columns: auto 1fr auto auto; gap: 16px; align-items: center; padding: 16px 20px; cursor: pointer; list-style: none; }
.qres > summary::-webkit-details-marker { display: none; }
.qres .num { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--surface-2); font-weight: 600; color: var(--text-2); }
.qres .tit b { display: block; font: 600 15px var(--f-titulo); color: var(--text); letter-spacing: -.01em; }
.qres .tit span { font-size: 11.5px; color: var(--text-3); }
.qres .qn { font: 600 22px var(--f-titulo); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.qres .qn.ap { color: var(--ok); } .qres .qn.su { color: var(--error); } .qres .qn.mid { color: var(--warn); }
.qres .chev { width: 18px; height: 18px; color: var(--text-3); transition: transform var(--dur-2) var(--ease-out); }
.qres[open] .chev { transform: rotate(180deg); }
.qres .inside { padding: 0 20px 20px; display: grid; gap: 18px; }
.bars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.bar-card { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); }
.bar-card .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.bar-card .v { margin: 6px 0 8px; font: 600 18px var(--f-titulo); color: var(--text); font-variant-numeric: tabular-nums; }
.bar-card .v small { color: var(--text-3); font-size: 12px; font-weight: 500; }
.meter { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--c-morado); }
.sec h3 { font: 600 11px var(--f-ui) !important; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: 0 0 10px !important; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: flex; gap: 10px; align-items: baseline; font: 400 13px/1.5 var(--f-prosa); color: var(--text-2); }
.checks li .m { flex: none; width: 16px; font-family: var(--f-ui); font-weight: 700; }
.checks li.ok .m { color: var(--ok); } .checks li.ko .m { color: var(--error); } .checks li.fx .m { color: var(--sq-spell); } .checks li.nt .m { color: var(--warn); }
.checks li code { white-space: pre-wrap; }
.codetabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }

    i += op.length;
  }
  toks.push({ t: 'eof', v: 'fin del fichero', s: n, e: n });
  return toks;
}

function lexNumber(src, i) {
  const s = i;
  const at = k => src[k] || '';
  if (src[i] === '0' && /[xXbB]/.test(at(i + 1))) {
    const hex = /[xX]/.test(at(i + 1));
    i += 2;
    const re = hex ? /[0-9a-fA-F_]/ : /[01_]/;
    while (re.test(at(i))) i++;
    const txt = src.slice(s + 2, i).replace(/_/g, '');
    let v = parseInt(txt || '0', hex ? 16 : 2);
    if (/[lL]/.test(at(i))) return { v: BigInt.asIntN(64, BigInt((hex ? '0x' : '0b') + (txt || '0'))), kind: 'long', e: i + 1 };
    if (v > 0xFFFFFFFF) throw new JavaError('syntax', 'Número entero demasiado grande', s, i);
    return { v: v | 0, kind: 'int', e: i };
  }
  while (/[0-9_]/.test(at(i))) i++;
  let isF = false;
  if (at(i) === '.' && DIG.test(at(i + 1))) { isF = true; i++; while (/[0-9_]/.test(at(i))) i++; }
  else if (at(i) === '.' && !/[A-Za-z_.]/.test(at(i + 1))) { isF = true; i++; }
  if (/[eE]/.test(at(i)) && /[0-9+-]/.test(at(i + 1))) {
    isF = true; i++;
    if (/[+-]/.test(at(i))) i++;
    while (DIG.test(at(i))) i++;
  }
  const txt = src.slice(s, i).replace(/_/g, '');
  const suf = at(i);
  if (/[fF]/.test(suf)) return { v: Math.fround(parseFloat(txt)), kind: 'float', e: i + 1 };
  if (/[dD]/.test(suf)) return { v: parseFloat(txt), kind: 'double', e: i + 1 };
  if (isF) return { v: parseFloat(txt), kind: 'double', e: i };
  const octal = /^0[0-7]+$/.test(txt);
  if (/[lL]/.test(suf)) {
    const big = octal ? BigInt('0o' + txt.slice(1)) : BigInt(txt);
    if (big > 9223372036854775808n) throw new JavaError('syntax', 'Número long demasiado grande: ' + txt, s, i + 1);
    return { v: big, kind: 'long', e: i + 1, big: big === 9223372036854775808n };
  }
  const v = octal ? parseInt(txt.slice(1), 8) : Number(txt);
  if (v > 2147483648) throw new JavaError('syntax', 'Número entero demasiado grande: ' + txt + ' (si quieres un long, añade L al final)', s, i, { s: i, e: i, text: 'L' }, 'int-too-big');
  return { v, kind: 'int', e: i, big: v === 2147483648 };
}

function guessQuoteClose(src, s, eol) {
  const line = src.slice(s, eol);
  let m = /\)\s*;/.exec(line);
  if (m) return s + m.index;
  m = /;/.exec(line);
  if (m) return s + m.index;
  m = /\)/.exec(line);
  if (m) return s + m.index;
  let k = eol;
  while (k > s + 1 && /\s/.test(src[k - 1])) k--;
  return k;
}

function lexEscape(src, i) {
  const n = src[i + 1];
  const map = { n: '\n', t: '\t', r: '\r', b: '\b', f: '\f', s: ' ', '"': '"', "'": "'", '\\': '\\' };
  if (n !== undefined && Object.prototype.hasOwnProperty.call(map, n)) return { ch: map[n], e: i + 2 };
  if (/[0-7]/.test(n || '')) {
    let j = i + 1, d = '';
    while (d.length < 3 && /[0-7]/.test(src[j] || '')) d += src[j++];
    return { ch: String.fromCharCode(parseInt(d, 8)), e: j };
  }
  if (n === 'u') {
    let j = i + 1;
    while (src[j] === 'u') j++;
    const h = src.slice(j, j + 4);
    if (/^[0-9a-fA-F]{4}$/.test(h)) return { ch: String.fromCharCode(parseInt(h, 16)), e: j + 4 };
  }
  throw new JavaError('syntax', 'Secuencia de escape no válida: \\' + (n || '') + ' (las válidas son \\n, \\t, \\", \\\\…)', i, i + 2, { s: i, e: i + 1, text: '\\\\' }, 'bad-escape');
}

function lexString(src, i) {
  const s = i;
  i++;
  let out = '';
  for (;;) {
    const c = src[i];
    if (c === undefined || c === '\n' || c === '\r') {
      const at = guessQuoteClose(src, s, i);
      throw new JavaError('syntax', 'Cadena sin cerrar: falta la comilla " del final', s, i, { s: at, e: at, text: '"' }, 'unclosed-string');
    }
    if (c === '"') { i++; break; }
    if (c === '\\') { const r = lexEscape(src, i); out += r.ch; i = r.e; continue; }
    out += c; i++;
  }
  return { v: out, e: i };
}

function lexChar(src, i) {
  const s = i;
  let j = i + 1, ch;
  if (src[j] === '\\') { const r = lexEscape(src, j); ch = r.ch; j = r.e; }
  else if (src[j] === "'") throw new JavaError('syntax', "Un char no puede estar vacío: ''", s, j + 1);
  else if (src[j] === undefined || src[j] === '\n') throw new JavaError('syntax', "Carácter sin cerrar: falta la comilla ' del final", s, j, { s: j, e: j, text: "'" }, 'unclosed-char');
  else { ch = src[j]; j++; }
  if (src[j] !== "'") {
    let k = j;
    while (k < src.length && src[k] !== "'" && src[k] !== '\n') k++;
    if (src[k] === "'") {
      throw new JavaError('syntax', "Un char solo puede llevar UN carácter. Para texto usa comillas dobles: \"" + src.slice(s + 1, k) + '"', s, k + 1,
        { edits: [{ s, e: s + 1, text: '"' }, { s: k, e: k + 1, text: '"' }] }, 'char-too-long');
    }
    throw new JavaError('syntax', "Carácter sin cerrar: falta la comilla ' del final", s, j, { s: j, e: j, text: "'" }, 'unclosed-char');
  }
  return { v: ch.charCodeAt(0), e: j + 1 };
}

/* ----------------------------- sintaxis ----------------------------- */
const BIN_PREC = { '||': 1, '&&': 2, '|': 3, '^': 4, '&': 5, '==': 6, '!=': 6, '<': 7, '>': 7, '<=': 7, '>=': 7, 'instanceof': 7, '<<': 8, '>>': 8, '>>>': 8, '+': 9, '-': 9, '*': 10, '/': 10, '%': 10 };
const ASSIGN_OPS = new Set(['=', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '<<=', '>>=', '>>>=']);
const MODS = new Set(['public', 'private', 'protected', 'static', 'final', 'abstract', 'synchronized', 'native', 'transient', 'volatile', 'strictfp']);

function tokName(t) {
  if (t.t === 'eof') return 'el final del fichero';
  if (t.t === 'str') return 'una cadena';
  if (t.t === 'num') return 'el número ' + t.raw;
  return "'" + t.v + "'";
}

class Parser {
  constructor(src, toks) { this.src = src; this.toks = toks; this.i = 0; }
  get t() { return this.toks[this.i]; }
  peek(k = 1) { return this.toks[Math.min(this.i + k, this.toks.length - 1)]; }
  is(v, t) { t = t || this.t; return (t.t === 'op' || t.t === 'kw') && t.v === v; }
  isId(t) { t = t || this.t; return t.t === 'id'; }
  next() { const t = this.t; if (this.i < this.toks.length - 1) this.i++; return t; }
  accept(v) { return this.is(v) ? this.next() : null; }
  prevEnd() { return this.i > 0 ? this.toks[this.i - 1].e : 0; }
  lineOf(off) { return lineCol(this.src, off).line; }

  fail(msg, fix, code, tok) {
    tok = tok || this.t;
    throw new JavaError('syntax', msg, tok.s, Math.max(tok.e, tok.s + 1), fix, code);
  }
  expect(v) {
    if (this.is(v)) return this.next();
    const t = this.t, pe = this.prevEnd();
    if (v === ';' && (t.v === ')' || t.v === ']') && t.t === 'op' && this.lineOf(pe) === this.lineOf(t.s)) {
      this.fail("Sobra un '" + t.v + "'", { s: t.s, e: t.e, text: '' }, 'extra-paren', t);
    }
    if (v === ';') {
      const sameLine = this.lineOf(pe) === this.lineOf(t.s);
      this.fail(sameLine ? "Se esperaba ';' antes de " + tokName(t) : "Falta ';' al final de la línea " + this.lineOf(pe), { s: pe, e: pe, text: ';' }, 'missing-semi',
        sameLine ? t : { s: Math.max(0, pe - 1), e: pe });
    }
    if (v === ')' || v === ']') this.fail("Se esperaba '" + v + "' antes de " + tokName(t), { s: pe, e: pe, text: v }, 'missing-' + v);
    if (v === '}') this.fail("Falta '}' para cerrar un bloque (llaves sin cerrar)", { s: this.src.length, e: this.src.length, text: '\n}' }, 'missing-brace');
    if (v === '(') this.fail("Se esperaba '(' después de " + tokName(this.toks[this.i - 1] || t), { s: pe, e: pe, text: '(' }, 'missing-(');
    if (v === '{') this.fail("Se esperaba '{' antes de " + tokName(t), { s: pe, e: pe, text: ' {' }, 'missing-{');
    this.fail("Se esperaba '" + v + "' pero hay " + tokName(t));
  }
  ident(what) {
    if (this.t.t === 'id') return this.next();
    if (this.t.t === 'kw') this.fail("'" + this.t.v + "' es una palabra reservada de Java y no puede usarse como " + (what || 'nombre'), null, 'reserved');
    this.fail('Se esperaba ' + (what || 'un nombre') + ' pero hay ' + tokName(this.t));
  }
  node(k, s, props) { const n = props || {}; n.k = k; n.s = s; n.e = this.prevEnd(); return n; }

  speculate(fn) {
    const save = this.i;
    try { return fn(); } catch (e) { if (e instanceof JavaError) return false; throw e; } finally { this.i = save; }
  }

  /* ---------- unidad de compilación ---------- */
  parseUnit() {
    const unit = { k: 'unit', imports: [], classes: [], pkg: null, s: 0 };
    this.skipAnnotations();
    if (this.is('package')) { const s = this.t.s; this.next(); unit.pkg = this.qualified(); this.expect(';'); unit.pkgEnd = this.prevEnd(); unit.pkgS = s; }
    while (this.is('import')) {
      const s = this.t.s;
      this.next();
      const st = !!this.accept('static');
      const parts = [this.ident('un paquete').v];
      let star = false;
      while (this.accept('.')) {
        if (this.accept('*')) { star = true; break; }
        parts.push(this.ident('un nombre').v);
      }
      this.expect(';');
      unit.imports.push({ name: parts.join('.'), last: parts[parts.length - 1], static: st, star, s, e: this.prevEnd() });
    }
    while (this.accept(';')) { /* vacío */ }
    while (this.t.t !== 'eof') {
      if (this.accept(';')) continue;
      unit.classes.push(this.parseClass());
    }
    unit.e = this.src.length;
    return unit;
  }
  skipAnnotations() {
    const names = [];
    while (this.is('@') && !this.is('interface', this.peek())) {
      this.next(); names.push(this.qualified());
      if (this.is('(')) { let d = 0; do { if (this.is('(')) d++; else if (this.is(')')) d--; this.next(); } while (d > 0 && this.t.t !== 'eof'); }
    }
    return names;
  }
  qualified() {
    const parts = [this.ident().v];
    while (this.is('.') && this.isId(this.peek())) { this.next(); parts.push(this.next().v); }
    return parts.join('.');
  }
  parseMods() {
    const mods = new Set();
    mods.ann = [];
    let s = this.t.s;
    for (;;) {
      mods.ann.push(...this.skipAnnotations());
      if (this.t.t === 'kw' && MODS.has(this.t.v)) { mods.add(this.next().v); continue; }
      if (this.is('default') && !this.is(':', this.peek()) && !this.is('->', this.peek())) { mods.add(this.next().v); continue; }
      break;
    }
    mods.s = s;
    return mods;
  }
  parseClass() {
    const s = this.t.s;
    const mods = this.parseMods();
    if (this.isIdV('record')) this.fail('Los record no están soportados en este simulador: usa una clase normal');
    if (this.is('enum')) return this.parseEnum(s, mods);
    if (this.is('interface')) {
      this.next();
      const nameTok = this.ident('el nombre de la interfaz');
      const ifaces = [];
      if (this.accept('extends')) { do { ifaces.push(this.parseType().name); } while (this.accept(',')); }
      const cls = { k: 'class', kind: 'interface', name: nameTok.v, nameS: nameTok.s, nameE: nameTok.e, mods, members: [], s, superName: null, ifaces };
      this.parseClassBody(cls);
      return cls;
    }
    if (!this.is('class') && this.isId() && /^(class|clas|clase|calss|clss|Class|CLASS)$/.test(this.t.v)) {
      this.fail("Se escribe 'class' (en minúscula)", { s: this.t.s, e: this.t.e, text: 'class' }, 'class-typo');
    }
    if (!this.is('class')) {
      this.fail("Se esperaba 'class'. Todo el código Java tiene que ir dentro de una clase: public class Ejercicio { ... }", null, 'expected-class');
    }
    this.next();
    const nameTok = this.ident('el nombre de la clase');
    let superName = null, superS = null, superE = null;
    const ifaces = [];
    if (this.accept('extends')) { superS = this.t.s; superName = this.parseType().name; superE = this.prevEnd(); if (this.is(',')) this.fail('En Java una clase solo puede heredar (extends) de una clase. Para varias, usa interfaces con implements'); }
    if (this.accept('implements')) { do { ifaces.push(this.parseType().name); } while (this.accept(',')); }
    const cls = { k: 'class', kind: 'class', name: nameTok.v, nameS: nameTok.s, nameE: nameTok.e, mods, members: [], s, superName, superS, superE, ifaces };
    this.parseClassBody(cls);
    return cls;
  }
  parseClassBody(cls) {
    this.expect('{');
    while (!this.is('}')) {
      if (this.t.t === 'eof') this.expect('}');
      if (this.accept(';')) continue;
      cls.members.push(this.parseMember(cls));
    }
    this.next();
    cls.e = this.prevEnd();
  }
  parseEnum(s, mods) {
    this.next();
    const nameTok = this.ident('el nombre del enum');
    const ifaces = [];
    if (this.accept('implements')) { do { ifaces.push(this.parseType().name); } while (this.accept(',')); }
    const cls = { k: 'class', kind: 'enum', name: nameTok.v, nameS: nameTok.s, nameE: nameTok.e, mods, members: [], s, superName: null, ifaces, constants: [] };
    this.expect('{');
    while (this.isId()) {
      const ct = this.next();
      const args = this.is('(') ? this.parseArgs() : [];
      if (this.is('{')) this.fail('Los enum con cuerpo en cada constante no están soportados');
      cls.constants.push({ name: ct.v, args, s: ct.s, e: ct.e });
      if (!this.accept(',')) break;
    }
    if (this.accept(';')) {
      while (!this.is('}')) {
        if (this.t.t === 'eof') this.expect('}');
        if (this.accept(';')) continue;
        cls.members.push(this.parseMember(cls));
      }
    }
    this.expect('}');
    cls.e = this.prevEnd();
    return cls;
  }
  isIdV(v) { return this.t.t === 'id' && this.t.v === v; }

  parseMember(cls) {
    const s = this.t.s;
    const mods = this.parseMods();
    if (this.is('class') || this.is('enum') || this.is('interface')) { this.i = this.toks.findIndex(t => t.s === s); const c = this.parseClass(); c.nested = true; return c; }
    if (this.is('{')) { const body = this.parseBlock(); return { k: 'init', static: mods.has('static'), body, s, e: this.prevEnd() }; }
    if (this.is('<')) this.fail('Los métodos genéricos no están soportados en este simulador');
    // constructor
    if (this.isId() && this.t.v === cls.name && this.is('(', this.peek())) {
      const nt = this.next();
      const params = this.parseParams();
      this.skipThrows();
      const body = this.parseBlock();
      return { k: 'ctor', mods, name: nt.v, params, body, s, e: this.prevEnd(), nameS: nt.s, nameE: nt.e };
    }
    const typeS = this.t.s;
    const type = this.parseType();
    if (this.is('(') && type.dims === 0 && !PRIM_KW.has(type.name)) {
      // método sin tipo de retorno: "public static main(...)" o constructor mal escrito
      this.fail("Falta el tipo de retorno del método '" + type.name + "' (por ejemplo void o int)", { s: typeS, e: typeS, text: 'void ' }, 'missing-ret');
    }
    const nt = this.ident('un nombre de método o atributo');
    if (this.is('(')) {
      const params = this.parseParams();
      let dims = 0;
      while (this.is('[') && this.is(']', this.peek())) { this.next(); this.next(); dims++; }
      if (dims) type.dims += dims;
      this.skipThrows();
      let body = null;
      if (this.accept(';')) body = null;
      else body = this.parseBlock();
      return { k: 'method', mods, type, typeS, name: nt.v, nameS: nt.s, nameE: nt.e, params, body, s, e: this.prevEnd() };
    }
    const decls = this.parseDeclarators(type, nt);
    this.expect(';');
    return { k: 'field', mods, type, typeS, decls, s, e: this.prevEnd() };
  }
  skipThrows() { if (this.accept('throws')) { this.qualified(); while (this.accept(',')) this.qualified(); } }
  parseParams() {
    this.expect('(');
    const ps = [];
    if (!this.is(')')) {
      do {
        const s = this.t.s;
        this.parseMods();
        const type = this.parseType();
        let varargs = false;
        if (this.accept('...')) { varargs = true; type.dims++; }
        const nt = this.ident('el nombre del parámetro');
        while (this.is('[') && this.is(']', this.peek())) { this.next(); this.next(); type.dims++; }
        ps.push({ type, name: nt.v, s, e: this.prevEnd(), nameS: nt.s, nameE: nt.e, varargs });
      } while (this.accept(','));
    }
    this.expect(')');
    return ps;
  }
  parseType() {
    const t = this.t;
    let name, s = t.s;
    if (t.t === 'kw' && PRIM_KW.has(t.v)) { name = this.next().v; }
    let qualified = false;
    if (t.t === 'id') {
      name = this.next().v;
      while (this.is('.') && this.isId(this.peek())) { this.next(); name = this.next().v; qualified = true; }
    } else if (!name) this.fail('Se esperaba un tipo (int, double, String…) pero hay ' + tokName(t));
    const nameE = this.prevEnd();
    let args = null;
    if (this.is('<')) {
      this.next();
      args = [];
      if (!this.is('>')) {
        do {
          if (this.accept('?')) { if (this.accept('extends') || this.accept('super')) args.push(this.parseType()); else args.push({ name: 'Object', dims: 0 }); }
          else args.push(this.parseType());
        } while (this.accept(','));
      }
      this.closeAngle();
    }
    let dims = 0;
    while (this.is('[') && this.is(']', this.peek())) { this.next(); this.next(); dims++; }
    return { name, args, dims, s, nameE, e: this.prevEnd(), qualified };
  }
  closeAngle() {
    const t = this.t;
    if (this.is('>')) { this.next(); return; }
    if (t.t === 'op' && (t.v === '>>' || t.v === '>>>' || t.v === '>=' || t.v === '>>=')) {
      const rest = t.v.slice(1);
      this.toks.splice(this.i, 1, { t: 'op', v: '>', s: t.s, e: t.s + 1 }, { t: 'op', v: rest, s: t.s + 1, e: t.e });
      this.next();
      return;
    }
    this.expect('>');
  }
  parseDeclarators(type, firstName) {
    const ds = [];
    let nt = firstName;
    for (;;) {
      let dims = 0;
      while (this.is('[') && this.is(']', this.peek())) { this.next(); this.next(); dims++; }
      let init = null;
      if (this.accept('=')) init = this.is('{') ? this.parseArrayInit() : this.parseExpr();
      else if (this.is('==')) this.fail("Para dar un valor a una variable se usa '=' (no '==')", { s: this.t.s, e: this.t.e, text: '=' }, 'decl-eqeq');
      ds.push({ name: nt.v, dims, init, s: nt.s, e: this.prevEnd(), nameS: nt.s, nameE: nt.e });
      if (!this.accept(',')) break;
      nt = this.ident('el nombre de una variable');
    }
    return ds;
  }
  parseArrayInit() {
    const s = this.expect('{').s;
    const elems = [];
    while (!this.is('}')) {
      elems.push(this.is('{') ? this.parseArrayInit() : this.parseExpr());
      if (!this.accept(',')) break;
    }
    this.expect('}');
    return this.node('arrayInit', s, { elems });
  }

  /* ---------- sentencias ---------- */
  parseBlock() {
    const s = this.t.s;
    this.expect('{');
    const body = [];
    while (!this.is('}')) {
      if (this.t.t === 'eof') this.expect('}');
      body.push(this.parseStatement());
    }
    this.next();
    return this.node('block', s, { body });
  }
  looksLikeDecl() {
    const t = this.t;
    if (t.t === 'kw' && PRIM_KW.has(t.v) && t.v !== 'void') return true;
    if (this.is('final')) return true;
    if (t.t !== 'id') return false;
    return this.speculate(() => {
      this.parseType();
      if (this.t.t !== 'id') return false;
      const n = this.peek();
      return n.t === 'op' && ['=', ';', ',', '[', ':', ')'].includes(n.v) || n.t !== 'op' && this.lineOf(n.s) > this.lineOf(this.t.s);
    });
  }
  parseLocalDecl(noSemi) {
    const s = this.t.s;
    const mods = this.parseMods();
    const type = this.parseType();
    const nt = this.ident('el nombre de la variable');
    const decls = this.parseDeclarators(type, nt);
    if (!noSemi) this.expect(';');
    return this.node('local', s, { mods, type, decls });
  }
  parseStatement() {
    const t = this.t, s = t.s;
    if (this.is('{')) return this.parseBlock();
    if (this.is(';')) { this.next(); return this.node('empty', s); }
    if (t.t === 'kw') {
      switch (t.v) {
        case 'if': {
          this.next();
          const cond = this.parseParenCond('if');
          if (this.is(';')) {
            const semi = this.t; this.next();
            const elseAfter = this.speculate(() => { this.parseStatement(); return this.is('else'); });
            if (elseAfter) this.fail("Sobra el ';' después de la condición del if: con él, el else se queda sin if", { s: semi.s, e: semi.e, text: '' }, 'if-semi-else', semi);

   Corrector de faltas, autocorrección y nota benevolente
   ===================================================================== */
(function (CE) {
'use strict';

const KW_SPELL = ['public', 'private', 'protected', 'static', 'void', 'class', 'return', 'else', 'while', 'for', 'switch', 'case', 'break', 'default', 'continue', 'import', 'new', 'boolean', 'double', 'float', 'int', 'char', 'long', 'String', 'final', 'do', 'if', 'true', 'false', 'null', 'package', 'try', 'catch', 'throw', 'Scanner', 'System'];
const VALID_CAPS = new Set(['Double', 'Float', 'Boolean', 'Character', 'Long', 'Integer', 'Short', 'Byte', 'String', 'System', 'Scanner', 'Math', 'Random', 'Arrays', 'StringBuilder', 'Object', 'List', 'ArrayList', 'Exception']);

function declaredNames(src) {
  const set = new Set();
  const re = /\b(?:int|double|float|long|short|byte|char|boolean|String|var|void|[A-Z]\w*)(?:\s*<[^>]*>)?(?:\s*\[\s*\])*\s+([A-Za-z_À-ɏ][\wÀ-ɏ]*)\s*(?=[=;,)(\[:])/g;
  let m;
  while ((m = re.exec(src))) set.add(m[1]);
  const cls = /\bclass\s+(\w+)/g;
  while ((m = cls.exec(src))) set.add(m[1]);
  return set;
}

/* Posibles faltas en palabras clave (pubic, statc, viod, retrun, esle…). Solo se usan
   cuando el código no compila, para no "corregir" nombres que el alumno ha elegido. */
function spellCandidates(src) {
  let toks;
  try { toks = CE.lex(src); } catch (e) {
    if (!(e instanceof CE.JavaError)) return [];
    const ls = src.lastIndexOf('\n', e.s) + 1, le = src.indexOf('\n', e.s);
    const blank = src.slice(0, ls) + src.slice(ls, le < 0 ? src.length : le).replace(/[^\n]/g, ' ') + (le < 0 ? '' : src.slice(le));
    if (blank === src) return [];
    return spellCandidates(blank);
  }
  const decl = declaredNames(src);
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.t !== 'id' || decl.has(t.v) || VALID_CAPS.has(t.v) || t.v.length < 2) continue;
    const nx = toks[i + 1] || {};
    const pv = toks[i - 1] || {};
    if (pv.v === '.') continue;
    let best = null, bd = 99;
    for (const w of KW_SPELL) {
      const d = CE.dist(t.v, w);
      if (d < bd) { bd = d; best = w; }
    }
    const lim = t.v.length >= 5 ? 2 : 1;
    if (!best || bd > lim) continue;
    if (nx.v === '.' && !['System', 'Scanner', 'String'].includes(best)) continue;
    if (nx.v === '(' && !['if', 'while', 'for', 'switch', 'catch', 'return'].includes(best)) continue;
    out.push({ s: t.s, e: t.e, from: t.v, to: best, fix: { s: t.s, e: t.e, text: best }, msg: "¿Querías decir '" + best + "'? (has escrito '" + t.v + "')" });
  }
  return out;
}

function applyFix(src, fix) {
  const edits = fix.edits ? fix.edits.slice() : [fix];
  edits.sort((a, b) => b.s - a.s);
  let r = src;
  for (const ed of edits) r = r.slice(0, ed.s) + ed.text + r.slice(ed.e);
  return r;
}

function wrapInClass(src) {
  const lines = src.split('\n');
  const imports = lines.filter(l => /^\s*import\s/.test(l));
  const rest = lines.filter(l => !/^\s*import\s/.test(l) && !/^\s*package\s/.test(l));
  const body = rest.join('\n');
  const hasMethods = /\b(static|public|private)\b[^;{]*\([^)]*\)\s*\{/.test(body);
  const ind = (s, n) => s.split('\n').map(l => (l.trim() ? ' '.repeat(n) + l : l)).join('\n');
  let code;
  if (hasMethods) code = 'public class Ejercicio {\n' + ind(body.trim(), 4) + '\n}\n';
  else code = 'public class Ejercicio {\n    public static void main(String[] args) {\n' + ind(body.trim(), 8) + '\n    }\n}\n';
  return (imports.length ? imports.join('\n') + '\n\n' : '') + code;
}

const fixKey = (d) => d.s + ':' + (d.fix ? JSON.stringify(d.fix) : d.msg);
const lineOf = (src, s) => CE.lineCol(src, s).line;

function describeFix(src, fix, msg) {
  const edits = fix.edits || [fix];
  const first = edits[0];
  const before = src.slice(Math.min(...edits.map(e => e.s)), Math.max(...edits.map(e => e.e)));
  return { line: lineOf(src, first.s), msg, before, after: edits.length === 1 ? first.text : null };
}

/* Repara el código paso a paso. Cada arreglo se valida: si no hace avanzar
   la compilación, se descarta. */
function autoFix(src, maxIter) {
  maxIter = maxIter || 30;
  let cur = src;
  const fixes = [];
  const rejected = new Set();
  const seen = new Set();
  let a = CE.analyze(cur);
  for (let it = 0; it < maxIter; it++) {
    const errors = a.diags.filter(d => d.sev === 'error');
    if (!errors.length) break;
    const cands = [];
    if (a.syntax) {
      const se = a.syntax;
      if (se.code === 'expected-class' && !/\bclass\b/i.test(cur)) cands.push({ whole: wrapInClass(cur), msg: 'Faltaba la clase: se ha metido el código dentro de public class Ejercicio { ... }', s: 0 });
      const errLine = lineOf(cur, se.s);
      for (const c of spellCandidates(cur)) if (c.s <= se.e && lineOf(cur, c.s) >= errLine - 1) cands.push({ fix: c.fix, msg: c.msg, s: c.s, spell: true });
      if (se.fix) cands.push({ fix: se.fix, msg: se.message, s: se.s });
    } else {
      for (const d of errors) if (d.fix) cands.push({ fix: d.fix, msg: d.msg, s: d.s, spell: d.spell });
      if (!cands.length) {
        // errores sin arreglo automático: probar faltas en palabras clave
        for (const c of spellCandidates(cur)) cands.push({ fix: c.fix, msg: c.msg, s: c.s, spell: true });
      }
    }
    let progressed = false;
    for (const c of cands) {
      const key = c.whole ? 'wrap' : fixKey(c);
      if (rejected.has(key)) continue;
      const next = c.whole || applyFix(cur, c.fix);
      const b = CE.analyze(next);
      const prevErr = a.diags.filter(d => d.sev === 'error').length;
      const nextErr = b.diags.filter(d => d.sev === 'error').length;
      let ok;
      const synKey = x => 'm:' + x.message + '@' + x.s;
      if (a.syntax) ok = !b.syntax || b.syntax.s > a.syntax.s || (!seen.has(synKey(b.syntax)) && (b.syntax.message !== a.syntax.message || b.syntax.s !== a.syntax.s));
      else {
        const gone = !b.diags.some(d => d.sev === 'error' && d.s === c.s && d.msg === c.msg);
        ok = !b.syntax && (nextErr < prevErr || (gone && nextErr <= prevErr + (c.spell ? 1 : 0)));
      }
      if (!ok) { rejected.add(key); continue; }
      fixes.push(c.whole ? { line: 1, msg: c.msg, before: '', after: null, kind: 'estructura' } : Object.assign(describeFix(cur, c.fix, c.msg), { kind: c.spell ? 'falta' : (a.syntax ? 'sintaxis' : 'tipos') }));
      if (a.syntax) { seen.add('m:' + a.syntax.message + '@' + a.syntax.s); rejected.add('m:' + a.syntax.message + '@' + a.syntax.s); }
      cur = next; a = b; progressed = true;
      break;
    }
    if (!progressed) break;
  }
  const errors = a.diags.filter(d => d.sev === 'error');
  const fatal = errors.filter(d => !d.tolerable);
  const tolerated = errors.filter(d => d.tolerable);
  return { src: cur, fixes, analysis: a, runnable: !!a.P && !a.syntax && fatal.length === 0, fatal, tolerated };
}

/* ======================= comparación de salidas ======================= */
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const NUM_RE = /\d+(?:[.,]\d+)?(?:e-?\d+)?/gi;
/* Saca los números de la salida. "3,5" puede ser un decimal o una lista (3 y 5): se guardan las dos lecturas.
   El '-' solo es signo si no va pegado a otro número ("3-4-5" son 3, 4 y 5). */
function numbersIn(text) {
  const r = [];
  let m;
  NUM_RE.lastIndex = 0;
  while ((m = NUM_RE.exec(text))) {
    const s0 = m.index, raw = m[0];
    const neg = text[s0 - 1] === '-' && !/[0-9a-z]/.test(text[s0 - 2] || '');
    const sign = neg ? -1 : 1, start = neg ? s0 - 1 : s0;
    if (/[.,]/.test(raw)) {
      r.push({ v: sign * parseFloat(raw.replace(',', '.')), s: start, e: s0 + raw.length });
      const [a, b] = raw.split(/[.,]/);
      r.push({ v: sign * parseInt(a, 10), s: start, e: s0 + a.length });
      const b0 = s0 + a.length + 1;
      r.push({ v: parseFloat(b), s: b0, e: b0 + b.length });
    } else r.push({ v: sign * parseFloat(raw), s: start, e: s0 + raw.length });
  }
  return r.sort((x, y) => x.s - y.s || (y.e - x.e));
}
function tokenRe(tok) {
  let p = norm(tok);
  if (p.startsWith('~')) return new RegExp(p.slice(1), 'g');
  return new RegExp('(?<![a-z0-9])(?:' + p + ')(?![a-z0-9])', 'g');
}
function findTok(out, nums, tok, from, tol) {
  if (typeof tok === 'number') {
    const t = tol != null ? tol : (Number.isInteger(tok) ? 0.0001 : 0.011);
    for (const n of nums) if (n.s >= from && Math.abs(n.v - tok) <= t + Math.abs(tok) * 1e-9) return n;
    return null;
  }
  const re = tokenRe(tok);
  re.lastIndex = from;
  const m = re.exec(out);
  return m ? { s: m.index, e: m.index + m[0].length, raw: m[0] } : null;
}
function matchOutput(rawOut, test) {
  const out = norm(rawOut);
  const nums = numbersIn(out);
  const toks = test.out || [];
  let pos = 0, credit = 0;
  const detail = [];
  for (const tok of toks) {
    const tol = test.tol;
    let hit = findTok(out, nums, tok, pos, tol);
    if (hit) { credit += 1; pos = hit.e; detail.push({ tok, ok: true }); continue; }
    hit = findTok(out, nums, tok, 0, tol);
    if (hit) { credit += 0.9; detail.push({ tok, ok: 'orden' }); continue; }
    detail.push({ tok, ok: false });
  }
  let bad = 0;
  for (const tok of (test.not || [])) {
    if (findTok(out, nums, tok, 0, test.tol)) { bad++; detail.push({ tok, ok: false, not: true }); }
  }
  const total = toks.length || 1;
  let frac = Math.max(0, (credit - bad) / total);
  if (!toks.length) frac = bad ? 0 : 1;
  return { frac, detail };
}
function showTok(tok) {
  if (typeof tok === 'number') return String(tok).replace('.', ',');
  return tok.replace(/^~/, '').split('|')[0].replace(/\\s\*|\\s\+|\\b/g, ' ').replace(/[\\^$()?*+[\]]/g, '').replace(/\s+/g, ' ').trim();
}

/* ======================= pruebas ======================= */
function inputText(t) { if (t.in == null) return ''; if (Array.isArray(t.in)) return t.in.join('\n') + '\n'; return String(t.in).endsWith('\n') ? t.in : t.in + '\n'; }
function toJava(v, type) {
  if (type === 'char' && typeof v === 'string') return v.charCodeAt(0);
  if (type === 'long' && typeof v === 'number') return BigInt(v);
  if ((type === 'double' || type === 'float' || type === 'int') && typeof v === 'number') return v;
  if (CE.isArr(type) && Array.isArray(v)) { const a = v.map(x => toJava(x, CE.elemOf(type))); a.jt = CE.elemOf(type); return a; }
  return v;
}
/* Si la prueba llama a Ejercicio.metodo() y la clase del alumno se llama de otra forma, se usa la suya */
function driverFor(drv, src) {
  if (!src || !/\bEjercicio\./.test(drv) || /\b(class|enum|interface)\s+Ejercicio\b/.test(src)) return drv;
  const meth = (/\bEjercicio\.(\w+)\s*\(/.exec(drv) || [])[1];
  const re = /\b(?:class|enum|interface)\s+(\w+)/g; const cls = []; let m;
  while ((m = re.exec(src))) cls.push({ name: m[1], at: m.index });
  if (!cls.length) return drv;
  let pick = cls[0].name;
  if (meth) for (let i = 0; i < cls.length; i++) { const body = src.slice(cls[i].at, i + 1 < cls.length ? cls[i + 1].at : src.length); if (new RegExp('\\b' + meth + '\\s*\\(').test(body)) { pick = cls[i].name; break; } }
  return drv.replace(/\bEjercicio\./g, pick + '.');
}
function runTest(P, t, src) {
  if (t.driver) {
    const full = (src || '') + '\n\n' + driverFor(t.driver, src);
    const a = CE.analyze(full);
    const mc = (/class\s+(\w+)/.exec(t.driver) || [])[1];
    const bad = a.diags.filter(d => d.sev === 'error' && !d.tolerable);
    if (!a.P || a.syntax || bad.length) {
      const d = bad[0] || a.diags[0];
      return { frac: 0, status: 'nocompile', out: '', note: 'Tu código no encaja con lo que pide la prueba: ' + (d ? d.msg : 'error de sintaxis') };
    }
    t = Object.assign({}, t, { driver: null });
    return runTest(a.P, Object.assign(t, { mainClass: mc }), null);
  }
  /* Datos repetidos por estar mal: se prueba en el orden en que los pida el programa (cada dato al leerlo, todos en un bucle, o todos primero) */
  if (t.alt && Array.isArray(t.in)) {
    let best = null;
    for (const inp of [t.in, ...t.alt]) {
      const r = runTest(P, Object.assign({}, t, { in: inp, alt: null }), src);
      r.usedIn = inp;
      if (!best || r.frac > best.frac + 1e-9) best = r;
      if (best.frac >= 0.999) break;
    }
    if (best.usedIn !== t.in) best.note = (best.note ? best.note + ' · ' : '') + 'Tu programa pide los datos en otro orden, así que se ha probado con: ' + best.usedIn.join(', ');
    return best;
  }
  if (t.call) {
    const list = CE.findMethod(P, t.call);
    if (!list) return { frac: 0, status: 'nomethod', out: '', note: "No se encuentra el método '" + t.call + "'" };
    const kindOk = (v, pt) => typeof v === 'string' ? (pt === 'String' || (pt === 'char' && v.length === 1)) : typeof v === 'boolean' ? pt === 'boolean' : Array.isArray(v) ? CE.isArr(pt) : (pt !== 'String' && pt !== 'boolean' && !CE.isArr(pt));
    const m = list.find(x => x.params.length === t.args.length && t.args.every((v, i) => kindOk(v, x.params[i].type))) || list.find(x => x.params.length === t.args.length) || list[0];
    if (m.params.length !== t.args.length) return { frac: 0, status: 'nomethod', out: '', note: "El método '" + m.name + "' tiene " + m.params.length + ' parámetros y la prueba le pasa ' + t.args.length };
    const args = t.args.map((v, i) => toJava(v, m.params[i].type));
    const r = CE.run(P, { call: { method: m, args }, input: inputText(t), rand: t.rand, limit: 2000000 });
    const base = { status: r.status, out: r.out, ret: r.ret, retType: r.retType };
    if (r.status !== 'done') return Object.assign(base, { frac: 0, note: statusNote(r) });
    let ok = 0;
    if (t.retCheck) { let v = 0; try { v = t.retCheck(r.ret) ? 1 : 0; } catch (e) { v = 0; } base.retText = CE.jstr(r.ret, r.retType); return Object.assign(base, { frac: v }); }
    if ('ret' in t) {
      const exp = t.ret;
      let got = r.ret;
      if (typeof got === 'bigint') got = Number(got);
      if (Array.isArray(got)) got = got.map(x => typeof x === 'bigint' ? Number(x) : x);
      if (typeof exp === 'number') ok = typeof got === 'number' && Math.abs(got - exp) <= (t.tol != null ? t.tol : 0.011) ? 1 : 0;
      else if (typeof exp === 'string') {
        const txt = got === null ? null : CE.jstr(got, r.retType);
        // exact: true distingue mayúsculas y tildes (por ejemplo, para "Primera Letra En Mayuscula")
        const nf = t.exact ? (x => x) : norm;
        ok = txt !== null && nf(txt).trim() === nf(exp).trim() ? 1 : (txt !== null && nf(txt).replace(/\s+/g, '') === nf(exp).replace(/\s+/g, '') ? 0.75 : 0);
      }
      else if (Array.isArray(exp)) ok = Array.isArray(got) && got.length === exp.length && got.every((g, i) => Math.abs(g - exp[i]) < 0.011) ? 1 : 0;
      else ok = got === exp ? 1 : 0;
      base.retText = r.retType === 'void' ? '(nada)' : CE.jstr(r.ret, r.retType);
    }
    if (t.check) { let v = 0; try { v = t.check(r.out); } catch (e) { v = 0; } return Object.assign(base, { frac: 'ret' in t ? (ok + v) / 2 : v, detail: [] }); }
    if (t.out) {
      const mo = matchOutput(r.out, t);
      return Object.assign(base, { frac: 'ret' in t ? (ok + mo.frac) / 2 : mo.frac, detail: mo.detail });
    }
    return Object.assign(base, { frac: ok });
  }
  const r = CE.run(P, { input: inputText(t), rand: t.rand, limit: 2000000, mainClass: t.mainClass });
  let mo;
  if (t.check) { let v = 0; try { v = t.check(t.tail ? r.out.slice(r.lastReadOut || 0) : r.out); } catch (e) { v = 0; } mo = { frac: v, detail: [] }; }
  else {
    const tail = r.out.slice(r.lastReadOut || 0);
    const mt = matchOutput(tail, t);
    if (t.tail) mo = mt;
    else { const mf = matchOutput(r.out, t); mo = mf.frac >= mt.frac ? mf : mt; }
  }
  let frac = mo.frac;
  let note = null;
  if (r.status !== 'done') {
    note = statusNote(r);
    if (r.status === 'timeout' || r.status === 'outlimit') frac *= 0.3;
    else if (r.status === 'exception') frac *= 0.7;
  }
  if (Array.isArray(t.in) && t.in.length && !r.consumed && r.status !== 'exception') { frac = 0; note = 'El programa no lee ningún dato del teclado, y esta prueba le da: ' + t.in.join(', '); }
  return { frac, detail: mo.detail, status: r.status, out: r.out, note, uninit: r.uninit };
}
function statusNote(r) {
  switch (r.status) {
    case 'timeout': return 'El programa no termina (¿bucle infinito? revisa la condición y que la variable cambie dentro del bucle)';
    case 'outlimit': return 'El programa escribe demasiado (¿bucle infinito?)';
    case 'exception':
      if (r.exc && r.exc.jtype === 'NoSuchElementException') return 'El programa pide más datos de los que tiene esta prueba (¿lees de más o el bucle no para?)';
      if (r.exc && r.exc.jtype === 'InputMismatchException') return 'Se ha leído un dato con el tipo equivocado (InputMismatchException)';
      return 'Se ha producido una excepción: ' + (r.exc ? r.exc.toString() : '');

    case 'internal': return 'Error interno del simulador: ' + (r.exc && r.exc.message);
    default: return null;
  }
}

/* ======================= análisis de estructura ======================= */
const RX = {
  if: /\bif\s*\(/g, else: /\belse\b/g, switch: /\bswitch\s*\(/g, switchArrow: /\bcase\b[^:\n]*->/g, while: /\bwhile\s*\(/g, do: /\bdo\s*\{?/g,
  for: /\bfor\s*\([^:)]*;/g, foreach: /\bfor\s*\([^;)]*:/g, cond: /\?[^:;]+:/g, return: /\breturn\b/g, break: /\bbreak\s*;/g, try: /\btry\s*\{/g,
  newArray: /\bnew\s+\w+\s*\[/g, arrayInit: /=\s*\{/g, printf: /\.printf\s*\(/g
};
function analyzer(unit, src) {

      if (n.k === 'assign' && n.op !== '=') ops[n.op] = (ops[n.op] || 0) + 1;
      if (n.k === 'pre' || n.k === 'post') ops[n.op] = (ops[n.op] || 0) + 1;
      if ((n.k === 'local' || n.k === 'field') && n.decls) n.decls.forEach(d => decls.push({ name: d.name, type: tstr(n.type) + '[]'.repeat(d.dims || 0) }));

      if (n.k === 'method') methods.push({ name: n.name, params: n.params.map(p => tstr(p.type)), ret: tstr(n.type), static: n.mods.has('static'), abstract: n.mods.has('abstract'), override: (n.mods.ann || []).includes('Override'), node: n });

        for (const m of n.members) {
          if (m.k === 'field') m.decls.forEach(d => fields.push({ name: d.name, type: tstr(m.type), private: m.mods.has('private'), static: m.mods.has('static'), final: m.mods.has('final'), protected: m.mods.has('protected') }));
          if (m.k === 'ctor') ctors.push({ params: m.params.map(p => tstr(p.type)) });
          if (m.k === 'method') meths.push({ name: m.name, params: m.params.map(p => tstr(p.type)), ret: tstr(m.type), static: m.mods.has('static'), abstract: m.mods.has('abstract') || (n.kind === 'interface' && !m.body), override: (m.mods.ann || []).includes('Override'), private: m.mods.has('private') });

        System.out.println("Fin: ");

class Carrito {
    private Producto[] productos;
    private int numProductos;

    public Carrito(int capacidad) {
        productos = new Producto[capacidad];
        numProductos = 0;
    }

    public boolean anadir(Producto p) {
        if (numProductos == productos.length) {
            return false;
        }
        productos[numProductos] = p;
        numProductos++;
        return true;
    }

    public int getNumProductos() {
        return numProductos;
    }

    public double total() {
        double suma = 0;
        for (int i = 0; i < numProductos; i++) {
