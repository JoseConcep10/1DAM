        }
        return suma;
    }

    public Producto masCaro() {
        if (numProductos == 0) {
            return null;
        }
        Producto caro = productos[0];
        for (int i = 1; i < numProductos; i++) {
            if (productos[i].getPrecio() > caro.getPrecio()) {
                caro = productos[i];
            }
        }
        return caro;
    }

        }
        libros[num++] = l;
        return true;
    }

    private Libro buscar(String titulo) {
        for (int i = 0; i < num; i++) {
            if (libros[i].getTitulo().equals(titulo)) {
                return libros[i];
            }
        }
        return null;
    }

    public boolean prestar(String titulo) {
        Libro l = buscar(titulo);
        if (l == null || l.isPrestado()) {
            return false;
        }
        l.setPrestado(true);
        return true;
    }

    public boolean devolver(String titulo) {
        Libro l = buscar(titulo);
        if (l == null || !l.isPrestado()) {
            return false;
        }
        l.setPrestado(false);
        return true;
    }

    public int disponibles() {
        int n = 0;
        for (int i = 0; i < num; i++) {
            if (!libros[i].isPrestado()) {
                n++;
            }
        }
        return n;
    }
}`,

        if (isFull()) {
            return false;
        }
        datos[cima] = valor;
        cima++;
        return true;

        if (isEmpty()) {

abstract class Figura {
    private String nombre;

    public Figura(String nombre) {
        this.nombre = nombre;
    }

    public String getNombre() {
        return nombre;
    }

    public abstract double area();

    public static double sumaAreas(Figura[] figuras) {
        double suma = 0;
        for (Figura f : figuras) {

        }

class Circulo extends Figura {

'use strict';

const drv = llamada => 'class PruebaExamen {\n    public static void main(String[] args) {\n        ' + llamada + '\n    }\n}';
const quitar = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* Dibujo exacto línea a línea (sin contar espacios al final de cada línea) */
const dibujo = exp => out => {
  const lines = out.split('\n').map(l => l.replace(/[ \t\r]+$/, ''));
  while (lines.length && lines[0] === '') lines.shift();
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  const n = Math.max(lines.length, exp.length);
  if (!n) return 0;
  let s = 0;
  for (let i = 0; i < exp.length; i++) {
    const l = lines[i];
    if (l === undefined) continue;
    if (l === exp[i]) s += 1;
    else if (l.replace(/\s+/g, '') === exp[i].replace(/\s+/g, '')) s += 0.5;
  }
  return s / n;
};
/* Lee "etiqueta → número" de la salida: admite "Pares: 2", "2 pares", varias en una línea,
   paréntesis o corchetes con rangos ("Fuera de limite (0-10): 2") y el número en la línea siguiente */
const etiquetas = (out, cats) => {
  const res = {};
  const keys = Object.keys(cats);
  const lines = quitar(out).split('\n').map(l => l.replace(/\([^)]*\)|\[[^\]]*\]/g, ' '));
  const re = new RegExp('(-?\\d+)|' + keys.map(k => '(' + cats[k] + ')').join('|'), 'g');
  for (let li = 0; li < lines.length; li++) {
    const l = lines[li];
    const toks = [];
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(l))) {
      if (m[0] === '') { re.lastIndex++; continue; }
      if (m[1] !== undefined) { toks.push({ n: Number(m[1]), used: false }); continue; }
      const k = keys[m.slice(2).findIndex(x => x !== undefined)];
      const dosPuntos = /^\w*\s*[:=>-]/.test(l.slice(m.index + m[0].length));
      const prev = toks[toks.length - 1];
      if (prev && prev.k === k) { prev.dosPuntos = dosPuntos; continue; }   // "fuera del limite": una sola etiqueta
      toks.push({ k, dosPuntos });
    }
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (!t.k || t.k in res) continue;
      const prev = toks[i - 1], next = toks[i + 1];
      let v = null;
      if (t.dosPuntos && next && next.n !== undefined && !next.used) v = next;          // "Pares: 2"
      else if (prev && prev.n !== undefined && !prev.used) v = prev;                     // "2 pares"
      else if (next && next.n !== undefined && !next.used) v = next;                     // "Pares 2"
      if (v) { v.used = true; res[t.k] = v.n; }
      else if (!next) { const sig = (lines[li + 1] || '').trim(); if (/^-?\d+$/.test(sig)) res[t.k] = Number(sig); }   // número en la línea siguiente
    }
  }
  return res;
};
const borde = n => [...Array(n).keys()].map(i => [...Array(n).keys()].map(j => (i === 0 || i === n - 1 || j === 0 || j === n - 1) ? '*' : ' ').join(''));
const triangulo = n => [...Array(n).keys()].map(i => '*'.repeat(i + 1));

/* Ejercicio 3: busca el número de cada categoría en la salida (en el orden y formato que sea) */
const CATS3 = { impar: 'impar(?:es)?', par: '(?<![a-z])par(?:es)?(?![a-z])', cero: '(?<![a-z])ceros?(?![a-z])', fuera: 'fuera|limite[a-z]*|rango|invalid[a-z]*|incorrect[a-z]*|no valid[a-z]*|(?<![a-z])otros?(?![a-z])|(?<![a-z])error[a-z]*' };
const cuentas = exp => out => {
  const got = etiquetas(out, CATS3);
  const ks = Object.keys(exp);
  return ks.filter(k => got[k] === exp[k]).length / ks.length;
};

/* Ejercicio 4: palabras, vocales, frase alternada y palíndromo */
const alternas = frase => {
  const f = frase.toLowerCase();
  let a = '', b = '', k = 0;
  for (let i = 0; i < f.length; i++) {
    const ch = f[i];
    a += /[a-zñ]/.test(ch) ? (k++ % 2 === 1 ? ch.toUpperCase() : ch) : ch;   // contando solo letras
    b += i % 2 === 1 ? ch.toUpperCase() : ch;                                 // contando todas las posiciones
  }
  return [a.trim(), b.trim()];
};
const frase4 = frase => {
  const pal = frase.trim() ? frase.trim().split(/\s+/).length : 0;
  const voc = [...frase.toLowerCase()].filter(c => 'aeiou'.includes(c)).length;
  const letras = frase.toLowerCase().replace(/[^a-zñ]/g, '');
  const esPal = letras === [...letras].reverse().join('');
  const alts = alternas(frase);
  return out => {
    const ls = out.split('\n').map(l => l.replace(/[ \t\r]+$/, ''));
    const lq = ls.map(quitar);
    const got = etiquetas(out, { palabra: 'palabras?', vocal: 'vocal(?:es)?' });
    let ok = 0;
    if (got.palabra === pal) ok++;
    if (got.vocal === voc) ok++;
    // la frase alternada no puede ir pegada a otra palabra (si lo va, falta el println después del bucle)
    if (ls.some(l => alts.some(a => { if (!a) return false; let i = l.indexOf(a); while (i >= 0) { const sig = l.charAt(i + a.length); if (!/[A-Za-z0-9ñÑ]/.test(sig)) return true; i = l.indexOf(a, i + 1); } return false; }))) ok++;
    const lpal = lq.find(t => /palindrom|capicua/.test(t));
    if (lpal != null) {
      const dice = /\b(true|verdadero|cierto)\b/.test(lpal) ? true : /\b(false|falso)\b/.test(lpal) ? false : !/\bno\b/.test(lpal);
      if (dice === esPal) ok++;
    }
    return ok / 4;
  };
};

abstract class Personaje {
    protected String nombre;
    protected int vida;
    protected int vidaMaxima;

    public Personaje(String nombre, int vidaMaxima) {
        this.nombre = nombre;
        this.vidaMaxima = vidaMaxima;
        this.vida = vidaMaxima;
    }

    public void recibirDanio(int danio) {
        vida -= danio;
        if (vida < 0) {
            vida = 0;
        }
        System.out.printf("%s recibe %d de daño. Vida: %d/%d%n", nombre, danio, vida, vidaMaxima);
    }

    public boolean estaVivo() {
        return vida > 0;
    }

    public abstract void atacar(Personaje enemigo);
}

class Guerrero extends Personaje {
    public Guerrero() {
        super("Guerrero", 100);
    }

    @Override
    public void atacar(Personaje enemigo) {
        System.out.println("Guerrero ataca con la espada");
        enemigo.recibirDanio(20);
    }
}

class Mago extends Personaje {

    MAYOR_MENOR,

public class Ejercicio {

    public static int[] ordenarBurbuja(int[] numeros) {
        return ordenarBurbuja(numeros, Orden.MENOR_MAYOR);
    }

    public static int[] ordenarBurbuja(int[] numeros, Orden orden) {
        int[] copia = new int[numeros.length];
        System.arraycopy(numeros, 0, copia, 0, numeros.length);
        for (int i = 0; i < copia.length - 1; i++) {
            for (int j = 0; j < copia.length - 1 - i; j++) {
                boolean cambiar;
                if (orden == Orden.MENOR_MAYOR) {
                    cambiar = copia[j] > copia[j + 1];
                } else {
                    cambiar = copia[j] < copia[j + 1];
                }
                if (cambiar) {
                    int aux = copia[j];
                    copia[j] = copia[j + 1];
                    copia[j + 1] = aux;
                }
            }
        }
        return copia;
    }
}`,

        System.out.println(bienParentizada("{[()]}"));
        System.out.println(bienParentizada("(]"));
    }

    public static boolean bienParentizada(String texto) {
        String t = "";
        for (int i = 0; i < texto.length(); i++) {
            char c = texto.charAt(i);

                t += c;

        do {

        return t.isEmpty();
    }

/* =====================================================================

(function (CE) {
'use strict';

const KW = new Set('abstract boolean byte char class enum double extends final float implements import int interface long native package private protected public short static strictfp super synchronized this throws transient void volatile var true false null'.split(' '));
const CTL = new Set('if else for while do switch case default break continue return try catch finally throw new yield instanceof assert'.split(' '));
const TOK = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|("(?:\\.|[^"\\\n])*"?)|('(?:\\.|[^'\\\n])*'?)|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFdDlL]?\b|\b0[xX][0-9a-fA-F]+\b)|(@\w+)|([A-Za-z_$À-ɏ][\w$À-ɏ]*)|([^\s\w])/g;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function highlight(src) {
  let out = '', last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(src))) {
    if (m.index > last) out += esc(src.slice(last, m.index));
    const t = m[0];
    let c = null;
    if (m[1]) c = 'com';
    else if (m[2]) c = 'str';
    else if (m[3]) c = 'chr';
    else if (m[4]) c = 'num';
    else if (m[5]) c = 'ann';
    else if (m[6]) {
      if (CTL.has(t)) c = 'ctl';
      else if (KW.has(t)) c = 'kw';
      else if (/^[A-Z]/.test(t)) c = 'type';
      else if (/^\s*\(/.test(src.slice(TOK.lastIndex, TOK.lastIndex + 4))) c = 'fn';
    } else if (m[7]) c = 'op';
    out += c ? '<span class="tk-' + c + '">' + esc(t) + '</span>' : esc(t);
    last = TOK.lastIndex;
  }
  if (last < src.length) out += esc(src.slice(last));
  return out;
}
CE.highlight = highlight;

/* Formatear: reindenta según las llaves (y los case clásicos) */
function format(src) {
  const lines = src.replace(/\t/g, '    ').split('\n');
  let depth = 0;
  const caseStack = [];
  const out = [];
  let inBlockComment = false;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { out.push(''); continue; }
    let code = '';
    let i = 0, inStr = false, inChr = false;
    let lc = inBlockComment;
    for (; i < line.length; i++) {
      const c = line[i], n = line[i + 1];
      if (lc) { if (c === '*' && n === '/') { lc = false; i++; } continue; }
      if (inStr) { if (c === '\\') i++; else if (c === '"') inStr = false; continue; }
      if (inChr) { if (c === '\\') i++; else if (c === "'") inChr = false; continue; }
      if (c === '/' && n === '/') break;
      if (c === '/' && n === '*') { lc = true; i++; continue; }
      if (c === '"') { inStr = true; continue; }
      if (c === "'") { inChr = true; continue; }
      code += c;
    }
    const startsClose = /^[}\])]/.test(code);
    const isCase = /^(case\b[^:]*:|default\s*:)/.test(code) && !/->/.test(code);
    let d = depth;
    if (startsClose) d = Math.max(0, d - 1);
    if (caseStack.length && caseStack[caseStack.length - 1] === depth && !startsClose) {
      if (!isCase) d += 1;

/* ====================== utilidades de ejercicios ====================== */
const exCache = {};
function exampleOf(q) {
  if (exCache[q.id]) return exCache[q.id];
  const t = q.tests.find(x => !x.call) || q.tests[0];
  let html = '';
  try {
    const a = CE.analyze(t.driver ? q.ref + '\n\n' + t.driver : q.ref);
    const s = new CE.Session(a.P, { rand: t.rand, seed: 7, mainClass: t.driver ? (/class\s+(\w+)/.exec(t.driver) || [])[1] : undefined });
    let r = s.step();
    html += esc(r.out);
    const ins = Array.isArray(t.in) ? t.in.slice() : [];
    while (r.status === 'input' && ins.length) { const v = String(ins.shift()); html += '<span class="in">' + esc(v) + '</span>\n'; r = s.send(v); html += esc(r.out); }
  } catch (e) { html = esc('(no disponible)'); }
  exCache[q.id] = html.replace(/\n$/, '');
  return exCache[q.id];
}
/* Bloque "ejemplo": en las preguntas de clases enseña el main de prueba y lo que muestra */
function exampleBlock(q, tag) {
  const t = q.tests.find(x => !x.call) || q.tests[0];
  const h = tag || 'h2';
  if (t && t.driver) return '<' + h + '>Así se prueba tu código</' + h + '><pre class="ejemplo ejemplo-code">' + CE.highlight(t.driver) + '</pre><' + h + '>Y esto es lo que muestra</' + h + '><pre class="ejemplo">' + exampleOf(q) + '</pre>';
  return '<' + h + '>Ejemplo de ejecución</' + h + '><pre class="ejemplo">' + exampleOf(q) + '</pre>';
}
function starter(q) { return D.settings.plantilla ? (q && q.template) || CE.TEMPLATE : ''; }
function isTrivial(code) { const c = (code || '').replace(/\s+/g, ''); return !c || c === CE.TEMPLATE.replace(/\s+/g, '') || (CE.TPL_POO && c === CE.TPL_POO.replace(/\s+/g, '')); }
const utOf = q => q.ut || 2;
const enPool = q => D.settings.temas.includes(q.tema) && D.settings.uts.includes(utOf(q));
function lvl(n) { return '<span class="lvl" title="Dificultad ' + n + ' de 3">' + [1, 2, 3].map(i => '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</span>'; }
function notaCls(n) { return n == null ? '' : n >= 5 ? 'ap' : 'su'; }
function statOf(id) { return D.stats[id] || null; }
function recordStat(id, score) { const s = D.stats[id] || { best: 0, last: 0, n: 0 }; s.best = Math.max(s.best, score); s.last = score; s.n++; D.stats[id] = s; }

/* ---------- repositorio de fallos ---------- */
const APROBADO = 5;
function issuesOf(g) {
  const out = [];
  if (!g.runnable) out.push(g.notes.find(n => /no se ha podido ejecutar/i.test(n)) || 'El código no se pudo ejecutar');
  g.tests.forEach((t, i) => { if (t.frac < 0.99 && out.length < 4) out.push('Prueba ' + (i + 1) + (t.test.in && t.test.in.length ? ' (datos ' + t.test.in.join(', ') + ')' : t.test.call ? ' (' + t.test.call + ')' : '') + ': ' + (t.note || (t.frac > 0 ? 'salida incompleta' : 'no sale lo esperado'))); });
  for (const r of g.reqs) if (!r.ok && out.length < 6) out.push('Requisito: ' + r.text);
  return out;
}
/* Guarda el resultado: por debajo de 5 entra (o sigue) en el repositorio; al aprobarla, queda como superada */
function recordResult(id, g, code, how) {
  recordStat(id, g.score);
  const f = D.fallos[id];
  if (g.score < APROBADO) {
    const e = f && !f.resolved ? f : { n: f ? f.n : 0, first: Date.now() };
    e.n = (e.n || 0) + 1; e.last = g.score; e.date = Date.now(); e.resolved = false; e.resolvedDate = null; e.code = code; e.how = how; e.issues = issuesOf(g);
    D.fallos[id] = e;
    return 'fallo';
  }
  if (f && !f.resolved) { f.resolved = true; f.resolvedDate = Date.now(); f.resolvedScore = g.score; return 'superada'; }
  return null;
}
const pendientes = () => CE.BANK.filter(q => D.fallos[q.id] && !D.fallos[q.id].resolved).sort((a, b) => (D.fallos[b.id].date || 0) - (D.fallos[a.id].date || 0));
const superadas = () => CE.BANK.filter(q => D.fallos[q.id] && D.fallos[q.id].resolved).sort((a, b) => (D.fallos[b.id].resolvedDate || 0) - (D.fallos[a.id].resolvedDate || 0));

/* ---------- campo de tiempo (con minutos personalizados) ---------- */
const PRESETS = [[0, 'Sin límite'], [15, '15 minutos'], [30, '30 minutos'], [45, '45 minutos'], [60, '1 hora'], [90, '1 h 30 min'], [120, '2 horas']];
const clampMin = v => Math.max(1, Math.min(300, Math.round(+v || 20)));
function timeField(v) {
  const isPreset = PRESETS.some(p => p[0] === +v);
  return '<div class="time-field"><select class="sel" id="tiempo">' + PRESETS.map(([m, l]) => '<option value="' + m + '"' + (isPreset && +v === m ? ' selected' : '') + '>' + l + '</option>').join('') + '<option value="otro"' + (isPreset ? '' : ' selected') + '>Otro…</option></select>' +
    '<span class="min-in"' + (isPreset ? ' hidden' : '') + '><input class="sel num" type="number" inputmode="numeric" id="tiempoMin" min="1" max="300" value="' + (isPreset ? 20 : +v) + '" aria-label="Minutos del examen"> min</span></div>';
}
function wireTimeField(root) {
  const sel = root.querySelector('#tiempo');
  if (!sel) return;
  const box = root.querySelector('.min-in'), num = root.querySelector('#tiempoMin');
  sel.addEventListener('change', () => {
    if (sel.value === 'otro') { box.hidden = false; D.settings.tiempo = clampMin(num.value); num.focus(); num.select(); }
    else { box.hidden = true; D.settings.tiempo = +sel.value; }
    save();
  });
  num.addEventListener('input', () => { if (num.value) { D.settings.tiempo = clampMin(num.value); save(); } });
  num.addEventListener('blur', () => { num.value = clampMin(num.value); });
}

/* ---------- repositorio de fallos ---------- */
function fmtRel(t) {
  if (!t) return 'antes de hoy';
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const days = Math.round((d0 - new Date(t).setHours(0, 0, 0, 0)) / 86400000);
  if (days <= 0) return 'hoy';
  if (days === 1) return 'ayer';
  if (days < 7) return 'hace ' + days + ' días';
  return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}
const vecesTxt = n => n + (n === 1 ? ' vez' : ' veces');
function falloRow(q) {
  const f = D.fallos[q.id];
  return '<button class="qrow" data-q="' + q.id + '"><span><span class="t">' + esc(q.title) + '</span><span class="o">Fallada ' + vecesTxt(f.n) + ' · ' + fmtRel(f.date) + (f.issues && f.issues[0] ? ' · ' + esc(f.issues[0]) : '') + '</span></span>' + lvl(q.level) + '<span class="nota-mini su">' + (f.last != null ? fmtN(f.last, 1) : '—') + '</span></button>';
}

    '<label class="custom-min">Otro: <input class="sel num" type="number" inputmode="numeric" id="tCustom" min="1" max="180" placeholder="' + rec + '" aria-label="Minutos personalizados"> minutos</label>' +

    const x = ev.target.closest('[data-x]');
    if (x) { dlg.close(); if (x.dataset.x === 'go') startPracticeTimer(custom.value ? clampMin(custom.value) : sel); return; }
    if (ev.target === dlg) dlg.close();
  };
  custom.addEventListener('input', () => { for (const b of dlg.querySelectorAll('[data-m]')) b.setAttribute('aria-pressed', !custom.value && +b.dataset.m === sel); });
  custom.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); dlg.close(); startPracticeTimer(custom.value ? clampMin(custom.value) : sel); } });
  dlg.onclose = null;
  dlg.showModal();
  dlg.querySelector('[data-x="go"]').focus();
}
function startPracticeTimer(min) {
  if (!W || W.mode !== 'practice') return;
  D.ptimer = { qid: W.q.id, start: Date.now(), end: Date.now() + min * 60000, min };
  save();
  runPracticeTimer();
  flash('Tienes ' + min + ' minutos. ¡A por ello!');
  W.ed.focus();
}
function paintTimerBtn() {
  const b = W && W.root.querySelector('[data-act="ptimer"]');
  if (!b) return;
  const on = !!(D.ptimer && D.ptimer.qid === W.q.id);
  b.innerHTML = IC.clock + '<span class="lbl-t">' + (on ? 'Parar tiempo' : 'Temporizador') + '</span>';
  b.title = on ? 'Parar el temporizador' : 'Ponerte un tiempo para este ejercicio';
}
function runPracticeTimer() {
  stopTimer();
  const el = W.root.querySelector('#timer');
  const pt = D.ptimer;
  paintTimerBtn();
  if (!pt) { el.hidden = true; return; }
  const tick = () => {
    if (!D.ptimer || screen !== 'practice' || !W || W.q.id !== pt.qid) { stopTimer(); return; }
    const left = pt.end - Date.now();
    const s = Math.max(0, Math.ceil(left / 1000));
    el.hidden = false;
    el.textContent = mmss(s);
    el.className = 'timer' + (s <= 60 ? ' nada' : s <= Math.min(300, pt.min * 15) ? ' poco' : '');
    el.setAttribute('aria-label', 'Te quedan ' + Math.floor(s / 60) + ' minutos y ' + (s % 60) + ' segundos');
    if (left <= 0) {
      stopPracticeTimer();
      gradePractice({ timeUp: true, min: pt.min, used: pt.min * 60000 });
      flash('¡Se acabó el tiempo! Se ha corregido lo que tenías escrito.', 5000);
    }
  };
  tick();
  timerI = setInterval(tick, 1000);
}
function stopPracticeTimer() {
  stopTimer();
  D.ptimer = null;
  save();
  const el = W && W.root.querySelector('#timer');
  if (el) el.hidden = true;
  paintTimerBtn();
}

function modoHint(m) { return m === 'papel' ? 'Lo escribes a mano, como el examen real. Al acabar subes una foto de cada ejercicio y se corrige igual.' : 'Escribes y ejecutas el código aquí, con el editor.'; }
function sw(key, title, desc) {

function qrow(q) {
  const s = statOf(q.id);
  return '<button class="qrow" data-q="' + q.id + '"><span><span class="t">' + esc(q.title) + '</span><span class="o">UT' + utOf(q) + ' · ' + esc(q.origen) + '</span></span>' + lvl(q.level) + '<span class="nota-mini ' + (s ? notaCls(s.best) : '') + '">' + (s ? fmtN(s.best, 1) : '—') + '</span></button>';

function bankList(filter) {
  const f = CE.norm(filter || '').trim();
  const out = [];
  for (const [k, t] of Object.entries(CE.TEMAS)) {
    const qs = CE.BANK.filter(q => q.tema === k && (!f || CE.norm(q.title + ' ' + q.origen + ' ' + q.statement).includes(f)));
    if (!qs.length) continue;
    out.push('<div class="tema-grupo"><h3>' + t.nombre + ' <span>' + t.corto + '</span></h3><div class="qlist">' + qs.map(qrow).join('') + '</div></div>');
  }
  return out.join('') || '<div class="empty">No hay ejercicios con ese texto.</div>';
}
function pickQuestions(n, temas) {
  const pool = CE.BANK.filter(q => temas.includes(q.tema) && D.settings.uts.includes(utOf(q)));
  let groups = temas.map(t => shuffle(pool.filter(q => q.tema === t)).sort((a, b) => ((statOf(a.id) || {}).n || 0) - ((statOf(b.id) || {}).n || 0)));
  // Máximo de preguntas de un tema por examen según la variante (UT3: como mucho una de clases y objetos,
  // y solo en la mitad de los exámenes, salvo que no haya más temas elegidos)
  const maxT = CE.VAR.maxTema || {};
  const hayOtros = i => groups.some((g, j) => j !== i && maxT[temas[j]] == null && g.length);
  groups = groups.map((g, i) => maxT[temas[i]] == null ? g : g.slice(0, hayOtros(i) && Math.random() < 0.5 ? 0 : maxT[temas[i]]));
  const picked = [];
  let gi = Math.floor(Math.random() * groups.length);
  while (picked.length < Math.min(n, pool.length)) {
    const g = groups[gi % groups.length];
    if (g.length) picked.push(g.shift());
    gi++;
    if (groups.every(x => !x.length)) break;
  }
  return picked.sort((a, b) => a.level - b.level).map(q => q.id);
}
function startExam(ids) {
  const qids = ids && ids.length ? shuffle(ids).slice(0, 10) : pickQuestions(D.settings.n, D.settings.temas);
  if (!qids.length) return;
  if (D.settings.modo === 'papel') { startPaper(qids); return; }

    D.exam = { id: 'e' + Date.now(), qids, codes: {}, start: Date.now(), limit: +D.settings.tiempo || 0, verPruebas: !!D.settings.verPruebas, cur: 0 };
    for (const id of qids) D.exam.codes[id] = starter(byId(id));

  if (D.exam) confirmDlg('Ya tienes un examen a medias', 'Si empiezas uno nuevo, el anterior se descarta.', [{ label: 'Cancelar', ghost: true }, { label: 'Empezar uno nuevo', primary: true, value: true }]).then(ok => ok && go2());
  else go2();
}

function saveNow() { if (!W || !W.ed) return; const v = W.ed.getValue(); if (W.mode === 'exam' && D.exam) D.exam.codes[W.q.id] = v; else if (W.mode === 'practice') D.drafts[W.q.id] = v; save(); }
function setupSplitter(root) {
  const sp = root.querySelector('#splitter'), ide = root.querySelector('#ide');
  let y0 = 0, h0 = 0;
  const panel = () => ide.querySelector('.panel');
  const move = ev => { const h = Math.max(120, Math.min(ide.clientHeight - 160, h0 - (ev.clientY - y0))); ide.style.setProperty('--panel-h', h + 'px'); D.settings.panelH = h; };
  sp.addEventListener('pointerdown', ev => { y0 = ev.clientY; h0 = panel().offsetHeight; sp.classList.add('drag'); sp.setPointerCapture(ev.pointerId); sp.addEventListener('pointermove', move); });
  sp.addEventListener('pointerup', ev => { sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); saveSoon(); W && W.ed && W.ed.refresh(); });
  sp.addEventListener('keydown', ev => { if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') { ev.preventDefault(); const h = Math.max(120, panel().offsetHeight + (ev.key === 'ArrowUp' ? 24 : -24)); ide.style.setProperty('--panel-h', h + 'px'); D.settings.panelH = h; saveSoon(); } });
}
function paintDots() {
  if (!D.exam || !W) return;
  for (const id of D.exam.qids) {
    const el = W.root.querySelector('[data-dot="' + id + '"]');
    if (!el) continue;
    const c = D.exam.codes[id];
    let cls = '';
    if (!isTrivial(c)) { const a = id === W.q.id && W.analysis ? W.analysis : CE.analyze(CE.withGiven(byId(id), c)); cls = a.ok ? 'listo' : 'empezado'; }
    el.className = 'dot ' + cls;
  }
}

/* ---------- análisis en vivo ---------- */
function analyzeNow() {
  if (!W || !W.ed) return;
  const src = W.ed.getValue();
  const a = CE.analyze(CE.withGiven(W.q, src));
  W.analysis = a;
  let diags = a.diags.slice();
  if (a.syntax) {
    const errLine = CE.lineCol(src, a.syntax.s).line;
    for (const c of CE.spellCandidates(src)) {
      if (CE.lineCol(src, c.s).line > errLine) continue;
      if (diags.some(d => d.s === c.s)) continue;
      diags.push({ sev: 'error', spell: true, s: c.s, e: c.e, msg: c.msg, fix: c.fix, code: 'kw-spell' });
    }
  }
  diags.sort((x, y) => x.s - y.s);
  W.diags = diags;
  W.ed.setDiagnostics(diags);
  const errs = diags.filter(d => d.sev === 'error');
  const spells = errs.filter(d => d.spell);
  const warns = diags.filter(d => d.sev === 'warn');
  const st = W.root.querySelector('#status');
  if (isTrivial(src)) { st.className = 'pill'; st.textContent = 'Sin empezar'; }
  else if (!errs.length) { st.className = 'pill ' + (warns.length ? 'warn' : 'ok'); st.innerHTML = IC.check.replace('<svg', '<svg width="12" height="12"') + ' Compila' + (warns.length ? ' · ' + warns.length + ' aviso' + (warns.length > 1 ? 's' : '') : ''); }
  else if (spells.length === errs.length) { st.className = 'pill spell'; st.textContent = spells.length + ' falta' + (spells.length > 1 ? 's' : '') + ' que se puede' + (spells.length > 1 ? 'n' : '') + ' corregir'; }
  else { st.className = 'pill err'; st.textContent = errs.length + ' error' + (errs.length > 1 ? 'es' : ''); }
  const pn = W.root.querySelector('#probN');
  pn.textContent = diags.length;
  pn.className = 'badge-n ' + (errs.length > spells.length ? 'e' : spells.length ? 's' : '');
  if (W.tab === 'problems') renderProblems();
  if (W.mode === 'exam') paintDots();
}

  else if (tab === 'tests') renderTestsIntro();
  else if (tab === 'grade') renderGradeTab();
  else if (tab === 'solution') renderSolutionTab();
}
function consoleView() {
  const el = document.createElement('div');
  el.className = 'console';
  el.setAttribute('role', 'log');
  el.setAttribute('aria-live', 'polite');
  const v = {
    el,
    clear() { el.innerHTML = ''; },
    empty() { el.innerHTML = '<span class="vacio">Pulsa <b>Ejecutar</b> (o <kbd>Ctrl</kbd> + <kbd>Enter</kbd>) para lanzar tu programa. Cuando pida un dato, escríbelo aquí y pulsa Enter.</span>'; },
    text(s, cls) {
      if (!s) return;
      if (el.querySelector('.vacio')) el.innerHTML = '';
      const lines = s.split(/(?<=\n)/);
      for (const ln of lines) {
        const isExc = /^(Exception in thread|\tat |Caused by)/.test(ln);
        const span = document.createElement('span');
        if (cls || isExc) span.className = cls || 'exc';
        span.textContent = ln;
        el.appendChild(span);
      }
      v.scroll();
    },
    html(h) { if (el.querySelector('.vacio')) el.innerHTML = ''; const d = document.createElement('span'); d.innerHTML = h; el.appendChild(d); v.scroll(); },
    note(h) { const d = document.createElement('span'); d.className = 'note'; d.innerHTML = h; el.appendChild(d); v.scroll(); },
    actions(btns) {
      const d = document.createElement('div'); d.className = 'acts';
      for (const b of btns.filter(Boolean)) { const x = document.createElement('button'); x.className = 'btn btn--sm ' + (b.primary ? 'btn--primary' : ''); x.textContent = b.label; x.onclick = b.onClick; d.appendChild(x); }
      el.appendChild(d); v.scroll();
    },
    prompt(onEnter) {
      const inp = document.createElement('input');
      inp.className = 'stdin';
      inp.setAttribute('aria-label', 'Escribe el dato que pide el programa y pulsa Enter');
      inp.spellcheck = false;
      inp.autocomplete = 'off';
      el.appendChild(inp);
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); const val = inp.value; inp.remove(); v.text(val + '\n', 'in'); onEnter(val); }
        if (ev.key === 'Escape') { ev.preventDefault(); W.ed.focus(); }
        if ((ev.ctrlKey || ev.metaKey) && ev.key === 'c' && !inp.value) { ev.preventDefault(); stopRun(); }
      });
      v.scroll();
      inp.focus({ preventScroll: true });
      setTimeout(() => { if (inp.isConnected && document.activeElement !== inp) inp.focus({ preventScroll: true }); }, 30);
      return inp;
    },
    scroll() { const p = el.parentElement; if (p) p.scrollTop = p.scrollHeight; }
  };
  v.empty();
  return v;
}
function stopRun(silent) {
  if (!W) return;
  const inp = W.con.el.querySelector('input.stdin');
  if (inp) inp.remove();
  if (W.session && !W.session.done && !silent) W.con.text('\nPrograma detenido.\n', 'warn');
  W.session = null;
  W.root.querySelector('#stopBtn').hidden = true;
}
function linesOf(src) { return src.split('\n'); }
function compileReport(src, a) {
  const L = linesOf(src);
  const errs = (W.diags || a.diags).filter(d => d.sev === 'error');
  for (const d of errs.slice(0, 8)) {
    const lc = CE.lineCol(src, d.s);
    W.con.text('Ejercicio.java:' + lc.line + ': error: ' + d.msg + '\n', 'cerr');
    const line = L[lc.line - 1] || '';
    W.con.text('    ' + line.replace(/\t/g, '    ') + '\n', 'cline');
    W.con.text('    ' + ' '.repeat(Math.max(0, lc.col - 1)) + '^\n', 'cerr');
  }
  if (errs.length > 8) W.con.text('… y ' + (errs.length - 8) + ' errores más\n', 'cerr');
  W.con.text(errs.length + (errs.length === 1 ? ' error' : ' errores') + '\n', 'cerr');
}
function runCode() {
  if (!W) return;
  saveNow();
  analyzeNow();
  const src = W.ed.getValue();
  const a = W.analysis;
  showTab('console');
  stopRun(true);
  W.con.clear();
  W.con.text('run:\n', 'run');
  if (isTrivial(src) && !src.trim()) { W.con.text('El editor está vacío.\n', 'warn'); return; }
  const errs = (W.diags || []).filter(d => d.sev === 'error');
  if (errs.length) {
    compileReport(src, a);
    const fx = CE.autoFix(CE.withGiven(W.q, src));
    const tolerableOnly = a.P && !a.syntax && errs.every(d => d.tolerable);
    W.con.text('BUILD FAILED\n', 'exc');
    W.con.actions([
      fx.runnable && fx.fixes.length ? { label: 'Corregir ' + fx.fixes.length + (fx.fixes.length > 1 ? ' faltas' : ' falta') + ' y ejecutar', primary: true, onClick: () => { W.ed.replaceAll(fx.src); analyzeNow(); flash(fixSummary(fx.fixes)); runCode(); } } : null,
      tolerableOnly ? { label: 'Ejecutar igualmente', onClick: () => startSession(a.P, true) } : null,
      { label: 'Ver problemas', onClick: () => showTab('problems') }
    ]);
    if (tolerableOnly) W.con.note('Java no compilaría este código, pero el simulador puede ejecutarlo para que veas qué hace. En el examen real tendrías que arreglarlo.');
    return;
  }
  startSession(a.P);
}
function startSession(P, benevolo) {
  const s = new CE.Session(P, {});
  W.session = s;
  W.root.querySelector('#stopBtn').hidden = false;
  if (benevolo) { W.con.clear(); W.con.text('run (modo benevolente):\n', 'run'); }
  stepSession(s, s.step());
}
function stepSession(s, r) {
  if (!W || W.session !== s) return;
  W.con.text(r.out);
  if (r.status === 'input') { W.con.prompt(val => { if (W && W.session === s) stepSession(s, s.send(val)); }); return; }
  W.root.querySelector('#stopBtn').hidden = true;
  W.session = null;
  const res = r.res;
  if (r.status === 'done') W.con.text('\nBUILD SUCCESSFUL (total time: 0 seconds)\n', 'ok');
  else if (r.status === 'exception') W.con.text('\nBUILD FAILED (el programa ha terminado con una excepción)\n', 'exc');
  else if (r.status === 'timeout') { W.con.text('\n', ''); W.con.note('<b>El programa no termina.</b> Ha dado millones de vueltas sin acabar: seguramente es un bucle infinito. Revisa la condición del bucle y que la variable que la controla cambie dentro.'); }
  else if (r.status === 'outlimit') W.con.note('<b>El programa escribe demasiado</b> y se ha parado. ¿Un bucle que no termina?');
  else if (r.status === 'nomain') W.con.note('No hay método <code>main</code>. El programa empieza en <code>public static void main(String[] args)</code>.');
  else if (r.status === 'internal') W.con.note('Error interno del simulador: ' + esc(res.exc && res.exc.message));
  if (res && res.exc && res.exc.jtype) W.con.note(excHelp(res.exc));
  if (res && res.notes && res.notes.includes('punto-decimal')) W.con.note('Has escrito un decimal con <b>punto</b>. Aquí se acepta, pero en NetBeans con Java en español <code>nextDouble()</code> espera <b>coma</b> (2,5) y con punto lanza InputMismatchException.');
  if (res && res.uninit && res.uninit.length) W.con.note('Has usado ' + res.uninit.filter(x => x !== '?').map(x => '<code>' + esc(x) + '</code>').join(', ') + ' sin darle valor antes. Java no compilaría: "variable might not have been initialized". Dale un valor inicial al declararla.');
}
function excHelp(e) {

    InputMismatchException: 'El dato tecleado no es del tipo que se esperaba (por ejemplo, letras en <code>nextInt()</code>).',
    ArithmeticException: 'División entera entre 0. Comprueba el divisor antes de dividir.',
    ArrayIndexOutOfBoundsException: 'Has usado una posición que no existe en el array. Las posiciones van de 0 a <code>length - 1</code>.',
    StringIndexOutOfBoundsException: 'Has usado una posición que no existe en el texto. Van de 0 a <code>length() - 1</code>.',
    NullPointerException: 'Has usado una variable que vale <code>null</code> (todavía no tiene objeto).',
    NumberFormatException: 'El texto no se puede convertir a número.',
    NoSuchElementException: 'El programa ha intentado leer cuando ya no había más datos.',
    IllegalFormatConversionException: 'En el printf, el % no coincide con el tipo del valor: <code>%d</code> es para enteros, <code>%f</code> para decimales y <code>%s</code> para texto.',
    MissingFormatArgumentException: 'En el printf hay más % que valores.',

}
function fixSummary(fixes) {

  return 'Corregido: ' + fixes.slice(0, 3).map(f => 'línea ' + f.line + (f.before && f.after != null && f.before.length < 30 && f.after.length < 30 && f.before ? ' «' + f.before + '» → «' + f.after + '»' : '')).join(', ') + (fixes.length > 3 ? ' y ' + (fixes.length - 3) + ' más' : '');

function runTests() {

/* ============================== examen ============================== */
function startTimer() {
  stopTimer();
  const ex = D.exam;
  const el = W.root.querySelector('#timer');
  if (!ex) return;
  const tick = () => {
    if (!D.exam || screen !== 'exam') { stopTimer(); return; }
    if (ex.limit) {
      const left = ex.start + ex.limit * 60000 - Date.now();
      el.hidden = false;
      const s = Math.max(0, Math.ceil(left / 1000));
      el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      el.className = 'timer' + (s <= 60 ? ' nada' : s <= 300 ? ' poco' : '');
      el.setAttribute('aria-label', 'Tiempo restante ' + Math.floor(s / 60) + ' minutos');
      if (left <= 0) { stopTimer(); submitExam(true); }
    } else {
      el.hidden = false;
      const s = Math.floor((Date.now() - ex.start) / 1000);
      el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      el.className = 'timer';
      el.title = 'Tiempo transcurrido';
    }
  };
  tick();
  timerI = setInterval(tick, 1000);
}
function stopTimer() { clearInterval(timerI); timerI = null; }
function submitExam(auto) {
  saveNow();
  const ex = D.exam;
  if (!ex) return;
  const pending = ex.qids.filter(id => isTrivial(ex.codes[id])).length;
  const finish = () => {
    stopTimer();
    const grades = {};
    const changes = { fallo: 0, superada: 0 };
    for (const id of ex.qids) { grades[id] = CE.grade(byId(id), ex.codes[id] || ''); const c = recordResult(id, grades[id], ex.codes[id] || '', 'examen'); if (c) changes[c]++; }
    const total = ex.qids.reduce((a, id) => a + grades[id].score, 0) / ex.qids.length;
    const entry = { id: ex.id, date: Date.now(), qids: ex.qids, codes: ex.codes, scores: ex.qids.map(id => grades[id].score), total, dur: Date.now() - ex.start };
    D.history.push(entry);
    if (D.history.length > 60) D.history.shift();
    D.exam = null;
    save();
    lastResult = { entry, grades, changes };
    go('results', lastResult);
    if (auto) flash('Se acabó el tiempo: el examen se ha entregado solo.', 5000);
  };
  if (auto) { finish(); return; }
  const left = ex.limit ? ex.start + ex.limit * 60000 - Date.now() : null;
  confirmDlg('¿Entregar el examen?', (pending ? '<b>' + pending + (pending > 1 ? ' preguntas están' : ' pregunta está') + ' sin empezar.</b> ' : 'Has escrito código en todas las preguntas. ') + (left ? 'Te quedan ' + fmtDur(left) + '. ' : '') + 'Después ya no podrás cambiar nada.', [{ label: 'Seguir con el examen', ghost: true }, { label: 'Entregar', primary: true, value: true }]).then(ok => ok && finish());
}
function openHistory(id) {
  const h = D.history.find(x => x.id === id);
  if (!h) return;
  const grades = {};
  for (const qid of h.qids) { const q = byId(qid); if (q) grades[qid] = CE.grade(q, h.codes[qid] || ''); }
  go('results', { entry: h, grades });
}

/* ============================ resultados ============================ */
function gradeSentence(g) {
  if (g.blank) return 'Sin responder.';
  if (!g.runnable && g.tests.length) return 'El código no se ha podido ejecutar, así que solo cuentan los requisitos que se ven en el texto.';
  const t = g.parts[0], r = g.parts[1];
  const bits = [];
  bits.push(t.got >= t.max - 0.01 ? 'Pasa todas las pruebas' : t.got > 0 ? 'Pasa parte de las pruebas (' + fmtN1(t.got) + ' de ' + t.max + ')' : 'No pasa las pruebas');
  bits.push(r.got >= r.max - 0.01 ? 'cumple los requisitos' : 'le faltan requisitos (' + fmtN1(r.got) + ' de ' + r.max + ')');
  if (g.fixes.length) bits.push('se le han corregido ' + g.fixes.length + ' falta' + (g.fixes.length > 1 ? 's' : ''));
  return bits.join(', ') + '.';
}
function codeView(src, changedLines) {
  const hl = CE.highlight(src).split('\n');
  return '<pre class="codeview">' + hl.map((l, i) => '<span class="ln' + (changedLines && changedLines.has(i + 1) ? ' chg' : '') + '">' + (l || ' ') + '</span>').join('') + '</pre>';
}
function changed(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  const set = new Set();
  const n = Math.max(A.length, B.length);
  let off = 0;
  for (let i = 0; i < n; i++) { if (A[i - off] !== B[i]) { set.add(i + 1); if (B.length > A.length && A[i - off] === B[i + 1]) off++; } }
  return set;
}
function qDetail(q, g, code, withCode, fotos) {
  const bars = g.parts.map(p => '<div class="bar-card"><div class="l">' + p.name + '</div><div class="v">' + fmtN1(p.got) + ' <small>/ ' + p.max + '</small></div><div class="meter"><i style="width:' + Math.round(p.got / p.max * 100) + '%"></i></div></div>').join('');
  const reqs = '<ul class="checks">' + g.reqs.map(r => '<li class="' + (r.ok ? 'ok' : 'ko') + '"><span class="m">' + (r.ok ? '✓' : '✗') + '</span>' + esc(r.text) + '</li>').join('') + '</ul>';
  const fixes = g.fixes.length || g.tolerated.length || g.notes.length ? '<div class="sec"><h3>Faltas y avisos</h3><ul class="checks">' +
    g.fixes.map(f => '<li class="fx"><span class="m">~</span><span>Línea ' + f.line + ': ' + esc(f.msg) + (f.before && f.after != null && f.before.length < 40 ? ' <code>' + esc(f.before) + '</code> → <code>' + esc(f.after || '(nada)') + '</code>' : '') + '</span></li>').join('') +
    g.tolerated.map(f => '<li class="nt"><span class="m">!</span><span>Línea ' + f.line + ': ' + esc(f.msg) + ' (Java no lo compilaría; aquí se ha ejecutado igual)</span></li>').join('') +
    g.notes.map(n => '<li class="nt"><span class="m">i</span><span>' + esc(n) + '</span></li>').join('') + '</ul></div>' : '';
  const tests = '<div class="sec"><h3>Pruebas</h3><div class="tests" style="padding:0">' + g.tests.map((r, i) => testHtml(r.test, r, i)).join('') + '</div></div>';
  const codeTabs = withCode ? '<div class="sec"><h3>Código</h3><div class="codetabs" data-codetabs>' + (fotos ? '<button class="btn btn--sm btn--ghost" aria-pressed="false" data-ct="foto">' + IC.image + 'Tu hoja</button>' : '') + '<button class="btn btn--sm" aria-pressed="true" data-ct="mine">' + (fotos ? 'Transcripción' : 'Tu código') + '</button>' + (g.fixes.length ? '<button class="btn btn--sm btn--ghost" data-ct="fixed">Con las faltas corregidas</button>' : '') + '<button class="btn btn--sm btn--ghost" data-ct="ref">Solución</button></div>' +
    (fotos ? '<div data-cv="foto" hidden><div class="fotos-res" data-fotos="' + fotos + '"></div></div>' : '') + '<div data-cv="mine">' + (isTrivial(code) ? '<div class="empty">No escribiste nada en esta pregunta.</div>' : codeView(code)) + '</div>' + (g.fixes.length ? '<div data-cv="fixed" hidden>' + codeView(g.fixedSrc, changed(code, g.fixedSrc)) + '</div>' : '') + '<div data-cv="ref" hidden>' + codeView(q.ref) + '</div></div><div class="explain">' + esc(q.explain) + '</div>' : '';
  return '<div class="bars">' + bars + '</div><div class="sec"><h3>Requisitos</h3>' + reqs + '</div>' + fixes + tests + codeTabs;

/* Fotos en IndexedDB (localStorage se queda corto para imágenes) */
const FOTOS = (() => {
  let dbp = null;
  const mem = new Map();
  const open = () => dbp || (dbp = new Promise(res => {
    try {
      const r = indexedDB.open(CE.VAR.key.replace(/-v1$/, '') + '-fotos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fotos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (mode, fn) => { const db = await open(); if (!db) return fn(null); return new Promise(res => { const t = db.transaction('fotos', mode); const st = t.objectStore('fotos'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => res(null); }); };
  return {
    async get(k) { const db = await open(); if (!db) return mem.get(k) || []; return new Promise(res => { const r = db.transaction('fotos').objectStore('fotos').get(k); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },
    async set(k, v) { mem.set(k, v); return tx('readwrite', st => st && st.put(v, k)); },
    async keys() { const db = await open(); if (!db) return [...mem.keys()]; return new Promise(res => { const r = db.transaction('fotos').objectStore('fotos').getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },
    async del(k) { mem.delete(k); return tx('readwrite', st => st && st.delete(k)); }
  };
})();
const fotoKey = (pid, qid) => pid + ':' + qid;
async function pruneFotos() {
  const keep = new Set(D.history.filter(h => h.paperId).slice(-30).map(h => h.paperId));
  if (D.paper) keep.add(D.paper.id);
  for (const k of await FOTOS.keys()) if (!keep.has(String(k).split(':')[0])) FOTOS.del(k);
}
/* Reduce la foto (máx. 1800 px, JPEG) para que pese poco y se lea bien */
function fileToJpeg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se puede leer la imagen ' + file.name)); };
    img.src = url;
  });
}
function rotateJpeg(data) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalHeight; c.height = img.naturalWidth;
      const x = c.getContext('2d');
      x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2); x.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = data;
  });
}

/* ---------- transcripción con IA (Claude, con la clave del propio usuario) ---------- */
const IA_KEY = 'concep-examen-ut2-ia';
function iaConf() { try { return JSON.parse(localStorage.getItem(IA_KEY)) || null; } catch (e) { return null; } }
function iaSave(v) { try { if (v) localStorage.setItem(IA_KEY, JSON.stringify(v)); else localStorage.removeItem(IA_KEY); } catch (e) { flash('No se ha podido guardar la clave en este navegador.'); } }
const plain = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); };
async function transcribir(q, fotos) {
  const conf = iaConf();
  if (!conf || !conf.key) throw new Error('Falta configurar la clave de la API de Claude.');
  const prompt = 'Estas fotos son las hojas manuscritas de un alumno de 1.º de DAM con su respuesta en Java a este ejercicio de examen:\n' +
    '«' + q.title + '»: ' + plain(q.statement) + '\n\n' +
    'Transcribe EXACTAMENTE el código Java que hay escrito a mano, como haría un escáner. Esto es muy importante, porque después otro programa corrige el código y tiene que corregir lo que escribió el alumno:\n' +
    '- No corrijas nada: deja los ; que falten, las llaves o paréntesis que no cierren, las palabras mal escritas (Sytem, pubic, nextint…), las mayúsculas y la lógica tal como están.\n' +
    '- No añadas nada que no esté escrito (ni imports, ni la clase, ni el main, ni comentarios).\n' +
    '- Respeta los saltos de línea. La sangría puede ser aproximada.\n' +
    '- Lo que esté tachado no se copia. Si hay flechas o añadidos al margen, colócalos donde indiquen.\n' +
    '- Si una parte no se puede leer, pon /*?*/ en su lugar.\n' +
    '- Si en las hojas hay más de un ejercicio, copia solo el que corresponde a este enunciado.\n' +
    'Responde solo con el código, sin explicaciones y sin bloques ```.';
  const content = fotos.map(f => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: f.split(',')[1] } }));
  content.push({ type: 'text', text: prompt });
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': conf.key,
        'anthropic-version': '2026-10-21',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: 'claude-opus-5-5', max_tokens: 16000, output_config: { effort: 'low' }, fallbacks: 'default', messages: [{ role: 'user', content }] })
    });
  } catch (e) { throw new Error('No hay conexión con la API de Claude. Comprueba internet (o transcríbelo a mano).'); }
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok) {
    const m = j && j.error && j.error.message ? j.error.message : '';
    if (r.status === 401) throw new Error('La clave de la API no es válida. Revísala en «Transcripción con IA».');
    if (r.status === 403) throw new Error('Tu clave no tiene permiso para usar este modelo. ' + m);
    if (r.status === 429) throw new Error('Demasiadas peticiones seguidas o sin saldo en tu cuenta. Espera un poco. ' + m);
    if (r.status === 413) throw new Error('Las fotos pesan demasiado. Quita alguna o haz fotos más pequeñas.');
    if (r.status >= 500) throw new Error('El servicio de Claude no responde ahora mismo (' + r.status + '). Prueba en un rato.');
    throw new Error('La API ha devuelto un error (' + r.status + '): ' + m);
  }
  if (j.stop_reason === 'refusal') throw new Error('Claude no ha podido transcribir estas fotos. Transcríbelo a mano.');
  let text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
  text = text.replace(/^```[a-zA-Z]*\s*\n?/, '').replace(/\n?```\s*$/, '');
  if (j.stop_reason === 'max_tokens') flash('La transcripción puede estar cortada al final: revísala.');
  return text;
}

}
function verFoto(list, i) {
  dlg.innerHTML = '<div class="visor"><img src="' + list[i] + '" alt="Foto ' + (i + 1) + '"><div class="acts">' + (list.length > 1 ? '<button class="btn btn--sm" data-v="-1">Anterior</button><button class="btn btn--sm" data-v="1">Siguiente</button>' : '') + '<button class="btn btn--sm btn--primary" data-v="x">Cerrar</button></div></div>';
  dlg.classList.add('dlg--visor');
  dlg.onclick = ev => {
    const b = ev.target.closest('[data-v]');
    if (b && b.dataset.v !== 'x') { verFoto(list, (i + +b.dataset.v + list.length) % list.length); return; }
    if (b || ev.target === dlg) { dlg.close(); }
    if (ev.target.tagName === 'IMG') ev.target.classList.toggle('zoom');
  };
  dlg.onclose = () => dlg.classList.remove('dlg--visor');
  if (!dlg.open) dlg.showModal();
}
function gradePaper() {
  const P = D.paper;
  const sinTexto = P.qids.filter(id => !(P.codes[id] || '').trim());
  const fin = () => {
    stopTimer();
    const grades = {}, changes = { fallo: 0, superada: 0 };
    for (const id of P.qids) { grades[id] = CE.grade(byId(id), P.codes[id] || ''); const c = recordResult(id, grades[id], P.codes[id] || '', 'examen en papel'); if (c) changes[c]++; }
    const total = P.qids.reduce((a, id) => a + grades[id].score, 0) / P.qids.length;
    const entry = { id: P.id, date: Date.now(), qids: P.qids, codes: P.codes, scores: P.qids.map(id => grades[id].score), total, dur: (P.ended || Date.now()) - P.start, mode: 'papel', paperId: P.id };
    D.history.push(entry);
    if (D.history.length > 60) D.history.shift();
    D.paper = null;
    save();
    lastResult = { entry, grades, changes };
    go('results', lastResult);
  };
  if (sinTexto.length) confirmDlg('Faltan ejercicios por pasar a texto', sinTexto.map(id => '«' + esc(byId(id).title) + '»').join(', ') + (sinTexto.length > 1 ? ' no tienen' : ' no tiene') + ' transcripción y contará' + (sinTexto.length > 1 ? 'n' : '') + ' como en blanco (0).', [{ label: 'Volver', ghost: true }, { label: 'Corregir igualmente', primary: true, value: true }]).then(ok => ok && fin());
  else confirmDlg('¿Corregir el examen?', 'Revisa que cada transcripción se parece a lo que escribiste en la hoja. Después ya no se puede cambiar.', [{ label: 'Revisar más', ghost: true }, { label: 'Corregir', primary: true, value: true }]).then(ok => ok && fin());
}
async function paintResultFotos(root) {
  for (const box of root.querySelectorAll('[data-fotos]')) {
    const list = await FOTOS.get(box.dataset.fotos);
    box.innerHTML = list.length ? list.map((src, i) => '<img src="' + src + '" alt="Foto ' + (i + 1) + ' de tu hoja" data-vf="' + i + '">').join('') : '<div class="empty">Las fotos de este examen ya no están guardadas en este navegador.</div>';
    box.onclick = ev => { const im = ev.target.closest('[data-vf]'); if (im) verFoto(list, +im.dataset.vf); };
  }
}

/* ============================ arranque ============================ */
applyTheme();
go('home');
CE.app = { go, get D() { return D; }, get W() { return W; } };
})(window.CE);

</script>
