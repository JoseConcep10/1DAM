/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== Creador de examen UT1 · Programación — sobre los tokens de ConcepDesign ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  --lh-code: 21px;
}
.concep-dark {
  --text-3: #8A8A98;
  --syn-kw: #B794FF; --syn-ctl: #FF6FAE; --syn-str: #8EE0B8; --syn-num: #F6C76B; --syn-var: #D4D4DC; --syn-op: #A6A6B3; --syn-com: #8C8C99;
  --ed-bg: #0E0E10; --ed-line: rgba(255,255,255,.035); --gutter: #8A8A98; --gutter-on: #E6E6EC; --line-err: rgba(255, 46, 147, .14);
  --sel: rgba(122, 34, 255, .38);
  --ok-bg: rgba(52, 211, 153, .1); --warn-bg: rgba(251, 191, 36, .1); --err-bg: rgba(255, 46, 147, .1); --info-bg: rgba(122, 34, 255, .14);
  --s-gray-f: #1B1B20; --s-gray-s: #A6A6B3; --s-teal-f: #0F2D26; --s-teal-s: #5FD9AE; --s-purple-f: #261A44; --s-purple-s: #B794FF; --s-coral-f: #3A1426; --s-coral-s: #FF6FAE;
  --edge: #B8B8C4; --grid: rgba(255,255,255,.09); --canvas: #0E0E10;
  --tone-teoria: #7DA2FF; --tone-pseudo: #B794FF; --tone-dfd: #8EE0B8;
}
.concep {
  --text-3: #636371;
  --syn-kw: #6A1FE0; --syn-ctl: #C8006A; --syn-str: #0B7A55; --syn-num: #8F5400; --syn-var: #2A2A33; --syn-op: #4E4E5A; --syn-com: #6B6B78;
  --ed-bg: #FFFFFF; --ed-line: rgba(11,11,12,.04); --gutter: #6B6B7E; --gutter-on: #0B0B0C; --line-err: rgba(224, 17, 95, .1);
  --sel: rgba(122, 34, 255, .2);
  --ok-bg: rgba(14, 159, 110, .09); --warn-bg: rgba(194, 120, 3, .1); --err-bg: rgba(224, 17, 95, .08); --info-bg: rgba(122, 34, 255, .08);
  --s-gray-f: #F1F1F5; --s-gray-s: #5A5A68; --s-teal-f: #E2F5EE; --s-teal-s: #0B7A55; --s-purple-f: #EFE7FF; --s-purple-s: #6A1FE0; --s-coral-f: #FFE7F1; --s-coral-s: #C8006A;
  --edge: #4E4E5A; --grid: rgba(11,11,12,.12); --canvas: #FBFBFD;
  --tone-teoria: #0040CC; --tone-pseudo: #5B17C4; --tone-dfd: #066847;
}
.concep, .concep-dark { --err: var(--error); --link: var(--accent-text); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); }
#app { height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app h1, #app h2, #app h3, #app h4, #app h5 { font-family: var(--f-titulo); }
h1, h2, h3, h4, h5, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
::selection { background: var(--sel); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 500 11px var(--f-ui); padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; color: var(--text-2); background: var(--surface); }
code { font-family: var(--f-ui); font-size: .92em; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
svg.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.concep-dark ::-webkit-scrollbar, .concep ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }
.concep ::-webkit-scrollbar-thumb { background: rgba(11,11,12,.2); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }
::-webkit-scrollbar-corner, ::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled, .btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--c-gradiente); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 6px 22px -10px rgba(122, 34, 255, .75); }
.btn--primary:hover { background: var(--c-gradiente); box-shadow: 0 8px 26px -8px rgba(255, 0, 122, .55); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { background: transparent; border-color: color-mix(in srgb, var(--error) 45%, transparent); color: var(--error); }
.btn--danger:hover { background: var(--err-bg); }
.btn--sm { min-height: 30px; padding: 0 11px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.btn--block { width: 100%; }
.icon-btn { width: 36px; padding: 0; }
.icon-btn.btn--sm { width: 30px; }
label.btn { cursor: pointer; }
label.btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- estructura y barra superior ---------- */
.shell { display: flex; flex-direction: column; height: 100%; }
.top { flex: none; position: relative; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; border-radius: 8px; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.top .grow { flex: 1; min-width: 0; }
.top .meta, .top .cta, .top .acc { display: flex; align-items: center; gap: 8px; }
.pal-btn kbd { margin-left: 2px; font-size: 10.5px; padding: 0 5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); color: var(--text-2); background: transparent; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-bg); }
.pill.err { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: var(--err-bg); }
.subbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--bg); }
.qtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; flex: 1; min-width: 0; }
.qtabs::-webkit-scrollbar { display: none; }
.qtab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font: 500 12px var(--f-ui); white-space: nowrap; }
.qtab:hover { background: var(--surface); color: var(--text); }
.qtab[aria-current="true"] { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.qtab[aria-current="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--c-gradiente-h); }
.qtab .mark { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-strong); color: #fff; }
.qtab .mark.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.qtab .mark svg { width: 11px; height: 11px; stroke-width: 2.2; }
.qtab .qp { font-variant-numeric: tabular-nums; color: var(--text-3); }
.qnav { display: flex; gap: 2px; flex: none; }
.view { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }

/* iconos de modo y estados */
.mi { display: inline-grid; place-items: center; flex: none; }
.mi svg.ic { width: 15px; height: 15px; }
.mi-teoria { color: var(--tone-teoria); } .mi-pseudo { color: var(--tone-pseudo); } .mi-dfd { color: var(--tone-dfd); }
.st { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.st.ok { background: var(--ok); } .st.half { background: var(--warn); } .st.bad { background: var(--error); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.chip.k-teoria { color: var(--tone-teoria); background: color-mix(in srgb, var(--tone-teoria) 12%, transparent); border-color: color-mix(in srgb, var(--tone-teoria) 30%, transparent); }
.chip.k-pseudo { color: var(--tone-pseudo); background: color-mix(in srgb, var(--tone-pseudo) 12%, transparent); border-color: color-mix(in srgb, var(--tone-pseudo) 30%, transparent); }
.chip.k-dfd { color: var(--tone-dfd); background: color-mix(in srgb, var(--tone-dfd) 12%, transparent); border-color: color-mix(in srgb, var(--tone-dfd) 30%, transparent); }
.chip.ok { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.chip.half { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.chip.bad { color: var(--error); background: var(--err-bg); border-color: color-mix(in srgb, var(--error) 35%, transparent); }
.hint { color: var(--text-3); font-size: 12px; }
.muted { color: var(--text-2); }

/* ---------- inicio ---------- */
.home { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; display: grid; gap: 28px; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; padding: 8px 0 4px; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 60ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 100%; background: radial-gradient(closest-side, rgba(122, 34, 255, .22), transparent 70%); pointer-events: none; filter: blur(10px); z-index: 0; }
.concep .hero .halo { opacity: .55; }
.hero > div { position: relative; }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { min-width: 112px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .v.c-grad-text { color: transparent; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 18px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--c-morado) 45%, transparent); background: var(--info-bg); }
.resume .txt { flex: 1; min-width: 220px; font-family: var(--f-prosa); font-size: 13.5px; color: var(--text-2); line-height: 1.5; }
.resume .txt b { color: var(--text); font-family: var(--f-titulo); font-weight: 600; }
.home-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.side-stack { display: grid; gap: 20px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; min-width: 0; }
.card--accent { position: relative; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-2); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .grow { flex: 1; }
.count-pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
.start-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.empty { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-2); font: 400 13px/1.55 var(--f-prosa); }
.empty svg.ic { width: 20px; height: 20px; color: var(--warn); margin-top: 1px; }
.frows, .rlist, .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.frows { max-height: 260px; overflow-y: auto; }
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 4px 6px 4px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.frow .ft { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.frow .fc { color: var(--text-2); font-variant-numeric: tabular-nums; }
.qlist { display: grid; gap: 6px; }
.real-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); text-align: left; font-size: 12.5px; }
.real-row:hover { border-color: color-mix(in srgb, var(--c-morado) 55%, transparent); background: var(--surface-2); }
.real-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--info-bg); color: var(--accent-text); font-size: 12px; font-weight: 600; }
.real-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.real-p { color: var(--text-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.rrow .nota { text-align: center; font: 600 15px var(--f-titulo); font-variant-numeric: tabular-nums; padding: 3px 0; border-radius: 8px; }
.rrow .nota.ok { color: var(--ok); background: var(--ok-bg); } .rrow .nota.bad { color: var(--error); background: var(--err-bg); }
.rrow .rt { display: grid; min-width: 0; }
.rrow .rm { color: var(--text-2); font-size: 12px; }
.more { margin-top: 8px; }
.more summary { display: flex; align-items: center; gap: 6px; height: 32px; cursor: pointer; list-style: none; color: var(--text-2); font-size: 12px; }
.more summary::-webkit-details-marker, details.help summary::-webkit-details-marker, .ojo summary::-webkit-details-marker { display: none; }
.more summary:hover { color: var(--text); }
.more summary svg.ic, details.help summary svg.ic { transition: transform .12s; }
.more[open] summary svg.ic, details.help[open] summary > svg.ic:first-child { transform: rotate(90deg); }
.more .rlist { margin-top: 6px; }
.spark { position: relative; display: flex; align-items: flex-end; gap: 4px; padding: 14px 14px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); height: 128px; }
.spark span { flex: 1; min-width: 6px; border-radius: 4px 4px 0 0; background: var(--ok); opacity: .9; }
.spark span.f { background: var(--error); }
.spark .aprobado { position: absolute; left: 14px; right: 14px; bottom: calc(10px + (100% - 24px) * .5); border-top: 1px dashed var(--text-3); }
.tip { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 8px 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.tip:first-child { border-left: 3px solid var(--error); }
.tip-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 700; }
.tip:first-child .tip-n { background: var(--err-bg); color: var(--error); }
.tip-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.tip-h b { color: var(--text); font: 600 13.5px var(--f-titulo); }
.tip-c { font-size: 11.5px; color: var(--text-3); }
.tip-t { margin-top: 4px; font: 400 13px/1.55 var(--f-prosa); color: var(--text-2); }
.tip-e { margin-top: 4px; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip-foot { margin-top: 10px; font-family: var(--f-prosa); }
.walk { display: grid; gap: 8px; }
.walk-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); }
.walk-item .n { min-width: 36px; height: 26px; padding: 0 4px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); font-size: 11px; color: var(--text); white-space: nowrap; }
.walk-item b { font: 600 13px var(--f-titulo); color: var(--text); display: block; }
.walk-item small { color: var(--text-2); font-size: 12px; }

/* ---------- pregunta ---------- */
.q-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 1240px; min-height: 100%; margin: 0 auto; padding: 24px 24px 32px; }
.q-doc { padding: 0; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; margin-bottom: 10px; }
.q-meta .qn { color: var(--text); font-weight: 600; }
.q-doc h2 { font: 600 22px/1.2 var(--f-titulo); letter-spacing: -.02em; color: var(--text); margin: 0; }
.q-doc .stmt { margin-top: 8px; font: 400 14.5px/1.65 var(--f-prosa); color: var(--text); max-width: 100ch; }
.q-doc .note { margin-top: 6px; color: var(--text-2); font: 400 13px/1.55 var(--f-prosa); }
.ojo { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); max-width: 100ch; }
.ojo summary { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; cursor: pointer; list-style: none; color: var(--text-2); font-size: 12px; }
.ojo summary svg.ic { color: var(--warn); }
.ojo summary .n { color: var(--text-3); }
.side-tips { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 10px; }
.side-tips li { font: 400 12.5px/1.5 var(--f-prosa); color: var(--text-2); }
.side-tips b { display: block; color: var(--text); font: 600 12.5px var(--f-titulo); }
.q-body { flex: 1; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 16px; background: var(--ed-bg); overflow: hidden; }
.q-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* editor de código con resaltado */
.code-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.code-toolbar .lbl { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin: 0 4px 0 10px; }
.code-toolbar .lbl:first-child { margin-left: 0; }
.code-toolbar .grow { flex: 1; }
.code-toolbar .cursor { color: var(--text-3); font-size: 11.5px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.sym { min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; font: 13px var(--f-ui); color: var(--text); }
.sym:hover { background: var(--surface-2); border-color: var(--border-strong); }
.sym.word { font-size: 11.5px; color: var(--syn-ctl); }
.code-scroll { height: clamp(320px, calc(100dvh - 500px), 900px); overflow: auto; display: flex; background: var(--ed-bg); font: 14px/21px var(--f-ui); }
.gutter { position: sticky; left: 0; z-index: 2; flex: none; min-width: 56px; padding: 8px 18px 40px 8px; text-align: right; color: var(--gutter); background: var(--ed-bg); user-select: none; }
.gutter div { height: 21px; }
.gutter div.cur { color: var(--gutter-on); }
.gutter div.err { color: var(--error); }
.code-layer { position: relative; flex: 1; min-width: 0; }
.code-hl { margin: 0; padding: 8px 24px 40px 4px; font: inherit; white-space: pre; color: var(--syn-op); pointer-events: none; min-width: max-content; }
.code-hl .cl { height: 21px; }
.code-hl .cl.err { background: var(--line-err); text-decoration: wavy underline var(--error) 1px; text-underline-offset: 4px; }
.code-hl .kw, .code-view .kw { color: var(--syn-kw); } .code-hl .ct, .code-view .ct { color: var(--syn-ctl); } .code-hl .s, .code-view .s { color: var(--syn-str); } .code-hl .n, .code-view .n { color: var(--syn-num); } .code-hl .v, .code-view .v { color: var(--syn-var); } .code-hl .c, .code-view .c { color: var(--syn-com); font-style: italic; }
.code-ta { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 8px 24px 40px 4px; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--text); font: inherit; white-space: pre; tab-size: 2; }
.code-ta::placeholder { color: var(--text-3); }
.code-ta::selection { background: var(--sel); color: transparent; }
.code-scroll:focus-within { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--focus) 55%, transparent); }
.prose { flex: 1; display: block; width: 100%; height: clamp(320px, calc(100dvh - 420px), 900px); padding: 18px 22px; border: 0; outline: none; resize: none; background: var(--ed-bg); color: var(--text); font: 14px/1.7 var(--f-ui); }
.prose:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--focus) 55%, transparent); border-radius: 0; }
.prose::placeholder { color: var(--text-3); }
.dfd-host { height: clamp(440px, calc(100dvh - 500px), 900px); }

/* panel de problemas */
.panel { flex: none; border-top: 1px solid var(--border); background: var(--surface); }
.panel-tabs { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); }
.panel-tabs .on { color: var(--text); font-weight: 600; }
.panel-tabs .pc { text-transform: none; letter-spacing: 0; color: var(--text-2); }
.panel-tabs .grow { flex: 1; }
.panel-tabs .pt { color: var(--text-3); }
.panel-body { max-height: 180px; overflow: auto; padding: 0 0 8px; font-size: 13px; }
.prob { display: flex; align-items: flex-start; gap: 8px; padding: 3px 16px; line-height: 20px; font-family: var(--f-prosa); }
.prob:hover { background: var(--surface-2); }
.prob svg.ic { margin-top: 2px; }
.prob .loc { color: var(--text-3); margin-left: 6px; white-space: nowrap; font-family: var(--f-ui); font-size: 12px; }
.prob.err svg { color: var(--error); } .prob.ok svg { color: var(--ok); } .prob.warn svg { color: var(--warn); } .prob.info svg { color: var(--accent-text); }
.prob[data-line] { cursor: pointer; }
details.help { border-top: 1px solid var(--border); background: var(--surface); }
details.help summary { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 16px; cursor: pointer; list-style: none; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
details.help summary:hover { color: var(--text); }
.help-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px 24px; padding: 6px 18px 18px; font: 400 12.5px/1.55 var(--f-prosa); color: var(--text-2); }
.help-body h4 { font: 600 12px var(--f-titulo); color: var(--text); margin-bottom: 4px; }
.help-body pre { margin: 0; padding: 10px 12px; background: var(--ed-bg); border: 1px solid var(--border); border-radius: 10px; font: 12px/1.5 var(--f-ui); color: var(--text); white-space: pre; overflow-x: auto; }

/* ---------- resultados ---------- */
.report { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
.rep-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding-bottom: 24px; border-bottom: 1px solid var(--border); position: relative; }
.rep-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 96px; height: 3px; border-radius: 3px; background: var(--c-gradiente-h); }
.grade { width: 120px; height: 120px; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 3px solid var(--border-strong); background: var(--surface); }
.grade.pass { border-color: var(--ok); } .grade.fail { border-color: var(--error); }
.grade b { font: 600 38px/1 var(--f-titulo); color: var(--text); font-variant-numeric: tabular-nums; }
.grade span { font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
.rep-head .eyebrow, .real-head .eyebrow { display: flex; align-items: center; gap: 6px; font: 600 11px var(--f-titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
.rep-head h1, .real-head h1 { font: 700 clamp(26px, 3.4vw, 36px)/1.1 var(--f-titulo); letter-spacing: -.03em; color: var(--text); margin-top: 8px; }
.rep-head .lead, .real-head .lead { margin-top: 8px; color: var(--text-2); font: 400 14.5px/1.6 var(--f-prosa); max-width: 80ch; }
.notice { margin-top: 16px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--c-morado) 40%, transparent); border-radius: 12px; background: var(--info-bg); font: 400 13px/1.5 var(--f-prosa); }
.rq { margin-top: 28px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); scroll-margin-top: 12px; overflow: hidden; }
.rq-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.rq-head .kick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; }
.rq-head h3 { font: 600 17px/1.25 var(--f-titulo); letter-spacing: -.015em; color: var(--text); margin-top: 6px; }
.rq-head .stmt { margin-top: 6px; color: var(--text-2); font: 400 13.5px/1.55 var(--f-prosa); max-width: 100ch; }
.pts { text-align: right; }
.pts b { display: block; font: 600 24px/1 var(--f-titulo); color: var(--text); font-variant-numeric: tabular-nums; }
.pts small { color: var(--text-2); font-size: 11.5px; }
.rq-body { padding: 20px 22px 24px; display: grid; gap: 22px; background: var(--bg); min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; }
.cols > * { min-width: 0; }
.rq h4 { font: 600 11px var(--f-titulo); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-bottom: 8px; }
.diag { display: grid; gap: 6px; }
.diag .prob { padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); line-height: 1.45; }
.diag .prob:hover { background: var(--surface); }
.ded-pen { font: 12px var(--f-ui); color: var(--warn); min-width: 42px; }
.explain { padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--c-morado) 35%, transparent); border-radius: 12px; background: var(--info-bg); font: 400 14px/1.65 var(--f-prosa); }
.answer-text { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); white-space: pre-wrap; font: 13px/1.6 var(--f-ui); min-height: 60px; overflow-wrap: anywhere; }
.answer-text.none { color: var(--text-3); font-style: italic; font-family: var(--f-prosa); }
.answer-model { font-family: var(--f-prosa); font-size: 14px; }
.rubric { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rubric li { display: flex; gap: 8px; align-items: center; font: 400 13.5px var(--f-prosa); }
.rubric .y svg { color: var(--ok); } .rubric .n svg { color: var(--error); }
.code-view { margin: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--ed-bg); font: 13px/20px var(--f-ui); overflow-x: auto; padding: 8px 0; color: var(--syn-op); }
.code-view .ln { display: grid; grid-template-columns: 44px minmax(0, 1fr); white-space: pre; width: max-content; min-width: 100%; }
.code-view .ln i { font-style: normal; text-align: right; padding-right: 14px; color: var(--gutter); user-select: none; }
.code-view .ln.err { background: var(--line-err); }
.code-view .ln.err i { color: var(--error); }
.code-view .none { padding: 4px 14px; color: var(--text-3); font-style: italic; font-family: var(--f-prosa); }
.tests-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
.tests { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tests th { text-align: left; font: 600 12px var(--f-titulo); color: #fff; background: var(--th-bg); padding: 10px 12px; }
.tests td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.tests td.io { font-family: var(--f-ui); white-space: pre-wrap; max-width: 380px; }
.tests td.io .scroll { max-height: 110px; overflow: auto; }
.tests .why { color: var(--error); font: 400 12px var(--f-prosa); margin-top: 3px; }
.tests td.res { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tests th.res { text-align: right; }
.tests tr.pass td.res { color: var(--ok); } .tests tr.fail td.res { color: var(--error); } .tests tr.part td.res { color: var(--warn); }
.tests .ninguno, .tests .nada { color: var(--text-3); }
.tests .err-out { color: var(--error); }
.help-inline { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.help-inline .help-in { padding: 0 12px 12px; }

/* ---------- examen real ---------- */
.real-head { padding-bottom: 24px; border-bottom: 1px solid var(--border); position: relative; }
.real-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 96px; height: 3px; border-radius: 3px; background: var(--c-gradiente-h); }
.real-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; color: var(--text-2); font: 400 12.5px var(--f-prosa); }
.rq-body > .real-actions { margin-top: 0; padding-top: 14px; border-top: 1px solid var(--border); }
.real-meta { margin-top: 12px; font: 400 12.5px var(--f-prosa); color: var(--text-3); }
.real-toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 20px; }
.real-toc button { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-align: left; font-size: 12.5px; color: var(--text); }
.real-toc button:hover { border-color: color-mix(in srgb, var(--c-morado) 55%, transparent); background: var(--surface-2); }
.real-toc b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--info-bg); color: var(--accent-text); font-size: 12px; }
.real-toc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.real-toc em { font-style: normal; color: var(--text-2); font-size: 11.5px; }
.real-stmt { padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); white-space: pre-wrap; font: 400 14px/1.65 var(--f-prosa); }
.real-sol { display: grid; gap: 12px; }
.real-sol h5 { margin: 8px 0 0; font: 600 14px var(--f-titulo); color: var(--text); }
.real-sol h5:first-child { margin-top: 0; }
.real-text { white-space: pre-wrap; font: 400 14px/1.65 var(--f-prosa); }
.real-run { margin-top: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
.run-h { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
.real-run pre { margin: 0; padding: 10px 14px; font: 12.5px/1.55 var(--f-ui); color: var(--text); white-space: pre-wrap; max-height: 260px; overflow: auto; }
.real-why { margin: 0; padding-left: 20px; display: grid; gap: 6px; font: 400 14px/1.6 var(--f-prosa); }
.real-dfd { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.real-dfd-only { max-width: 620px; }
.err-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 10px; }
.err-card { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--border)); border-radius: 12px; background: var(--warn-bg); font: 400 13px/1.55 var(--f-prosa); }
.err-card svg.ic { color: var(--warn); margin-top: 2px; }
.page-foot { margin-top: 32px; padding: 16px 0; }

/* pantalla completa del examen real */
.rq-open { cursor: pointer; transition: background-color var(--dur-1); }
.rq-open:hover { background: color-mix(in srgb, var(--c-morado) 10%, var(--surface-2)); }
.rq-head-r { display: flex; align-items: flex-start; gap: 16px; }
.expand-hint { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 12px; color: var(--text-2); opacity: 0; transition: opacity .12s; white-space: nowrap; }
.rq-open:hover .expand-hint, .rq-open:focus-visible .expand-hint { opacity: 1; }
.focus-wrap { position: fixed; inset: 0; z-index: 250; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
.focus-bar { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); flex: none; }
.focus-bar .btn[disabled] { opacity: .3; }
.focus-bar .btn svg { width: 18px; height: 18px; }
.focus-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding: 0 6px; }
.focus-title b { font: 600 14px var(--f-titulo); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus-count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.focus-dots { display: flex; gap: 4px; margin-left: 8px; }
.focus-dots button { width: 28px; height: 28px; border: 1px solid var(--border-strong); border-radius: 50%; background: transparent; color: var(--text-2); font-size: 11.5px; }
.focus-dots button:hover { border-color: var(--c-morado); color: var(--text); }
.focus-dots button.on { background: var(--c-gradiente); border-color: transparent; color: #fff; font-weight: 600; }
.focus-bar .grow { flex: 1; }
.focus-keys { font-size: 12px; color: var(--text-2); white-space: nowrap; margin-right: 6px; }
.focus-keys kbd { margin: 0 1px; }
.focus-body { position: relative; flex: 1; overflow-y: auto; }
.focus-inner { max-width: 1240px; margin: 0 auto; padding: 28px 72px 64px; }
.rq-focus { margin-top: 0; }
.rq-focus .rq-head { padding: 18px 24px; }
.rq-focus .rq-head h3 { font-size: 21px; }
.rq-focus .dfd.dfd-ro { max-height: calc(100vh - 160px); }
.focus-side { position: fixed; top: 50%; transform: translateY(-50%); z-index: 2; display: grid; place-items: center; width: 40px; height: 64px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: var(--text-2); box-shadow: var(--shadow); opacity: .85; }
.focus-side:hover { opacity: 1; color: var(--text); border-color: var(--c-morado); }
.focus-side svg.ic { width: 20px; height: 20px; }
.focus-prev { left: 16px; } .focus-next { right: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .focus-body.in-r .focus-inner { animation: fin-r .18s ease-out; }
  .focus-body.in-l .focus-inner { animation: fin-l .18s ease-out; }
  @keyframes fin-r { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes fin-l { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
}

/* ---------- diálogo, notificación y paleta ---------- */
dialog { width: min(460px, calc(100vw - 32px)); max-width: none; padding: 0; border: 1px solid var(--border-strong); border-radius: 18px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-family: var(--f-ui); }
dialog::backdrop { background: rgba(5, 5, 8, .62); backdrop-filter: blur(4px); }
.dlg { padding: 22px; }
.dlg-h { display: flex; gap: 14px; align-items: flex-start; }
.dlg-h svg.ic { width: 26px; height: 26px; color: var(--accent-text); margin-top: 2px; }
.dlg h2 { margin: 0 0 8px; font: 600 18px var(--f-titulo); letter-spacing: -.015em; color: var(--text); }
.dlg p { margin: 0 0 8px; color: var(--text-2); font: 400 14px/1.6 var(--f-prosa); }
.dlg ul { margin: 6px 0 8px; padding-left: 18px; color: var(--text-2); font: 400 14px/1.6 var(--f-prosa); }
.dlg .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.flash { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 400; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 10px; max-width: min(560px, calc(100vw - 32px)); padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); box-shadow: var(--shadow); font: 400 13px/1.5 var(--f-prosa); transition: opacity var(--dur-2), transform var(--dur-2) var(--ease-out); }
.flash svg.ic { color: var(--accent-text); }
.flash.on { opacity: 1; transform: translate(-50%, 0); }
.palette-wrap { position: fixed; inset: 0; z-index: 300; background: rgba(5, 5, 8, .5); backdrop-filter: blur(3px); font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
.palette { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 32px)); border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.pal-in svg.ic { color: var(--text-2); }
.pal-in input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg); color: var(--text); outline: none; font-size: 13px; }
.pal-in input:focus { border-color: var(--c-morado); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-morado) 28%, transparent); }
.pal-list { list-style: none; margin: 0; padding: 6px 6px 8px; max-height: min(460px, 65vh); overflow-y: auto; }
.pal-group { padding: 10px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.pal-it { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.pal-it svg.ic { color: var(--text-2); }
.pal-it .pl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-it .ph { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.pal-it.on { background: var(--info-bg); color: var(--text); box-shadow: inset 2px 0 0 var(--c-morado); }
.pal-it.on svg.ic { color: var(--accent-text); }
.pal-none { padding: 14px; color: var(--text-2); font-size: 13px; }

/* ---------- editor DFD ---------- */
.dfd { display: grid; grid-template-columns: 112px minmax(0, 1fr) 260px; min-height: 440px; background: var(--canvas); overflow: hidden; }
.dfd.dfd-ro { grid-template-columns: minmax(0, 1fr); height: 420px; min-height: 0; border: 1px solid var(--border); border-radius: 12px; }
.dfd-palette { display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; }
.dfd-pal-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); padding: 2px 6px 6px; }
.pal-item { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 5px; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: grab; font-size: 11.5px; color: var(--text-2); touch-action: none; user-select: none; }
.pal-item:hover { background: var(--surface-2); color: var(--text); }
.pal-item:active { cursor: grabbing; }
.pal-item.on, .pal-item[aria-pressed="true"] { background: var(--info-bg); border-color: var(--focus); color: var(--text); }
.pal-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.pal-ico { width: 56px; height: 28px; overflow: visible; }
.pal-ico * { stroke-width: 1.4; }
.pal-ico.t-inicio *, .pal-ico.t-fin *, .pal-ico.t-proceso *, .pal-ico.t-bucle * { fill: var(--s-gray-f); stroke: var(--s-gray-s); }
.pal-ico.t-io * { fill: var(--s-teal-f); stroke: var(--s-teal-s); }
.pal-ico.t-conector * { fill: var(--canvas); stroke: var(--edge); stroke-width: 1.6; }
.pal-ico.t-si * { fill: var(--s-purple-f); stroke: var(--s-purple-s); }
.pal-ico.t-switch polygon { fill: var(--s-coral-f); stroke: var(--s-coral-s); }
.pal-ico.t-switch path { stroke: var(--s-coral-s); fill: none; }
.pal-arrow .pal-ico path { stroke: var(--edge); stroke-width: 1.6; fill: none; }
.pal-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.6); opacity: .85; }
.dfd-stage { position: relative; min-width: 0; outline: none; background: var(--canvas); }
.dfd-stage:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); border-radius: 0; outline: none; }
.dfd-svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
.dfd-svg.panning { cursor: grabbing; }
.griddot { fill: var(--grid); }
.dfd-toolbar { position: absolute; z-index: 3; top: 10px; left: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: var(--shadow); }
.tb { display: grid; place-items: center; min-width: 30px; height: 28px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--text); font-size: 12px; }
.tb:hover { background: var(--surface-2); }
.tb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tb-text { padding: 0 9px; }
.tb-zoom { min-width: 44px; text-align: center; font: 11.5px var(--f-ui); color: var(--text-2); }
.tb-sep { width: 1px; height: 16px; margin: 0 3px; background: var(--border-strong); }
.dfd-empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; color: var(--text-3); font: 400 13px/1.7 var(--f-prosa); padding: 0 16px; }
.dfd-empty b { color: var(--text-2); }
.dfd-toast { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 6px); opacity: 0; pointer-events: none; padding: 7px 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font: 400 12.5px var(--f-prosa); transition: opacity .15s, transform .15s; white-space: nowrap; }
.dfd-toast.on { opacity: 1; transform: translate(-50%, 0); }
.dfd-inline { position: absolute; z-index: 5; height: 32px; padding: 0 10px; border: 1px solid var(--focus); border-radius: 8px; background: var(--bg); color: var(--text); font: 13px var(--f-ui); box-shadow: var(--shadow); outline: none; }
.node .shape { stroke-width: 1.5; }
.node.t-inicio .shape, .node.t-fin .shape, .node.t-proceso .shape, .node.t-bucle .shape { fill: var(--s-gray-f); stroke: var(--s-gray-s); }
.node.t-io .shape { fill: var(--s-teal-f); stroke: var(--s-teal-s); }
.node.t-si .shape { fill: var(--s-purple-f); stroke: var(--s-purple-s); }
.node.t-switch .shape { fill: var(--s-coral-f); stroke: var(--s-coral-s); }
.rail { fill: none; stroke: var(--s-coral-s); stroke-width: 1.5; }
.node.t-conector .shape { fill: var(--canvas); stroke: var(--edge); stroke-width: 1.7; }
.node.t-inicio .node-text, .node.t-fin .node-text { font-family: var(--f-titulo); font-weight: 600; letter-spacing: .04em; }
.node-text { font: 12.5px var(--f-ui); fill: var(--text); pointer-events: none; }
.node-text.ph { fill: var(--text-3); font-style: italic; font-family: var(--f-prosa); }
.case-label { font: 700 11.5px var(--f-ui); fill: var(--s-coral-s); pointer-events: none; }
.dfd:not(.dfd-ro) .node { cursor: move; }
.node.is-bad .shape { stroke: var(--error); stroke-width: 2.4; stroke-dasharray: 5 3; }
.node.is-src .shape, .node.is-target .shape { stroke: var(--focus); stroke-width: 2.4; }
.sel-box { fill: none; stroke: var(--focus); stroke-width: 1.2; stroke-dasharray: 4 3; pointer-events: none; }
.ports { opacity: 0; transition: opacity .1s; }
.node:hover .ports, .node.is-sel .ports, .connecting .ports { opacity: 1; }
.port { cursor: crosshair; }
.port-hit { fill: transparent; }
.port-dot { fill: var(--canvas); stroke: var(--focus); stroke-width: 1.6; }
.port:hover .port-dot { fill: var(--focus); }
.port.in-only .port-dot { stroke: var(--text-3); }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge-line { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-linejoin: round; pointer-events: none; }
.edge.is-sel .edge-line, .edge:hover .edge-line { stroke: var(--focus); }
.edge.is-sel .edge-line { stroke-width: 2.4; }
.arrhead { fill: var(--edge); }
.arrhead.sel { fill: var(--focus); }
.edge-label { font: 700 11.5px var(--f-ui); fill: var(--text); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.edge-temp { fill: none; stroke: var(--focus); stroke-width: 1.6; stroke-dasharray: 5 4; }
.dfd-props { padding: 14px; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.dfd-props .btn { align-self: flex-start; }
.props-title { font: 600 11px var(--f-titulo); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.props-help { margin: 0; padding-left: 16px; display: grid; gap: 8px; color: var(--text-2); font: 400 12.5px/1.55 var(--f-prosa); }
.props-help b { color: var(--text); font-weight: 600; }
.dotlegend { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid var(--focus); vertical-align: -1px; }
.props-kind { font: 600 13px var(--f-titulo); color: var(--text); display: flex; align-items: center; gap: 8px; }
.props-kind::before { content: ""; width: 18px; height: 11px; border-radius: 2px; border: 1.5px solid var(--s-gray-s); background: var(--s-gray-f); }
.props-kind.t-inicio::before, .props-kind.t-fin::before { border-radius: 6px; }
.props-kind.t-io::before { border-color: var(--s-teal-s); background: var(--s-teal-f); transform: skewX(-20deg); }
.props-kind.t-si::before { width: 12px; height: 12px; border-color: var(--s-purple-s); background: var(--s-purple-f); transform: rotate(45deg) scale(.85); }
.props-kind.t-switch::before { width: 12px; height: 12px; border-color: var(--s-coral-s); background: var(--s-coral-f); transform: rotate(45deg) scale(.85); }
.props-kind.t-bucle::before { clip-path: polygon(22% 0, 78% 0, 100% 50%, 78% 100%, 22% 100%, 0 50%); border: 0; background: var(--s-gray-s); }
.props-kind.t-conector::before { width: 12px; height: 12px; border-radius: 50%; border-color: var(--edge); background: transparent; }
.props-note { color: var(--text-2); font: 400 12.5px/1.5 var(--f-prosa); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 11.5px; color: var(--text-2); }
.field input, .case-row input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg); font: 13px var(--f-ui); color: var(--text); }
.field input:focus, .case-row input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-morado) 28%, transparent); }
.symbar { display: flex; gap: 4px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; align-self: flex-start; background: var(--bg); }
.seg button { height: 30px; padding: 0 14px; border: 0; border-left: 1px solid var(--border-strong); background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--info-bg); color: var(--text); box-shadow: inset 0 -2px 0 var(--c-morado); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--text); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; align-self: flex-start; background: var(--bg); }
.stepper button { width: 32px; height: 30px; border: 0; background: transparent; font-size: 15px; }
.stepper button:hover { background: var(--surface-2); }
.stepper output { min-width: 32px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.cases { display: grid; gap: 6px; }
.case-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.case-row.fixed em { font-style: normal; font: 12px var(--f-ui); color: var(--s-coral-s); }

/* ---------- adaptable ---------- */
@media (max-width: 1100px) {
  .dfd { grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .dfd-props { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--border); max-height: 200px; }
  .home-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) { .focus-keys, .focus-dots { display: none; } .focus-inner { padding: 20px 56px 48px; } }
@media (max-width: 760px) {
  .top { flex-wrap: wrap; gap: 8px 12px; padding: 8px 14px; }
  .top .cta, .top .meta { order: 5; }
  .top .cta { flex: 1 1 100%; flex-wrap: wrap; }
  .top .cta .btn { flex: 1 1 auto; }
  .pal-btn span, .pal-btn kbd { display: none; }
  .pal-btn { width: 36px; padding: 0; }
  .subbar { padding: 8px 14px; }
  .home { padding: 24px 16px 48px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { min-width: 0; }
  .card { padding: 18px; }
  .q-wrap { padding: 18px 16px 28px; }
  .report { padding: 24px 16px 48px; }
  .rep-head { grid-template-columns: 1fr; gap: 18px; }
  .rq-head { grid-template-columns: 1fr; padding: 14px 16px; }
  .rq-body { padding: 16px; }
  .pts { text-align: left; }
  .expand-hint { display: none; }
  .focus-inner { padding: 16px 16px 48px; }
  .focus-side { display: none; }
  .frow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .frow .fc { display: none; }
  .code-toolbar .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.concep { --error: #B80C4B; --ok: #0A7452; --warn: #8F5400; }
.dfd-toolbar { flex-wrap: wrap; max-width: calc(100% - 20px); }
.rq-body, .real-sol { grid-template-columns: minmax(0, 1fr); }
.real-actions .btn { white-space: normal; text-align: left; min-height: 36px; height: auto; padding-block: 8px; }
.q-foot { flex-wrap: wrap; }

<script>
var CE = (function () {
'use strict';

/* ============================================================
   Utilidades
   ============================================================ */
function CEError(kind, msg, line) { const e = new Error(msg); e.kind = kind; e.line = line || null; e.isCE = true; return e; }
const synErr = (m, l) => CEError('syntax', m, l);
const rtErr = (m, l) => CEError('runtime', m, l);

function norm(s) {

}
function fmt(v) {

}
const esc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const IDENT = '[\\p{L}_][\\p{L}\\p{N}_]*';
const identRe = new RegExp('^' + IDENT + '$', 'u');

/* ============================================================
   Expresiones: tokenizador, parser y evaluador
   ============================================================ */
const KW_OPS = new Set(['Y', 'O', 'NO', 'MOD', 'DIV', 'VERDADERO', 'FALSO']);

function tokenize(src, line) {
  const toks = []; let i = 0; const n = src.length;
  const isD = c => /[0-9]/.test(c);
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '"' || c === '“' || c === '”' || c === '«') {
      let j = i + 1, s = '';
      while (j < n && !'"“”»'.includes(src[j])) { s += src[j]; j++; }
      if (j >= n) throw synErr('Falta cerrar las comillas de un texto', line);
      toks.push({ t: 'str', v: s }); i = j + 1; continue;
    }
    if (c === "'" || c === '‘' || c === '’') {
      let j = i + 1, s = '';
      while (j < n && !"'‘’".includes(src[j])) { s += src[j]; j++; }
      if (j >= n) throw synErr('Falta cerrar las comillas simples de un carácter', line);
      toks.push({ t: 'str', v: s }); i = j + 1; continue;
    }
    if (isD(c) || (c === '.' && isD(src[i + 1] || ''))) {

    }

}

function makeParser(toks, line) {
  let p = 0;
  const isOp = v => toks[p] && toks[p].t === 'op' && toks[p].v === v;
  const isKw = v => toks[p] && toks[p].t === 'kw' && toks[p].v === v;

  function andE() { let a = notE(); while (isKw('Y')) { p++; a = { k: 'bin', op: 'Y', a, b: notE() }; } return a; }

    return a;
  }
  function add() {
    let a = mul();
    while (toks[p] && toks[p].t === 'op' && (toks[p].v === '+' || toks[p].v === '-')) { const op = toks[p++].v; a = { k: 'bin', op, a, b: mul() }; }
    return a;
  }

    let a = un();
    for (;;) {
      const t = toks[p];

      } else break;
    }

  }
  function un() {
    if (isOp('-')) { p++; return { k: 'un', op: '-', a: un() }; }
    if (isOp('+')) { p++; return un(); }
    return prim();
  }
  function prim() {
    const t = toks[p++];
    if (!t) throw synErr('La expresión está incompleta', line);
    if (t.t === 'num') return { k: 'num', v: t.v };
    if (t.t === 'str') return { k: 'str', v: t.v };
    if (t.t === 'id') return { k: 'var', name: t.v };
    if (t.t === 'kw' && t.v === 'VERDADERO') return { k: 'bool', v: true };
    if (t.t === 'kw' && t.v === 'FALSO') return { k: 'bool', v: false };
    if (t.t === 'op' && t.v === '(') {
      const e = orE();
      if (!isOp(')')) throw synErr('Falta cerrar un paréntesis', line);
      p++; return e;
    }
    if (t.t === 'op' && t.v === ',') throw synErr('Coma inesperada en la expresión', line);
    throw synErr('No se esperaba «' + t.v + '» en ese punto de la expresión', line);
  }

}

function parseExpr(src, line) {
  const toks = tokenize(src, line);
  if (!toks.length) throw synErr('Falta una expresión o una condición', line);
  const ps = makeParser(toks, line);
  const e = ps.orE();
  if (!ps.atEnd()) {
    const t = ps.cur();
    throw synErr('Sobra «' + t.v + '» en «' + src.trim() + '» (¿falta un operador o una coma?)', line);
  }

}
function parseExprList(src, line) {
  const toks = tokenize(src, line);
  if (!toks.length) throw synErr('Falta lo que quieres mostrar', line);
  const ps = makeParser(toks, line); const items = [];
  for (;;) {
    items.push(ps.orE());
    if (ps.atEnd()) break;
    if (ps.isOp(',')) { ps.skip(); if (ps.atEnd()) throw synErr('Sobra una coma al final', line); continue; }

}

function toNum(v, line) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v))) return Number(v);
  throw rtErr('No se puede hacer una operación numérica con «' + fmt(v) + '»', line);
}
function eq(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 1e-9;
  if (typeof a === 'boolean' || typeof b === 'boolean') return a === b;
  return fmt(a) === fmt(b);
}
function cmpv(a, b, line) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;
  return toNum(a, line) - toNum(b, line);
}
function evalAst(a, env, line) {
  switch (a.k) {
    case 'num': case 'str': case 'bool': return a.v;
    case 'var':
      if (!Object.prototype.hasOwnProperty.call(env.vars, a.name))
        throw rtErr('La variable «' + a.name + '» se usa antes de tener un valor (falta un LEER o una asignación antes)', line);
      return env.vars[a.name];
    case 'un': {
      const v = evalAst(a.a, env, line);
      if (a.op === 'NO') { if (typeof v !== 'boolean') throw rtErr('NO solo se aplica a condiciones', line); return !v; }
      return -toNum(v, line);

    case 'bin': {
      if (a.op === 'Y' || a.op === 'O') {
        const l = evalAst(a.a, env, line);
        if (typeof l !== 'boolean') throw rtErr(a.op + ' necesita condiciones (que sean verdaderas o falsas)', line);
        if (a.op === 'Y' && !l) return false;
        if (a.op === 'O' && l) return true;
        const r = evalAst(a.b, env, line);
        if (typeof r !== 'boolean') throw rtErr(a.op + ' necesita condiciones (que sean verdaderas o falsas)', line);
        return r;
      }
      const l = evalAst(a.a, env, line), r = evalAst(a.b, env, line);
      switch (a.op) {
        case '+': if (typeof l === 'string' || typeof r === 'string') return fmt(l) + fmt(r); return toNum(l, line) + toNum(r, line);
        case '-': return toNum(l, line) - toNum(r, line);
        case '*': return toNum(l, line) * toNum(r, line);
        case '/': { const d = toNum(r, line); if (d === 0) throw rtErr('División entre cero', line); return toNum(l, line) / d; }
        case 'DIV': { const d = toNum(r, line); if (d === 0) throw rtErr('División entre cero', line); return Math.trunc(toNum(l, line) / d); }
        case 'MOD': { const d = toNum(r, line); if (d === 0) throw rtErr('División entre cero', line); const x = toNum(l, line); return ((x % d) + d) % d; }
        case '=': return eq(l, r);
        case '≠': return !eq(l, r);
        case '<': return cmpv(l, r, line) < 0;
        case '>': return cmpv(l, r, line) > 0;
        case '≤': return cmpv(l, r, line) <= 0;
        case '≥': return cmpv(l, r, line) >= 0;

}

function newEnv(inputs) { return { vars: {}, inputs: (inputs || []).slice(), out: [], steps: 0, maxSteps: 60000 }; }
function tick(env, line) {
  if (++env.steps > env.maxSteps) throw rtErr('El programa no termina (¿bucle infinito?). Revisa que la condición del bucle llegue a cumplirse', line);
}
function readInput(env, line) {
  if (!env.inputs.length) throw rtErr('El programa intenta LEER más datos de los que se le han dado', line);
  const v = env.inputs.shift();
  return (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v))) ? Number(v) : v;
}

/* ============================================================
   Instrucciones simples (comunes a pseudocódigo y DFD)
   ============================================================ */
const ASSIGN_RE = new RegExp('^(' + IDENT + ')\\s*(?:←|<-|:=)\\s*(.*)$', 'u');
const BADASSIGN_RE = new RegExp('^' + IDENT + '\\s*=(?!=)', 'u');

function parseSimple(t, n) {
  let m;
  if ((m = /^LEER\s+(.+)$/.exec(t))) {
    const names = m[1].split(',').map(s => s.trim());
    names.forEach(nm => { if (!identRe.test(nm)) throw synErr('«' + nm + '» no es un nombre de variable válido en el LEER', n); });
    return { k: 'read', names, line: n };
  }
  if ((m = /^(MOSTRAR|IMPRIMIR)\s+(.+)$/.exec(t))) return { k: 'show', items: parseExprList(m[2], n), text: m[2], line: n };
  if (/^(LEER|MOSTRAR|IMPRIMIR)$/.test(t)) throw synErr('Después de ' + t + ' falta indicar ' + (t === 'LEER' ? 'la variable que se lee' : 'qué se muestra'), n);
  if ((m = ASSIGN_RE.exec(t))) {
    if (!m[2].trim()) throw synErr('Falta el valor a la derecha de ←', n);
    return { k: 'assign', name: m[1], expr: parseExpr(m[2], n), src: m[2].trim(), line: n };
  }
  if (BADASSIGN_RE.test(t)) throw synErr('Para asignar se usa ← (no =). Ejemplo: suma ← a + b', n);
  return null;
}

const FOR_RE = new RegExp('^PARA\\s+(' + IDENT + ')\\s*(?:←|<-|:=)\\s*(.+?)\\s+HASTA\\s+(.+?)(?:\\s+(INCREMENTANDO|DECREMENTANDO)\\s+EN\\s+(.+?))?(?:\\s+HACER)?\\s*$', 'u');

  const m = FOR_RE.exec(t);
  if (!m) throw synErr('El bucle PARA se escribe: PARA x ← 1 HASTA 10 INCREMENTANDO EN 1', n);
  let step = m[5] ? parseExpr(m[5], n) : { k: 'num', v: 1 };

    header: 'PARA ' + m[1] + ' ← ' + m[2].trim() + ' HASTA ' + m[3].trim() + (m[5] ? ' ' + m[4] + ' EN ' + m[5].trim() : ''), line: n };

/* ============================================================
   Pseudocódigo: parser
   ============================================================ */
const RESERVED = new Set(['PROGRAMA', 'ENTORNO', 'INICIO', 'FIN', 'SI', 'ENTONCES', 'NO', 'EVALUAR', 'VALE', 'EN', 'OTRO', 'CASO',
  'MIENTRAS', 'HACER', 'HASTA', 'QUE', 'PARA', 'INCREMENTANDO', 'DECREMENTANDO', 'LEER', 'MOSTRAR', 'IMPRIMIR', 'Y', 'O', 'MOD', 'DIV']);

function parsePseudo(src, opts) {
  const LEN = !!(opts && opts.lenient), MAP = opts && opts.lineMap;
  const warn = (pen, msg, line, key) => { if (opts && opts.warn) opts.warn({ pen, msg, line, key: key || msg }); };

    const s = t.replace(/\/\/.*$/, '').replace(/\s+/g, ' ').trim();
    if (s) L.push({ n: MAP ? MAP[i] : i + 1, t: s });
  });

  const cur = () => L[i];

  let m = /^PROGRAMA\s+(\S.*?)\s*$/.exec(L[0].t);
  if (!m) throw synErr('La primera línea debe ser PROGRAMA seguido del nombre (por ejemplo: PROGRAMA Sumar)', L[0].n);
  const name = m[1]; i = 1;

  if (!cur() || !/^ENTORNO\s*:/.test(cur().t)) throw synErr('Después de PROGRAMA va la línea ENTORNO: con las variables y su tipo (por ejemplo: ENTORNO: a, b: real)', cur() ? cur().n : L[0].n);
  const vars = {};
  const TYPE_RE = /^(enteros?|reale?s?|dobles?|double|float|flotantes?|decimal(es)?|num[eé]ric[oa]s?|cadenas?|textos?|string|car[aá]cter(es)?|char|booleanos?|l[oó]gic[oa]s?|bool)$/i;
  while (cur() && !/^INICIO\s*:?$/.test(cur().t)) {
    const decls = cur().t.replace(/^ENTORNO\s*:\s*/, '').split(/;|\.(?=\s|$)/).map(s => s.trim()).filter(Boolean);
    for (const t of decls) {
      const k = t.lastIndexOf(':');
      if (k < 0 && !LEN) throw synErr('Cada declaración de ENTORNO lleva «:» y el tipo. Ejemplo: ENTORNO: a, b: real', cur().n);
      const names = (k < 0 ? t : t.slice(0, k)).split(',').map(s => s.trim()).filter(Boolean);
      const desc = k < 0 ? '' : t.slice(k + 1).trim();
      if (!names.length && !LEN) throw synErr('Faltan los nombres de las variables antes de «:»', cur().n);
      const words = desc.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z]+/).filter(Boolean);
      const tw = words.find(w => TYPE_RE.test(w)) || (/entera/.test(desc) ? 'entero' : null);
      if (!desc) { if (!LEN) throw synErr('Falta el tipo de las variables: entero, real, doble, cadena, carácter o booleano', cur().n); warn(0.1, 'Falta el tipo de las variables en ENTORNO (entero, real, doble, cadena, carácter o booleano).', cur().n, 'tipo'); }
      else if (!tw) { if (!LEN) throw synErr('Tipo no reconocido: «' + desc + '». Usa entero, real, doble, cadena, carácter o booleano', cur().n); warn(0.1, 'Tipo no reconocido en ENTORNO: «' + desc + '». Usa entero, real, doble, cadena, carácter o booleano.', cur().n, 'tipo'); }
      for (const nm of names) {
        if (!identRe.test(nm) || RESERVED.has(nm)) { if (!LEN) { if (!identRe.test(nm)) throw synErr('«' + nm + '» no es un nombre de variable válido', cur().n); throw synErr('«' + nm + '» es una palabra reservada, no puede ser una variable', cur().n); } warn(0.1, '«' + nm + '» no es un nombre de variable válido en ENTORNO.', cur().n); continue; }
        vars[nm] = tw && /^(cadena|texto|string|car|char)/.test(tw) ? 'texto' : tw && /^(bool|logic)/.test(tw) ? 'bool' : 'numero';
      }
    }
    i++;
  }
  if (!cur()) throw synErr('Falta la línea INICIO que abre el algoritmo', L[L.length - 1].n);
  i++;

  const STRAY = /^(FIN (SI|MIENTRAS|PARA|EVALUAR)|SI ?NO|HASTA QUE|EN OTRO CASO|SI VALE)\b/;

  function block(ends, need, open) {
    const out = [];
    for (;;) {
      if (!cur()) {
        if (!LEN) throw synErr('Falta «' + need + '» (el bloque que empieza en la línea ' + open + ' no se cierra)', L[L.length - 1].n);
        warn(need === 'FIN PROGRAMA.' ? 0.1 : 0.25, 'Falta «' + need + '»' + (need === 'FIN PROGRAMA.' ? ' al final.' : ' para cerrar el bloque de la línea ' + open + '.'), open, 'cierre:' + need + open);
        return out;
      }
      if (ends.some(r => r.test(cur().t))) return out;
      if (!LEN) { out.push(stmt()); continue; }
      if (need !== 'FIN PROGRAMA.' && /^FIN PROGRAMA\.?$/.test(cur().t)) {
        warn(0.25, 'Falta «' + need + '» para cerrar el bloque de la línea ' + open + '.', open, 'cierre:' + need + open);
        return out;
      }
      const i0 = i;
      try { out.push(stmt()); }
      catch (e) {
        if (!e.isCE) throw e;
        const ln = e.line || (L[i0] && L[i0].n);
        warn(0.5, 'Línea ' + ln + ': ' + e.message + ' (esa línea no se ha podido ejecutar).', ln, 'linea:' + ln);
        i = Math.max(i, i0 + 1);
      }
    }
  }

    const l = cur(), t = l.t, n = l.n; let m;

    if (STRAY.test(t)) throw synErr('«' + t.split(' ').slice(0, 2).join(' ') + '» no tiene el bloque que debería cerrar o separar', n);
    const simple = parseSimple(t, n);
    if (simple) { i++; return simple; }

    if (/^SI\s/.test(t)) {
      m = /^SI\s+(.*?)\s+ENTONCES(.*)$/.exec(t);
      if (!m) throw synErr('Falta ENTONCES al final de la condición del SI', n);
      if (m[2].trim()) throw synErr('Después de ENTONCES se salta de línea: las instrucciones van en las líneas siguientes', n);
      const cond = parseExpr(m[1], n); i++;
      const then = block([/^SI ?NO$/, /^FIN SI$/], 'FIN SI', n);
      let els = null;
      if (cur() && /^SI ?NO$/.test(cur().t)) { i++; els = block([/^FIN SI$/], 'FIN SI', n); }
      if (cur() && /^FIN SI$/.test(cur().t)) i++;
      return { k: 'if', cond, src: m[1].trim(), then, else: els, line: n };
    }
    if ((m = /^EVALUAR\s+(.+)$/.exec(t))) {
      const ex = parseExpr(m[1], n); i++;

function dedupeDeductions(list) {

function gradeDFD(g, ex) {

  if (prep.fatal) { r.kind = 'structure'; r.problems = [...new Set(prep.issues.map(x => x.msg))]; return r; }

const GOTO_RE = { test: t => {

/* ============================================================

async function runCmd(full) {
  const [cmd, arg] = full.split(/:(.*)/s);

    case 'palette': openPalette(); break;
    case 'focus': openFocus(+arg); break;
    case 'real': D.acc.real = true; save(); go('real'); break;
    case 'realq': { D.acc.real = true; save(); if (screen !== 'real') go('real'); const t = document.getElementById('real' + arg); if (t) t.scrollIntoView({ block: 'start' }); break; }
    case 'real-sim': startExam('real', CE.REAL.simulacro); break;
    case 'real-prac': { const q = CE.REAL.questions.find(x => x.n === +arg); if (q) startExam('real', q.practice); break; }
    case 'card': { if (screen !== 'home') go('home'); const t = document.getElementById('c-' + arg); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'theme': D.theme = D.theme === 'dark' ? 'light' : 'dark'; save(); renderChrome(); break;
    case 'home': save(); go('home'); break;
    case 'errok': if (D.errores && D.errores[arg]) { delete D.errores[arg]; save(); renderView(); flash('Quitado de tus errores frecuentes'); } break;
    case 'new': startExam('normal'); break;

    case 'resume': go('exam'); break;
    case 'last': viewing = D.ultimo; go('results'); break;
    case 'goto': if (screen !== 'exam') { D.enCurso.cur = +arg; go('exam'); } else switchQ(+arg); break;
    case 'prev': if (D.enCurso.cur > 0) switchQ(D.enCurso.cur - 1); break;
    case 'next': if (D.enCurso.cur < D.enCurso.questions.length - 1) switchQ(D.enCurso.cur + 1); else submitExam(); break;
    case 'submit': save(); submitExam(); break;

    case 'export': exportData(); break;
    case 'del': {
      const f = D.fallos[arg]; if (!f) return;
      if (await dialog({ title: 'Quitar del banco de fallos', body: '<p>«' + X(f.title) + '» dejará de salir en el examen de fallos.</p>', ok: 'Quitar', danger: true, icon: 'trash' })) { delete D.fallos[arg]; save(); renderChrome(); if (screen === 'home') renderView(); }

function pickVariant(b) { return b.variants ? b.variants[Math.floor(Math.random() * b.variants.length)].key : null; }
function newNormalExam() {

  const pick = pool => { const e = shuffle(pool.filter(x => !used.has(x.id)))[0]; used.add(e.id); return { exId: e.id, variant: pickVariant(e) }; };
  const easy = CE.BANK.filter(e => e.level <= 2), hard = CE.BANK.filter(e => e.level >= 2);
  const dOk = e => !e.pseudoOnly;
  const p1 = pick(easy), p2 = pick(hard), d1 = pick(easy.filter(dOk)), d2 = pick(hard.filter(dOk));
  return { id: 'ex' + Date.now(), type: 'normal', started: Date.now(), cur: 0, questions: [
    { mode: 'teoria', exId: 'teoria', answer: '' },
    Object.assign({ mode: 'pseudo', answer: '' }, p1), Object.assign({ mode: 'pseudo', answer: '' }, p2),
    Object.assign({ mode: 'dfd', answer: null }, d1), Object.assign({ mode: 'dfd', answer: null }, d2)] };
}
function newFallosExam() {
  const items = Object.values(D.fallos).sort((a, b) => (b.count - a.count) || (b.last - a.last)).slice(0, 5).sort((a, b) => MODE_ORDER[a.mode] - MODE_ORDER[b.mode]);
  return { id: 'ex' + Date.now(), type: 'fallos', started: Date.now(), cur: 0, questions: items.map(f => ({ mode: f.mode, exId: f.exId, variant: f.variant || null, answer: f.mode === 'dfd' ? null : '' })) };
}

}

  if (D.enCurso && !await dialog({ title: 'Tienes un examen sin entregar', body: '<p>Si empiezas uno nuevo se perderán sus respuestas.</p>', ok: 'Empezar uno nuevo', cancel: 'Volver', danger: true, icon: 'warn' })) return;
  D.enCurso = type === 'fallos' ? newFallosExam() : type === 'real' ? newRealExam(list) : newNormalExam(); D.panel = 'explorer'; D.acc.curso = true; save();
