/* ============================ Corrección ============================ */
function gradeQuestion(q) {
  if (q.mode === 'teoria') { const r = CE.gradeTeoria(q.answer, q.exId); return { r, pts: r.pts, ok: r.ok }; }
  const ex = exOf(q);
  const r = q.mode === 'pseudo' ? CE.gradePseudo(q.answer, ex) : CE.gradeDFD(q.answer, ex);
  return { r, pts: r.pts, ok: r.ok };
}
async function submitExam() {
  const ex = D.enCurso; if (!ex) return;
  const pend = ex.questions.map((q, i) => answered(q) ? null : i).filter(x => x !== null);
  const ok = await dialog({
    title: 'Entregar el examen', icon: 'send',
    body: pend.length ? '<p>Hay preguntas sin responder:</p><ul>' + pend.map(i => '<li>' + X(qLabel(ex.questions[i], i)) + '</li>').join('') + '</ul><p>Contarán como falladas.</p>' : '<p>Se corregirán las ' + ex.questions.length + ' preguntas y verás las soluciones.</p>',
    ok: 'Entregar', cancel: 'Seguir revisando'
  });
  if (!ok) return;
  ex.finished = Date.now();
  const items = ex.questions.map(q => Object.assign({ qkey: qKey(q) }, gradeQuestion(q)));
  const W = q => q.weight || 1;
  const nota = 10 * items.reduce((s, it, i) => s + it.pts / 2 * W(ex.questions[i]), 0) / ex.questions.reduce((s, q) => s + W(q), 0);
  ex.results = { items, nota: Math.round(nota * 100) / 100, aciertos: items.filter(i => i.ok).length, guardadas: 0, superadas: 0 };
  items.forEach((it, i) => {
    const q = ex.questions[i], k = it.qkey;
    if (!it.ok) {
      const f = D.fallos[k] || { key: k, mode: q.mode, exId: q.exId, variant: q.variant || null, title: qTitle(q), count: 0, first: ex.finished };
      f.count++; f.last = ex.finished; D.fallos[k] = f; it.saved = true; ex.results.guardadas++;
    } else if (D.fallos[k]) { delete D.fallos[k]; it.cleared = true; ex.results.superadas++; }
  });
  D.historial.unshift({ date: ex.finished, type: ex.type, nota: ex.results.nota, aciertos: ex.results.aciertos, total: items.length, dur: ex.finished - ex.started });
  D.historial = D.historial.slice(0, 200);
  recordErrors(ex);
  D.ultimo = ex; D.enCurso = null; D.panel = 'explorer'; D.sideOpen = true; save();
  viewing = ex; go('results');
}

const CTL = new Set(['SI', 'ENTONCES', 'NO', 'FIN', 'MIENTRAS', 'HACER', 'HASTA', 'QUE', 'PARA', 'INCREMENTANDO', 'DECREMENTANDO', 'EN', 'EVALUAR', 'VALE', 'OTRO', 'CASO']);
const KW = new Set(['PROGRAMA', 'ENTORNO', 'INICIO', 'ENTERO', 'REAL', 'DOBLE', 'CADENA', 'CARÁCTER', 'BOOLEANO', 'entero', 'real', 'doble', 'cadena', 'carácter', 'caracter', 'booleano', 'LEER', 'MOSTRAR', 'IMPRIMIR', 'MOD', 'DIV', 'Y', 'O', 'VERDADERO', 'FALSO']);
const TOKRE = /("[^"]*"?|“[^”]*”?|'[^']*'?)|(\/\/.*$)|(\d+(?:[.,]\d+)?)|([\p{L}_][\p{L}\p{N}_]*)|([\s\S])/gu;
function hl(line) {
  let o = '', m; TOKRE.lastIndex = 0;
  while ((m = TOKRE.exec(line))) {
    if (m[1]) o += '<span class="s">' + X(m[1]) + '</span>';
    else if (m[2]) o += '<span class="c">' + X(m[2]) + '</span>';
    else if (m[3]) o += '<span class="n">' + X(m[3]) + '</span>';
    else if (m[4]) o += CTL.has(m[4]) ? '<span class="ct">' + m[4] + '</span>' : KW.has(m[4]) ? '<span class="kw">' + m[4] + '</span>' : '<span class="v">' + X(m[4]) + '</span>';
    else o += X(m[5]);
  }
  return o;
}
function codeView(src, errLines) {
  const err = new Set(errLines || []);
  if (!src || !String(src).trim()) return '<pre class="code-view"><div class="none">Sin respuesta</div></pre>';
  return '<pre class="code-view">' + String(src).replace(/\r/g, '').split('\n').map((l, i) => '<div class="ln' + (err.has(i + 1) ? ' err' : '') + '"><i>' + (i + 1) + '</i><span>' + (hl(l) || ' ') + '</span></div>').join('') + '</pre>';
}

  let errLines = new Set();
  function paint() {
    const lines = ta.value.split('\n'), curL = ta.value.slice(0, ta.selectionStart).split('\n').length;
    pre.innerHTML = lines.map((l, i) => '<div class="cl' + (errLines.has(i + 1) ? ' err' : '') + '">' + (hl(l) || ' ') + '</div>').join('');
    gut.innerHTML = lines.map((_, i) => '<div class="' + (errLines.has(i + 1) ? 'err' : i + 1 === curL && document.activeElement === ta ? 'cur' : '') + '">' + (i + 1) + '</div>').join('');
  }
  function cursor() {
    const before = ta.value.slice(0, ta.selectionStart).split('\n');
    cursorPos = { l: before.length, c: before[before.length - 1].length + 1 };
    const c = $('[data-cursor]'); if (c) c.textContent = 'Lín. ' + cursorPos.l + ', col. ' + cursorPos.c;
    const cur = gut.querySelector('.cur'); if (cur) cur.classList.remove('cur');

  }

  function insertAt(text) {
    const s = ta.selectionStart, e = ta.selectionEnd, before = ta.value.slice(0, s), ls = before.lastIndexOf('\n') + 1;
    const ind = (before.slice(ls).match(/^\s*/) || [''])[0];
    let t = text.includes('\n') ? text.split('\n').map((l, i) => i ? ind + l : l).join('\n') : text;
    let caret = t.indexOf('▌'); t = t.replace('▌', ''); if (caret < 0) caret = t.length;

      const s = ta.selectionStart, ls = ta.value.lastIndexOf('\n', s - 1) + 1, line = ta.value.slice(ls, s);
      let ind = (line.match(/^\s*/) || [''])[0];

      const sc = v.querySelector('.code-scroll'), rowY = (ta.value.slice(0, ta.selectionStart).split('\n').length) * 21 + 30;
      if (rowY > sc.scrollTop + sc.clientHeight) sc.scrollTop = rowY - sc.clientHeight + 10;
    }
  });
  v.querySelector('.code-toolbar').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.ins) insertAt(b.dataset.ins);

    else if (b.dataset.act === 'check') {
      if (!ta.value.trim()) return setProblems([{ kind: 'err', msg: 'Aún no has escrito nada.' }]);
      const list = [];
      try { CE.parsePseudo(ta.value); errLines = new Set(); }
      catch (e) {
        if (!e.isCE) throw e;
        errLines = new Set(e.line ? [e.line] : []);
        const pre2 = CE.prepLenient(ta.value), W = pre2.W.slice();
        try { CE.parsePseudo(pre2.text, { lenient: true, lineMap: pre2.lineMap, warn: x => W.push(x) }); } catch (e2) { if (!e2.isCE) throw e2; }
        const seen = new Set();
        W.forEach(w => { const k = w.key || w.msg; if (seen.has(k)) return; seen.add(k); list.push({ kind: w.pen >= 0.5 ? 'err' : 'warn', msg: String(w.msg).replace(/^Línea \d+: /, '') + (w.pen ? ' (resta ' + String(w.pen).replace('.', ',') + ')' : ''), line: w.line }); if (w.line) errLines.add(w.line); });

    const p = ev.target.closest('[data-line]'); if (!p) return;
    const ln = +p.dataset.line, lines = ta.value.split('\n'); let pos = 0;
    for (let i = 0; i < ln - 1 && i < lines.length; i++) pos += lines[i].length + 1;

  });
  paint(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); cursor();
}

/* ---------- Vista a pantalla completa con flechas ---------- */
let focusEl = null, focusN = 0, focusMounted = [], focusFS = false;
function openFocus(n) {

  if (!focusEl) {
    focusEl = document.createElement('div'); focusEl.className = 'focus-wrap'; focusEl.setAttribute('role', 'dialog'); focusEl.setAttribute('aria-modal', 'true');
    document.body.appendChild(focusEl);
    focusEl.addEventListener('click', ev => {
      const b = ev.target.closest('[data-f],[data-cmd]'); if (!b) return;
      if (b.dataset.f === 'prev') openFocus(focusN - 1);
      else if (b.dataset.f === 'next') openFocus(focusN + 1);
      else if (b.dataset.f === 'go') openFocus(+b.dataset.n);
      else if (b.dataset.f === 'close') closeFocus();
      else if (b.dataset.f === 'fs') toggleFS();
      else if (b.dataset.cmd) { const c = b.dataset.cmd; closeFocus(); runCmd(c); }
    });
    focusFS = false;
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => { focusFS = true; paintFsBtn(); }).catch(() => {});
    }
  }
  const dir = n > focusN ? 1 : n < focusN ? -1 : 0;
  focusN = n;
  focusMounted.forEach(m => m.destroy && m.destroy()); focusMounted = [];
  const q = Q[n - 1], a = realArticle(q, 'f');
  focusEl.innerHTML =
    '<header class="focus-bar">' +
      '<button class="icon-btn" data-f="prev" title="Pregunta anterior (←)" aria-label="Pregunta anterior"' + (n === 1 ? ' disabled' : '') + '>' + ic('left') + '</button>' +
      '<div class="focus-title"><span class="focus-count">' + n + ' / ' + N + '</span><b>' + X(q.title) + '</b></div>' +
      '<button class="icon-btn" data-f="next" title="Pregunta siguiente (→)" aria-label="Pregunta siguiente"' + (n === N ? ' disabled' : '') + '>' + ic('right') + '</button>' +
      '<nav class="focus-dots" aria-label="Ir a la pregunta">' + Q.map(x => '<button data-f="go" data-n="' + x.n + '" class="' + (x.n === n ? 'on' : '') + '" title="Pregunta ' + x.n + '" aria-label="Pregunta ' + x.n + '">' + x.n + '</button>').join('') + '</nav>' +
      '<span class="grow"></span>' +
      '<span class="focus-keys"><kbd>←</kbd><kbd>→</kbd> cambiar · <kbd>Esc</kbd> salir</span>' +
      '<button class="icon-btn" data-f="fs" data-fsbtn title="Pantalla completa del navegador" aria-label="Pantalla completa"></button>' +
      '<button class="icon-btn" data-f="close" title="Cerrar (Esc)" aria-label="Cerrar">' + ic('x') + '</button>' +
    '</header>' +
    '<div class="focus-body' + (dir > 0 ? ' in-r' : dir < 0 ? ' in-l' : '') + '"><div class="focus-inner">' + a.html + '</div>' +
      '<button class="focus-side focus-prev" data-f="prev" aria-label="Pregunta anterior"' + (n === 1 ? ' hidden' : '') + '>' + ic('left') + '</button>' +
      '<button class="focus-side focus-next" data-f="next" aria-label="Pregunta siguiente"' + (n === N ? ' hidden' : '') + '>' + ic('right') + '</button></div>';
  paintFsBtn();

  focusEl.querySelector('.focus-body').scrollTop = 0;
  focusEl.querySelector('[data-f="close"]').focus({ preventScroll: true });
}
function paintFsBtn() {
  const b = focusEl && focusEl.querySelector('[data-fsbtn]'); if (!b) return;
  const on = !!document.fullscreenElement;
  b.innerHTML = ic(on ? 'shrink' : 'expand'); b.title = on ? 'Salir de la pantalla completa del navegador' : 'Pantalla completa del navegador';
}
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().then(() => { focusFS = true; }).catch(() => {});
}
function closeFocus() {
  if (!focusEl) return;
  focusMounted.forEach(m => m.destroy && m.destroy()); focusMounted = [];
  focusEl.remove(); focusEl = null;
  if (document.fullscreenElement && focusFS) document.exitFullscreen().catch(() => {});
  focusFS = false;
  const t = document.getElementById('real' + focusN); if (t && screen === 'real') t.scrollIntoView({ block: 'start' });
}
document.addEventListener('fullscreenchange', paintFsBtn);
document.addEventListener('keydown', ev => {
  if (!focusEl || pal) return;
  if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); if (focusN < CE.REAL.questions.length) openFocus(focusN + 1); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); if (focusN > 1) openFocus(focusN - 1); }
  else if (ev.key === 'Home') { ev.preventDefault(); openFocus(1); }
  else if (ev.key === 'End') { ev.preventDefault(); openFocus(CE.REAL.questions.length); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeFocus(); }
  else if (/^[1-9]$/.test(ev.key) && +ev.key <= CE.REAL.questions.length) openFocus(+ev.key);
}, true);

/* ============================ Paleta de secciones ============================ */
function sectionList() {
  const L = [], add = (group, label, cmd, icon, hint) => L.push({ group, label, cmd, icon, hint: hint || '' });
  add('General', 'Inicio', 'home', 'home', 'nota media y errores frecuentes');
  if (D.enCurso) add('Exámenes', 'Continuar el examen en curso', 'resume', 'play', 'Pregunta ' + (D.enCurso.cur + 1) + ' de ' + D.enCurso.questions.length);
  add('Exámenes', 'Nuevo examen', 'new', 'plus', '5 preguntas');
  add('Exámenes', 'Examen de fallos', 'fallos-exam', 'error', Object.keys(D.fallos).length + ' guardadas');
  if (D.ultimo && D.ultimo.results) add('Exámenes', 'Corrección del último examen', 'last', 'book', fmtN(D.ultimo.results.nota) + ' / 10');
  add('Examen real', 'Examen real: soluciones y errores comunes', 'real', 'real', CE.REAL.total + ' puntos');
  CE.REAL.questions.forEach(q => add('Examen real', 'Pregunta ' + q.n + ' · ' + q.title, 'focus:' + q.n, 'expand', 'pantalla completa · ' + fmtN(q.pts) + ' pt'));
  add('Examen real', 'Simulacro completo del examen real', 'real-sim', 'play');
  add('Inicio', 'Banco de fallos', 'card:fallos', 'error', 'en el inicio');
  add('Inicio', 'Historial y recientes', 'card:recientes', 'history', 'en el inicio');
  add('Inicio', 'Errores frecuentes', 'card:errores', 'bulb', 'en el inicio');
  add('Inicio', 'Copia de seguridad (exportar / importar)', 'card:copia', 'save', 'en el inicio');
  add('Preferencias', 'Cambiar tema claro / oscuro', 'theme', D.theme === 'dark' ? 'moon' : 'sun', D.theme === 'dark' ? 'tema oscuro' : 'tema claro');
  return L;
}
let pal = null;
function closePalette() { if (pal) { pal.remove(); pal = null; } }
function openPalette() {
  if (pal) return closePalette();
  if (focusEl) closeFocus();
  pal = document.createElement('div'); pal.className = 'palette-wrap';
  pal.innerHTML = '<div class="palette" role="dialog" aria-label="Ir a una sección"><div class="pal-in">' + ic('search') + '<input type="text" placeholder="Escribe para buscar una sección…" aria-label="Buscar sección" spellcheck="false"></div><ul class="pal-list" role="listbox"></ul></div>';
  document.body.appendChild(pal);
  const inp = pal.querySelector('input'), ul = pal.querySelector('.pal-list'), all = sectionList();
  let sel = 0, cur = all;
  const nn = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function draw() {
    const q = nn(inp.value.trim());
    cur = all.filter(x => !q || nn(x.group + ' ' + x.label + ' ' + x.hint).includes(q));
    sel = Math.min(sel, Math.max(0, cur.length - 1));
    let g = '', h = '';
    cur.forEach((x, i) => {
      if (x.group !== g) { g = x.group; h += '<li class="pal-group">' + X(g) + '</li>'; }
      h += '<li role="option" class="pal-it' + (i === sel ? ' on' : '') + '" data-i="' + i + '" aria-selected="' + (i === sel) + '">' + ic(x.icon) + '<span class="pl">' + X(x.label) + '</span><span class="ph">' + X(x.hint) + '</span></li>';
    });
    ul.innerHTML = h || '<li class="pal-none">No hay ninguna sección con ese nombre</li>';
    const on = ul.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  const pick = i => { const x = cur[i]; if (!x) return; closePalette(); runCmd(x.cmd); };
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); sel = Math.min(cur.length - 1, sel + 1); draw(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); pick(sel); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closePalette(); }
  });
  ul.addEventListener('mousemove', ev => { const li = ev.target.closest('[data-i]'); if (li && +li.dataset.i !== sel) { sel = +li.dataset.i; ul.querySelectorAll('.pal-it').forEach(e => e.classList.toggle('on', +e.dataset.i === sel)); } });
  ul.addEventListener('click', ev => { const li = ev.target.closest('[data-i]'); if (li) pick(+li.dataset.i); });
  pal.addEventListener('mousedown', ev => { if (ev.target === pal) closePalette(); });
  draw(); inp.focus();
}
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey && /^[kp]$/i.test(ev.key)) { ev.preventDefault(); openPalette(); }
  else if (ev.key === 'F1') { ev.preventDefault(); openPalette(); }
});

/* ============================ Copias ============================ */
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'creadorExamenU1', exportado: new Date().toISOString(), fallos: D.fallos, historial: D.historial, ultimo: D.ultimo, errores: D.errores }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'examen-ut1-copia-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash('Copia descargada');
}
function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = async () => {
    let j; try { j = JSON.parse(rd.result); } catch (e) { flash('Ese archivo no es una copia válida', 'warn'); return; }
    if (!j || j.app !== 'creadorExamenU1' || typeof j.fallos !== 'object') { flash('Ese archivo no es una copia de este creador', 'warn'); return; }
    if (!await dialog({ title: 'Importar copia', icon: 'imp', body: '<p>La copia tiene ' + Object.keys(j.fallos).length + ' preguntas en el banco de fallos y ' + (j.historial || []).length + ' exámenes. Sustituirá a los datos actuales.</p>', ok: 'Importar' })) return;
    D.fallos = j.fallos; D.historial = j.historial || []; D.ultimo = j.ultimo || null; D.errores = j.errores || {}; if (!j.errores && D.ultimo && D.ultimo.results) recordErrors(D.ultimo); save(); go(screen === 'exam' ? 'exam' : 'home'); flash('Copia importada');
  };
  rd.readAsText(file);
}

/* ============================ Arranque ============================ */
load();
if (!D.errores) { D.errores = {}; if (D.ultimo && D.ultimo.results) try { recordErrors(D.ultimo); } catch (e) { D.errores = {}; } save(); }
applyTheme();
buildShell();
go('home');
window.__CEX = { get D() { return D; }, go, startExam, submitExam, gradeQuestion, save, setViewing: ex => { viewing = ex; } };
})();
