<style>
/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Examen de Entornos de Desarrollo — mismo estilo que el menú de repaso y el creador de Java ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  /* Color de ETS (portada de EVAGD), el mismo que en el menú de repaso */
  --asig: #FD8127;
  --asig-tinta: #0B0B0C;
}
/* Contraste AA para texto pequeño (los tokens de marca se quedan algo cortos a 11–13 px) */
.concep { --text-3: #62626E; --ok-txt: #0B7A55; --warn-txt: #8A5500; --err-txt: #B00D4A; }
.concep-dark { --text-3: #8A8A98; --ok-txt: var(--ok); --warn-txt: var(--warn); --err-txt: var(--error); }
#app > div { --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text)); --focus: var(--asig); --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent); --err-bg: color-mix(in srgb, var(--error) 10%, transparent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), filter var(--dur-1); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--asig); border-color: transparent; color: var(--asig-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--asig); }
.btn--primary:hover { background: var(--asig); filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { color: var(--err-txt); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: transparent; }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--asig); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.progreso { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- página ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 58ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, color-mix(in srgb, var(--asig) 28%, transparent), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--asig); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; font-family: var(--f-prosa); line-height: 1.5; }
.lbl { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.reglas { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.reglas li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); font: 400 13.5px/1.5 var(--f-prosa); }
.reglas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--asig); flex: none; transform: translateY(-2px); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
.check input { accent-color: var(--asig); width: 16px; height: 16px; margin: 0; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hist { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.nota-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 600 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.nota-chip.ap { color: var(--ok-txt); }
.nota-chip.su { color: var(--err-txt); }
.vacio-txt { color: var(--text-3); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.lista-fallos { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.lista-fallos li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 400 13px/1.45 var(--f-prosa); color: var(--text); }
.lista-fallos li .ok { display: block; margin-top: 4px; color: var(--ok-txt); font-size: 12px; }
.lista-fallos li .x { float: right; margin-left: 8px; font: 600 11px var(--f-ui); color: var(--err-txt); }
textarea.copia { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 400 11.5px/1.4 var(--f-ui); resize: vertical; }
.msg { font-size: 12px; color: var(--text-3); }

/* ---------- examen ---------- */
.examen-page { max-width: 820px; margin: 0 auto; padding: 26px 24px 120px; }
.q { padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; scroll-margin-top: 80px; }
.q .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.q .meta .n { color: var(--acento-texto); font-weight: 600; }
.q h3 { font: 600 17px/1.35 var(--f-titulo); letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--f-prosa); cursor: pointer; transition: border-color var(--dur-1), background-color var(--dur-1); }
.opt:hover { border-color: var(--border-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-strong); font: 600 12px var(--f-ui); color: var(--text-2); }
.opt .t { padding-top: 2px; }
.opt:has(input:checked) { border-color: var(--asig); background: color-mix(in srgb, var(--asig) 9%, var(--bg)); }
.opt:has(input:checked) .l { background: var(--asig); border-color: var(--asig); color: var(--asig-tinta); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.q.hecha .opt { cursor: default; }
.q.hecha .opt.bien { border-color: var(--ok); background: var(--ok-bg); }
.q.hecha .opt.bien .l { background: var(--ok); border-color: var(--ok); color: #0B0B0C; }
.q.hecha .opt.mal { border-color: var(--error); background: var(--err-bg); }
.q.hecha .opt.mal .l { background: var(--error); border-color: var(--error); color: #0B0B0C; }
.concep .q.hecha .opt.mal .l { color: #fff; }
.estado { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font: 600 11px var(--f-ui); letter-spacing: 0; text-transform: none; }
.estado.bien { color: var(--ok-txt); background: var(--ok-bg); }
.estado.mal { color: var(--err-txt); background: var(--err-bg); }
.estado.blanco { color: var(--text-2); background: var(--surface-2); }
.expl { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border-left: 3px solid var(--asig); background: color-mix(in srgb, var(--asig) 6%, transparent); color: var(--text-2); font: 400 13.5px/1.55 var(--f-prosa); }
.expl b { color: var(--text); font-weight: 600; }
.barra-fija { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.barra-fija .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.barra-fija .aviso { font-size: 12px; color: var(--warn-txt); }
.puntos { display: flex; gap: 4px; flex-wrap: wrap; }
.puntos a { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--border); font: 600 10px var(--f-ui); color: var(--text-3); text-decoration: none; }
.puntos a.r { background: color-mix(in srgb, var(--asig) 16%, transparent); border-color: color-mix(in srgb, var(--asig) 50%, transparent); color: var(--acento-texto); }

/* ---------- resultado ---------- */
.resultado { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; margin-bottom: 22px; }
.resultado .big { font: 700 64px/1 var(--f-titulo); letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--text); }
.resultado .big small { font-size: 18px; color: var(--text-3); font-weight: 500; letter-spacing: 0; }
.resultado .veredicto { font: 600 15px var(--f-titulo); margin-bottom: 8px; }
.resultado .veredicto.ap { color: var(--ok-txt); }
.resultado .veredicto.su { color: var(--err-txt); }
.medidor { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.medidor > div { height: 100%; border-radius: inherit; background: var(--asig); }
.resumen { margin-top: 10px; color: var(--text-2); font-size: 12.5px; }
.seccion-t { font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 26px 0 12px; }

.fade-in { animation: entra var(--dur-3) var(--ease-out) both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .btn, .opt { transition: none; } }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .hero-stats { flex-wrap: wrap; }
  .stat { flex: 1; min-width: 96px; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .top { gap: 10px; padding: 8px 16px; }
  .top .c-wordmark, .top .sep { display: none; }
  .page, .examen-page { padding-left: 16px; padding-right: 16px; }
  .q, .card { padding: 18px 16px; }
  .resultado { grid-template-columns: 1fr; gap: 10px; }
  .resultado .big { font-size: 52px; }
  .barra-fija { padding-left: 16px; padding-right: 16px; }
  .puntos { display: none; }
}

<script>
const CFG = { ut: "UT1–UT2", temario: "UT1 y UT2", k: { seen: "ed_seen_v2", fails: "ed_fails", hist: "ed_hist", penal: "ed_penal", tema: "ed_tema" } };
// Banco de Entornos de Desarrollo UT1–UT2 (sin frameworks ni cambios de base).

const BANK = [
// ---------- 1. Sistema informático y software ----------
{n:"facil",t:"Software",q:"¿Qué tres elementos forman un sistema informático?",o:["Hardware, software y usuario","Hardware, software y red","CPU, memoria y periféricos","Sistema operativo, aplicaciones y datos"],e:"Un sistema informático lo forman hardware, software y usuario."},
{n:"facil",t:"Software",q:"¿Cómo se define el hardware?",o:["Los elementos físicos que componen el ordenador","El conjunto de programas que gestionan el ordenador","La parte intangible del sistema informático","Las instrucciones que ejecuta el procesador"],e:"Hardware = partes físicas (las que se pueden tocar): procesador, memoria, placas, etc."},
{n:"facil",t:"Software",q:"Un sistema operativo es un ejemplo de software…",o:["De sistema","De aplicación","De programación","De usuario"],e:"El software de sistema sirve y gestiona otros programas; el SO gestiona la comunicación SW‑HW."},
{n:"facil",t:"Software",q:"Un compilador, un IDE o un depurador son ejemplos de software…",o:["De programación","De sistema","De aplicación","De gestión de datos"],e:"El software de programación ayuda a crear otros programas."},
{n:"facil",t:"Software",q:"Un procesador de textos o un navegador web son software…",o:["De aplicación","De sistema","De programación","Firmware"],e:"El software de aplicación realiza tareas específicas para el usuario."},
{n:"facil",t:"Software",q:"¿Qué es un programa informático?",o:["Datos e instrucciones que se ejecutan para realizar una o varias tareas","Las reglas de sintaxis y los operadores de un lenguaje de programación","El componente físico que procesa los datos del ordenador","Una máquina virtual que emula un ordenador completo"],e:"Definición de las diapositivas: datos + instrucciones ejecutadas de forma secuencial."},
{n:"facil",t:"Software",q:"¿Qué es un lenguaje de programación?",o:["Instrucciones, operadores y reglas de sintaxis para escribir programas","Un programa que traduce el código fuente a código máquina ejecutable","Un entorno que agrupa editor, compilador y depurador","Un sistema de numeración en base 2 que entiende la CPU"],e:"El lenguaje proporciona instrucciones, operadores y reglas de sintaxis al programador."},
{n:"media",t:"Software",q:"Los lenguajes de programación se clasifican según:",o:["Nivel de abstracción, forma de ejecución y paradigma","Precio, tipo de licencia, fabricante y año de creación","Tamaño del código, velocidad y memoria que consumen","Sistema operativo, IDE y editor"],e:"Las tres clasificaciones vistas: abstracción, ejecución y paradigma."},
// ---------- Sistemas de numeración ----------
{n:"facil",t:"Numeración",q:"¿Cuál es la base del sistema hexadecimal?",o:["16","8","2","10"],e:"Hexadecimal usa 16 símbolos: 0‑9 y A‑F."},
{n:"facil",t:"Numeración",q:"¿Cuál es la base del sistema octal?",o:["8","16","2","10"],e:"Octal usa los símbolos 0‑7."},
{n:"facil",t:"Numeración",q:"¿Cómo se llama el bit situado más a la derecha de un número binario?",o:["Bit menos significativo (LSB)","Bit más significativo (MSB)","Bit de paridad del número","Bit de signo"],e:"El de la derecha es el LSB; el de la izquierda es el MSB."},
{n:"facil",t:"Numeración",q:"¿Cómo se llama el bit situado más a la izquierda de un número binario?",o:["Bit más significativo (MSB)","Bit menos significativo (LSB)","Byte alto","Bit de control"],e:"El de la izquierda es el MSB (Most Significant Bit)."},
{n:"facil",t:"Numeración",q:"¿Cuántos bits tiene un byte?",o:["8","4","16","1024"],e:"1 byte = 8 bits, lo que suele ocupar un carácter."},
{n:"facil",t:"Numeración",q:"¿A cuántos bytes equivale 1 kilobyte según los apuntes?",o:["1024","1000","512","2048"],e:"1 KB = 1024 bytes; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB."},
{n:"facil",t:"Numeración",q:"¿A qué equivale 1 terabyte?",o:["1024 GB","1000 MB","1024 MB","1024 KB"],e:"1 TB = 1024 GB."},
{n:"facil",t:"Numeración",q:"¿Cuál es la unidad mínima de información?",o:["El bit","El byte","El kilobyte","El carácter"],e:"El bit, que puede valer 0 o 1."},
{n:"media",t:"Numeración",q:"¿Por qué se dice que el sistema binario es posicional?",o:["Porque el valor de un dígito depende de su posición","Porque solo usa dos posiciones para guardar cada número","Porque los dígitos se leen siempre de izquierda a derecha","Porque cada posición vale siempre 2"],e:"En un sistema posicional el valor depende del símbolo y su posición (base elevada a la posición)."},
// ---------- Lenguajes: abstracción y generaciones ----------
{n:"media",t:"Lenguajes",q:"¿A qué se refiere el 'nivel de abstracción' de un lenguaje?",o:["A cuánto se aleja del código máquina","A la velocidad con la que se ejecutan sus programas","Al número de paradigmas de programación que admite","A si es compilado o interpretado"],e:"Abstracción = cuánto se desacopla del código máquina."},
{n:"facil",t:"Lenguajes",q:"¿Qué generación de lenguajes corresponde al lenguaje ensamblador?",o:["2.ª generación","1.ª generación","3.ª generación","4.ª generación"],e:"1.ª código máquina, 2.ª ensamblador, 3.ª alto nivel (C, Java…), 4.ª SQL…, 5.ª basados en reglas/hechos."},
{n:"facil",t:"Lenguajes",q:"¿Qué generación corresponde al código máquina?",o:["1.ª generación","2.ª generación","3.ª generación","5.ª generación"],e:"La primera generación es el código máquina (binario)."},
{n:"facil",t:"Lenguajes",q:"C, C++, C# y Java pertenecen a la…",o:["3.ª generación","2.ª generación","4.ª generación","5.ª generación"],e:"La 3.ª generación son lenguajes cercanos al humano donde la solución se describe paso a paso."},
{n:"media",t:"Lenguajes",q:"SQL, PL/SQL o Unix Shell son lenguajes de…",o:["4.ª generación","3.ª generación","2.ª generación","5.ª generación"],e:"La 4.ª generación opera con grandes conjuntos de datos: BBDD, interfaces, web…"},
{n:"media",t:"Lenguajes",q:"Los lenguajes cuyos programas se forman con hechos, reglas y restricciones que debe cumplir la solución son de…",o:["5.ª generación","4.ª generación","3.ª generación","1.ª generación"],e:"La 5.ª generación se basa en hechos, reglas, restricciones, ecuaciones…"},
// ---------- Lenguajes: ejecución ----------
{n:"media",t:"Ejecución",q:"En un lenguaje compilado, ¿qué programa une el código objeto con las librerías para generar el ejecutable?",o:["El enlazador (linker)","El intérprete del lenguaje","El depurador (debugger)","El editor de texto"],e:"El compilador genera código objeto y el enlazador (linkador) lo une con las librerías."},
{n:"facil",t:"Ejecución",q:"¿Cuál es un ejemplo de lenguaje compilado según los apuntes?",o:["C++","Python","JavaScript","Bash"],e:"C y C++ son compilados; Python y JS interpretados; Bash (shell) también es interpretado."},
{n:"facil",t:"Ejecución",q:"¿Cuál de estos es un lenguaje interpretado?",o:["Python","C","C++","Ensamblador"],e:"Python y JavaScript son los ejemplos de interpretados."},
{n:"facil",t:"Ejecución",q:"Java es un lenguaje…",o:["Mixto: compila a bytecode que interpreta la JVM","Puramente compilado a código máquina de cada procesador","Puramente interpretado, sin ningún paso de compilación","De 2.ª generación, como el ensamblador"],e:"Java genera bytecode, que interpreta la máquina virtual de Java."},
{n:"facil",t:"Ejecución",q:"¿Cómo se llama el código intermedio que genera el compilador de Java?",o:["Bytecode","Código objeto","Código fuente","Script"],e:"Los lenguajes mixtos generan un código intermedio: en Java, el bytecode."},
{n:"facil",t:"Ejecución",q:"¿Qué necesita siempre un programa en lenguaje interpretado para ejecutarse?",o:["El código fuente y el intérprete","Solo el ejecutable binario ya enlazado","El enlazador y las librerías del sistema","Un IDE instalado"],e:"En interpretados siempre hace falta el código original y el intérprete."},
{n:"media",t:"Ejecución",q:"¿Qué afirmación sobre compiladores e intérpretes es correcta?",o:["Un intérprete puede ejecutar un programa con errores si no llega a ellos","Un compilador traduce cada instrucción cada vez que la encuentra","Un intérprete genera código objeto antes de ejecutar el programa","Un compilador genera el ejecutable aunque el código tenga errores"],e:"El intérprete analiza instrucción a instrucción; el compilador no genera resultado si el código no es correcto."},
{n:"facil",t:"Ejecución",q:"¿Cuántas veces traduce un compilador cada instrucción?",o:["Una sola vez","Cada vez que se ejecuta","Dos veces: análisis y generación","Depende del intérprete"],e:"El compilador traduce una vez; el intérprete cada vez que encuentra la instrucción."},
{n:"facil",t:"Ejecución",q:"¿Qué ventaja tienen los lenguajes compilados frente a los interpretados?",o:["Son más eficientes","Funcionan en cualquier arquitectura sin cambios","No necesitan compilarse","Permiten ejecutar código con errores"],e:"Los compilados son más eficientes y se distribuyen como binarios."},
{n:"media",t:"Ejecución",q:"¿Qué ventaja tiene un lenguaje interpretado en cuanto a portabilidad?",o:["Funciona en cualquier arquitectura que tenga intérprete","Genera binarios para todas las arquitecturas a la vez al compilar","No necesita sistema operativo para ejecutarse","Es siempre más rápido que uno compilado"],e:"Los binarios compilados dependen de la arquitectura; un interpretado solo necesita el intérprete."},
{n:"media",t:"Ejecución",q:"Según los apuntes, la única forma real de lograr la confidencialidad del código es…",o:["El cifrado criptográfico del código","Distribuirlo ya compilado en código máquina","Usar un lenguaje interpretado","Usar bytecode"],e:"Los binarios siempre se pueden decompilar; la confidencialidad solo se logra con cifrado."},
// ---------- Paradigmas ----------
{n:"facil",t:"Paradigmas",q:"¿Qué caracteriza al paradigma declarativo?",o:["Se indica 'qué' hay que hacer, no 'cómo'","Las instrucciones se ejecutan una tras otra detallando cada paso","Todo se organiza en objetos","Solo usa sentencias secuenciales"],e:"Declarativo = qué (\"balón a Michael\"); imperativo = cómo, paso a paso."},
{n:"facil",t:"Paradigmas",q:"En el paradigma imperativo…",o:["Las instrucciones se ejecutan una detrás de otra","Solo se describe el resultado deseado, no los pasos","No existen bucles ni condicionales","El programa se basa en hechos y reglas lógicas"],e:"Imperativo: se detalla paso a paso cómo hacerlo."},
{n:"facil",t:"Paradigmas",q:"¿Qué tres estructuras de control permite la programación estructurada?",o:["Secuenciales, selectivas y repetitivas","Clases, objetos, métodos y atributos","Hechos, reglas y consultas","Saltos incondicionales (goto), funciones y macros"],e:"Secuencia, selección e iteración."},
{n:"media",t:"Paradigmas",q:"¿Cuál es un inconveniente de la programación estructurada?",o:["No permite una reutilización eficaz del código","Los programas son muy difíciles de leer y de seguir","El mantenimiento es complejo","Necesita una máquina virtual"],e:"Inconvenientes: todo en un único bloque y poca reutilización."},
{n:"media",t:"Paradigmas",q:"¿Cuál de estos es un lenguaje estructurado según los apuntes?",o:["Pascal","Java","VB.NET","Delphi"],e:"Ejemplos de estructurados: Pascal, C, Fortran."},
{n:"facil",t:"Paradigmas",q:"En la programación orientada a objetos, un programa es…",o:["Un conjunto de objetos que colaboran entre ellos","Un único bloque de instrucciones que se ejecutan en orden","Un conjunto de reglas lógicas","Una lista de consultas a bases de datos"],e:"POO: objetos independientes que colaboran y son reutilizables."},
{n:"facil",t:"Paradigmas",q:"Una ventaja clave de la orientación a objetos es…",o:["Los objetos son reutilizables en otros proyectos","No necesita compilación","Todo el programa está en un único bloque de código fuente","Solo usa sentencias secuenciales"],e:"La reutilización de objetos es la gran ventaja frente a la estructurada."},
// ---------- Código fuente / objeto / ejecutable y compilación ----------
{n:"media",t:"Compilación",q:"¿Qué es el código objeto?",o:["Código máquina traducido del fuente que aún debe enlazarse","El código que escribe el programador en el editor del IDE","El archivo final que se ejecuta directamente","El pseudocódigo intermedio del compilador"],e:"Código objeto = traducción del fuente a código máquina, pendiente de enlazar."},
{n:"facil",t:"Compilación",q:"¿Cuál es el orden correcto de obtención del ejecutable?",o:["Fuente → objeto → ejecutable","Objeto → fuente → ejecutable","Ejecutable → objeto → fuente","Fuente → ejecutable → objeto"],e:"Fuente (se traduce) → objeto (se enlaza) → ejecutable."},
{n:"media",t:"Compilación",q:"Un código ejecutable que hace llamadas a otros sistemas y no es código máquina se llama…",o:["Script","Bytecode","Código objeto","Librería"],e:"Las diapositivas lo llaman script."},
{n:"media",t:"Compilación",q:"¿Cuál es la primera fase de un compilador?",o:["Análisis léxico (lexicográfico)","Análisis sintáctico‑semántico","Generación de código intermedio","Optimización de código"],e:"Orden: léxico → sintáctico‑semántico → código intermedio → optimización → generación de código → enlazado."},
{n:"media",t:"Compilación",q:"¿En qué fase se agrupan los caracteres en lexemas y se crea la tabla de símbolos?",o:["Análisis léxico","Análisis semántico","Optimización","Enlazado de librerías"],e:"El análisis léxico lee los caracteres, forma lexemas y crea la tabla de símbolos."},
{n:"media",t:"Compilación",q:"La detección de variables no declaradas o código inaccesible se hace en el…",o:["Análisis sintáctico‑semántico","Análisis léxico","Enlazado de librerías del programa","Generación de código"],e:"El semántico comprueba reglas sobre el árbol sintáctico usando la tabla de símbolos."},
{n:"media",t:"Compilación",q:"¿Qué fase genera una representación tipo pseudocódigo para facilitar la traducción?",o:["Generación de código intermedio","Optimización de código","Análisis léxico de los caracteres","Enlazado"],e:"Tras el análisis se genera un código intermedio a modo de pseudocódigo."},
{n:"media",t:"Compilación",q:"¿Qué se genera en la fase de 'generación de código'?",o:["Código objeto relocalizable, sin posiciones de memoria fijas","El ejecutable final, ya enlazado con las librerías del sistema","La tabla de símbolos","El árbol sintáctico"],e:"Se genera código máquina relocalizable; el enlazado viene después."},
{n:"media",t:"Compilación",q:"¿Cuál es la última fase del proceso de compilación?",o:["Enlazado de librerías","Optimización de código","Generación de código intermedio","Análisis semántico"],e:"Al final se enlaza el código objeto con las librerías y se obtiene el ejecutable."},
{n:"media",t:"Compilación",q:"¿Qué es la tabla de símbolos?",o:["Una estructura con los atributos de cada variable y función","Una lista de los errores que encuentra el compilador al traducir","El conjunto de librerías del programa","La tabla ASCII de caracteres"],e:"La crea el compilador en el análisis léxico y la usa el semántico."},
{n:"facil",t:"Compilación",q:"Un programa Java es portable porque…",o:["El bytecode se ejecuta en cualquier máquina con la JVM","Se compila a código máquina para todos los procesadores","No usa librerías","Es un lenguaje interpretado puro"],e:"Cualquier arquitectura con máquina virtual de Java puede ejecutar su bytecode."},
// ---------- Ciclo de vida / Cascada ----------
{n:"facil",t:"Ciclo de vida",q:"¿Cuál es uno de los modelos de ciclo de vida más clásicos?",o:["El modelo en cascada","Scrum","Kanban","El modelo DevOps continuo"],e:"Las diapositivas presentan el modelo en cascada como el clásico."},
{n:"facil",t:"Ciclo de vida",q:"¿Cuál es el orden correcto de las primeras fases del modelo en cascada?",o:["Análisis → Diseño → Codificación → Pruebas","Diseño → Análisis → Pruebas → Codificación","Codificación → Análisis → Diseño → Pruebas","Análisis → Codificación → Diseño → Pruebas"],e:"Análisis, diseño, codificación, pruebas, documentación, despliegue y mantenimiento."},
{n:"facil",t:"Ciclo de vida",q:"¿En qué fase se definen los requisitos del software, normalmente con entrevistas al cliente?",o:["Análisis","Diseño","Codificación","Despliegue"],e:"El análisis define los requisitos; la comunicación con el cliente debe ser bilateral."},
{n:"facil",t:"Ciclo de vida",q:"En la fase de análisis, la comunicación con el cliente debe ser…",o:["Bilateral","Unilateral","Solo por escrito","Inexistente hasta las pruebas"],e:"Es necesario contraste y consenso por ambas partes."},
{n:"media",t:"Ciclo de vida",q:"¿En qué fase se determina el funcionamiento global y los recursos del sistema, sin entrar en detalle?",o:["Diseño","Análisis","Codificación","Mantenimiento"],e:"El diseño establece el funcionamiento general y los recursos físicos y lógicos."},
{n:"facil",t:"Ciclo de vida",q:"Idealmente, ¿quién debería realizar las pruebas?",o:["Personal distinto al que la programó","El mismo programador que escribió el código","El cliente final","El comercial"],e:"Idílicamente las hace personal distinto, con experiencia en detectar fallos."},
{n:"media",t:"Ciclo de vida",q:"¿Qué dos tipos de documentación se distinguen?",o:["De usuario y técnica","Interna y externa al ordenador","En papel y digital","De análisis y de diseño"],e:"Documentación para el usuario y documentación técnica para desarrolladores."},
{n:"facil",t:"Ciclo de vida",q:"¿En qué fase se corrigen errores tras la implantación y se realizan ampliaciones?",o:["Mantenimiento","Despliegue","Pruebas","Codificación"],e:"En mantenimiento; si es una ampliación el modelo se vuelve cíclico."},
{n:"facil",t:"Ciclo de vida",q:"¿Qué fase prepara el software para su distribución e implantación en el sistema?",o:["Despliegue","Documentación","Diseño","Análisis"],e:"Despliegue: implantar o preparar la instalación, valorando la convivencia con versiones anteriores."},
{n:"facil",t:"Ciclo de vida",q:"¿Cuál es el principal problema del modelo en cascada?",o:["Es inflexible ante cambios o imprevistos","Es demasiado rápido para proyectos grandes","No tiene fase de pruebas","No permite documentar el software"],e:"Por eso surgieron las metodologías ágiles."},
// ---------- Ágil y roles ----------
{n:"media",t:"Ágil y roles",q:"¿En qué año se escribió el Manifiesto Ágil?",o:["2001","1995","2010","1989"],e:"El manifiesto ágil es de 2001."},
{n:"facil",t:"Ágil y roles",q:"¿Qué buscan las metodologías ágiles?",o:["Entregar pronto pequeñas piezas de software que funcionen","Entregar todo el software de una vez al final del proyecto","Eliminar la comunicación con el cliente","Seguir fases rígidas sin cambios"],e:"Dividir el proyecto en tareas pequeñas y entregar con frecuencia para satisfacer al cliente."},
{n:"facil",t:"Ágil y roles",q:"¿Qué rol actúa en nombre del cliente y comunica al equipo las tareas para cumplir sus requisitos?",o:["Product Owner","Project Manager","Tech Lead","Team Lead"],e:"El dueño del producto (Product Owner) representa al cliente."},
{n:"media",t:"Ágil y roles",q:"¿Qué rol gestiona el presupuesto, asigna tareas y horas de trabajo?",o:["Project Manager","Product Owner","Diseñador UX/UI","Desarrollador junior"],e:"El Project Manager gestiona el proyecto, presupuesto y asignación de horas."},
{n:"media",t:"Ágil y roles",q:"¿Qué rol supervisa los requerimientos técnicos y de sistema y orienta técnicamente al equipo?",o:["Tech Lead (analista)","Team Lead","Comercial","Product Owner (dueño del producto)"],e:"El Tech Lead supervisa requisitos técnicos (hardware, software…)."},
{n:"media",t:"Ágil y roles",q:"¿Qué rol se encarga del rendimiento del equipo y de formar a las nuevas incorporaciones?",o:["Team Lead","Tech Lead","Project Manager","Diseñador UI"],e:"El Team Lead vela por que los desarrolladores trabajen bien y en conjunto."},
{n:"media",t:"Ágil y roles",q:"¿De qué se encargan los diseñadores UX y UI?",o:["De las interfaces y la experiencia del usuario","Del presupuesto del proyecto","De los requisitos de hardware y servidores","De las ventas al cliente"],e:"UX/UI: interfaces y experiencia de usuario."},
// ---------- 2. IDE ----------
{n:"facil",t:"IDE",q:"¿Qué significa IDE?",o:["Integrated Development Environment","Internal Debugging Engine","Interactive Design Editor","Integrated Deployment Environment"],e:"Entorno de Desarrollo Integrado."},
{n:"facil",t:"IDE",q:"¿Qué es un IDE?",o:["Una aplicación con herramientas que agilizan el desarrollo","Un lenguaje de programación de alto nivel","Un sistema operativo pensado para programadores","Un compilador sin editor"],e:"Agrupa editor, compilador/intérprete, depurador, etc."},
{n:"facil",t:"IDE",q:"¿Puede un IDE servir para varios lenguajes de programación?",o:["Sí, hay IDE para un lenguaje o para varios","No, cada IDE solo admite un único lenguaje","Solo si es un IDE en la nube","Solo para lenguajes interpretados"],e:"Las diapositivas lo indican: para uno o para varios."},
{n:"facil",t:"IDE",q:"¿Qué herramienta del IDE permite ejecutar el programa instrucción a instrucción para detectar errores?",o:["El depurador","El editor de texto","El constructor de interfaces","El control de versiones"],e:"El depurador (debugger)."},
{n:"facil",t:"IDE",q:"El autocompletado y el analizador léxico forman parte de…",o:["El editor de texto","El depurador","El control de versiones","Los plugins de despliegue"],e:"El editor ofrece soluciones para agilizar la escritura del código."},
{n:"media",t:"IDE",q:"¿Qué componente del IDE facilita el trabajo en equipo y compartir código?",o:["La integración con control de versiones","El constructor de interfaces gráficas","El depurador","El compilador"],e:"La integración con un VCS (p. ej. Git) agiliza el trabajo en equipo."},
{n:"facil",t:"IDE",q:"¿Para qué sirven los plugins en un IDE?",o:["Para añadir extensiones y funcionalidades","Para compilar el código más rápido","Para sustituir al sistema operativo","Para ejecutar máquinas virtuales"],e:"Permiten añadir extensiones al IDE."},
{n:"facil",t:"IDE",q:"¿Cuál de estas NO es una herramienta típica de un IDE según los apuntes?",o:["Sistema gestor de nóminas","Editor de texto","Compilador o intérprete","Constructor de interfaces gráficas"],e:"Herramientas: editor, compilador/intérprete, depurador, constructor de GUI, VCS y plugins."},
{n:"media",t:"IDE",q:"¿Cuál de estas es una forma de configurar un IDE?",o:["Crear atajos de teclado personalizados","Cambiar la arquitectura del procesador","Modificar el código máquina del SO","Eliminar el compilador del lenguaje"],e:"Se pueden añadir/quitar ventanas, crear atajos y compilar/depurar con parámetros."},
{n:"media",t:"IDE",q:"¿Qué criterios se usan para elegir un IDE?",o:["Sistema operativo, lenguaje y herramientas","Precio del ordenador y marca del procesador","Solo la apariencia","El número de usuarios en el mundo"],e:"SO, lenguaje y herramientas/disponibilidad (trabajo cooperativo, plugins, interfaz)."},
{n:"media",t:"IDE",q:"¿Cuál de estos es un IDE en la nube?",o:["Cloud 9 (Amazon)","Eclipse","NetBeans","Visual Studio 2019"],e:"Cloud 9 de Amazon y CodeAnywhere son ejemplos de IDE en la nube."},
{n:"facil",t:"IDE",q:"¿Cuál es una ventaja de un IDE en la nube?",o:["Es accesible desde cualquier equipo con navegador","Es siempre gratuito","Es más amigable que uno de escritorio","No necesita conexión a Internet para funcionar"],e:"Ventaja: acceso desde cualquier lugar. Inconvenientes: menos usabilidad y el precio."},
{n:"media",t:"IDE",q:"¿Qué inconvenientes se citan de los IDE en la nube?",o:["Pérdida de usabilidad y precios elevados","No permiten escribir ni ejecutar código","Solo funcionan en Linux","No admiten varios lenguajes de programación"],e:"Se pierde usabilidad y el precio puede ser una barrera."},
{n:"facil",t:"IDE",q:"Si el programa tiene interfaz gráfica, ¿qué herramienta del IDE ayuda a crearla?",o:["El constructor de interfaces gráficas","El depurador","El intérprete","El enlazador"],e:"El constructor de GUI permite crearla de forma visual."},
{n:"media",t:"IDE",q:"Según el tipo de lenguaje, un IDE incluirá…",o:["Un compilador o un intérprete","Siempre ambos obligatoriamente","Solo un depurador","Un sistema operativo"],e:"Compilador para lenguajes compilados, intérprete para interpretados."}
];

</script>
<script>
// Creador de examen de Entornos de Desarrollo (tipo test). CFG (unidades, claves) viene del banco.
// Examen como el real: 10 preguntas, 4 opciones, una correcta. Sale 8 fáciles + 2 medias.
// Los datos (fallos, historial, preguntas vistas) usan las mismas claves que la versión 2, así que no se pierden.
'use strict';
const app = document.getElementById('app');
const N_EXAMEN = 10, N_MEDIAS = 2;
const L = ['A', 'B', 'C', 'D'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toFixed(2).replace('.', ',');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
const validas = new Set(BANK.map(q => q.q));
const seenMap = () => store(CFG.k.seen) || {};
function failMap() { const f = store(CFG.k.fails) || {}; Object.keys(f).forEach(k => { if (!validas.has(k)) delete f[k]; }); return f; }
const historial = () => store(CFG.k.hist) || [];
// Tema: siempre claro al abrir; si lo abre el menú de repaso, usa el tema del menú (?tema=dark|light)
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};
const LOCKUP = '<a class="c-lockup" href="#" data-ir="inicio" aria-label="Inicio"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#concep-simbolo"/></svg><span class="c-wordmark">Concep</span></a>';

function mount(html) {
  document.body.classList.toggle('claro', tema === 'light');
  const root = document.createElement('div');
  root.className = tema === 'light' ? 'concep' : 'concep-dark';
  root.innerHTML = html;
  app.replaceChildren(root);
  window.scrollTo(0, 0);
}
function topBar(centro, derecha) {
  return '<header class="top">' + LOCKUP + '<span class="sep" aria-hidden="true"></span>' + centro + '<div class="grow"></div><div class="acc">' + (derecha || '') +
    '<button class="btn btn--ghost icon-btn" data-tema title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">' + (tema === 'light' ? IC.moon : IC.sun) + '</button></div></header>';
}
const MODULO = '<div class="modulo"><b>Entornos de desarrollo</b><span>Creador de examen ' + CFG.ut + '</span></div>';

// ---------- inicio ----------
function vistaInicio(abrir) {
  const h = historial(), f = failMap();
  const nf = Object.keys(f).length;
  const media = h.length ? h.reduce((s, x) => s + x, 0) / h.length : null;
  const fallos = BANK.filter(q => f[q.q]).sort((a, b) => f[b.q] - f[a.q]);
  mount(topBar(MODULO) +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">Concep · Entornos de desarrollo · ' + CFG.ut + '</span>' +
    '<h1>Creador de examen ' + CFG.ut + '</h1><p>Diez preguntas como las del examen: cuatro opciones y una sola correcta, casi todas sencillas. Al corregir ves la nota, la respuesta buena y por qué. Lo que fallas se guarda para repasarlo.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + BANK.length + '</div><div class="l">Preguntas</div></div><div class="stat"><div class="v">' + h.length + '</div><div class="l">' + (h.length === 1 ? 'Examen' : 'Exámenes') + '</div></div><div class="stat"><div class="v">' + (media === null ? '—' : fmt(media)) + '</div><div class="l">Nota media</div></div></div></section>' +
    '<div class="grid2">' +
    '<section class="card card--accent" aria-labelledby="h-nuevo"><h2 id="h-nuevo">Nuevo examen</h2><p class="sub">Preguntas de todo el temario de ' + CFG.temario + ', primero las que menos has visto.</p>' +
    '<ul class="reglas"><li>10 preguntas tipo test, cada una vale 1 punto.</li><li>8 fáciles y 2 un poco más de detalle, como en el examen real.</li><li>Puedes dejar preguntas en blanco.</li></ul>' +
    '<label class="check"><input type="checkbox" id="penal"' + (store(CFG.k.penal) ? ' checked' : '') + '> Restar errores (−0,33 por fallo)</label>' +
    '<div class="fila"><button class="btn btn--primary btn--lg" data-empezar="normal">' + IC.play + 'Empezar examen</button></div>' +
    (h.length ? '<div class="hist"><span>Últimos intentos</span>' + h.slice(-8).map(x => '<span class="nota-chip ' + (x >= 5 ? 'ap' : 'su') + '">' + fmt(x) + '</span>').join('') + '</div>' : '') +
    '</section>' +
    '<section class="card" aria-labelledby="h-fallos"><h2 id="h-fallos">Mis fallos</h2>' +
    (nf ? '<p class="sub">' + nf + (nf === 1 ? ' pregunta guardada' : ' preguntas guardadas') + '. Cada fallo o pregunta en blanco suma 1 y cada acierto resta 1; al llegar a 0 sale de la lista.</p>'
      : '<p class="vacio-txt">Aún no tienes fallos guardados. Haz un examen y aquí aparecerán las que falles o dejes en blanco.</p>') +
    '<div class="fila"><button class="btn btn--primary" data-empezar="fallos"' + (nf ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (nf ? ' (' + Math.min(N_EXAMEN, nf) + ')' : '') + '</button>' +
    '<button class="btn" data-ver-fallos' + (nf ? '' : ' disabled') + ' aria-expanded="' + (abrir === 'lista') + '">Ver lista</button><button class="btn btn--ghost" data-copia aria-expanded="' + (abrir === 'copia') + '">Copia de seguridad</button></div>' +
    '<div id="lista"' + (abrir === 'lista' && nf ? '' : ' hidden') + '><ol class="lista-fallos">' + fallos.map(q => '<li><span class="x">×' + f[q.q] + '</span>' + esc(q.q) + '<span class="ok">✓ ' + esc(q.o[0]) + '</span></li>').join('') + '</ol>' +
    '<div class="fila" style="margin-top:10px"><button class="btn btn--danger btn--sm" data-vaciar>Vaciar lista de fallos</button></div></div>' +
    '<div id="copia"' + (abrir === 'copia' ? '' : ' hidden') + '><p class="vacio-txt" style="margin:16px 0 0">Los fallos se guardan solo en este navegador. Copia este texto para no perderlos, o pega uno para restaurarlos.</p>' +
    '<textarea class="copia" id="copiaTxt" spellcheck="false" aria-label="Copia de seguridad de los fallos">' + esc(JSON.stringify(f)) + '</textarea>' +
    '<div class="fila" style="margin-top:8px"><button class="btn btn--sm" data-copiar>Copiar</button><button class="btn btn--sm" data-restaurar>Restaurar desde el texto</button><span class="msg" id="copiaMsg" role="status"></span></div></div>' +
    '</section></div></main>');
}

// ---------- examen ----------
let examen = null; // { modo, items: [{q, opts:[{text, ok}], resp, prev}] }
function elegir(modo) {
  if (modo === 'fallos') {
    const f = failMap();
    return shuffle(shuffle(BANK.filter(q => f[q.q])).sort((a, b) => f[b.q] - f[a.q]).slice(0, N_EXAMEN));
  }
  const seen = seenMap();
  const porVistas = pool => shuffle(pool).sort((a, b) => (seen[a.q] || 0) - (seen[b.q] || 0));
  const medias = porVistas(BANK.filter(q => q.n === 'media')).slice(0, N_MEDIAS);
  const faciles = porVistas(BANK.filter(q => q.n !== 'media')).slice(0, N_EXAMEN - medias.length);
  return shuffle([...faciles, ...medias]);
}
function empezar(modo) {
  const picks = elegir(modo);
  if (!picks.length) return;
  const f = failMap();
  examen = { modo, penal: !!store(CFG.k.penal), items: picks.map(q => ({ q, opts: shuffle(q.o.map((text, k) => ({ text, ok: k === 0 }))), resp: null, prev: f[q.q] || 0 })) };
  vistaExamen();
}
function htmlPregunta(it, n, corregida) {
  const ci = it.opts.findIndex(o => o.ok);
  let estado = '';
  if (corregida) estado = it.resp === null ? '<span class="estado blanco">En blanco</span>' : it.resp === ci ? '<span class="estado bien">Correcta</span>' : '<span class="estado mal">Incorrecta</span>';
  return '<article class="q' + (corregida ? ' hecha' : '') + '" id="p' + n + '"><div class="meta"><span class="n">Pregunta ' + (n + 1) + '</span><span>· ' + esc(it.q.t) + '</span>' +
    (it.prev && !corregida ? '<span>· fallada ' + it.prev + (it.prev > 1 ? ' veces' : ' vez') + '</span>' : '') + estado + '</div>' +
    '<h3 id="h' + n + '">' + esc(it.q.q) + '</h3><div class="opts" role="radiogroup" aria-labelledby="h' + n + '">' +
    it.opts.map((o, k) => {
      const cls = corregida ? (k === ci ? ' bien' : (k === it.resp ? ' mal' : '')) : '';
      return '<label class="opt' + cls + '"><input type="radio" name="q' + n + '" value="' + k + '"' + (it.resp === k ? ' checked' : '') + (corregida ? ' disabled' : '') + '><span class="l">' + L[k] + '</span><span class="t">' + esc(o.text) + '</span></label>';
    }).join('') + '</div>' +
    (corregida ? '<div class="expl"><b>Respuesta correcta: ' + L[ci] + ') ' + esc(it.opts[ci].text) + '</b><br>' + esc(it.q.e) + '</div>' : '') + '</article>';
}
function vistaExamen() {
  const it = examen.items;
  mount(topBar('<button class="btn btn--ghost btn--sm" data-salir>' + IC.back + 'Salir</button><div class="modulo"><b>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : 'Examen') + '</b><span>' + pl(it.length, 'pregunta', 'preguntas') + ' · ETS</span></div>',
    '<span class="progreso" id="prog" aria-live="polite"></span>') +
    '<main class="examen-page fade-in">' + it.map((x, n) => htmlPregunta(x, n, false)).join('') + '</main>' +
    '<div class="barra-fija"><div class="in"><button class="btn btn--primary" data-corregir>' + IC.check + 'Corregir examen</button><nav class="puntos" aria-label="Ir a una pregunta" id="puntos"></nav><span class="aviso" id="aviso" role="status"></span></div></div>');
  progreso();
}
function progreso() {
  const r = examen.items.filter(x => x.resp !== null).length;
  const p = document.getElementById('prog'); if (p) p.textContent = r + '/' + examen.items.length;
  const pt = document.getElementById('puntos');
  if (pt) pt.innerHTML = examen.items.map((x, n) => '<a href="#p' + n + '" class="' + (x.resp !== null ? 'r' : '') + '" aria-label="Pregunta ' + (n + 1) + (x.resp !== null ? ', respondida' : '') + '">' + (n + 1) + '</a>').join('');
}

// ---------- corrección ----------
function corregir() {
  const it = examen.items;
  let ok = 0, mal = 0, blanco = 0;
  it.forEach(x => { const ci = x.opts.findIndex(o => o.ok); if (x.resp === null) blanco++; else if (x.resp === ci) ok++; else mal++; });
  const nota = Math.max(0, (ok - (examen.penal ? mal / 3 : 0)) * 10 / it.length);
  const seen = seenMap(); it.forEach(x => seen[x.q.q] = (seen[x.q.q] || 0) + 1); store(CFG.k.seen, seen);
  const h = historial(); h.push(nota); store(CFG.k.hist, h.slice(-20));
  const f = failMap(); let nuevas = 0, superadas = 0;
  it.forEach(x => {
    const bien = x.resp !== null && x.opts[x.resp].ok;
    if (!bien) { if (!f[x.q.q]) nuevas++; f[x.q.q] = (f[x.q.q] || 0) + 1; }
    else if (f[x.q.q]) { f[x.q.q]--; if (f[x.q.q] <= 0) { delete f[x.q.q]; superadas++; } }
  });
  store(CFG.k.fails, f);
  const quedan = Object.keys(f).length;
  const ap = nota >= 5;
  mount(topBar('<button class="btn btn--ghost btn--sm" data-ir="inicio">' + IC.back + 'Inicio</button><div class="modulo"><b>Resultado</b><span>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : 'Examen') + ' · ETS</span></div>') +
    '<main class="examen-page fade-in"><section class="card card--accent"><div class="resultado"><div class="big">' + fmt(nota) + '<small> /10</small></div>' +
    '<div><div class="veredicto ' + (ap ? 'ap' : 'su') + '">' + (nota >= 9 ? 'Sobresaliente' : nota >= 7 ? 'Notable' : nota >= 6 ? 'Bien' : ap ? 'Aprobado' : 'Suspenso') + '</div><div class="medidor"><div style="width:' + (nota * 10) + '%"></div></div>' +
    '<div class="resumen">' + pl(ok, 'correcta', 'correctas') + ' · ' + pl(mal, 'incorrecta', 'incorrectas') + ' · ' + blanco + ' en blanco' + (examen.penal ? ' · −0,33 por fallo' : '') + '</div>' +
    '<div class="resumen">Lista de fallos: ' + (nuevas ? '+' + pl(nuevas, 'nueva', 'nuevas') : 'ninguna nueva') + (superadas ? ' · ' + pl(superadas, 'superada', 'superadas') : '') + ' · ' + quedan + ' en total.</div></div></div>' +
    '<div class="fila"><button class="btn btn--primary" data-empezar="normal">' + IC.play + 'Nuevo examen</button><button class="btn" data-empezar="fallos"' + (quedan ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (quedan ? ' (' + Math.min(N_EXAMEN, quedan) + ')' : '') + '</button></div></section>' +
    '<h2 class="seccion-t">Corrección</h2>' + it.map((x, n) => htmlPregunta(x, n, true)).join('') + '</main>');
}

// ---------- eventos ----------
function cambiarTema(btn) {
  tema = tema === 'light' ? 'dark' : 'light'; store(CFG.k.tema, tema);
  const root = app.firstElementChild; root.classList.remove('concep', 'concep-dark'); root.classList.add(tema === 'light' ? 'concep' : 'concep-dark');
  document.body.classList.toggle('claro', tema === 'light'); btn.innerHTML = tema === 'light' ? IC.moon : IC.sun;
}
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'penal') store(CFG.k.penal, t.checked);
  if (t.type === 'radio' && examen) { examen.items[+t.name.slice(1)].resp = +t.value; progreso(); const a = document.getElementById('aviso'); if (a) a.textContent = ''; }
});
// Confirmación de doble clic: el primer clic arma el botón y, si no se vuelve a pulsar en 4 s, se desarma solo
function armar(b, texto, alDesarmar) {
  if (b.dataset.c) return false;
  const antes = b.innerHTML;
  b.dataset.c = '1'; b.lastChild.textContent = texto;
  setTimeout(() => { if (b.isConnected && b.dataset.c) { delete b.dataset.c; b.innerHTML = antes; if (alDesarmar) alDesarmar(); } }, 4000);
  return true;
}
app.addEventListener('click', async ev => {
  const b = ev.target.closest('button, a[data-ir]');
  if (!b) return;
  if (b.hasAttribute('data-tema')) return cambiarTema(b);
  if (b.dataset.ir === 'inicio') { ev.preventDefault(); examen = null; return vistaInicio(); }
  if (b.dataset.empezar) return empezar(b.dataset.empezar);
  if (b.hasAttribute('data-salir')) {
    if (armar(b, '¿Seguro?')) return;
    examen = null; return vistaInicio();
  }
  if (b.hasAttribute('data-corregir')) {
    const blancas = examen.items.filter(x => x.resp === null).length;
    const aviso = document.getElementById('aviso');
    if (blancas && armar(b, 'Corregir igualmente', () => { aviso.textContent = ''; })) { aviso.textContent = (blancas === 1 ? 'Te queda 1 pregunta' : 'Te quedan ' + blancas + ' preguntas') + ' en blanco.'; return; }
    return corregir();
  }
  if (b.hasAttribute('data-ver-fallos')) { const l = document.getElementById('lista'); l.hidden = !l.hidden; b.setAttribute('aria-expanded', !l.hidden); return; }
  if (b.hasAttribute('data-copia')) { const c = document.getElementById('copia'); c.hidden = !c.hidden; b.setAttribute('aria-expanded', !c.hidden); return; }
  if (b.hasAttribute('data-vaciar')) {
    if (armar(b, 'Pulsa otra vez para vaciarla')) return;
    store(CFG.k.fails, {}); return vistaInicio();
  }
  if (b.hasAttribute('data-copiar')) {
    const ta = document.getElementById('copiaTxt'), m = document.getElementById('copiaMsg');
    try { await navigator.clipboard.writeText(ta.value); m.textContent = 'Copiado'; } catch (e) { ta.select(); m.textContent = 'Selecciona el texto y cópialo a mano'; }
    return;
  }
  if (b.hasAttribute('data-restaurar')) {
    const m = document.getElementById('copiaMsg');
    try {
      const data = JSON.parse(document.getElementById('copiaTxt').value);
      if (typeof data !== 'object' || Array.isArray(data) || !data) throw 0;
      const limpio = {}; Object.entries(data).forEach(([k, v]) => { if (validas.has(k) && +v > 0) limpio[k] = Math.round(+v); });
      if (!Object.keys(limpio).length) { m.textContent = 'La copia no tiene ninguna pregunta válida; no se ha cambiado nada. Para borrar la lista usa «Vaciar».'; return; }
      store(CFG.k.fails, limpio); vistaInicio('copia');
      document.getElementById('copiaMsg').textContent = 'Restaurada' + (Object.keys(limpio).length === 1 ? ' 1 pregunta' : 's ' + Object.keys(limpio).length + ' preguntas');
    } catch (e) { m.textContent = 'El texto no es una copia válida'; }
  }
});
vistaInicio();

</script>
</body>
</html>
