<style>
/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Examen de Entornos de Desarrollo — mismo estilo que el menú de repaso y el creador de Java ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
  /* Color de ETS (portada de EVAGD), el mismo que en el menú de repaso */
  --asig: #FD8127;
  --asig-tinta: #0B0B0C;
}
/* Contraste AA para texto pequeño (los tokens de marca se quedan algo cortos a 11–13 px) */
.concep { --text-3: #62626E; --ok-txt: #0B7A55; --warn-txt: #8A5500; --err-txt: #B00D4A; }
.concep-dark { --text-3: #8A8A98; --ok-txt: var(--ok); --warn-txt: var(--warn); --err-txt: var(--error); }
#app > div { --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text)); --focus: var(--asig); --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent); --err-bg: color-mix(in srgb, var(--error) 10%, transparent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), filter var(--dur-1); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--asig); border-color: transparent; color: var(--asig-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--asig); }
.btn--primary:hover { background: var(--asig); filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--danger { color: var(--err-txt); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: transparent; }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--lg { min-height: 46px; padding: 0 22px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--asig); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.progreso { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- página ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 16ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 58ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, color-mix(in srgb, var(--asig) 28%, transparent), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; overflow: hidden; }
.card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--asig); }
.card h2 { font: 600 17px/1.2 var(--f-titulo); letter-spacing: -.015em; margin: 0 0 4px; color: var(--text); }
.card .sub { color: var(--text-3); font-size: 12px; margin: 0 0 18px; font-family: var(--f-prosa); line-height: 1.5; }
.lbl { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.reglas { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.reglas li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); font: 400 13.5px/1.5 var(--f-prosa); }
.reglas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--asig); flex: none; transform: translateY(-2px); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
.check input { accent-color: var(--asig); width: 16px; height: 16px; margin: 0; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hist { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.nota-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 600 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.nota-chip.ap { color: var(--ok-txt); }
.nota-chip.su { color: var(--err-txt); }
.vacio-txt { color: var(--text-3); font: 400 13px/1.55 var(--f-prosa); margin: 0 0 16px; }
.lista-fallos { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.lista-fallos li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 400 13px/1.45 var(--f-prosa); color: var(--text); }
.lista-fallos li .ok { display: block; margin-top: 4px; color: var(--ok-txt); font-size: 12px; }
.lista-fallos li .x { float: right; margin-left: 8px; font: 600 11px var(--f-ui); color: var(--err-txt); }
textarea.copia { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 400 11.5px/1.4 var(--f-ui); resize: vertical; }
.msg { font-size: 12px; color: var(--text-3); }

/* ---------- examen ---------- */
.examen-page { max-width: 820px; margin: 0 auto; padding: 26px 24px 120px; }
.q { padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; scroll-margin-top: 80px; }
.q .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.q .meta .n { color: var(--acento-texto); font-weight: 600; }
.q h3 { font: 600 17px/1.35 var(--f-titulo); letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--f-prosa); cursor: pointer; transition: border-color var(--dur-1), background-color var(--dur-1); }
.opt:hover { border-color: var(--border-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-strong); font: 600 12px var(--f-ui); color: var(--text-2); }
.opt .t { padding-top: 2px; }
.opt:has(input:checked) { border-color: var(--asig); background: color-mix(in srgb, var(--asig) 9%, var(--bg)); }
.opt:has(input:checked) .l { background: var(--asig); border-color: var(--asig); color: var(--asig-tinta); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.q.hecha .opt { cursor: default; }
.q.hecha .opt.bien { border-color: var(--ok); background: var(--ok-bg); }
.q.hecha .opt.bien .l { background: var(--ok); border-color: var(--ok); color: #0B0B0C; }
.q.hecha .opt.mal { border-color: var(--error); background: var(--err-bg); }
.q.hecha .opt.mal .l { background: var(--error); border-color: var(--error); color: #0B0B0C; }
.concep .q.hecha .opt.mal .l { color: #fff; }
.estado { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font: 600 11px var(--f-ui); letter-spacing: 0; text-transform: none; }
.estado.bien { color: var(--ok-txt); background: var(--ok-bg); }
.estado.mal { color: var(--err-txt); background: var(--err-bg); }
.estado.blanco { color: var(--text-2); background: var(--surface-2); }
.expl { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border-left: 3px solid var(--asig); background: color-mix(in srgb, var(--asig) 6%, transparent); color: var(--text-2); font: 400 13.5px/1.55 var(--f-prosa); }
.expl b { color: var(--text); font-weight: 600; }
.barra-fija { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.barra-fija .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.barra-fija .aviso { font-size: 12px; color: var(--warn-txt); }
.puntos { display: flex; gap: 4px; flex-wrap: wrap; }
.puntos a { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--border); font: 600 10px var(--f-ui); color: var(--text-3); text-decoration: none; }
.puntos a.r { background: color-mix(in srgb, var(--asig) 16%, transparent); border-color: color-mix(in srgb, var(--asig) 50%, transparent); color: var(--acento-texto); }

/* ---------- resultado ---------- */
.resultado { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; margin-bottom: 22px; }
.resultado .big { font: 700 64px/1 var(--f-titulo); letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--text); }
.resultado .big small { font-size: 18px; color: var(--text-3); font-weight: 500; letter-spacing: 0; }
.resultado .veredicto { font: 600 15px var(--f-titulo); margin-bottom: 8px; }
.resultado .veredicto.ap { color: var(--ok-txt); }
.resultado .veredicto.su { color: var(--err-txt); }
.medidor { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.medidor > div { height: 100%; border-radius: inherit; background: var(--asig); }
.resumen { margin-top: 10px; color: var(--text-2); font-size: 12.5px; }
.seccion-t { font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 26px 0 12px; }

.fade-in { animation: entra var(--dur-3) var(--ease-out) both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .btn, .opt { transition: none; } }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .hero-stats { flex-wrap: wrap; }
  .stat { flex: 1; min-width: 96px; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .top { gap: 10px; padding: 8px 16px; }
  .top .c-wordmark, .top .sep { display: none; }
  .page, .examen-page { padding-left: 16px; padding-right: 16px; }
  .q, .card { padding: 18px 16px; }
  .resultado { grid-template-columns: 1fr; gap: 10px; }
  .resultado .big { font-size: 52px; }
  .barra-fija { padding-left: 16px; padding-right: 16px; }
  .puntos { display: none; }
}

<noscript><p style="padding:24px;color:#fff;font-family:sans-serif">Este creador de examen necesita JavaScript activado.</p></noscript>
<script>
const CFG = { ut: "UT4–UT5", temario: "UT4 y UT5", k: { seen: "ets45_seen", fails: "ets45_fails", hist: "ets45_hist", penal: "ets45_penal", tema: "ets45_tema" } };
// Banco de Entornos de Desarrollo UT4–UT5: depurador (UT4), control de versiones, Git, GitHub y Scrum (UT5).
// Sacado del resumen UT4_T02_Resumen_examen_UT4-UT5.pdf (apuntes «Uso del depurador», «Control de versiones» y «Metodologías ágiles»).
// n: "facil" | "media". La opción correcta es SIEMPRE la primera de o (se barajan al mostrar). e: explicación.
// El examen saca 8 fáciles y 2 medias, como el de UT1–UT2.
const BANK = [
// ---------- UT4 · Depurador ----------
{n:"facil",t:"Depurador",q:"¿Qué es un depurador (debugger)?",o:["Una herramienta que ayuda a encontrar y corregir errores","Un programa que traduce el código fuente a código máquina","Un editor que colorea la sintaxis del código fuente","Un sistema que guarda las versiones de los ficheros"],e:"El depurador ejecuta el código paso a paso para detectar y corregir errores. Traducir es cosa del compilador y guardar versiones, del control de versiones."},
{n:"media",t:"Depurador",q:"Según los apuntes, ¿qué parte de su tiempo dedican los programadores a buscar errores?",o:["Alrededor del 50 %","Alrededor del 10 %","Alrededor del 25 %","Alrededor del 90 %"],e:"Según una encuesta a programadores de EE. UU., cerca del 50 % del tiempo se va en buscar errores."},
{n:"facil",t:"Depurador",q:"¿Los depuradores son exclusivos de Visual Studio?",o:["No, la mayoría de los IDE incluyen uno","Sí, solo Visual Studio tiene depurador","Sí, y además solo funcionan con C#","No, pero solo existen en IDE de pago"],e:"Casi todos los IDE (Visual Studio, NetBeans, IntelliJ, VS Code…) traen su depurador."},
{n:"facil",t:"Depurador",q:"Sin depurador, cuando un programa falla, ¿qué vemos normalmente?",o:["La traza de la excepción en la consola","El valor de todas las variables en cada línea","La línea exacta que hay que corregir y cómo","Nada, el programa se cierra sin mostrar nada"],e:"Solo vemos la traza de la excepción (por ejemplo ClassNotFoundException). El depurador deja ver qué pasa dentro antes del error."},
{n:"facil",t:"Breakpoints",q:"¿Qué es un breakpoint?",o:["Un punto donde la ejecución se detiene","Un error que hace que el programa se cierre","Una línea que el compilador se salta siempre","Un comentario especial que marca código viejo"],e:"Un breakpoint (punto de interrupción) para la ejecución en esa línea para poder examinar el programa y retomarlo después."},
{n:"media",t:"Breakpoints",q:"¿Por qué dos motivos se para un programa en un breakpoint?",o:["Para ver el estado del programa y para descartar errores","Para compilar más rápido y para ahorrar memoria RAM","Para guardar una versión y para subirla al remoto luego","Para cerrar el programa y para volver a lanzarlo luego"],e:"Se para para ver el estado (valores de las variables) y para descartar errores: si se llega bien, lo anterior funciona."},
{n:"facil",t:"Breakpoints",q:"Si la ejecución llega sin problemas a un breakpoint, ¿qué sabemos?",o:["Que el código anterior no ha fallado","Que el programa entero ya no tiene errores","Que el código posterior no va a fallar","Que hay que quitar ese breakpoint ya"],e:"Llegar bien a un breakpoint descarta errores en el código que se ejecutó antes."},
{n:"facil",t:"Breakpoints",q:"¿Cómo se pone un breakpoint en Visual Studio?",o:["Haciendo clic en la banda gris a la izquierda del código","Escribiendo la palabra breakpoint al final de la línea","Pulsando dos veces la tecla Intro sobre la línea","Seleccionando la línea y pulsando el botón Compilar todo"],e:"Clic en el margen gris (o F9). Aparece una bola que indica que la ejecución se parará ahí."},
{n:"media",t:"Breakpoints",q:"¿Qué tecla pone o quita un breakpoint en Visual Studio?",o:["F9","F5","F10","F11"],e:"F9 pone o quita el breakpoint. F5 inicia/continúa, F10 es Step Over y F11 Step Into."},
{n:"facil",t:"Breakpoints",q:"¿Qué es un breakpoint condicional?",o:["Uno que solo para si se cumple una condición","Uno que para el programa en todas las líneas","Uno que solo funciona si no hay errores","Uno que borra las variables al pararse"],e:"Solo detiene la ejecución si se cumple una condición; por ejemplo, cuando se ha pasado por él X veces."},
{n:"media",t:"Breakpoints",q:"El fallo solo ocurre en la vuelta 500 de un bucle. ¿Qué es lo más cómodo?",o:["Un breakpoint condicional","Un breakpoint en cada línea","Pulsar Continuar 500 veces","Usar Step Out en el bucle"],e:"Con un breakpoint condicional (o por recuento de visitas) se para justo en esa vuelta, sin ir una a una."},
{n:"facil",t:"Botones",q:"¿Con qué botón se inicia la depuración en Visual Studio?",o:["Con el play de fondo verde relleno (F5)","Con el cuadrado rojo de la barra (Mayús+F5)","Con la flecha blanca de la barra (Alt+F10)","Con el botón de guardar todo (Ctrl+Mayús+S)"],e:"El play verde relleno (Iniciar depuración, F5). El cuadrado rojo la detiene."},
{n:"facil",t:"Botones",q:"¿Qué hace el botón Continuar?",o:["Sigue hasta el siguiente breakpoint","Avanza solo una línea y se vuelve a parar","Vuelve a lanzar el programa desde el principio","Sale del método actual y vuelve al que llamó"],e:"Continuar (F5) reanuda el programa hasta el próximo breakpoint (o hasta el final)."},
{n:"facil",t:"Botones",q:"¿Qué hace el cuadrado rojo durante la depuración?",o:["Detiene la depuración","Pone un breakpoint nuevo","Reinicia el programa","Pasa a la línea siguiente"],e:"El cuadrado rojo (Detener) para la depuración."},
{n:"facil",t:"Botones",q:"¿Qué hace el botón Reiniciar?",o:["Vuelve a lanzar el programa desde el principio","Borra todos los breakpoints que hay puestos","Avanza hasta el siguiente breakpoint del código","Deshace el último cambio que hiciste en el código"],e:"Reiniciar relanza el programa desde el principio, en modo depuración."},
{n:"facil",t:"Botones",q:"¿Qué hace Step Into (F11)?",o:["Avanza un paso y entra en la función llamada","Ejecuta la función entera sin entrar en ella","Sale del método actual y vuelve al que llamó","Sigue la ejecución hasta el próximo breakpoint"],e:"Into = entra. Si la línea llama a una función, entra dentro para recorrerla línea a línea."},
{n:"facil",t:"Botones",q:"¿Qué hace Step Over (F10)?",o:["Ejecuta la línea entera sin entrar en la función","Entra dentro de la función para verla por dentro","Sale del método actual y vuelve al que llamó","Detiene la depuración y cierra el programa"],e:"Over = pasa por encima. Si es una llamada a función, la ejecuta completa sin entrar."},
{n:"facil",t:"Botones",q:"¿Qué hace Step Out (Mayús+F11)?",o:["Acaba el método actual y vuelve al que lo llamó","Entra dentro de la función que se va a llamar ahora","Ejecuta la línea sin entrar en ninguna función","Para la depuración y sale del programa"],e:"Out = sale. Termina el método en el que estás y vuelve al que lo llamó."},
{n:"facil",t:"Botones",q:"Estás en una línea que llama a calcular() y quieres ver qué pasa dentro. ¿Qué usas?",o:["Step Into","Step Over","Step Out","Detener"],e:"Para entrar en la función se usa Step Into."},
{n:"facil",t:"Botones",q:"Sabes que calcular() funciona bien y no quieres entrar en ella. ¿Qué usas?",o:["Step Over","Step Into","Step Out","Reiniciar"],e:"Step Over ejecuta la llamada entera y pasa a la línea siguiente."},
{n:"media",t:"Botones",q:"Has entrado en sumar() con Step Into y ya has visto lo que querías. ¿Qué usas para volver?",o:["Step Out","Step Over","Step Into","Reiniciar"],e:"Step Out termina sumar() y te devuelve al método que la llamó."},
{n:"media",t:"Botones",q:"¿Qué tecla corresponde a Step Over en Visual Studio?",o:["F10","F11","F5","F9"],e:"F10 = Step Over, F11 = Step Into, Mayús+F11 = Step Out, F5 = iniciar/continuar, F9 = breakpoint."},
{n:"facil",t:"Botones",q:"¿Qué muestra la flecha blanca (Mostrar instrucción siguiente)?",o:["La próxima instrucción que se va a ejecutar","La última instrucción que ha dado algún error","El primer breakpoint que hay en el código","La función que llamó al método actual"],e:"Muestra cuál es la próxima instrucción que se ejecutará."},
{n:"facil",t:"Ventanas",q:"Al pararse en un breakpoint, ¿dónde se ven los valores de las variables?",o:["En la ventana de variables o con el ratón encima","En la consola, porque el programa los imprime solo","En el explorador de soluciones, junto a cada fichero","En ningún sitio: hay que añadir un Console.WriteLine"],e:"En la ventana Automático / Variables locales (abajo a la izquierda) o dejando el cursor sobre la variable."},
{n:"facil",t:"Ventanas",q:"¿Qué es la pila de llamadas (call stack)?",o:["La ventana que muestra el orden en que se han llamado las funciones","La lista de errores que ha encontrado el compilador en el proyecto","La lista de breakpoints que hay puestos en todo el código fuente","La memoria donde se guardan los ficheros del repositorio de Git"],e:"La pila de llamadas muestra en qué orden se han ido llamando las funciones hasta llegar a la línea actual."},
{n:"media",t:"Ventanas",q:"En un programa sin funciones propias, ¿qué aparece en la pila de llamadas?",o:["Solo la función Main","Todas las variables","Todos los breakpoints","Nada, sale vacía"],e:"Al principio solo aparece Main; al modularizar el programa se ven todas las llamadas."},
{n:"facil",t:"Ventanas",q:"¿Qué permite la pestaña Breakpoints?",o:["Activar o desactivar breakpoints y ponerles condiciones","Ver el historial de commits del repositorio del proyecto","Compilar el proyecto sin tener que lanzar la depuración","Cambiar el lenguaje de programación del proyecto"],e:"Desde la pestaña Breakpoints se activan, desactivan y se les ponen condiciones (como el recuento de visitas)."},
{n:"media",t:"Depurador",q:"¿Cuál es el orden lógico para depurar un fallo?",o:["Poner un breakpoint, iniciar la depuración y mirar las variables","Iniciar la depuración, cerrar el IDE y revisar el código a mano","Mirar las variables, compilar y después poner un breakpoint","Hacer un commit, un push y esperar a que alguien lo arregle"],e:"Breakpoint en la zona sospechosa → play verde (F5) → al pararse, mirar variables y avanzar con Step Over/Into/Out."},
// ---------- UT5 · Control de versiones ----------
{n:"facil",t:"VCS",q:"¿Qué es un VCS?",o:["Un sistema de control de versiones","Un sistema de compilación visual","Un servidor de copias por correo electrónico","Un compilador de código seguro"],e:"VCS = Version Control System: software que monitoriza y gestiona los cambios en un sistema de archivos."},
{n:"facil",t:"VCS",q:"¿Cómo se llama la carpeta que controla un VCS?",o:["Repositorio","Directorio raíz","Biblioteca","Proyecto base"],e:"La carpeta gestionada por el VCS es el repositorio."},
{n:"facil",t:"VCS",q:"¿Por qué hace falta un sistema de control de versiones?",o:["Porque varias personas tocan a la vez el mismo código","Porque sin él el código no se puede compilar ni ejecutar","Porque los IDE no permiten guardar ficheros por su cuenta","Porque es obligatorio para programar en C# y en Java"],e:"Los equipos (de 3 a 9 personas, más las que pasaron antes) trabajan a la vez y durante años; hacerlo a mano es inviable."},
{n:"media",t:"VCS",q:"¿Cuál NO es una ventaja de un VCS?",o:["Impedir que existan conflictos","Guardar solo las diferencias","Saber quién hizo cada versión","Volver a una versión estable"],e:"Los VCS ayudan a resolver conflictos, pero no impiden que aparezcan."},
{n:"facil",t:"VCS",q:"¿Qué guarda un VCS entre una versión y la siguiente?",o:["Solo las diferencias entre versiones","Una copia completa de todo cada vez","Solo el nombre de los ficheros","Solo los ficheros que se borraron"],e:"Solo se guardan las diferencias entre versiones, lo que lo hace eficiente."},
{n:"facil",t:"Vocabulario",q:"¿Cómo se llama la versión más actual?",o:["HEAD","Baseline","Master","Origin"],e:"La versión más actual es HEAD. Baseline es una versión aprobada y master/main la rama principal."},
{n:"media",t:"Vocabulario",q:"¿Qué es una baseline?",o:["Una versión aprobada a partir de la cual se hacen cambios","La primera línea de código de cada fichero del proyecto","La rama que se crea para corregir un bug muy urgente","El servidor donde se guarda el repositorio remoto"],e:"Baseline = versión aprobada de un fichero de la que parten los cambios."},
{n:"facil",t:"Vocabulario",q:"¿Qué es una rama (branch)?",o:["Una copia del proyecto para trabajar aparte","Un fichero que lista lo que Git debe ignorar","Un comando que sube los cambios al repositorio remoto","Una carpeta oculta con los metadatos de Git"],e:"Una rama es una copia del proyecto en un momento dado (pruebas, bugs, nueva versión…) que luego se puede fusionar."},
{n:"facil",t:"Vocabulario",q:"¿Cómo se llama la rama principal?",o:["master o main","origin o remote","HEAD o baseline","fork o clone"],e:"La rama principal se llama master (o main en los repositorios más nuevos)."},
{n:"facil",t:"Vocabulario",q:"¿Qué diferencia hay entre commit y push?",o:["Commit guarda en el repositorio local; push sube al remoto","Commit sube al remoto; push guarda en el repositorio local","Son lo mismo, pero push solo se usa en Visual Studio","Commit borra cambios; push los recupera del remoto"],e:"Commit lleva los cambios al repositorio local; push los sube al remoto («a la nube»)."},
{n:"facil",t:"Vocabulario",q:"¿Qué hace pull?",o:["Trae los cambios del remoto al local","Sube los cambios del local al remoto","Crea una rama nueva desde master","Borra el último commit del historial"],e:"Pull descarga los cambios del repositorio remoto y los fusiona en el local."},
{n:"facil",t:"Vocabulario",q:"¿Qué es checkout en el vocabulario de un VCS?",o:["Crear una copia local de una versión del repositorio","Subir al remoto todos los commits que hay en el local","Borrar del repositorio un fichero que ya no se usa","Fusionar dos versiones de un fichero en una sola"],e:"Checkout = copia local de una versión (normalmente la última). En Git también sirve para cambiar de rama."},
{n:"facil",t:"Vocabulario",q:"¿Cuándo se produce un conflicto?",o:["Cuando dos personas cambian lo mismo de forma distinta","Cuando un fichero es demasiado grande para el repositorio","Cuando se hace un commit sin escribir ningún mensaje","Cuando dos personas trabajan en ficheros diferentes"],e:"Hay conflicto cuando dos versiones tocan la misma parte y el sistema no sabe cuál es la buena."},
{n:"media",t:"Vocabulario",q:"Juan pone la web en azul y hace commit; Pedro, sin bajarse los cambios de Juan, la pone en verde e intenta subirla. ¿Qué ocurre?",o:["Un conflicto: Git no sabe qué línea es la buena","Git se queda con el verde porque es el último","Git se queda con el azul porque llegó primero","Git mezcla los dos colores de forma automática"],e:"Es el ejemplo de conflicto de los apuntes: los dos cambiaron la misma línea y hay que resolverlo a mano."},
{n:"media",t:"Vocabulario",q:"¿Qué es un changelist?",o:["El conjunto de cambios hechos en un commit","La lista de ramas que tiene un repositorio","La lista de ficheros que Git debe ignorar","El historial de todos los pull requests"],e:"Changelist = conjunto de cambios de un commit."},
{n:"facil",t:"Vocabulario",q:"¿Qué es un merge?",o:["Fusionar dos versiones en una","La copia de un repositorio ajeno","La subida de cambios al remoto","El borrado de una rama vieja"],e:"Merge = fusionar dos versiones (o dos ramas) en una."},
{n:"facil",t:"Tipos",q:"En un sistema de control de versiones centralizado, ¿cuántos repositorios hay?",o:["Uno solo, con todo el código","Uno por cada programador","Dos: uno público y otro privado","Uno por cada rama del proyecto"],e:"Centralizado: un único repositorio. Distribuido: cada programador tiene una copia."},
{n:"facil",t:"Tipos",q:"¿Qué tipo de sistema de control de versiones es Git?",o:["Distribuido","Centralizado","Local, sin red","Manual, por correo"],e:"Git es distribuido: no depende de un repositorio central y cada uno tiene su copia."},
{n:"media",t:"Tipos",q:"¿Qué ventaja tiene un sistema centralizado?",o:["Gestión sencilla y un único número de versión","Cada programador tiene su propia copia completa","Permite trabajar con versiones no oficiales","No hace falta ningún responsable de las ramas"],e:"Centralizado: gestión sencilla, más control y un único número de versión; a cambio, menos flexibilidad."},
{n:"media",t:"Tipos",q:"¿Qué hace el gestor de integración?",o:["Actualiza el repositorio común con los trabajos de cada uno","Programa las funciones que nadie más del equipo quiere hacer","Instala Git y Visual Studio en los ordenadores del equipo","Decide qué se desarrolla y en qué orden en cada sprint"],e:"Cada desarrollador tiene un repositorio privado y otro público; el gestor de integración pasa los trabajos públicos al común."},
// ---------- UT5 · Git ----------
{n:"facil",t:"Git",q:"¿Cuál de estas afirmaciones sobre Git es cierta?",o:["Es software libre y gratuito","Es de pago y solo para empresas","Solo funciona dentro de GitHub","Solo sirve para proyectos en C#"],e:"Git es un VCS distribuido, libre y gratuito, que guarda el historial y permite ramas y fusiones."},
{n:"facil",t:"Git",q:"¿Cuáles son los 3 estados de un fichero en Git?",o:["Modified, staged y committed","Created, saved y deleted","Local, remote, origin y fork","Open, closed y merged"],e:"Modificado (cambiado), preparado (con git add) y confirmado (guardado con commit)."},
{n:"facil",t:"Git",q:"¿Qué es la staging area?",o:["El área con lo que irá en el próximo commit","La carpeta donde editas los archivos del proyecto","El servidor de GitHub donde se guarda el repositorio","La rama principal del proyecto, también llamada main"],e:"Staging area (área de preparación o índice): guarda lo que irá en el próximo commit."},
{n:"facil",t:"Git",q:"Un fichero que has cambiado pero todavía no has preparado con git add está…",o:["Modificado (modified)","Preparado (staged)","Confirmado (committed)","Fusionado (merged)"],e:"Modified: cambiado pero ni preparado ni confirmado."},
{n:"media",t:"Git",q:"¿Qué comando pasa un fichero de modificado a preparado (staged)?",o:["git add","git commit","git push","git init"],e:"git add lo prepara (staging); git commit lo confirma en el repositorio local."},
{n:"facil",t:"Git",q:"¿En qué carpeta guarda Git los metadatos y la base de datos de versiones?",o:["En la carpeta oculta .git","En la carpeta bin del proyecto","En la carpeta obj del proyecto","En la carpeta Documentos del usuario"],e:"El repositorio está en la carpeta oculta .git; es lo que se copia al clonar."},
{n:"media",t:"Git",q:"¿Cuál es el flujo básico de trabajo en Git?",o:["Modificar ficheros, git add y git commit","git commit, modificar ficheros y git add","git push, git add y modificar ficheros","git add, git push y modificar ficheros"],e:"Copias el repositorio → modificas → preparas (git add) → confirmas (git commit)."},
{n:"facil",t:"Herramientas",q:"¿Qué es GitHub?",o:["Una plataforma web para alojar repositorios remotos","Un IDE de escritorio para programar en Java y en C#","Un depurador que viene instalado dentro de Git","Otro nombre para la rama principal"],e:"GitHub es una web que aloja repositorios remotos y usa Git."},
{n:"media",t:"Herramientas",q:"¿Qué es GitKraken?",o:["Un cliente gráfico de Git","Un depurador de Visual Studio","Una rama especial de Git","Un tipo de pull request"],e:"GitKraken es un cliente gráfico (con versión gratuita) que hace lo mismo que la terminal."},
{n:"media",t:"Herramientas",q:"¿Hay que instalar un plugin para usar Git en Visual Studio?",o:["No, en Visual Studio Git viene integrado","Sí, siempre hay que instalar GitKraken","Sí, Visual Studio no es compatible con Git","No, porque Visual Studio usa solo GitHub"],e:"En otros IDE hay que instalar el plugin, pero en Visual Studio Git ya viene integrado."},
// Comandos
{n:"facil",t:"Comandos",q:"¿Qué comando crea un repositorio nuevo?",o:["git init","git clone","git start","git new"],e:"git init crea un repositorio nuevo (la carpeta oculta .git)."},
{n:"facil",t:"Comandos",q:"¿Qué comando hace una copia local de un repositorio remoto?",o:["git clone <url>","git init <url>","git push <url>","git copy <url>"],e:"git clone <url> copia el repositorio remoto en local; los dos quedan independientes."},
{n:"facil",t:"Comandos",q:"¿Qué comando muestra los ficheros nuevos, modificados y preparados?",o:["git status","git log","git show","git diff --all"],e:"git status enseña el estado. git log es el historial y git show un commit concreto."},
{n:"facil",t:"Comandos",q:"¿Qué hace git add . (con el punto)?",o:["Prepara todos los ficheros para el commit","Sube todos los ficheros al repositorio remoto","Borra todos los ficheros del directorio","Crea un repositorio en la carpeta actual"],e:"git add . añade todos los ficheros al staging; git add f1 f2 solo esos."},
{n:"facil",t:"Comandos",q:"¿Qué comando confirma los cambios preparados con un mensaje?",o:["git commit -m \"mensaje\"","git push -m \"mensaje\"","git add -m \"mensaje\"","git save -am \"mensaje\""],e:"git commit -m \"mensaje\" confirma lo preparado; siempre con un mensaje que describa el cambio."},
{n:"media",t:"Comandos",q:"¿Cómo se cambia el mensaje del último commit?",o:["git commit --amend -m \"nuevo\"","git commit --edit -m \"nuevo\"","git log --amend -m \"nuevo\"","git push --amend -m \"nuevo\""],e:"git commit --amend -m \"nuevo\" reescribe el mensaje del último commit."},
{n:"facil",t:"Comandos",q:"¿Qué comando muestra el historial de commits?",o:["git log","git status","git init","git add"],e:"git log muestra los commits en orden cronológico."},
{n:"media",t:"Comandos",q:"¿Cuántos caracteres tiene el identificador de un commit?",o:["40, en hexadecimal","8, solo con números","16, en binario","64, con letras y números"],e:"Cada commit tiene un identificador único de 40 caracteres hexadecimales."},
{n:"media",t:"Comandos",q:"¿Qué compara git diff HEAD?",o:["El directorio de trabajo con el último commit","El repositorio local con el repositorio remoto","Dos ramas distintas del mismo repositorio","El staging con el repositorio remoto"],e:"git diff compara trabajo con staging; git diff HEAD, trabajo con el último commit."},
{n:"facil",t:"Comandos",q:"¿Para qué sirve el fichero .gitignore?",o:["Para indicar los ficheros que Git no debe controlar","Para guardar el historial de commits del proyecto entero","Para configurar el nombre y el correo del usuario","Para listar las ramas que tiene el repositorio"],e:".gitignore lista ficheros y patrones que Git ignora (por ejemplo bin/ y obj/ en .NET)."},
{n:"facil",t:"Comandos",q:"¿Qué comando configura el nombre del usuario en Git?",o:["git config user.name \"Nombre\"","git init user.name \"Nombre\"","git add user.name \"Nombre\"","git commit user.name \"Nombre\""],e:"git config user.name y git config user.email; git config --list muestra la configuración."},
{n:"media",t:"Comandos",q:"¿Qué hacen git rm y git mv?",o:["Borrar y renombrar","Crear y borrar ramas nuevas","Subir y bajar cambios","Preparar y confirmar"],e:"git rm borra ficheros y git mv los renombra (o mueve)."},
// Deshacer
{n:"facil",t:"Deshacer",q:"¿Cómo se deshace un git add (sacar un fichero del staging)?",o:["git restore --staged <fichero>","git commit --amend <fichero>","git push --staged <el fichero>","git init --staged <fichero>"],e:"git restore --staged <f> saca el fichero del staging sin perder los cambios."},
{n:"facil",t:"Deshacer",q:"¿Qué comando deshace un commit creando otro commit nuevo?",o:["git revert","git reset --hard","git checkout","git restore"],e:"git revert crea un commit nuevo con el estado corregido y no borra historial: es lo más seguro."},
{n:"facil",t:"Deshacer",q:"¿Qué comando es el más peligroso porque borra todo lo posterior de la rama?",o:["git reset --hard <commit>","git revert <commit>","git restore --staged <f>","git log <commit>"],e:"git reset --hard vuelve a ese commit y elimina todo lo posterior: muy peligroso."},
{n:"media",t:"Deshacer",q:"¿Qué hace git reset <fichero> (sin --hard)?",o:["Saca los cambios del staging y los deja en el directorio","Borra el fichero del disco y también del repositorio remoto","Vuelve atrás hasta el primer commit y borra todo lo demás","Sube el fichero al remoto aunque no esté confirmado"],e:"git reset <f> borra los cambios del área intermedia pero mantiene los del directorio de trabajo. Es seguro."},
{n:"media",t:"Deshacer",q:"¿Por qué git checkout <commit> <fichero> es peligroso?",o:["Porque machaca lo que tenías sin guardar en ese fichero","Porque borra todas las ramas que hay en el repositorio","Porque sube el fichero al remoto sin pedir confirmación","Porque elimina el historial de commits de todo el proyecto"],e:"Devuelve el fichero al contenido de ese commit y machaca los cambios no guardados."},
{n:"media",t:"Deshacer",q:"En un proyecto compartido, ¿qué es más seguro para deshacer un commit ya subido?",o:["git revert, porque no borra historial","git reset --hard, porque lo borra todo","git checkout, porque cambia de rama","git commit --amend, porque lo reescribe"],e:"revert deshace creando un commit nuevo y el historial de los demás no se rompe."},
// Ramas y merge
{n:"facil",t:"Ramas",q:"¿Qué hace git branch <rama>?",o:["Crea una rama desde HEAD","Cambia a una rama que ya existe","Borra la rama que se indica","Fusiona la rama con master"],e:"git branch <rama> la crea; git branch solo lista las ramas."},
{n:"facil",t:"Ramas",q:"¿Qué hace git checkout -b nueva?",o:["Crea la rama nueva y se cambia a ella","Borra la rama nueva sin preguntar","Fusiona la rama nueva con master","Sube la rama nueva al repositorio remoto"],e:"checkout -b crea la rama y se cambia a ella en un solo paso."},
{n:"facil",t:"Ramas",q:"¿Qué comando borra una rama?",o:["git branch -d <rama>","git checkout -d <rama>","git merge -d <rama>","git remove <rama>"],e:"git branch -d <rama> la borra (-D para forzar)."},
{n:"media",t:"Ramas",q:"Quieres llevar los cambios de la rama test a master. ¿Qué haces?",o:["git checkout master y después git merge test","git checkout test y después git merge master","git merge master estando en la rama master","git push test master y después git pull test"],e:"Te pones en la rama destino (master) y fusionas la otra: git merge test."},
{n:"facil",t:"Ramas",q:"¿Qué marcas hay que borrar al resolver un conflicto a mano?",o:["<<<<<<<, ======= y >>>>>>>","###, ***, +++ y ///","{{{{{{{, ::::::: y }}}}}}}","<!--, ------- y -->"],e:"Git marca el trozo en conflicto con <<<<<<<, ======= y >>>>>>>; eliges el código y borras las marcas."},
{n:"media",t:"Ramas",q:"¿Cómo se resuelve un conflicto en un merge?",o:["A mano: eliges el código, borras las marcas y haces commit","Git lo resuelve solo eligiendo siempre la versión más nueva","Borrando el repositorio y clonándolo otra vez desde GitHub","Haciendo git reset --hard para volver al primer commit"],e:"Git no puede resolverlo solo; se hace a mano (o con herramientas como Meld o git mergetool)."},

{n:"facil",t:"GitHub",q:"¿Qué nombre tiene por defecto el repositorio remoto?",o:["origin","master","HEAD","remote"],e:"git remote add origin <url> conecta con el remoto; origin es el nombre por defecto."},
{n:"facil",t:"GitHub",q:"¿Qué comando sube los commits locales a la rama master del remoto?",o:["git push origin master","git pull origin master","git fetch origin master","git clone origin master"],e:"push sube; pull baja y fusiona; fetch baja sin fusionar."},
{n:"facil",t:"GitHub",q:"¿A qué equivale git pull?",o:["A git fetch más git merge","A git add más git commit","A git push más git merge","A git clone más git init"],e:"pull = fetch (descargar) + merge (fusionar)."},
{n:"media",t:"GitHub",q:"¿Qué hace git fetch origin?",o:["Baja los cambios a una rama espejo sin fusionarlos","Sube los cambios locales al remoto sin fusionarlos","Descarga los cambios y los fusiona en tu rama","Borra el remoto origin de la configuración"],e:"fetch solo descarga a una rama espejo (origin/master); para fusionar hace falta merge."},
{n:"media",t:"GitHub",q:"¿Qué comando lista los repositorios remotos?",o:["git remote -v","git branch -v","git log -v","git status -v"],e:"git remote -v lista los remotos con su URL."},
{n:"facil",t:"GitHub",q:"¿Qué es un fork?",o:["Una copia de un repo ajeno en tu cuenta","Una rama que se crea con git checkout -b","Un conflicto que no se puede resolver","Un commit que deshace otro commit"],e:"Un fork copia el repositorio de otro en tu cuenta, con permisos totales."},
{n:"facil",t:"GitHub",q:"¿Qué es un pull request?",o:["Una petición para que integren tus cambios","Un comando que trae los cambios del remoto","Una copia de un repositorio en tu cuenta","Un error que aparece al hacer un push"],e:"Pull request: petición para integrar cambios (o fusionar ramas). Se revisa y se fusiona con el botón verde."},
{n:"media",t:"GitHub",q:"No tienes permiso en un repositorio y quieres aportar. ¿Qué haces?",o:["Fork, rama, commits, push al fork y pull request","Clonar, hacer commit y push directamente a master","Pedir la contraseña del dueño y subirlo tú mismo","Hacer git reset --hard y volver a clonar todo"],e:"Sin permiso: fork → clonas → rama → commits → push a tu fork → pull request para que el dueño lo integre."},
{n:"facil",t:"GitHub",q:"¿Qué hay que hacer siempre antes de un push?",o:["Un pull","Un reset","Un fork","Un init"],e:"Antes de hacer push, haz pull y resuelve los conflictos."},
{n:"facil",t:"GitHub",q:"¿Se debe trabajar directamente en master?",o:["No, mejor una rama por funcionalidad","Sí, siempre en master para no liarse","Sí, pero solo si eres el dueño","No, hay que trabajar siempre en origin"],e:"Buena práctica: una rama por funcionalidad y luego merge. git flow propone un sistema de ramas más completo."},
{n:"media",t:"GitHub",q:"¿Para qué tipo de cambios conviene crear una rama?",o:["Para cambios medianos o grandes, como una página nueva","Para cualquier cambio, aunque sea el color de un botón","Solo para corregir faltas de ortografía en comentarios","Solo cuando ya se ha terminado el proyecto entero"],e:"Las ramas son para cambios medianos o grandes (una página, una clase nueva), no para cambiar el color de un botón."},
// ---------- UT5 · Scrum ----------
{n:"facil",t:"Scrum",q:"¿Qué es Scrum?",o:["Una metodología ágil para desarrollar software","Un sistema de control de versiones distribuido","Un depurador que viene con Visual Studio","Un lenguaje de programación orientado a objetos"],e:"Scrum es una forma ágil de desarrollar software en sprints a partir de una lista priorizada."},
{n:"facil",t:"Scrum",q:"¿Qué es la pila del producto (product backlog)?",o:["La lista priorizada del trabajo que hay que hacer","La lista de errores que da el compilador al compilar","El conjunto de commits de la rama principal","La reunión diaria que dirige el Scrum Master"],e:"Pila del producto: lista priorizada; al principio los requisitos y luego cambios, errores, mejoras…"},
{n:"facil",t:"Scrum",q:"¿Cuánto dura un sprint?",o:["Entre una semana y un mes, con duración fija","Siempre un día, de la mañana a la noche","Entre seis meses y un año, según el cliente","Lo que haga falta, no tiene duración fija"],e:"Un sprint es una iteración de duración fija, de una semana a un mes como máximo."},
{n:"facil",t:"Scrum",q:"¿Cuáles son los 3 roles de Scrum?",o:["Product Owner, Scrum Master y equipo","Cliente, jefe de proyecto y programador junior","Analista, diseñador y tester del producto","Gestor de integración, colaborador y dueño"],e:"Product Owner (qué y en qué orden), Scrum Master (guía el proceso) y equipo de desarrollo (cómo)."},
{n:"facil",t:"Scrum",q:"¿Quién decide qué se desarrolla y en qué orden?",o:["El Product Owner","El Scrum Master","El equipo de desarrollo","El gestor de integración"],e:"El Product Owner tiene la visión del producto y es responsable de la pila del producto."},
{n:"facil",t:"Scrum",q:"¿El Scrum Master tiene autoridad sobre el equipo?",o:["No, solo guía al equipo en el proceso","Sí, es el jefe y reparte las tareas","Sí, decide qué se hace en cada sprint","No, porque no forma parte de Scrum"],e:"El Scrum Master guía el proceso Scrum y dirige la daily, pero no tiene autoridad sobre los demás."},
{n:"facil",t:"Scrum",q:"¿Cuántas personas forman el equipo de desarrollo en Scrum?",o:["Entre 4 y 8","Entre 1 y 2","Entre 10 y 20","Más de 50"],e:"El equipo de desarrollo decide cómo hacer el trabajo y lo forman entre 4 y 8 personas."},
{n:"facil",t:"Scrum",q:"¿Cuánto dura la daily (reunión diaria)?",o:["15 minutos","2 horas","Una mañana","Un minuto"],e:"Daily Scrum: 15 minutos, mismo sitio y misma hora, con todo el equipo."},
{n:"media",t:"Scrum",q:"¿Qué tres preguntas se responden en la daily?",o:["¿Qué hice ayer?, ¿qué haré hoy?, ¿qué me lo impide?","¿Cuánto cobro?, ¿cuándo acabo?, ¿quién me ayuda?","¿Qué rama uso?, ¿qué commit hago?, ¿cuándo subo?","¿Qué falla?, ¿quién lo hizo?, ¿cómo lo castigamos?"],e:"Las tres preguntas de la daily: qué hice ayer, qué haré hoy y qué me lo impide."},
{n:"media",t:"Scrum",q:"¿Qué es el sprint backlog (pila del sprint)?",o:["Lo elegido para el sprint, dividido en tareas","La lista de todos los requisitos de todo el producto","La lista de sprints que ya se han terminado antes","El tablero de GitHub donde se guardan los commits"],e:"En la planificación, el equipo elige entradas de alta prioridad y las divide en tareas: eso es la pila del sprint."},
{n:"media",t:"Scrum",q:"¿Qué significa WIP y cómo debe ser?",o:["Work In Progress; debe ser bajo","Work In Production; debe ser alto","Weekly Improvement Plan; debe ser fijo","Work In Pairs; debe ser de dos"],e:"WIP = tareas empezadas y sin terminar. Debe ser bajo, con tareas pequeñas."},
{n:"media",t:"Scrum",q:"¿Cuándo está «hecho» (done) el resultado de un sprint?",o:["Cuando está diseñado, implementado, probado y documentado","Cuando el código compila sin errores, aunque no se haya probado","Cuando el Scrum Master dice que ya se ha trabajado bastante","Cuando se ha terminado el tiempo del sprint, esté como esté"],e:"El incremento debe estar listo para usarse: diseñado, implementado, integrado, probado y documentado."},
{n:"facil",t:"Scrum",q:"¿Se pueden cambiar los objetivos o las personas en mitad de un sprint?",o:["No, dentro del sprint no se cambian","Sí, cada día se pueden cambiar","Sí, si lo pide el Scrum Master","Solo las personas, nunca los objetivos"],e:"Dentro del sprint no se cambian objetivos ni personas."},
{n:"media",t:"Scrum",q:"¿Qué columnas tiene la pizarra Scrum?",o:["Backlog, To Do, In Progress, Testing y Done","Lunes, Martes, Miércoles, Jueves y Viernes","Rojo, Amarillo, Verde, Azul y Negro","Init, Add, Commit, Push y Pull"],e:"Backlog → To Do → In Progress → Testing → Done; cada nota es una tarea con estimación y prioridad."},
{n:"facil",t:"Scrum",q:"¿Qué es un issue en GitHub?",o:["Una tarea, mejora o bug asignable","Un commit que se ha subido al remoto","Una rama que se ha fusionado con main","Un fichero que Git no debe controlar"],e:"Los issues son tareas (mejoras, bugs…) que se asignan, detallan y etiquetan, y se mueven por el tablero de Projects."},
{n:"media",t:"Scrum",q:"¿Dónde se organiza Scrum en un repositorio de GitHub?",o:["En el apartado Projects, con issues y labels","En la carpeta oculta .git del repositorio","En el fichero .gitignore del proyecto","En la pestaña Breakpoints de Visual Studio 2022"],e:"Projects es el tablero; los issues se mueven por sus columnas y las labels indican tipo y prioridad."},
{n:"facil",t:"Scrum",q:"¿Cómo se mide el progreso en Scrum?",o:["Con resultados: tareas terminadas y producto","Con las horas que pasa cada uno en la oficina","Con el número de líneas de código escritas","Con el número de reuniones que se hacen"],e:"Principio de progreso: se mide con resultados (tareas terminadas y producto al final del sprint)."}

<script>
// Creador de examen de Entornos de Desarrollo (tipo test). CFG (unidades, claves) viene del banco.
// Examen como el real: 10 preguntas, 4 opciones, una correcta. Sale 8 fáciles + 2 medias.
// Los datos (fallos, historial, preguntas vistas) usan las mismas claves que la versión 2, así que no se pierden.
'use strict';
const app = document.getElementById('app');
const N_EXAMEN = 10, N_MEDIAS = 2;
const L = ['A', 'B', 'C', 'D'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toFixed(2).replace('.', ',');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
const validas = new Set(BANK.map(q => q.q));
const seenMap = () => store(CFG.k.seen) || {};
function failMap() { const f = store(CFG.k.fails) || {}; Object.keys(f).forEach(k => { if (!validas.has(k)) delete f[k]; }); return f; }
const historial = () => store(CFG.k.hist) || [];
// Tema: siempre claro al abrir; si lo abre el menú de repaso, usa el tema del menú (?tema=dark|light)
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};
const LOCKUP = '<a class="c-lockup" href="#" data-ir="inicio" aria-label="Inicio"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#concep-simbolo"/></svg><span class="c-wordmark">Concep</span></a>';

function mount(html) {
  document.body.classList.toggle('claro', tema === 'light');
  const root = document.createElement('div');
  root.className = tema === 'light' ? 'concep' : 'concep-dark';
  root.innerHTML = html;
  app.replaceChildren(root);
  window.scrollTo(0, 0);
}
function topBar(centro, derecha) {
  return '<header class="top">' + LOCKUP + '<span class="sep" aria-hidden="true"></span>' + centro + '<div class="grow"></div><div class="acc">' + (derecha || '') +
    '<button class="btn btn--ghost icon-btn" data-tema title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">' + (tema === 'light' ? IC.moon : IC.sun) + '</button></div></header>';
}
const MODULO = '<div class="modulo"><b>Entornos de desarrollo</b><span>Creador de examen ' + CFG.ut + '</span></div>';

// ---------- inicio ----------
function vistaInicio(abrir) {
  const h = historial(), f = failMap();
  const nf = Object.keys(f).length;
  const media = h.length ? h.reduce((s, x) => s + x, 0) / h.length : null;
  const fallos = BANK.filter(q => f[q.q]).sort((a, b) => f[b.q] - f[a.q]);
  mount(topBar(MODULO) +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">Concep · Entornos de desarrollo · ' + CFG.ut + '</span>' +
    '<h1>Creador de examen ' + CFG.ut + '</h1><p>Diez preguntas como las del examen: cuatro opciones y una sola correcta, casi todas sencillas. Al corregir ves la nota, la respuesta buena y por qué. Lo que fallas se guarda para repasarlo.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + BANK.length + '</div><div class="l">Preguntas</div></div><div class="stat"><div class="v">' + h.length + '</div><div class="l">' + (h.length === 1 ? 'Examen' : 'Exámenes') + '</div></div><div class="stat"><div class="v">' + (media === null ? '—' : fmt(media)) + '</div><div class="l">Nota media</div></div></div></section>' +
    '<div class="grid2">' +
    '<section class="card card--accent" aria-labelledby="h-nuevo"><h2 id="h-nuevo">Nuevo examen</h2><p class="sub">Preguntas de todo el temario de ' + CFG.temario + ', primero las que menos has visto.</p>' +
    '<ul class="reglas"><li>10 preguntas tipo test, cada una vale 1 punto.</li><li>8 fáciles y 2 un poco más de detalle, como en el examen real.</li><li>Puedes dejar preguntas en blanco.</li></ul>' +
    '<label class="check"><input type="checkbox" id="penal"' + (store(CFG.k.penal) ? ' checked' : '') + '> Restar errores (−0,33 por fallo)</label>' +
    '<div class="fila"><button class="btn btn--primary btn--lg" data-empezar="normal">' + IC.play + 'Empezar examen</button></div>' +
    (h.length ? '<div class="hist"><span>Últimos intentos</span>' + h.slice(-8).map(x => '<span class="nota-chip ' + (x >= 5 ? 'ap' : 'su') + '">' + fmt(x) + '</span>').join('') + '</div>' : '') +
    '</section>' +
    '<section class="card" aria-labelledby="h-fallos"><h2 id="h-fallos">Mis fallos</h2>' +
    (nf ? '<p class="sub">' + nf + (nf === 1 ? ' pregunta guardada' : ' preguntas guardadas') + '. Cada fallo o pregunta en blanco suma 1 y cada acierto resta 1; al llegar a 0 sale de la lista.</p>'
      : '<p class="vacio-txt">Aún no tienes fallos guardados. Haz un examen y aquí aparecerán las que falles o dejes en blanco.</p>') +
    '<div class="fila"><button class="btn btn--primary" data-empezar="fallos"' + (nf ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (nf ? ' (' + Math.min(N_EXAMEN, nf) + ')' : '') + '</button>' +
    '<button class="btn" data-ver-fallos' + (nf ? '' : ' disabled') + ' aria-expanded="' + (abrir === 'lista') + '">Ver lista</button><button class="btn btn--ghost" data-copia aria-expanded="' + (abrir === 'copia') + '">Copia de seguridad</button></div>' +
    '<div id="lista"' + (abrir === 'lista' && nf ? '' : ' hidden') + '><ol class="lista-fallos">' + fallos.map(q => '<li><span class="x">×' + f[q.q] + '</span>' + esc(q.q) + '<span class="ok">✓ ' + esc(q.o[0]) + '</span></li>').join('') + '</ol>' +
    '<div class="fila" style="margin-top:10px"><button class="btn btn--danger btn--sm" data-vaciar>Vaciar lista de fallos</button></div></div>' +
    '<div id="copia"' + (abrir === 'copia' ? '' : ' hidden') + '><p class="vacio-txt" style="margin:16px 0 0">Los fallos se guardan solo en este navegador. Copia este texto para no perderlos, o pega uno para restaurarlos.</p>' +
    '<textarea class="copia" id="copiaTxt" spellcheck="false" aria-label="Copia de seguridad de los fallos">' + esc(JSON.stringify(f)) + '</textarea>' +
    '<div class="fila" style="margin-top:8px"><button class="btn btn--sm" data-copiar>Copiar</button><button class="btn btn--sm" data-restaurar>Restaurar desde el texto</button><span class="msg" id="copiaMsg" role="status"></span></div></div>' +
    '</section></div></main>');
}

// ---------- examen ----------
let examen = null; // { modo, items: [{q, opts:[{text, ok}], resp, prev}] }
function elegir(modo) {
  if (modo === 'fallos') {
    const f = failMap();
    return shuffle(shuffle(BANK.filter(q => f[q.q])).sort((a, b) => f[b.q] - f[a.q]).slice(0, N_EXAMEN));
  }
  const seen = seenMap();
  const porVistas = pool => shuffle(pool).sort((a, b) => (seen[a.q] || 0) - (seen[b.q] || 0));
  const medias = porVistas(BANK.filter(q => q.n === 'media')).slice(0, N_MEDIAS);
  const faciles = porVistas(BANK.filter(q => q.n !== 'media')).slice(0, N_EXAMEN - medias.length);
  return shuffle([...faciles, ...medias]);
}
function empezar(modo) {
  const picks = elegir(modo);
  if (!picks.length) return;
  const f = failMap();
  examen = { modo, penal: !!store(CFG.k.penal), items: picks.map(q => ({ q, opts: shuffle(q.o.map((text, k) => ({ text, ok: k === 0 }))), resp: null, prev: f[q.q] || 0 })) };
  vistaExamen();
}
function htmlPregunta(it, n, corregida) {
  const ci = it.opts.findIndex(o => o.ok);
  let estado = '';
  if (corregida) estado = it.resp === null ? '<span class="estado blanco">En blanco</span>' : it.resp === ci ? '<span class="estado bien">Correcta</span>' : '<span class="estado mal">Incorrecta</span>';
  return '<article class="q' + (corregida ? ' hecha' : '') + '" id="p' + n + '"><div class="meta"><span class="n">Pregunta ' + (n + 1) + '</span><span>· ' + esc(it.q.t) + '</span>' +
    (it.prev && !corregida ? '<span>· fallada ' + it.prev + (it.prev > 1 ? ' veces' : ' vez') + '</span>' : '') + estado + '</div>' +
    '<h3 id="h' + n + '">' + esc(it.q.q) + '</h3><div class="opts" role="radiogroup" aria-labelledby="h' + n + '">' +
    it.opts.map((o, k) => {
      const cls = corregida ? (k === ci ? ' bien' : (k === it.resp ? ' mal' : '')) : '';
      return '<label class="opt' + cls + '"><input type="radio" name="q' + n + '" value="' + k + '"' + (it.resp === k ? ' checked' : '') + (corregida ? ' disabled' : '') + '><span class="l">' + L[k] + '</span><span class="t">' + esc(o.text) + '</span></label>';
    }).join('') + '</div>' +
    (corregida ? '<div class="expl"><b>Respuesta correcta: ' + L[ci] + ') ' + esc(it.opts[ci].text) + '</b><br>' + esc(it.q.e) + '</div>' : '') + '</article>';
}
function vistaExamen() {
  const it = examen.items;
  mount(topBar('<button class="btn btn--ghost btn--sm" data-salir>' + IC.back + 'Salir</button><div class="modulo"><b>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : 'Examen') + '</b><span>' + pl(it.length, 'pregunta', 'preguntas') + ' · ETS</span></div>',
    '<span class="progreso" id="prog" aria-live="polite"></span>') +
    '<main class="examen-page fade-in">' + it.map((x, n) => htmlPregunta(x, n, false)).join('') + '</main>' +
    '<div class="barra-fija"><div class="in"><button class="btn btn--primary" data-corregir>' + IC.check + 'Corregir examen</button><nav class="puntos" aria-label="Ir a una pregunta" id="puntos"></nav><span class="aviso" id="aviso" role="status"></span></div></div>');
  progreso();
}
function progreso() {
  const r = examen.items.filter(x => x.resp !== null).length;
  const p = document.getElementById('prog'); if (p) p.textContent = r + '/' + examen.items.length;
  const pt = document.getElementById('puntos');
  if (pt) pt.innerHTML = examen.items.map((x, n) => '<a href="#p' + n + '" class="' + (x.resp !== null ? 'r' : '') + '" aria-label="Pregunta ' + (n + 1) + (x.resp !== null ? ', respondida' : '') + '">' + (n + 1) + '</a>').join('');
}

// ---------- corrección ----------
function corregir() {
  const it = examen.items;
  let ok = 0, mal = 0, blanco = 0;
  it.forEach(x => { const ci = x.opts.findIndex(o => o.ok); if (x.resp === null) blanco++; else if (x.resp === ci) ok++; else mal++; });
  const nota = Math.max(0, (ok - (examen.penal ? mal / 3 : 0)) * 10 / it.length);
  const seen = seenMap(); it.forEach(x => seen[x.q.q] = (seen[x.q.q] || 0) + 1); store(CFG.k.seen, seen);
  const h = historial(); h.push(nota); store(CFG.k.hist, h.slice(-20));
  const f = failMap(); let nuevas = 0, superadas = 0;
  it.forEach(x => {
    const bien = x.resp !== null && x.opts[x.resp].ok;
    if (!bien) { if (!f[x.q.q]) nuevas++; f[x.q.q] = (f[x.q.q] || 0) + 1; }
    else if (f[x.q.q]) { f[x.q.q]--; if (f[x.q.q] <= 0) { delete f[x.q.q]; superadas++; } }
  });
  store(CFG.k.fails, f);
  const quedan = Object.keys(f).length;
  const ap = nota >= 5;
  mount(topBar('<button class="btn btn--ghost btn--sm" data-ir="inicio">' + IC.back + 'Inicio</button><div class="modulo"><b>Resultado</b><span>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : 'Examen') + ' · ETS</span></div>') +
    '<main class="examen-page fade-in"><section class="card card--accent"><div class="resultado"><div class="big">' + fmt(nota) + '<small> /10</small></div>' +
    '<div><div class="veredicto ' + (ap ? 'ap' : 'su') + '">' + (nota >= 9 ? 'Sobresaliente' : nota >= 7 ? 'Notable' : nota >= 6 ? 'Bien' : ap ? 'Aprobado' : 'Suspenso') + '</div><div class="medidor"><div style="width:' + (nota * 10) + '%"></div></div>' +
    '<div class="resumen">' + pl(ok, 'correcta', 'correctas') + ' · ' + pl(mal, 'incorrecta', 'incorrectas') + ' · ' + blanco + ' en blanco' + (examen.penal ? ' · −0,33 por fallo' : '') + '</div>' +
    '<div class="resumen">Lista de fallos: ' + (nuevas ? '+' + pl(nuevas, 'nueva', 'nuevas') : 'ninguna nueva') + (superadas ? ' · ' + pl(superadas, 'superada', 'superadas') : '') + ' · ' + quedan + ' en total.</div></div></div>' +
    '<div class="fila"><button class="btn btn--primary" data-empezar="normal">' + IC.play + 'Nuevo examen</button><button class="btn" data-empezar="fallos"' + (quedan ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (quedan ? ' (' + Math.min(N_EXAMEN, quedan) + ')' : '') + '</button></div></section>' +
    '<h2 class="seccion-t">Corrección</h2>' + it.map((x, n) => htmlPregunta(x, n, true)).join('') + '</main>');
}

// ---------- eventos ----------
function cambiarTema(btn) {
  tema = tema === 'light' ? 'dark' : 'light'; store(CFG.k.tema, tema);
  const root = app.firstElementChild; root.classList.remove('concep', 'concep-dark'); root.classList.add(tema === 'light' ? 'concep' : 'concep-dark');
  document.body.classList.toggle('claro', tema === 'light'); btn.innerHTML = tema === 'light' ? IC.moon : IC.sun;
}
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'penal') store(CFG.k.penal, t.checked);
  if (t.type === 'radio' && examen) { examen.items[+t.name.slice(1)].resp = +t.value; progreso(); const a = document.getElementById('aviso'); if (a) a.textContent = ''; }
});
// Confirmación de doble clic: el primer clic arma el botón y, si no se vuelve a pulsar en 4 s, se desarma solo
function armar(b, texto, alDesarmar) {
  if (b.dataset.c) return false;
  const antes = b.innerHTML;
  b.dataset.c = '1'; b.lastChild.textContent = texto;
  setTimeout(() => { if (b.isConnected && b.dataset.c) { delete b.dataset.c; b.innerHTML = antes; if (alDesarmar) alDesarmar(); } }, 4000);
  return true;
}
app.addEventListener('click', async ev => {
  const b = ev.target.closest('button, a[data-ir]');
  if (!b) return;
  if (b.hasAttribute('data-tema')) return cambiarTema(b);
  if (b.dataset.ir === 'inicio') { ev.preventDefault(); examen = null; return vistaInicio(); }
  if (b.dataset.empezar) return empezar(b.dataset.empezar);
  if (b.hasAttribute('data-salir')) {
    if (armar(b, '¿Seguro?')) return;
    examen = null; return vistaInicio();
  }
  if (b.hasAttribute('data-corregir')) {
    const blancas = examen.items.filter(x => x.resp === null).length;
    const aviso = document.getElementById('aviso');
    if (blancas && armar(b, 'Corregir igualmente', () => { aviso.textContent = ''; })) { aviso.textContent = (blancas === 1 ? 'Te queda 1 pregunta' : 'Te quedan ' + blancas + ' preguntas') + ' en blanco.'; return; }
    return corregir();
  }
  if (b.hasAttribute('data-ver-fallos')) { const l = document.getElementById('lista'); l.hidden = !l.hidden; b.setAttribute('aria-expanded', !l.hidden); return; }
  if (b.hasAttribute('data-copia')) { const c = document.getElementById('copia'); c.hidden = !c.hidden; b.setAttribute('aria-expanded', !c.hidden); return; }
  if (b.hasAttribute('data-vaciar')) {
    if (armar(b, 'Pulsa otra vez para vaciarla')) return;
    store(CFG.k.fails, {}); return vistaInicio();
  }
  if (b.hasAttribute('data-copiar')) {
    const ta = document.getElementById('copiaTxt'), m = document.getElementById('copiaMsg');
    try { await navigator.clipboard.writeText(ta.value); m.textContent = 'Copiado'; } catch (e) { ta.select(); m.textContent = 'Selecciona el texto y cópialo a mano'; }
    return;
  }
  if (b.hasAttribute('data-restaurar')) {
    const m = document.getElementById('copiaMsg');
    try {
      const data = JSON.parse(document.getElementById('copiaTxt').value);
      if (typeof data !== 'object' || Array.isArray(data) || !data) throw 0;
      const limpio = {}; Object.entries(data).forEach(([k, v]) => { if (validas.has(k) && +v > 0) limpio[k] = Math.round(+v); });
      if (!Object.keys(limpio).length) { m.textContent = 'La copia no tiene ninguna pregunta válida; no se ha cambiado nada. Para borrar la lista usa «Vaciar».'; return; }
      store(CFG.k.fails, limpio); vistaInicio('copia');
      document.getElementById('copiaMsg').textContent = 'Restaurada' + (Object.keys(limpio).length === 1 ? ' 1 pregunta' : 's ' + Object.keys(limpio).length + ' preguntas');
    } catch (e) { m.textContent = 'El texto no es una copia válida'; }
  }
});
vistaInicio();

</script>
</body>
</html>
