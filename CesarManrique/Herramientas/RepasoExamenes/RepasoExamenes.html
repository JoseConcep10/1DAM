/* =====================================================================
   ConcepDesign — tokens y componentes base de la marca CONCEP
   Fuente: Manual de Identidad Visual CONCEP (references/manual-identidad-concep.pdf)
   Uso: pega este bloque entero en el <style> de la pieza (los artifacts
   no cargan CSS local) o enlázalo con <link> en un proyecto.
   Fuentes: añade antes
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

:root {
  /* ---- Paleta oficial (estricta) ---- */
  --c-azul: #0052FF;        /* inicio del degradado: tecnología, estructura */
  --c-azul-2: #00D2FF;      /* secundario */
  --c-morado: #7A22FF;      /* transición: creatividad, IA */
  --c-morado-2: #8A2BE2;    /* secundario */
  --c-rosa: #FF007A;        /* cierre y destello: energía */
  --c-rosa-2: #FF2E93;      /* secundario */
  --c-negro: #0B0B0C;       /* fondo oscuro, texto sobre claro */
  --c-blanco: #FFFFFF;      /* texto sobre oscuro, fondo PDF */

  /* ---- Degradado oficial ---- */
  --c-gradiente: linear-gradient(135deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);
  --c-gradiente-h: linear-gradient(90deg, #0052FF 0%, #7A22FF 50%, #FF007A 100%);

  /* ---- Tipografía ---- */
  --f-marca: "Comfortaa", "Poppins", system-ui, sans-serif;   /* SOLO el wordmark CONCEP, nunca párrafos */
  --f-titulo: "Poppins", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --t-xs: .75rem;  --t-sm: .875rem; --t-base: 1rem;  --t-lg: 1.125rem;
  --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem; --t-4xl: clamp(2.5rem, 5vw, 3.5rem);
  --t-hero: clamp(3rem, 8vw, 5.5rem);

  /* ---- Espacio (base 4) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ---- Radios: esquinas suavemente redondeadas ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* ---- Movimiento ---- */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-1: 140ms; --dur-2: 240ms; --dur-3: 420ms;

}

/* ---- Tema CLARO (documentos, PDF) — por defecto, y también en .concep anidado dentro de oscuro ---- */
:root, .concep {
  --bg: #FFFFFF;
  --surface: #F6F6F9;
  --surface-2: #EEEEF3;
  --border: #E4E4EB;
  --border-strong: #CFCFD9;
  --text: #0B0B0C;
  --text-2: #4E4E5A;
  --text-3: #7A7A87;
  --accent-text: #0047E0;   /* enlaces/acento legible sobre blanco */
  --th-bg: #0B0B0C;         /* cabecera de tabla */
  --focus: #7A22FF;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 1px 2px rgba(11,11,12,.06), 0 8px 24px rgba(11,11,12,.06);
  --ok: #0E9F6E; --warn: #C27803; --error: #E0115F;
  color-scheme: light;
}

/* ---- Tema OSCURO (apps, web) — preferente en interfaces ---- */
.concep-dark, [data-concep="dark"] {
  --bg: #0B0B0C;
  --surface: #131316;
  --surface-2: #1B1B20;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --text: #F5F5F7;
  --text-2: #A6A6B3;
  --text-3: #6F6F7C;
  --accent-text: #7DA2FF;   /* tinte claro del azul: legible sobre negro */
  --th-bg: #1B1B20;
  --focus: #A274FF;
  --glass: rgba(19, 19, 22, .62);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.45);
  --ok: #34D399; --warn: #FBBF24; --error: #FF2E93;
  color-scheme: dark;
}

/* =========================== Base =========================== */
.concep, .concep-dark { background: var(--bg); color: var(--text); font-family: var(--f-texto); font-size: var(--t-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.concep h1, .concep h2, .concep h3, .concep-dark h1, .concep-dark h2, .concep-dark h3 { font-family: var(--f-titulo); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5em; text-wrap: balance; }
:where(.concep, .concep-dark) a:where(:not(.c-btn, .c-lockup)) { color: var(--accent-text); text-underline-offset: 3px; }
.c-lockup { color: var(--text); }
/* Todo <svg><use href="#concep-simbolo"/></svg> debe llevar viewBox="0 0 200 200" para escalar bien. */
.concep :focus-visible, .concep-dark :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ========================= Marca ========================= */
.c-wordmark { font-family: var(--f-marca); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.c-lockup { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; }
.c-lockup svg { width: 1.9em; height: 1.9em; }
.c-lockup--vertical { flex-direction: column; gap: .35em; }
.c-eyebrow { font: 600 var(--t-xs)/1 var(--f-titulo); letter-spacing: .18em; text-transform: uppercase; background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-grad-text { background: var(--c-gradiente-h); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-accent-line { height: 3px; border: 0; border-radius: 3px; background: var(--c-gradiente-h); margin: 0; }

/* ======================= Componentes ======================= */
.c-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 44px; padding: 0 var(--s-5); border-radius: var(--r-md); border: 1px solid transparent; font: 600 var(--t-sm)/1 var(--f-titulo); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2); }
.c-btn:active { transform: scale(.98); }
.c-btn--primary { background: var(--c-gradiente); color: #fff; box-shadow: 0 6px 24px -8px rgba(122, 34, 255, .6); }
.c-btn--primary:hover { box-shadow: 0 10px 32px -8px rgba(255, 0, 122, .55); }
.c-btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.c-btn--secondary:hover { background: var(--surface-2); }
.c-btn--ghost { background: transparent; color: var(--text-2); }
.c-btn--ghost:hover { color: var(--text); background: var(--surface); }
.c-btn:disabled { opacity: .45; cursor: not-allowed; }

.c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); }
.c-card--glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.c-card--accent { position: relative; overflow: hidden; }
.c-card--accent::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c-gradiente-h); }

.c-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font: 500 var(--t-xs)/1 var(--f-texto); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.c-badge--ai { color: #fff; background: var(--c-gradiente); border: 0; }
.c-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.c-field { display: grid; gap: 6px; }
.c-label { font: 500 var(--t-sm)/1.3 var(--f-texto); color: var(--text-2); }
.c-input { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 400 var(--t-base)/1 var(--f-texto); transition: border-color var(--dur-2), box-shadow var(--dur-2); }
.c-input:focus { outline: none; border-color: var(--c-morado); box-shadow: 0 0 0 3px rgba(122, 34, 255, .25); }
.c-hint { font-size: var(--t-xs); color: var(--text-3); }
.c-hint--error { color: var(--error); }

/* Tablas: cabecera oscura, filas aireadas (igual que el manual) */
.c-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
.c-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.c-table th { background: #0B0B0C; color: #fff; text-align: left; font: 600 var(--t-sm)/1.3 var(--f-titulo); padding: 12px 16px; }
.c-table td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.c-table td:first-child { color: var(--text); font-weight: 600; }
.c-table tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.c-table th { background: var(--th-bg); }

.c-code { font-family: var(--f-mono); font-size: .9em; background: #0B0B0C; color: #fff; padding: 2px 8px; border-radius: 6px; }

/* Al imprimir, el texto con degradado (background-clip:text) deja un recuadro: pásalo a color sólido */
@media print {
  .c-eyebrow { background: none; color: var(--c-morado); }
  .c-grad-text { background: none; color: var(--c-rosa); }
}

@media (prefers-reduced-motion: reduce) {
  .concep *, .concep-dark * { transition: none !important; animation: none !important; }
}

/* ===== CONCEP · Repaso de exámenes — mismo estilo que el creador de examen de Programación ===== */
:root {
  --f-ui: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --f-prosa: "Inter", "Segoe UI", system-ui, sans-serif;
}
/* Acento: degradado CONCEP en el inicio; color de la asignatura dentro de ella */
#app > div {
  --acento: var(--c-morado);
  --acento-linea: var(--c-gradiente-h);
  --acento-fondo: var(--c-gradiente);
  --acento-tinta: #fff;
  --acento-texto: var(--accent-text);
  --acento-halo: rgba(122, 34, 255, .22);
}
.qtab, .asig { --c: var(--c0); }
.concep-dark [data-oscuro] { --c: color-mix(in srgb, var(--c0) 55%, #fff); }
#app > div.en-asig { --asig: var(--asig0); --asig-tinta: var(--asig-tinta0); }
#app > div.en-asig.concep-dark[data-oscuro] { --asig: color-mix(in srgb, var(--asig0) 55%, #fff); --asig-tinta: #0B0B0C; }
#app > div.en-asig {
  --acento: var(--asig);
  --acento-linea: var(--asig);
  --acento-fondo: var(--asig);
  --acento-tinta: var(--asig-tinta);
  --acento-texto: color-mix(in srgb, var(--asig) 62%, var(--text));
  --acento-halo: color-mix(in srgb, var(--asig) 30%, transparent);
  --focus: var(--asig);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0B0B0C; }
body.claro { background: #fff; }
#app { min-height: 100%; font-family: var(--f-ui); font-size: 13px; line-height: 1.55; }
#app > div { min-height: 100vh; min-height: 100dvh; transition: background-color var(--dur-3); }
#app h1, #app h2, #app h3 { font-family: var(--f-titulo); }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.concep-dark ::-webkit-scrollbar { width: 12px; height: 12px; }
.concep-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 12.5px/1 var(--f-ui); white-space: nowrap; text-decoration: none; transition: background-color var(--dur-1), border-color var(--dur-1), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary { background: var(--acento-fondo); border-color: transparent; color: var(--acento-tinta); font-weight: 600; box-shadow: 0 6px 22px -10px var(--acento); }
.btn--primary:hover { background: var(--acento-fondo); filter: brightness(1.06); box-shadow: 0 8px 26px -8px var(--acento); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }
.btn--sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.top .c-lockup { font-size: 14px; color: var(--text); text-decoration: none; }
.top .sep { width: 1px; height: 22px; background: var(--border-strong); flex: none; }
.top .modulo { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.top .modulo b { font: 600 13px var(--f-titulo); letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .modulo span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; min-width: 0; }
.top .acc { display: flex; align-items: center; gap: 8px; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acento-linea); opacity: 0; transition: opacity var(--dur-2); }
.en-asig .top::after { opacity: 1; }
.qtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; }
.qtab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font: 500 12px var(--f-ui); text-decoration: none; white-space: nowrap; }
.qtab:hover { background: var(--surface); color: var(--text); }
.qtab[aria-current="true"] { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.qtab[aria-current="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--c); }
.qtab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- página ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 0 4px; isolation: isolate; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--f-titulo); letter-spacing: -.035em; margin: 10px 0 12px; color: var(--text); max-width: 20ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); font: 400 15px/1.6 var(--f-prosa); max-width: 60ch; }
.hero .halo { position: absolute; inset: -80px auto auto -120px; width: 520px; height: 320px; max-width: 120vw; background: radial-gradient(closest-side, var(--acento-halo), transparent 70%); pointer-events: none; filter: blur(10px); z-index: -1; transition: background var(--dur-3); }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; background: var(--acento-linea); -webkit-background-clip: text; background-clip: text; color: transparent; }
.en-asig .eyebrow { background: none; color: var(--acento-texto); }
.hero-stats { display: flex; gap: 10px; }
.stat { min-width: 120px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.stat .v { font: 600 26px/1 var(--f-titulo); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.seccion { margin-top: 34px; }
.seccion > h2 { font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 0 0 12px; }

/* ---------- tarjetas de asignatura ---------- */
.asigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.asig { position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 172px; padding: 20px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none; overflow: hidden; transition: border-color var(--dur-2), transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2); }
.asig::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c); }
.asig::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 22%, transparent), transparent); pointer-events: none; }
.asig:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); transform: translateY(-2px); box-shadow: 0 14px 34px -18px color-mix(in srgb, var(--c) 80%, transparent); }
.asig .sigla { font: 700 24px/1 var(--f-ui); letter-spacing: .02em; color: color-mix(in srgb, var(--c) 70%, var(--text)); }
.asig .sigla small { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: .06em; margin-left: 6px; }
.asig .nom { font: 600 15px/1.3 var(--f-titulo); letter-spacing: -.01em; color: var(--text); text-wrap: balance; }
.asig .pie { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: 500 11px var(--f-ui); }
.tag .d { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.tag.creador .d { background: var(--ok); }
.tag.pdf .d { background: var(--warn); }
.tag.vacia { color: var(--text-3); border-style: dashed; background: transparent; }

/* ---------- exámenes de una asignatura ---------- */
.columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.columna > h2 { display: flex; align-items: center; gap: 8px; font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.columna > h2 svg { width: 14px; height: 14px; color: var(--acento-texto); }
.columna > h2 .cuenta { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 11px; letter-spacing: 0; }
.columna .vacio { padding: 32px 22px; }
.examenes { display: grid; gap: 14px; }
.examen { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; padding: 22px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; color: inherit; text-decoration: none; transition: border-color var(--dur-2), transform var(--dur-2) var(--ease-out); }
.examen:hover { border-color: color-mix(in srgb, var(--acento) 50%, var(--border)); transform: translateY(-1px); }
.examen:hover .btn:not(.btn--primary) { background: var(--surface-2); }
.examen:not(.examen--creador)::before { opacity: .45; }
.examen::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--acento); }
.examen .num { grid-row: span 3; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--acento) 14%, transparent); color: var(--acento-texto); font: 700 14px var(--f-ui); }
.examen .cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.examen h3 { font: 600 18px/1.25 var(--f-titulo); letter-spacing: -.015em; margin: 0; color: var(--text); }
.examen .meta { font-size: 11.5px; color: var(--text-3); }
.examen .meta b { color: var(--acento-texto); font-weight: 600; }
.examen p { margin: 0; color: var(--text-2); font: 400 14px/1.55 var(--f-prosa); max-width: 70ch; }
.examen .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.examen .nota { font-size: 11px; color: var(--text-3); align-self: center; }
.vacio { padding: 40px 28px; border-radius: 16px; border: 1px dashed var(--border-strong); background: transparent; text-align: center; }
.vacio h3 { font: 600 18px var(--f-titulo); margin: 0 0 6px; color: var(--text); }
.vacio p { margin: 0 auto; color: var(--text-2); font: 400 14px/1.55 var(--f-prosa); max-width: 52ch; }
.vacio .ico { width: 44px; height: 44px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--acento) 14%, transparent); color: var(--acento-texto); }
.vacio .ico svg { width: 20px; height: 20px; }
.aviso { margin-top: 26px; font: 400 12.5px/1.55 var(--f-prosa); color: var(--text-3); max-width: 80ch; }

/* ---------- visor (creador o PDF dentro del menú) ---------- */
.visor { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.visor iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
/* Franja fina del menú encima del creador: sin logotipo ni título, para no duplicar la barra del creador */
.franja { position: relative; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: calc(4px + env(safe-area-inset-top, 0px)) 12px 4px; border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
.franja::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acento-linea); }
.franja .qtabs { flex: 1; min-width: 0; padding: 2px; }
.franja .qtab { height: 28px; padding: 0 10px; font-size: 11.5px; border-radius: 8px; }
.franja .btn--sm { min-height: 28px; }
.franja .icon-btn { width: 30px; flex: none; }
.chip-asig { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 8px; background: var(--acento-fondo); color: var(--acento-tinta); font: 700 12px var(--f-ui); letter-spacing: .04em; flex: none; }

.fade-in { animation: entra var(--dur-3) var(--ease-out) both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .asig, .btn { transition: none; } }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .columnas { grid-template-columns: 1fr; gap: 30px; }
  .hero-stats { flex-wrap: wrap; }
  .stat { flex: 1; min-width: 100px; }
}
@media (max-width: 640px) {
  .top { gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
  .top .qtabs { order: 10; width: 100%; }
  .top .c-wordmark, .top .sep { display: none; }
  .page { padding: 20px 16px 48px; }
  .examen { grid-template-columns: 1fr; padding: 18px 16px; }
  .examen .num { grid-row: auto; width: 36px; height: 36px; font-size: 12px; }
  .visor .btn .txt { display: none; }
}

<script>

//   #/            inicio con las asignaturas

//   #/PRO/ut2-3/creador     el creador de ese examen, dentro del menú
//   #/PRO/ut2-3/repaso/0    el PDF de repaso n.º 0 de ese examen
'use strict';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = 'concep.repasoExamenes.tema';
// Siempre se abre en claro; el botón cambia el tema solo mientras la página está abierta
const leerTema = () => 'light';
const guardarTema = t => { try { localStorage.setItem(LS, t); } catch (e) { /* sin almacenamiento: no pasa nada */ } };
let tema = leerTema();

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',

const LOCKUP = '<a class="c-lockup" href="#/" aria-label="Inicio"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#concep-simbolo"/></svg><span class="c-wordmark">Concep</span></a>';

// Texto legible sobre el color de la asignatura (blanco o negro según su luminancia)
function lum(hex) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function tinta(hex) { const L = lum(hex); return (1.05) / (L + .05) >= (L + .05) / .05 ? '#FFFFFF' : '#0B0B0C'; }
// Los colores muy oscuros (DJK, SSF) se aclaran en el tema oscuro para que se vean sobre el negro
const oscuro = hex => lum(hex) < .09;
const varsColor = a => 'style="--c0:' + a.color + '"' + (oscuro(a.color) ? ' data-oscuro' : '');
const ruta = r => encodeURI(r);
const nCreadores = a => a.examenes.filter(e => e.creador).length;
const nRepasos = a => a.examenes.reduce((s, e) => s + (e.repasos || []).length, 0);

const nombreDoc = (e, tipo) => (tipo === 'creador' ? 'Creador de examen ' : 'Resumen del examen ') + (/^(UT|Unit)/.test(e.unidades) ? e.unidades : 'de ' + e.unidades.toLowerCase());
const nombreCompleto = a => a.nombre + (a.ciclo ? ' (' + a.ciclo + ')' : '');

function themeClass() { return tema === 'light' ? 'concep' : 'concep-dark'; }
function mount(html, asig) {
  document.body.classList.toggle('claro', tema === 'light');
  const root = document.createElement('div');
  root.className = themeClass() + (asig ? ' en-asig' : '');
  if (asig) { root.style.setProperty('--asig0', asig.color); root.style.setProperty('--asig-tinta0', tinta(asig.color)); if (oscuro(asig.color)) root.dataset.oscuro = ''; }
  root.innerHTML = html;
  app.replaceChildren(root);
}
function topBar(centro, derecha) {
  return '<header class="top">' + LOCKUP + '<span class="sep" aria-hidden="true"></span>' + centro + '<div class="grow"></div><div class="acc">' + (derecha || '') +
    '<button class="btn btn--ghost icon-btn" data-tema title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">' + (tema === 'light' ? IC.moon : IC.sun) + '</button></div></header>';
}
function pestanas(actual) {
  return '<nav class="qtabs" aria-label="Asignaturas">' + ASIGNATURAS.map(a =>
    '<a class="qtab" href="#/' + a.id + '" ' + varsColor(a) + ' aria-current="' + (a.id === actual) + '" title="' + esc(nombreCompleto(a)) + '"><span class="dot"></span>' + a.id + '</a>').join('') + '</nav>';
}

function vistaInicio() {
  const total = ASIGNATURAS.reduce((s, a) => s + a.examenes.length, 0);
  const creadores = ASIGNATURAS.reduce((s, a) => s + nCreadores(a), 0);
  const tarjetas = ASIGNATURAS.map(a => {
    const c = nCreadores(a), r = nRepasos(a);
    const pie = a.examenes.length
      ? '<span class="tag">' + a.examenes.length + (a.examenes.length === 1 ? ' examen' : ' exámenes') + '</span>' +
        (c ? '<span class="tag creador"><span class="d"></span>' + c + (c === 1 ? ' creador' : ' creadores') + '</span>' : '') +
        (r ? '<span class="tag pdf"><span class="d"></span>' + r + (r === 1 ? ' resumen' : ' resúmenes') + '</span>' : '')
      : '<span class="tag vacia">Todavía sin nada</span>';
    return '<a class="asig" href="#/' + a.id + '" ' + varsColor(a) + '><span class="sigla">' + a.id + (a.ciclo ? '<small>' + a.ciclo + '</small>' : '') + '</span><span class="nom">' + esc(a.nombre) + '</span><span class="pie">' + pie + '</span></a>';
  }).join('');
  mount(topBar('<div class="modulo"><b>Repaso de exámenes</b><span>1.º DAM · CIFP César Manrique</span></div>') +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">Concep · 1.º DAM · 2026-2027</span>' +
    '<h1>Repaso de exámenes</h1><p>Todas las asignaturas en un sitio. Entra en una, elige el examen y practica con su creador o repasa el resumen.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + ASIGNATURAS.length + '</div><div class="l">Asignaturas</div></div><div class="stat"><div class="v">' + total + '</div><div class="l">Exámenes</div></div><div class="stat"><div class="v">' + creadores + '</div><div class="l">Creadores</div></div></div></section>' +
    '<section class="seccion" aria-labelledby="h-asigs"><h2 id="h-asigs">Asignaturas</h2><div class="asigs">' + tarjetas + '</div></section></main>');
  document.title = 'Repaso de exámenes · CONCEP';
}

function vistaAsignatura(a) {
  // Dos columnas fijas: creadores de examen y resúmenes. Cada tarjeta es un examen.
  const item = (e, i, href, ico, doc, nota, principal) =>
    '<a class="examen' + (principal ? ' examen--creador' : '') + '" href="' + href + '"><span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<div class="cab"><h3>' + esc(e.titulo) + '</h3><span class="meta"><b>' + esc(e.unidades) + '</b>' + (e.fecha ? ' · ' + esc(e.fecha) : '') + '</span></div>' +
    (e.descripcion ? '<p>' + esc(e.descripcion) + '</p>' : '') +
    '<div class="acciones"><span class="btn ' + (principal ? 'btn--primary' : '') + '">' + ico + esc(doc) + '</span>' + (nota ? '<span class="nota">' + esc(nota) + '</span>' : '') + '</div></a>';
  const creadores = [], resumenes = [];
  a.examenes.forEach((e, i) => {
    if (e.creador) creadores.push(item(e, i, '#/' + a.id + '/' + e.id + '/creador', IC.play, nombreDoc(e, 'creador'), e.creador.nota, true));
    (e.repasos || []).forEach((p, j) => resumenes.push(item(e, i, '#/' + a.id + '/' + e.id + '/repaso/' + j, IC.doc, nombreDoc(e, 'repaso'), p.nota, false)));
  });
  const vacio = (tit, txt) => '<div class="vacio"><div class="ico">' + IC.vacio + '</div><h3>' + tit + '</h3><p>' + txt + '</p></div>';
  const columna = (id, ico, tit, items, vac) =>
    '<section class="columna" aria-labelledby="' + id + '"><h2 id="' + id + '">' + ico + tit + '<span class="cuenta">' + items.length + '</span></h2>' +
    (items.length ? '<div class="examenes">' + items.join('') + '</div>' : vac) + '</section>';
  const lista = '<div class="columnas">' +
    columna('h-cre', IC.play, 'Creadores de examen', creadores, vacio('Todavía no hay creadores', 'Cuando hagamos un creador de examen para esta asignatura, aparecerá aquí.')) +
    columna('h-res', IC.doc, 'Resúmenes', resumenes, vacio('Todavía no hay resúmenes', 'Los resúmenes de examen en PDF de esta asignatura aparecerán aquí.')) + '</div>';
  mount(topBar(pestanas(a.id)) +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">' + a.id + ' · ' + (a.examenes.length ? a.examenes.length + (a.examenes.length === 1 ? ' examen' : ' exámenes') : 'sin exámenes') + '</span>' +
    '<h1>' + esc(nombreCompleto(a)) + '</h1></div></section>' +
    '<div class="seccion">' + lista + '</div>' +
    (a.examenes.some(e => e.creador) ? '<p class="aviso">Los creadores se abren dentro de este menú. Si alguno no guarda tu progreso o no se ve bien, usa «Abrir aparte» para abrirlo en su propia pestaña.</p>' : '') +
    '</main>', a);
  document.title = a.id + ' · Repaso de exámenes';
}

function vistaVisor(a, e, tipo, j) {
  const doc = tipo === 'creador' ? e.creador : (e.repasos || [])[j];
  if (!doc) return vistaAsignatura(a);
  // Los creadores reciben el tema del menú para que no salga uno claro encima de otro oscuro
  const src = ruta(doc.ruta) + (tipo === 'creador' ? '?tema=' + tema : ''), nombre = nombreDoc(e, tipo);
  // Solo una franja fina: volver y asignaturas. La barra con el logotipo es la del propio creador.
  mount('<div class="visor"><nav class="franja" aria-label="Menú de repaso"><a class="btn btn--ghost btn--sm" href="#/' + a.id + '" aria-label="Volver a ' + esc(a.nombre) + '">' + IC.back + '<span class="txt">Volver</span></a>' +
    pestanas(a.id) + '<a class="btn btn--ghost btn--sm icon-btn" href="' + src + '" target="_blank" rel="noopener" aria-label="Abrir aparte" title="Abrir en una pestaña aparte">' + IC.ext + '</a></nav>' +
    '<iframe src="' + src + '" title="' + esc(nombre) + '"></iframe></div>', a);
  const activa = app.querySelector('.qtab[aria-current="true"]');
  if (activa) activa.scrollIntoView({ inline: 'center', block: 'nearest' });
  document.title = nombre + ' · ' + a.id;
}

function router() {
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return ''; } };
  const [id, exId, tipo, j] = location.hash.replace(/^#\/?/, '').split('/').map(dec);
  const a = ASIGNATURAS.find(x => x.id === (id || '').toUpperCase());
  if (!a) return vistaInicio();
  const e = exId && a.examenes.find(x => x.id === exId);
  if (e && (tipo === 'creador' || tipo === 'repaso')) return vistaVisor(a, e, tipo, +j || 0);
  vistaAsignatura(a);
  window.scrollTo(0, 0);
  const activa = app.querySelector('.qtab[aria-current="true"]');
  if (activa) activa.scrollIntoView({ inline: 'center', block: 'nearest' });
}

app.addEventListener('click', ev => {
  if (ev.target.closest('[data-tema]')) {
    tema = tema === 'light' ? 'dark' : 'light'; guardarTema(tema);
    const root = app.firstElementChild;
    root.classList.remove('concep', 'concep-dark'); root.classList.add(themeClass());
    document.body.classList.toggle('claro', tema === 'light');
    ev.target.closest('[data-tema]').innerHTML = tema === 'light' ? IC.moon : IC.sun;
  }
});
window.addEventListener('hashchange', router);
router();

</script>
</body>
</html>
