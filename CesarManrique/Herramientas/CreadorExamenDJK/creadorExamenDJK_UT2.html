{t:"Características de las THD",q:"¿Cuántas características de las THD recogen los apuntes?",o:["Nueve","Cinco","Ocho","Doce"],e:"Nueve: versatilidad, automatización, interconexión, analítica avanzada, seguridad, escalabilidad, personalización, ahorro e innovación."},
{t:"Características de las THD",q:"Que el IoT sirva tanto en una cadena de producción como para apagar las luces de una oficina es un ejemplo de…",o:["versatilidad","escalabilidad","ahorro","seguridad"],e:"Versatilidad: las THD se aplican en muchas industrias y contextos."},
{t:"Características de las THD",q:"Un software de contabilidad que hace los cálculos solo, una vez introducidos los datos, es un ejemplo de…",o:["automatización","interconexión","personalización","innovación"],e:"Automatización: muchas THD son autónomas al hacer su trabajo."},
{t:"Características de las THD",q:"Una tienda online que une la compra, el cobro con tarjeta y el email de confirmación es un ejemplo de…",o:["interconexión","versatilidad","analítica avanzada","escalabilidad"],e:"Interconexión: las THD se comunican entre sí."},
{t:"Características de las THD",q:"Un sistema de reconocimiento facial que registra entradas y salidas y hace estadísticas de puntualidad es un ejemplo de…",o:["analítica avanzada","automatización","personalización","ahorro"],e:"Analítica avanzada: dan datos en tiempo real y permiten analizarlos."},
{t:"Características de las THD",q:"El cifrado de datos, la autenticación en varios pasos y la firma digital corresponden a la característica de…",o:["seguridad","interconexión","versatilidad","innovación"],e:"Seguridad: protección contra ciberamenazas con cifrado, autenticación en varios pasos (el SMS del banco), firma y certificados digitales."},
{t:"Características de las THD",q:"Que una THD pueda crecer y adaptarse según cambian las necesidades de la empresa es…",o:["escalabilidad","automatización","analítica avanzada","ahorro"],e:"Escalabilidad. Ejemplo: la realidad virtual de un restaurante que añade nuevos escenarios."},
{t:"Características de las THD",q:"Un sistema de recursos humanos con horarios flexibles y consulta de nóminas para cada empleado es un ejemplo de…",o:["personalización","seguridad","interconexión","versatilidad"],e:"Personalización: experiencias a medida que mejoran la satisfacción y la fidelización."},
{t:"Características de las THD",q:"«Gasto inicial alto, pero reducción de costes a largo plazo» describe la característica de…",o:["ahorro","innovación","escalabilidad","personalización"],e:"Ahorro. Ejemplo: la nevera inteligente de un restaurante que avisa de lo que falta."},
{t:"Características de las THD",q:"Que las THD permitan crear nuevos productos, servicios y modelos de negocio es la característica de…",o:["innovación","versatilidad","automatización","seguridad"],e:"Innovación: por ejemplo, la impresión 3D de piezas o la IA en marketing."},
// ---------- Productos y servicios ----------
{t:"Productos y servicios",q:"¿Qué es el time-to-market?",o:["El tiempo que tarda un producto en salir al mercado","El horario de apertura de una tienda online","El tiempo que un cliente pasa en una web","La fecha de caducidad de un producto"],e:"Time-to-market es el tiempo de salida al mercado; la automatización, la robótica y la nube lo acortan."},
{t:"Productos y servicios",q:"Pasar de vender una máquina industrial a vender su mantenimiento predictivo basado en datos es un ejemplo de…",o:["crear nuevos servicios digitales","diseño y prototipado acelerado","personalización masiva","reducción del time-to-market"],e:"Creación de nuevos servicios digitales: convertir productos tradicionales en servicios conectados."},
{t:"Productos y servicios",q:"¿Qué THD permiten simular y probar un producto antes de fabricar prototipos físicos caros?",o:["La inteligencia artificial y los gemelos digitales","La ciberseguridad y las redes de telefonía 5G","Los wearables y las aplicaciones móviles","El blockchain y la banca digital"],e:"Diseño y prototipado acelerado: la IA y los gemelos digitales simulan, prueban y optimizan antes de fabricar."},
// ---------- Empresas españolas ----------
{t:"Empresas españolas",q:"¿Qué empresa española es líder mundial en tecnología para el sector de los viajes y las reservas?",o:["Amadeus","Indra","Telefónica","Repsol"],e:"Amadeus IT Group: líder mundial en tecnología para viajes y reservas turísticas."},
{t:"Empresas españolas",q:"¿Qué empresa destaca por integrar la tienda física y la online y por la trazabilidad de su inventario?",o:["Inditex","Endesa","CaixaBank","Indra"],e:"Inditex es pionera en la integración del comercio físico y online y en la trazabilidad de inventarios."},
{t:"Empresas españolas",q:"Indra es un referente en transformación digital, sobre todo en…",o:["defensa y sistemas de tráfico aéreo","banca digital para pymes","moda y distribución","redes eléctricas inteligentes"],e:"Indra: defensa, sistemas de tráfico aéreo y soluciones tecnológicas avanzadas."},
{t:"Empresas españolas",q:"¿Qué porcentaje de empresas españolas tiene una estrategia de ciberseguridad formal?",o:["El 42,9 %","El 87,6 %","El 76 %","El 9 %"],e:"Solo el 42,9 % (menos de la mitad), aunque el 87,6 % se ve con digitalización media o avanzada."},
{t:"Empresas españolas",q:"¿Qué porcentaje de las empresas españolas usa la nube (cloud), base del resto de herramientas digitales?",o:["El 42 %","El 20 %","El 76 %","El 87,6 %"],e:"Cloud: 42 % de adopción. Big data: 47 %. IA: más del 20 %."},
{t:"Empresas españolas",q:"Según los barómetros de 2026, ¿qué porcentaje de pymes ha adoptado de forma sólida tecnologías punteras como IIoT o blockchain?",o:["El 9 %","El 44 %","El 79 %","El 31 %"],e:"El 79 % de las pymes cree que su digitalización es media o alta, pero solo el 9 % ha adoptado de forma sólida tecnologías punteras."},
// ---------- Sectores ----------
{t:"Aplicaciones por sectores",q:"La telemedicina y el monitoreo remoto de pacientes son aplicaciones de las THD en el sector…",o:["de la salud","de la educación","de la banca","de la construcción"],e:"Salud: monitoreo remoto, telemedicina, análisis de datos de salud, registros electrónicos y detección temprana."},
{t:"Aplicaciones por sectores",q:"¿Qué es BIM y en qué sector se usa?",o:["El modelado de información de construcción, en construcción y arquitectura","Un sistema de banca inteligente para detectar fraudes, en finanzas","Un formato de vídeo en streaming, en medios y entretenimiento","Un protocolo de votación, en la Administración pública"],e:"BIM (modelado de información de construcción) se usa en construcción y arquitectura."},
{t:"Aplicaciones por sectores",q:"La detección de fraudes y el análisis de riesgos son aplicaciones de las THD en…",o:["finanzas y banca","transporte y logística","energía y medio ambiente","educación"],e:"Finanzas y banca: banca en línea, pagos digitales, detección de fraudes, análisis de riesgos y carteras de inversión."},
{t:"Aplicaciones por sectores",q:"La gestión de flotas y la planificación de rutas son aplicaciones de las THD en…",o:["transporte y logística","comercio electrónico","seguridad y defensa","salud"],e:"Transporte y logística: gestión de flotas, logística de entrega, planificación de rutas y monitorización de vehículos."},
{t:"Aplicaciones por sectores",q:"La votación electrónica segura y la digitalización de trámites son aplicaciones de las THD en…",o:["el gobierno y la Administración pública","los medios y el entretenimiento","la fabricación","la energía"],e:"Gobierno y Administración: digitalización de trámites, votación electrónica segura y gestión de datos gubernamentales."},
// ---------- Medio ambiente ----------
{t:"Medio ambiente",q:"¿Qué son las prácticas empresariales sostenibles?",o:["Las que buscan equilibrar el éxito económico con el impacto social y ambiental","Las que reducen al mínimo los costes de producción a toda costa","Las que solo usan energía renovable en sus oficinas","Las que mantienen los mismos procesos durante muchos años"],e:"Equilibran el éxito económico con el impacto social y ambiental; son clave en la Industria 4.0."},
{t:"Medio ambiente",q:"¿Cuál de estos es un efecto POSITIVO de las THD en el medio ambiente?",o:["Menos uso de papel gracias a los documentos electrónicos","Más residuos electrónicos por la obsolescencia","Más consumo energético de los centros de datos","Agotamiento de minerales y metales"],e:"Positivos: menos papel, más eficiencia energética, menos desplazamientos (teletrabajo) y mejor monitoreo ambiental."},
{t:"Medio ambiente",q:"¿Cuál de estos es un daño de las THD al medio ambiente?",o:["Los residuos electrónicos por la obsolescencia rápida","La reducción de desplazamientos por el teletrabajo","La climatización automatizada de los edificios","El control de la calidad del aire con sensores y drones"],e:"Daños: residuos electrónicos, huella de carbono de dispositivos y centros de datos, más consumo energético, agotamiento de recursos e impacto en suelo y biodiversidad."},
// ---------- Impacto en las empresas ----------
{t:"Impacto en las empresas",q:"¿En qué dos grandes categorías impactan las THD en la empresa?",o:["Tecnologías de la Información (IT) y Tecnologías de la Operación (OT)","Tecnologías del Hardware (HW) y Tecnologías del Software (SW)","Tecnologías de Producción y Tecnologías de Venta","Tecnologías de la Industria (IT) y Tecnologías Ofimáticas (OT)"],e:"THD e IT (almacenamiento, protección, procesamiento y transmisión de datos) y THD y OT (monitorización, control de la producción y de la cadena de suministro)."},
{t:"Impacto en las empresas",q:"El control de la producción y de la cadena de suministro pertenece a…",o:["las Tecnologías de la Operación (OT)","las Tecnologías de la Información (IT)","el comercio electrónico","la Administración pública"],e:"OT: monitorización, control de la producción y control de la cadena de suministro."},
{t:"Impacto en las empresas",q:"El almacenamiento, la protección y la transmisión de datos pertenecen a…",o:["las Tecnologías de la Información (IT)","las Tecnologías de la Operación (OT)","la fabricación aditiva","la robótica colaborativa"],e:"IT: almacenamiento, protección de datos, procesamiento y transmisión de datos e información digital."},
{t:"Impacto en las empresas",q:"¿Cuál de estos es un cambio que las THD traen a los CLIENTES?",o:["Una mejor experiencia gracias a chatbots y asistentes virtuales","Modelos de negocio de economía colaborativa para la empresa","Menos errores humanos en la cadena de producción","Ventaja competitiva frente a otras empresas"],e:"Para los clientes: mejor experiencia (chatbots), información en tiempo real, personalización, más calidad y entregas rápidas, nuevas experiencias con AR y VR."},
{t:"Impacto en las empresas",q:"La economía colaborativa y los servicios de suscripción son ejemplos de…",o:["modelos de negocio disruptivos","prácticas empresariales sostenibles","Tecnologías de la Operación","errores al digitalizarse"],e:"Son modelos de negocio disruptivos, uno de los cambios que las THD traen a las empresas."},
// ---------- Trabajos de clase (exposiciones de cada THD, sin datos concretos) ----------
{t:"Trabajos: gemelos digitales",q:"¿Qué distingue a un gemelo digital de un simple modelo 3D?",o:["Que recibe datos en directo de sensores instalados en el objeto real","Que se dibuja a mano alzada antes de fabricar el objeto real","Que solo se usa en videojuegos y no en la industria","Que funciona sin ordenador, con maquetas a escala"],e:"El gemelo digital es una copia virtual que se actualiza en tiempo real con los datos de los sensores del objeto real; por eso puede prever fallos."},
{t:"Trabajos: gemelos digitales",q:"¿Por qué un gemelo digital reduce la contaminación por desplazamientos?",o:["Porque permite diagnosticar una máquina a distancia sin ir a revisarla","Porque obliga a fabricar las máquinas más cerca de los clientes","Porque prohíbe usar coches en las plantas industriales","Porque sustituye a los técnicos por robots que no viajan"],e:"Con el diagnóstico remoto los técnicos vigilan la planta desde una pantalla y no viajan para revisar averías menores."},
{t:"Trabajos: gemelos digitales",q:"En sanidad, un gemelo digital sirve para…",o:["simular cirugías complejas o mejorar la gestión de camas y urgencias","sustituir al médico en todas las consultas presenciales","guardar las facturas del hospital en papel","fabricar medicamentos con impresoras 3D"],e:"Se crean gemelos de órganos o del flujo de pacientes: se ensayan operaciones y se organizan mejor camas y urgencias."},
{t:"Trabajos: gemelos digitales",q:"¿Cuál es el principal problema ambiental de los gemelos digitales y su solución?",o:["Los servidores gastan mucha energía; se usan algoritmos eficientes y renovables","Generan mucho papel; se pasa todo a documentos electrónicos","Usan mucha agua para regar; se instalan sensores de humedad","Producen humo en las fábricas; se ponen filtros en las chimeneas"],e:"Procesar tantos datos en la nube consume mucha energía: la solución es una IA más eficiente y centros de datos con energía renovable."},
{t:"Trabajos: RA y RV",q:"¿Qué diferencia hay entre realidad aumentada (RA) y realidad virtual (RV)?",o:["La RA añade capas digitales al mundo real; la RV aísla en un entorno 100 % digital","La RA solo funciona con cascos; la RV solo funciona con teléfonos móviles","La RA es para videojuegos; la RV es exclusivamente para uso médico","La RA es en blanco y negro; la RV muestra el mundo real en color"],e:"RA: ves el entorno real enriquecido (móvil, tablet, gafas transparentes). RV: cascos o visores que te sumergen en un mundo simulado."},
{t:"Trabajos: RA y RV",q:"Proyectar esquemas de cableado sobre la pieza real mientras se ensambla es un uso de…",o:["la realidad aumentada","la realidad virtual","la fabricación aditiva","el blockchain"],e:"La RA superpone información digital sobre el objeto real: mantenimiento y montaje guiados, con asistencia remota."},
{t:"Trabajos: RA y RV",q:"¿Por qué la formación con RV reduce errores y accidentes?",o:["Porque se practica sin riesgo y tantas veces como haga falta","Porque así el trabajador ya no necesita aprender la tarea","Porque las máquinas reales dejan de usarse para siempre","Porque los cascos de RV avisan automáticamente a la policía"],e:"Se practica de forma continua y sin peligro: mejora la retención y baja el margen de error al pasar a la tarea real."},
{t:"Trabajos: RA y RV",q:"¿Qué es el modelo de «producto como servicio» aplicado a los visores de RA/RV?",o:["Alquilar los equipos; el fabricante los mantiene y los recicla","Regalar los visores a cambio de mostrar publicidad dentro","Vender los visores sin garantía para que salgan más baratos","Fabricar los visores solo bajo pedido con impresión 3D"],e:"Con el alquiler o leasing el fabricante mantiene, actualiza y recicla el equipo al final de su vida: menos residuos electrónicos."},
{t:"Trabajos: RA y RV",q:"¿Cuál es un impacto ambiental NEGATIVO de la RA y la RV?",o:["Los residuos electrónicos por la rápida obsolescencia de cascos y gafas","Que evitan desplazamientos para reuniones y formaciones","Que permiten prototipar en 3D sin construir maquetas","Que los simulacros virtuales no gastan agua ni extintores"],e:"Lo negativo: consumo energético del hardware y los centros de datos, y basura electrónica. Lo demás son impactos positivos."},
{t:"Trabajos: nube",q:"¿Cuáles son los tres pasos del funcionamiento de la nube?",o:["Solicitud del usuario, procesamiento en el centro de datos y respuesta al dispositivo","Compra del servidor, instalación en la oficina y copia en un disco externo","Diseño del producto, fabricación en serie y venta en tienda física","Captura con sensores, impresión en papel y archivo en carpetas"],e:"El usuario pide un servicio por internet, los servidores remotos lo procesan o guardan y devuelven el resultado casi al instante."},
{t:"Trabajos: nube",q:"En costes, pasar a la nube supone cambiar…",o:["una gran inversión inicial en servidores (CapEx) por pagar según el consumo (OpEx)","el pago por uso (OpEx) por una gran inversión inicial en servidores (CapEx)","los sueldos de los empleados por el alquiler de oficinas","los impuestos por subvenciones europeas"],e:"Se deja de comprar y mantener hardware propio y se paga una cuota por lo que se usa."},
{t:"Trabajos: nube",q:"¿Qué es la multi-tenancy y por qué ahorra energía?",o:["Varios clientes comparten aislados un mismo servidor físico y se aprovecha mejor","Cada cliente tiene su propio servidor físico aunque esté medio vacío","Los datos se copian en muchos países para que nunca se pierdan","Los servidores se apagan de noche y se encienden por la mañana"],e:"Compartir infraestructura aprovecha mejor la potencia del hardware que tener servidores propios infrautilizados."},
{t:"Trabajos: nube",q:"¿Qué mide el índice PUE de un centro de datos?",o:["Su eficiencia energética","Su velocidad de conexión a internet","El número de clientes que tiene","La cantidad de datos que almacena"],e:"PUE (Power Usage Effectiveness) mide la eficiencia energética; hoy es un criterio para elegir proveedor de nube."},
{t:"Trabajos: nube",q:"¿Por qué muchas empresas eligen una nube híbrida?",o:["Para tener lo más sensible en servidores privados y el resto en la nube pública","Para no tener que pagar nunca por ningún servicio de almacenamiento en internet","Porque la ley obliga a guardarlo todo en papel además de en la nube","Porque la nube pública no deja acceder a los datos desde un teléfono móvil"],e:"Por las leyes de privacidad (soberanía digital) se combinan nube pública y servidores privados para lo más sensible."},
{t:"Trabajos: nube",q:"Usar varios proveedores de nube a la vez (multicloud) ayuda sobre todo a…",o:["que la empresa siga funcionando aunque falle uno (continuidad de negocio)","que la empresa no necesite conexión a internet para trabajar","que los empleados no tengan que usar contraseñas","que los datos dejen de estar protegidos por ninguna ley"],e:"El multicloud da continuidad de negocio, análisis a gran escala y soporte a empleados repartidos por el mundo."},
{t:"Trabajos: ciberseguridad",q:"¿Qué tres aspectos de la información protege la ciberseguridad?",o:["Confidencialidad, integridad y disponibilidad","Velocidad, almacenamiento y conectividad","Autenticidad, rapidez y personalización","Volumen, velocidad y variedad"],e:"Que solo la vea quien debe (confidencialidad), que no se altere (integridad) y que esté accesible cuando haga falta (disponibilidad)."},
{t:"Trabajos: ciberseguridad",q:"¿Qué es el ransomware?",o:["Un ataque que bloquea los archivos y pide un rescate para devolverlos","Un correo falso que imita a un banco para robar contraseñas","Un envío masivo de peticiones para tumbar una página web","Un programa que acelera el ordenador eliminando archivos"],e:"Ransomware = secuestro de archivos. El phishing es el correo falso y el ataque de denegación de servicio es el que tumba la web."},
{t:"Trabajos: ciberseguridad",q:"Un ataque que entra en una empresa aprovechando su relación con un proveedor es un ataque…",o:["a la cadena de suministro","de phishing","interno","de fuerza bruta"],e:"Los atacantes entran por un proveedor y desde ahí llegan a más organizaciones."},
{t:"Trabajos: ciberseguridad",q:"¿Por qué se usan varias medidas de seguridad a la vez?",o:["Porque ninguna protección funciona al cien por cien","Porque la ley prohíbe usar una sola medida de seguridad","Porque así se gasta todo el presupuesto de informática","Porque cada empleado debe elegir la suya propia"],e:"No hay protección perfecta: se combinan red protegida, actualizaciones, contraseñas con doble verificación, copias de seguridad y formación."},
{t:"Trabajos: ciberseguridad",q:"Ante un ataque de ransomware, ¿por qué muchas instituciones no pagan el rescate?",o:["Porque pagar no garantiza recuperar los archivos ni que no vuelvan a atacar","Porque las copias de seguridad hacen que el ataque no tenga ningún efecto","Porque el rescate siempre se paga con dinero público de otro país","Porque los atacantes devuelven los archivos gratis pasados unos días"],e:"Pagar no asegura nada. Lo que funciona es prepararse: copias de seguridad, formación y ayuda especializada."},
{t:"Trabajos: ciberseguridad",q:"¿Cuál de estas medidas reduce el impacto ambiental de la ciberseguridad?",o:["Guardar solo las copias de seguridad necesarias y borrar lo que ya no haga falta","Cambiar todos los ordenadores cada pocos meses por otros más potentes","Duplicar todas las copias de seguridad en muchos servidores más","Tener sistemas mucho más grandes de lo que realmente se necesita"],e:"También ayuda usar centros de datos eficientes y renovables, reparar y reciclar equipos y priorizar la prevención."},
{t:"Trabajos: blockchain",q:"¿Qué es la blockchain?",o:["Un registro de datos distribuido que validan muchos nodos, sin un único centro","Una base de datos guardada en un único servidor central de un banco","Un programa de ofimática para editar documentos en grupo","Un tipo de cable de red para conectar centros de datos"],e:"Es un registro descentralizado: varios nodos validan los datos, que quedan registrados y se pueden rastrear (trazabilidad)."},
{t:"Trabajos: blockchain",q:"¿Por qué es prácticamente imposible modificar un dato de una blockchain?",o:["Habría que falsificar la mayoría de las copias repartidas por la red","Porque los bloques se guardan impresos en papel en una notaría","Porque solo el creador de la red conoce la contraseña de cada bloque","Porque los datos se borran automáticamente al cabo de un tiempo"],e:"Los bloques se encadenan con la huella del anterior y cada nodo tiene una copia: cambiar un dato exige reescribir más de la mitad de ellas."},
{t:"Trabajos: blockchain",q:"¿Qué son los contratos inteligentes (smart contracts)?",o:["Programas que ejecutan solos una transacción al cumplirse unas condiciones","Contratos de trabajo firmados con un bolígrafo digital en una tableta","Seguros que contratan las empresas para cubrirse ante ciberataques","Acuerdos entre empresas para compartir sus centros de datos"],e:"Automatizan las transacciones sin intermediarios y aceleran los procesos."},
{t:"Trabajos: blockchain",q:"¿Qué tipo de blockchain controla una única entidad que decide quién entra?",o:["Privada o permisionada","Pública","Híbrida o federada","Abierta o minera"],e:"Pública: cualquiera entra. Privada: una entidad autoriza el acceso. Híbrida: acceso restringido pero libro de consulta pública."},
{t:"Trabajos: blockchain",q:"Escanear un código QR del envase para ver todo el recorrido de un alimento es un ejemplo de…",o:["trazabilidad con blockchain","realidad aumentada","computación en el borde","fabricación aditiva"],e:"Se registra cada paso de la cadena de suministro (también la temperatura) y el cliente consulta el historial."},
{t:"Trabajos: blockchain",q:"¿Qué es el aprendizaje federado, propuesto para reducir el impacto de blockchain e IA?",o:["Entrenar modelos de IA con los datos guardados en local, sin centralizarlos","Guardar todos los datos del mundo en un único centro de datos gigante","Que varios gobiernos aprueben juntos una ley sobre la IA","Enseñar programación a los alumnos de varios países a la vez"],e:"Al no centralizar los datos se ahorra energía y se mejora la privacidad."},
{t:"Trabajos: Big Data e IA",q:"¿Cuáles son las «tres uves» del Big Data?",o:["Volumen, velocidad y variedad","Valor, verdad y visibilidad","Vídeo, voz y vatios","Venta, viaje y vivienda"],e:"Muchísimos datos, que llegan sin parar (tiempo real) y de muchos tipos (texto, fotos, vídeo, sensores)."},
{t:"Trabajos: Big Data e IA",q:"¿En qué se diferencia una IA de un programa normal?",o:["La IA encuentra patrones aprendiendo de ejemplos; el programa sigue reglas escritas","La IA sigue reglas escritas a mano; el programa aprende solo de ejemplos","La IA solo funciona sin internet; el programa necesita siempre la nube","No hay diferencia: son dos nombres para la misma cosa"],e:"Un programa hace lo que le escribimos; a una IA se le dan muchos ejemplos y encuentra los patrones. Por eso necesita Big Data."},
{t:"Trabajos: Big Data e IA",q:"¿En qué orden trabajan juntos el Big Data y la IA?",o:["Recoger, guardar y limpiar, entrenar, predecir","Predecir, entrenar, recoger, guardar y limpiar","Entrenar, predecir, borrar los datos, recoger","Guardar y limpiar, predecir, recoger, entrenar"],e:"Los dos primeros pasos son del Big Data (recoger y guardar limpio) y los dos últimos de la IA (entrenar y predecir)."},
{t:"Trabajos: Big Data e IA",q:"¿Qué es «entrenar» un modelo de IA?",o:["Darle muchos ejemplos con la respuesta correcta para que aprenda a reconocerlos","Escribir a mano todas las reglas que debe seguir en cada caso","Instalarlo en un ordenador más rápido para que vaya mejor","Conectarlo a internet para que copie las respuestas"],e:"Por ejemplo, miles de fotos marcadas «gato» o «no gato». La IA no piensa: si los datos son malos, se equivoca."},
{t:"Trabajos: Big Data e IA",q:"¿Cuál de estas es una solución para que el Big Data y la IA contaminen menos?",o:["Guardar solo los datos útiles y usar modelos de IA más pequeños","Guardar todos los datos para siempre por si algún día sirven","Usar modelos de IA cada vez más grandes en todos los casos","Enfriar los servidores con más agua evaporada"],e:"También: centros de datos con renovables y aprovechar el calor de los servidores para calefacción."},
{t:"Trabajos: Big Data e IA",q:"Un panel que junta los datos de ocupación de muchos hoteles sin mostrar los de cada uno es sobre todo…",o:["Big Data","inteligencia artificial","realidad virtual","robótica"],e:"Junta y muestra datos agregados: es Big Data. Sería IA si además aprendiera de ellos para predecir, por ejemplo, la demanda."},
{t:"Trabajos: robótica e IIoT",q:"¿Qué tres cosas hace un robot?",o:["Percibe su entorno, decide y actúa","Diseña, fabrica y vende productos","Guarda, copia y borra datos","Mide, imprime y archiva documentos"],e:"Percibe con sensores, decide en el controlador y actúa con los actuadores: es el control con realimentación."},
{t:"Trabajos: robótica e IIoT",q:"¿Qué es el efector final de un robot?",o:["La herramienta del extremo del brazo (pinza, ventosa…)","El ordenador que ejecuta el programa del robot","El motor que mueve cada articulación del brazo","El último programa que se le carga al robot"],e:"Partes: estructura mecánica (ejes), actuadores, sensores, controlador y efector final."},
{t:"Trabajos: robótica e IIoT",q:"¿Cómo consigue un cobot trabajar con seguridad junto a las personas?",o:["Limita su fuerza y velocidad y se detiene al tocar a alguien","Trabaja solo de noche, cuando no hay nadie en la nave","Se encierra siempre dentro de una jaula con vallas","Lo maneja una persona a distancia con un mando"],e:"Limita su fuerza y velocidad. Es una buena puerta de entrada a la robótica para una pyme."},
{t:"Trabajos: robótica e IIoT",q:"¿Qué diferencia hay entre un AGV y un AMR?",o:["El AGV sigue rutas fijas; el AMR calcula su ruta y esquiva obstáculos","El AGV vuela; el AMR se mueve por el suelo","El AGV es un brazo fijo; el AMR es un robot de cirugía","El AGV se controla por voz; el AMR, con un mando"],e:"Los dos son robots móviles; el AMR es autónomo y decide su recorrido."},
{t:"Trabajos: robótica e IIoT",q:"¿En qué se diferencia el IIoT del IoT de consumo?",o:["Se le exige más fiabilidad, respuesta inmediata y aguantar ambientes duros","Solo se usa en aparatos de casa como relojes y bombillas conectadas","No necesita sensores ni ningún tipo de conexión a la red","Es más barato porque un fallo no tiene consecuencias"],e:"En la industria un fallo puede parar una línea de producción: por eso se le exige mucho más."},
{t:"Trabajos: robótica e IIoT",q:"¿Cuándo conviene procesar los datos en el borde (edge) y no en la nube?",o:["Cuando hay que responder en milisegundos, cerca de la máquina","Cuando se quieren guardar y analizar volúmenes enormes de datos","Cuando no hay ninguna máquina conectada en la planta","Cuando los datos no se van a usar nunca"],e:"Edge: respuesta inmediata junto a la máquina. Nube: guardar y analizar grandes volúmenes."},
{t:"Trabajos: robótica e IIoT",q:"¿Qué es MQTT?",o:["Un protocolo ligero de mensajes: unos publican datos y otros se suscriben","Un tipo de robot colaborativo pensado para pequeñas empresas","Una norma europea para reciclar aparatos eléctricos y electrónicos","Un lenguaje de programación para crear páginas web dinámicas"],e:"MQTT (publicar/suscribir) y OPC UA son lenguajes comunes para que máquinas de distintas marcas se entiendan."},
{t:"Trabajos: robótica e IIoT",q:"El mantenimiento que repara justo cuando los datos indican que algo empieza a fallar es…",o:["predictivo","correctivo","preventivo","reactivo"],e:"Correctivo: tras la avería. Preventivo: según calendario (cambia piezas aún buenas). Predictivo: según los datos; es el uso estrella del IIoT."},
{t:"Trabajos: robótica e IIoT",q:"¿Cómo se complementan la robótica y el IIoT?",o:["El robot actúa y el IIoT informa: juntos miden, deciden y actúan","El IIoT sustituye a los robots en todas las fábricas","El robot guarda los datos y el IIoT fabrica las piezas","No se complementan: se usan siempre en sectores distintos"],e:"El propio robot es un dispositivo IIoT: sus sensores permiten predecir su mantenimiento."},
{t:"Trabajos de clase",q:"¿Qué tienen en común casi todas las THD expuestas en clase en su impacto ambiental?",o:["Dependen de centros de datos que gastan mucha energía y generan residuos electrónicos","Ninguna tiene impacto ambiental porque todo es digital","Todas consumen grandes cantidades de combustible fósil directamente","Todas contaminan el agua de los ríos cercanos a las fábricas"],e:"Las soluciones se repiten: energía renovable, eficiencia (PUE, modelos más pequeños), guardar solo lo útil, alargar la vida de los equipos y reciclar."}
];

const DESARROLLO = [
{t:"Qué son las THD",q:"¿Qué son las THD? Nombra y explica brevemente al menos cuatro de las tecnologías habilitadoras principales.",modelo:"Las tecnologías habilitadoras digitales son las herramientas y recursos tecnológicos que impulsan la innovación y la transformación digital de todos los sectores. Por ejemplo: los gemelos digitales replican una máquina o una planta para simular antes de cambiar lo real; la fabricación aditiva (impresión 3D) crea piezas a demanda con poco desperdicio; la ciberseguridad protege los sistemas conectados; la AR superpone información al mundo real y la VR sumerge en un entorno simulado; la nube almacena y procesa datos sin infraestructura propia; los robots y cobots automatizan tareas; el IIoT conecta sensores y máquinas en tiempo real, y el big data con IA analiza datos para prever averías.",ideas:["Definición: herramientas y recursos que impulsan la innovación y el desarrollo digital","Gemelos digitales o simulación, y fabricación aditiva (impresión 3D)","AR (superpone al mundo real) y VR (entorno simulado)","Nube, robots/cobots o IIoT explicados","Big data e IA, o ciberseguridad, explicados"]},
{t:"Características de las THD",q:"Explica las características de las THD poniendo un ejemplo de al menos cinco de ellas.",modelo:"Son nueve. Versatilidad: sirven en muchos sectores (el IoT en una fábrica o en una oficina). Automatización: trabajan solas (un software de contabilidad). Interconexión: se comunican entre sí (compra online, cobro y email de confirmación). Analítica avanzada: datos en tiempo real y su análisis (control de horarios con reconocimiento facial). Seguridad: cifrado, doble autenticación y firma digital. Escalabilidad: crecen con la empresa. Personalización: experiencias a medida que fidelizan. Ahorro: caras al principio pero rentables a largo plazo. Innovación: nuevos productos y modelos de negocio.",ideas:["Dice que son nueve","Versatilidad, automatización e interconexión con ejemplo","Analítica avanzada y seguridad con ejemplo","Escalabilidad y personalización","Ahorro (gasto inicial alto, ahorro a largo plazo) e innovación"]},
{t:"Medio ambiente",q:"Explica el impacto positivo y negativo de las THD en el medio ambiente.",modelo:"Positivo: menos uso de papel gracias a los documentos electrónicos, más eficiencia energética con climatización automatizada y gestión inteligente de la energía, menos desplazamientos gracias al teletrabajo y mejor vigilancia ambiental con sensores y drones. Negativo: residuos electrónicos por la obsolescencia rápida, huella de carbono de los dispositivos y los centros de datos, más consumo de energía por la nube, agotamiento de minerales y metales e impacto de la infraestructura digital en el suelo y la biodiversidad. Por eso las empresas deben aplicar prácticas sostenibles que equilibren beneficio económico e impacto social y ambiental.",ideas:["Positivo: menos papel y más eficiencia energética","Positivo: menos desplazamientos y mejor monitoreo ambiental","Negativo: residuos electrónicos y huella de carbono","Negativo: más consumo energético y agotamiento de recursos","Prácticas sostenibles: equilibrar beneficio económico e impacto social y ambiental"]},
{t:"Digitalizarse",q:"¿Qué supone digitalizar una empresa y qué errores hay que evitar?",modelo:"Digitalizarse no es instalar un programa o abrir una web, sino transformar a fondo la estrategia y la cultura de la empresa. Antes hay que conocer los habilitadores digitales y cómo mejora cada uno la innovación, la eficiencia, la competitividad, el trato al cliente y el respeto al medio ambiente, y avanzar con pequeños pasos integrando las tecnologías. Los cinco errores que hay que evitar son: no tener una estrategia global, no adaptarse a los cambios, intentar abarcarlo todo, no invertir en ciberseguridad y no medir ni evaluar el progreso.",ideas:["No es instalar un software o abrir una web: transforma estrategia y cultura","Conocer antes los habilitadores y avanzar con pequeños pasos","Errores: no tener estrategia global y no adaptarse a los cambios","Errores: intentar abarcarlo todo","Errores: no invertir en ciberseguridad y no medir el progreso"]},
{t:"Revoluciones industriales",q:"Explica las revoluciones industriales de la 1.0 a la 4.0 y las características de la Industria 4.0.",modelo:"La Revolución Industrial empezó en Gran Bretaña hacia 1760. La 1.0 trajo la máquina de vapor y el telar mecánico; la 2.0, la electricidad y la cadena de montaje; la 3.0, la electrónica, las tecnologías de la información, la robótica y los PLC. La 4.0 es la actual: fusiona el mundo físico, digital y biológico, la popularizó Klaus Schwab (Foro Económico Mundial) en 2016 e incorpora IoT, big data, nube, impresión 3D, sistemas ciberfísicos o cobots. Sus características son las fábricas inteligentes, la interconectividad y la personalización masiva, y su parte digital se consigue con las THD.",ideas:["Origen: Gran Bretaña, hacia 1760","1.0 vapor y telar; 2.0 electricidad y cadena de montaje","3.0 electrónica, TI, robótica y PLC","4.0: fusiona físico, digital y biológico; Klaus Schwab, 2016","Fábricas inteligentes, interconectividad y personalización masiva"]},
{t:"Impacto en las empresas",q:"¿Cómo cambian las THD las empresas y la experiencia de los clientes?",modelo:"Las THD impactan en dos categorías: las Tecnologías de la Información (almacenamiento, protección, procesamiento y transmisión de datos) y las Tecnologías de la Operación (monitorización y control de la producción y de la cadena de suministro). En las empresas traen automatización y eficiencia con IA e IoT (menos errores humanos), personalización de productos con impresión 3D y big data, innovación y modelos de negocio disruptivos como la economía colaborativa o la suscripción. Para los clientes suponen mejor experiencia con chatbots, información en tiempo real, personalización, más calidad y entregas rápidas, y nuevas experiencias con AR y VR.",ideas:["Dos categorías: IT y OT, con lo que incluye cada una","Empresas: automatización y eficiencia, menos errores","Empresas: personalización, innovación y modelos disruptivos","Clientes: chatbots, información en tiempo real y personalización","Clientes: más calidad, entregas rápidas y experiencias AR/VR"]},
{t:"Productos y servicios",q:"Explica cómo ayudan las THD a desarrollar nuevos productos y servicios.",modelo:"Las THD son el motor para rediseñar productos y servicios. Permiten el diseño y prototipado acelerado, porque la IA y los gemelos digitales simulan y prueban antes de fabricar prototipos caros; la personalización masiva gracias al IoT y al análisis de datos; la creación de nuevos servicios digitales, como pasar de vender una máquina a vender su mantenimiento predictivo; la toma de decisiones basada en datos (big data) para entender fallos y anticipar la demanda; y más eficiencia y agilidad, porque la automatización, la robótica y la nube reducen el time-to-market y los costes.",ideas:["Diseño y prototipado acelerado con IA y gemelos digitales","Personalización masiva con IoT y análisis de datos","Nuevos servicios digitales (ejemplo del mantenimiento predictivo)","Decisiones basadas en datos (big data)","Eficiencia y agilidad: menos time-to-market y costes"]},
{t:"Empresas españolas",q:"Describe la situación de la digitalización en las empresas españolas: empresas líderes y datos de adopción.",modelo:"Lideran la transformación digital Telefónica (redes, ciberseguridad y nube), CaixaBank y Santander (banca digital), Indra (defensa y tráfico aéreo), Amadeus (tecnología para viajes), Inditex (integración de tienda física y online) y Repsol y Endesa (redes eléctricas digitales y gemelos digitales). Por tecnologías, el 47 % usa big data, el 42 % la nube y más del 20 % la IA; el 76 % tiene digitalización básica. El 87,6 % se cree con digitalización media o avanzada, pero solo el 42,9 % tiene estrategia formal de ciberseguridad. En las pymes, el 79 % cree estar digitalizado, pero solo el 9 % usa de verdad tecnologías punteras. Hay una brecha entre lo que se cree y lo que se aplica.",ideas:["Al menos cuatro empresas líderes con su sector","Datos por tecnología: big data 47 %, nube 42 %, IA +20 %","Ciberseguridad: 87,6 % se ve digitalizada pero solo 42,9 % con estrategia","Pymes: 79 % se cree digitalizada, solo 9 % con tecnologías punteras","Conclusión: brecha entre lo que se cree y lo que se aplica"]},
{t:"Trabajos de clase",q:"Elige una THD de las expuestas en clase y explica qué es, cómo funciona, en qué sectores se usa y qué beneficios aporta.",modelo:"Ejemplo con Big Data e IA. El Big Data son cantidades de datos tan grandes que un ordenador normal no puede guardarlas ni procesarlas: tienen volumen, velocidad y variedad. La IA son programas que aprenden de ejemplos y encuentran patrones, en vez de seguir reglas escritas a mano. Funcionan juntas en cuatro pasos: se recogen los datos (móviles, webs, sensores), se guardan en la nube y se limpian, la IA se entrena con ellos y después predice ante casos nuevos. Se usan en transporte (predecir atascos), banca (detectar fraude en los pagos), agricultura (sensores que deciden cuándo regar), salud (revisar radiografías), turismo (ajustar precios según la demanda) y ocio (recomendaciones). Beneficios: decisiones basadas en datos, ahorro de tiempo, servicios personalizados y prevención de problemas, como cambiar una pieza antes de que se rompa.",ideas:["Qué es la tecnología, definida con precisión","Cómo funciona, por pasos o por partes","Al menos tres sectores con un uso concreto en cada uno","Al menos tres beneficios","Un ejemplo de uso real descrito sin inventar datos"]},
{t:"Trabajos de clase",q:"Explica el impacto ambiental de una THD expuesta en clase (lo positivo y lo negativo) y qué soluciones hay.",modelo:"Ejemplo con la nube. Lo negativo: los centros de datos están encendidos día y noche y necesitan mucha electricidad, también para refrigerar los servidores, y los equipos acaban como residuos electrónicos. Lo positivo: al compartir infraestructura entre muchos clientes (multi-tenancy) se aprovecha mejor el hardware que si cada empresa tuviera sus propios servidores medio vacíos, y se evitan desplazamientos y papel. Soluciones: mejorar la eficiencia energética de los centros de datos (medida con el índice PUE), alimentarlos con energía renovable, usar refrigeración más eficiente, guardar solo los datos útiles y alargar la vida de los equipos y reciclarlos bien.",ideas:["Impacto negativo: consumo eléctrico y refrigeración de los centros de datos","Impacto negativo: residuos electrónicos o uso de materias primas","Impacto positivo de esa tecnología (eficiencia, menos desplazamientos, menos desperdicio)","Soluciones: energía renovable y eficiencia (PUE, modelos más pequeños)","Soluciones: guardar solo lo útil, alargar la vida de los equipos y reciclar"]},
{t:"Trabajos de clase",q:"Explica cómo funciona un sistema IIoT por capas y cómo se combina con la robótica.",modelo:"Un sistema IIoT tiene cinco capas: los dispositivos (sensores que miden temperatura, vibración o consumo y actuadores que ejecutan órdenes); la conectividad (cable, wifi, 5G o redes de bajo consumo como LoRaWAN); el procesamiento, en el borde (edge) si hay que responder en milisegundos o en la nube si se quieren analizar muchos datos; la plataforma y el análisis con Big Data, IA y gemelos digitales; y la acción (paneles, alertas o ajustes automáticos). Para que máquinas de distintas marcas se entiendan se usan protocolos como MQTT u OPC UA. Su uso estrella es el mantenimiento predictivo. Con la robótica se complementa: el robot actúa y el IIoT informa. El propio robot lleva sensores que permiten predecir su mantenimiento, las flotas de robots se coordinan en red y los datos de calidad hacen que el robot aparte piezas defectuosas.",ideas:["Dispositivos y conectividad","Procesamiento en el borde o en la nube, con su diferencia","Plataforma de análisis y acción","Mantenimiento predictivo frente a correctivo y preventivo","Robótica + IIoT: el robot actúa, el IIoT informa"]}
];

</script>
<script>
// Creador de examen · Digitalización aplicada a los sectores productivos (DJK).
// Examen de 15 preguntas = 12 tipo test + 3 de desarrollo. Parte del creador de ITK.
// Test: 0,5 cada una; el fallo no resta. Desarrollo: 1 punto cada una. Máximo 9 puntos → la nota se pasa a 10.
// El desarrollo lo corrige el alumno marcando las ideas clave de la respuesta modelo.
// CONFIG (id, unidades, titulo) lo pone build.js; BANK y DESARROLLO vienen del banco de cada examen.
'use strict';
const app = document.getElementById('app');
const N_TEST = 12, N_DEV = 3, N_FALLOS = 10;
const P_OK = 0.5, P_MAL = 0, P_DEV = 1;
const ASIG = 'Digitalización';
const L = ['A', 'B', 'C', 'D'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

// ---------- almacenamiento (claves propias de cada examen) ----------
const K = s => CONFIG.id + '_' + s;
const MEM = {};
function store(k, v) {
  try {
    if (v === undefined) { const r = localStorage.getItem(k); return r === null ? (MEM[k] ?? null) : JSON.parse(r); }
    MEM[k] = v; localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { if (v === undefined) return MEM[k] ?? null; MEM[k] = v; }
}
const validas = new Set(BANK.map(q => q.q));
const seenMap = () => store(K('seen')) || {};
function failMap() { const f = store(K('fails')) || {}; Object.keys(f).forEach(k => { if (!validas.has(k)) delete f[k]; }); return f; }
const historial = () => store(K('hist')) || [];
// Tema: siempre claro al abrir; si lo abre el menú de repaso, usa el tema del menú (?tema=dark|light)
let tema = (new URLSearchParams(location.search).get('tema') === 'dark' ? 'dark' : 'light');

const IC = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>'
};
const LOCKUP = '<a class="c-lockup" href="#" data-ir="inicio" aria-label="Inicio"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#concep-simbolo"/></svg><span class="c-wordmark">Concep</span></a>';
const NOMBRE = 'Creador de examen ' + CONFIG.unidades;

function mount(html) {
  document.body.classList.toggle('claro', tema === 'light');
  const root = document.createElement('div');
  root.className = tema === 'light' ? 'concep' : 'concep-dark';
  root.innerHTML = html;
  app.replaceChildren(root);
  window.scrollTo(0, 0);
}
function topBar(centro, derecha) {
  return '<header class="top">' + LOCKUP + '<span class="sep" aria-hidden="true"></span>' + centro + '<div class="grow"></div><div class="acc">' + (derecha || '') +
    '<button class="btn btn--ghost icon-btn" data-tema title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">' + (tema === 'light' ? IC.moon : IC.sun) + '</button></div></header>';
}
const MODULO = '<div class="modulo"><b>' + ASIG + '</b><span>' + NOMBRE + '</span></div>';

// ---------- inicio ----------
function vistaInicio(abrir) {
  const h = historial(), f = failMap();
  const nf = Object.keys(f).length;
  const media = h.length ? h.reduce((s, x) => s + x, 0) / h.length : null;
  const fallos = BANK.filter(q => f[q.q]).sort((a, b) => f[b.q] - f[a.q]);
  mount(topBar(MODULO) +
    '<main class="page fade-in"><section class="hero"><div class="halo" aria-hidden="true"></div><div><span class="eyebrow">Concep · ' + ASIG + ' · ' + esc(CONFIG.unidades) + '</span>' +
    '<h1>' + esc(NOMBRE) + '</h1><p>' + esc(CONFIG.titulo) + '. Quince preguntas como en el examen: 12 tipo test y 3 de desarrollo. Al corregir ves la nota, la respuesta buena y por qué; el desarrollo lo comparas tú con la respuesta modelo.</p></div>' +
    '<div class="hero-stats"><div class="stat"><div class="v">' + (BANK.length + DESARROLLO.length) + '</div><div class="l">Preguntas</div></div><div class="stat"><div class="v">' + h.length + '</div><div class="l">' + (h.length === 1 ? 'Examen' : 'Exámenes') + '</div></div><div class="stat"><div class="v">' + (media === null ? '—' : fmt(media)) + '</div><div class="l">Nota media</div></div></div></section>' +
    '<div class="grid2">' +
    '<section class="card card--accent" aria-labelledby="h-nuevo"><h2 id="h-nuevo">Nuevo examen</h2><p class="sub">Preguntas de todo el temario de ' + esc(CONFIG.unidades) + ', primero las que menos has visto.</p>' +
    '<ul class="reglas"><li>12 preguntas tipo test con una sola respuesta correcta y 3 de desarrollo.</li><li>Cada pregunta del test vale 0,5 y los fallos no restan. Cada desarrollo vale 1 punto.</li><li>El máximo son 9 puntos; la nota se pasa a 10.</li></ul>' +
    '<div class="fila"><button class="btn btn--primary btn--lg" data-empezar="normal">' + IC.play + 'Empezar examen</button></div>' +
    (h.length ? '<div class="hist"><span>Últimos intentos</span>' + h.slice(-8).map(x => '<span class="nota-chip ' + (x >= 5 ? 'ap' : 'su') + '">' + fmt(x) + '</span>').join('') + '</div>' : '') +
    '</section>' +
    '<section class="card" aria-labelledby="h-fallos"><h2 id="h-fallos">Mis fallos</h2>' +
    (nf ? '<p class="sub">' + pl(nf, 'pregunta guardada', 'preguntas guardadas') + ' del test. Cada fallo o pregunta en blanco suma 1 y cada acierto resta 1; al llegar a 0 sale de la lista.</p>'
      : '<p class="vacio-txt">Aún no tienes fallos guardados. Haz un examen y aquí aparecerán las preguntas del test que falles o dejes en blanco.</p>') +
    '<div class="fila"><button class="btn btn--primary" data-empezar="fallos"' + (nf ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (nf ? ' (' + Math.min(N_FALLOS, nf) + ')' : '') + '</button>' +
    '<button class="btn" data-ver-fallos' + (nf ? '' : ' disabled') + ' aria-expanded="' + (abrir === 'lista') + '">Ver lista</button><button class="btn btn--ghost" data-copia aria-expanded="' + (abrir === 'copia') + '">Copia de seguridad</button></div>' +
    '<div id="lista"' + (abrir === 'lista' && nf ? '' : ' hidden') + '><ol class="lista-fallos">' + fallos.map(q => '<li><span class="x">×' + f[q.q] + '</span>' + esc(q.q) + '<span class="ok">✓ ' + esc(q.o[0]) + '</span></li>').join('') + '</ol>' +
    '<div class="fila" style="margin-top:10px"><button class="btn btn--danger btn--sm" data-vaciar>Vaciar lista de fallos</button></div></div>' +
    '<div id="copia"' + (abrir === 'copia' ? '' : ' hidden') + '><p class="vacio-txt" style="margin:16px 0 0">Los fallos se guardan solo en este navegador. Copia este texto para no perderlos, o pega uno para restaurarlos.</p>' +
    '<textarea class="copia" id="copiaTxt" spellcheck="false" aria-label="Copia de seguridad de los fallos">' + esc(JSON.stringify(f)) + '</textarea>' +
    '<div class="fila" style="margin-top:8px"><button class="btn btn--sm" data-copiar>Copiar</button><button class="btn btn--sm" data-restaurar>Restaurar desde el texto</button><span class="msg" id="copiaMsg" role="status"></span></div></div>' +
    '</section></div></main>');
  document.title = NOMBRE + ' · ' + ASIG;
}

// ---------- examen ----------
// examen = { modo, items: [{tipo:'test', q, opts, resp, prev} | {tipo:'dev', d, texto, marcadas:Set}], corregido, guardado }
let examen = null;
function porVistas(pool) { const seen = seenMap(); return shuffle(pool).sort((a, b) => (seen[a.q] || 0) - (seen[b.q] || 0)); }
function empezar(modo) {
  const f = failMap();
  let test, dev = [];
  if (modo === 'fallos') {
    test = shuffle(shuffle(BANK.filter(q => f[q.q])).sort((a, b) => f[b.q] - f[a.q]).slice(0, N_FALLOS));
    if (!test.length) return;
  } else {
    test = porVistas(BANK).slice(0, N_TEST);
    dev = porVistas(DESARROLLO).slice(0, N_DEV);
  }
  examen = {
    modo, corregido: false, guardado: false,
    items: [...test.map(q => ({ tipo: 'test', q, opts: shuffle(q.o.map((text, k) => ({ text, ok: k === 0 }))), resp: null, prev: f[q.q] || 0 })),
      ...dev.map(d => ({ tipo: 'dev', d, texto: '', marcadas: new Set() }))]
  };
  vistaExamen();
}
const respondida = x => x.tipo === 'test' ? x.resp !== null : x.texto.trim() !== '';
function htmlTest(it, n, corregida) {
  const ci = it.opts.findIndex(o => o.ok);
  let estado = '';
  if (corregida) estado = it.resp === null ? '<span class="estado blanco">En blanco · 0</span>' : it.resp === ci ? '<span class="estado bien">Correcta · +' + fmt(P_OK).replace(/0$/, '') + '</span>' : '<span class="estado mal">Incorrecta · ' + (P_MAL ? '−' + fmt(P_MAL) : '0') + '</span>';
  return '<article class="q' + (corregida ? ' hecha' : '') + '" id="p' + n + '"><div class="meta"><span class="n">Pregunta ' + (n + 1) + '</span><span>· ' + esc(it.q.t) + '</span>' +
    (it.prev && !corregida ? '<span>· fallada ' + pl(it.prev, 'vez', 'veces') + '</span>' : '') + estado + '</div>' +
    '<h3 id="h' + n + '">' + esc(it.q.q) + '</h3><div class="opts" role="radiogroup" aria-labelledby="h' + n + '">' +
    it.opts.map((o, k) => {
      const cls = corregida ? (k === ci ? ' bien' : (k === it.resp ? ' mal' : '')) : '';
      return '<label class="opt' + cls + '"><input type="radio" name="q' + n + '" value="' + k + '"' + (it.resp === k ? ' checked' : '') + (corregida ? ' disabled' : '') + '><span class="l">' + L[k] + '</span><span class="t">' + esc(o.text) + '</span></label>';
    }).join('') + '</div>' +
    (corregida ? '<div class="expl"><b>Respuesta correcta: ' + L[ci] + ') ' + esc(it.opts[ci].text) + '</b><br>' + esc(it.q.e) + '</div>' : '') + '</article>';
}
const puntosDev = it => P_DEV * it.marcadas.size / it.d.ideas.length;
function htmlDev(it, n, corregida) {
  return '<article class="q' + (corregida ? ' hecha' : '') + '" id="p' + n + '"><div class="meta"><span class="n">Pregunta ' + (n + 1) + '</span><span class="tipo">Desarrollo</span><span>· ' + esc(it.d.t) + '</span></div>' +
    '<h3 id="h' + n + '">' + esc(it.d.q) + '</h3>' +
    '<textarea class="resp" data-dev="' + n + '" aria-labelledby="h' + n + '" placeholder="Escribe tu respuesta en unas pocas líneas…"' + (corregida ? ' readonly' : '') + '>' + esc(it.texto) + '</textarea>' +
    (corregida ? '<div class="modelo"><b>Respuesta modelo</b><br>' + esc(it.d.modelo) + '</div>' +
      '<div class="ideas" role="group" aria-labelledby="ideas' + n + '"><span class="lbl" id="ideas' + n + '">Marca las ideas que has puesto en tu respuesta</span>' +
      it.d.ideas.map((idea, k) => '<label class="idea"><input type="checkbox" data-idea="' + n + ':' + k + '"' + (it.marcadas.has(k) ? ' checked' : '') + (examen.guardado ? ' disabled' : '') + '><span>' + esc(idea) + '</span></label>').join('') +
      '<div class="puntos-dev" id="pd' + n + '">' + fmt(puntosDev(it)) + ' de ' + fmt(P_DEV) + ' puntos</div></div>' : '') + '</article>';
}
function vistaExamen() {
  const it = examen.items;
  const nTest = it.filter(x => x.tipo === 'test').length, nDev = it.length - nTest;
  mount(topBar('<button class="btn btn--ghost btn--sm" data-salir>' + IC.back + 'Salir</button><div class="modulo"><b>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : 'Examen') + '</b><span>' + pl(nTest, 'pregunta tipo test', 'preguntas tipo test') + (nDev ? ' + ' + nDev + ' de desarrollo' : '') + '</span></div>',
    '<span class="progreso" id="prog" aria-live="polite"></span>') +
    '<main class="examen-page fade-in">' + it.map((x, n) => x.tipo === 'test' ? htmlTest(x, n, false) : htmlDev(x, n, false)).join('') + '</main>' +
    '<div class="barra-fija"><div class="in"><button class="btn btn--primary" data-corregir>' + IC.check + 'Corregir examen</button><nav class="puntos" aria-label="Ir a una pregunta" id="puntos"></nav><span class="aviso" id="aviso" role="status"></span></div></div>');
  progreso();
}
function progreso() {
  const r = examen.items.filter(respondida).length;
  const p = document.getElementById('prog'); if (p) p.textContent = r + '/' + examen.items.length;
  const pt = document.getElementById('puntos');
  if (pt) pt.innerHTML = examen.items.map((x, n) => '<a href="#p' + n + '" class="' + (respondida(x) ? 'r' : '') + '" aria-label="Pregunta ' + (n + 1) + (respondida(x) ? ', respondida' : '') + '">' + (n + 1) + '</a>').join('');
}

// ---------- corrección ----------
function cuentas() {
  let ok = 0, mal = 0, blanco = 0, dev = 0;
  examen.items.forEach(x => {
    if (x.tipo === 'dev') { dev += puntosDev(x); return; }
    const ci = x.opts.findIndex(o => o.ok);
    if (x.resp === null) blanco++; else if (x.resp === ci) ok++; else mal++;
  });
  const test = ok * P_OK - mal * P_MAL;
  const maximo = examen.items.reduce((s, x) => s + (x.tipo === 'test' ? P_OK : P_DEV), 0);
  const bruto = Math.max(0, test + dev);
  return { ok, mal, blanco, test, dev, maximo, bruto, nota: bruto * 10 / maximo };
}
function corregir() {
  examen.corregido = true;
  const tests = examen.items.filter(x => x.tipo === 'test');
  // preguntas vistas y registro de fallos del test (se guarda al corregir)
  const seen = seenMap(); examen.items.forEach(x => { const k = x.tipo === 'test' ? x.q.q : x.d.q; seen[k] = (seen[k] || 0) + 1; }); store(K('seen'), seen);
  const f = failMap(); let nuevas = 0, superadas = 0;
  tests.forEach(x => {
    const bien = x.resp !== null && x.opts[x.resp].ok;
    if (!bien) { if (!f[x.q.q]) nuevas++; f[x.q.q] = (f[x.q.q] || 0) + 1; }
    else if (f[x.q.q]) { f[x.q.q]--; if (f[x.q.q] <= 0) { delete f[x.q.q]; superadas++; } }
  });
  store(K('fails'), f);
  examen.fallosInfo = { nuevas, superadas, quedan: Object.keys(f).length };
  if (!examen.items.some(x => x.tipo === 'dev')) guardarNota();
  vistaResultado();
}
function guardarNota() {
  if (examen.guardado) return;
  examen.guardado = true;
  const h = historial(); h.push(cuentas().nota); store(K('hist'), h.slice(-20));
}
function htmlCabecera() {
  const c = cuentas(), ap = c.nota >= 5, fi = examen.fallosInfo, hayDev = examen.items.some(x => x.tipo === 'dev');
  return '<div class="resultado"><div class="big">' + fmt(c.nota) + '<small> /10</small></div>' +
    '<div><div class="veredicto ' + (ap ? 'ap' : 'su') + '">' + (c.nota >= 9 ? 'Sobresaliente' : c.nota >= 7 ? 'Notable' : c.nota >= 6 ? 'Bien' : ap ? 'Aprobado' : 'Suspenso') + (hayDev && !examen.guardado ? ' (falta corregir el desarrollo)' : '') + '</div><div class="medidor"><div style="width:' + Math.min(100, c.nota * 10) + '%"></div></div>' +
    '<div class="resumen">' + fmt(c.bruto) + ' de ' + fmt(c.maximo).replace(/,00$/, '') + ' puntos · ' + pl(c.ok, 'correcta', 'correctas') + ' · ' + pl(c.mal, 'incorrecta', 'incorrectas') + ' · ' + c.blanco + ' en blanco</div>' +
    '<div class="resumen">Lista de fallos: ' + (fi.nuevas ? '+' + pl(fi.nuevas, 'nueva', 'nuevas') : 'ninguna nueva') + (fi.superadas ? ' · ' + pl(fi.superadas, 'superada', 'superadas') : '') + ' · ' + fi.quedan + ' en total.</div></div></div>' +
    '<div class="desglose"><div><div class="v">+' + fmt(c.ok * P_OK) + '</div><div class="l">Aciertos test</div></div>' + (P_MAL ? '<div><div class="v">' + (c.mal ? '−' : '') + fmt(c.mal * P_MAL) + '</div><div class="l">Fallos test</div></div>' : '') +
    (hayDev ? '<div><div class="v">+' + fmt(c.dev) + '</div><div class="l">Desarrollo</div></div>' : '') + '<div><div class="v">' + fmt(c.bruto) + '</div><div class="l">Total (sobre ' + fmt(c.maximo).replace(/,00$/, '') + ')</div></div></div>';
}
function vistaResultado() {
  const it = examen.items, hayDev = it.some(x => x.tipo === 'dev');
  const quedan = examen.fallosInfo.quedan;
  const orden = hayDev ? [...it.map((x, n) => [x, n]).filter(([x]) => x.tipo === 'dev'), ...it.map((x, n) => [x, n]).filter(([x]) => x.tipo === 'test')] : it.map((x, n) => [x, n]);
  mount(topBar('<button class="btn btn--ghost btn--sm" data-ir="inicio">' + IC.back + 'Inicio</button><div class="modulo"><b>Resultado</b><span>' + (examen.modo === 'fallos' ? 'Examen de mis fallos' : NOMBRE) + '</span></div>') +
    '<main class="examen-page fade-in"><section class="card card--accent"><div id="cab">' + htmlCabecera() + '</div>' +
    '<div class="fila" style="margin-top:16px">' + (hayDev ? '<button class="btn btn--primary" data-guardar' + (examen.guardado ? ' disabled' : '') + '>' + IC.save + (examen.guardado ? 'Nota guardada' : 'Guardar nota') + '</button>' : '') +
    '<button class="btn' + (hayDev ? '' : ' btn--primary') + '" data-empezar="normal">' + IC.play + 'Nuevo examen</button><button class="btn" data-empezar="fallos"' + (quedan ? '' : ' disabled') + '>' + IC.redo + 'Examen de mis fallos' + (quedan ? ' (' + Math.min(N_FALLOS, quedan) + ')' : '') + '</button></div></section>' +
    (hayDev && !examen.guardado ? '<p class="pendiente" style="margin-top:18px"><b>Corrige tu desarrollo.</b> Compara cada respuesta con la modelo y marca las ideas que hayas puesto: cada pregunta vale ' + fmt(P_DEV).replace(/,00$/, '') + ' punto repartido entre sus ideas.' + ' Cuando acabes, pulsa «Guardar nota».</p>' : '') +
    '<h2 class="seccion-t">Corrección</h2>' + orden.map(([x, n]) => x.tipo === 'test' ? htmlTest(x, n, true) : htmlDev(x, n, true)).join('') + '</main>');
}

// ---------- eventos ----------
function armar(b, texto, alDesarmar) {
  if (b.dataset.c) return false;
  const antes = b.innerHTML;
  b.dataset.c = '1'; b.lastChild.textContent = texto;
  setTimeout(() => { if (b.isConnected && b.dataset.c) { delete b.dataset.c; b.innerHTML = antes; if (alDesarmar) alDesarmar(); } }, 4000);
  return true;
}
function cambiarTema(btn) {
  tema = tema === 'light' ? 'dark' : 'light'; store('concep_tema', tema);
  const root = app.firstElementChild; root.classList.remove('concep', 'concep-dark'); root.classList.add(tema === 'light' ? 'concep' : 'concep-dark');
  document.body.classList.toggle('claro', tema === 'light'); btn.innerHTML = tema === 'light' ? IC.moon : IC.sun;
}
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.dev !== undefined && examen && !examen.corregido) { examen.items[+t.dataset.dev].texto = t.value; progreso(); }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.type === 'radio' && examen && !examen.corregido) { examen.items[+t.name.slice(1)].resp = +t.value; progreso(); const a = document.getElementById('aviso'); if (a) a.textContent = ''; }
  if (t.dataset.idea && examen && examen.corregido && !examen.guardado) {
    const [n, k] = t.dataset.idea.split(':').map(Number), it = examen.items[n];
    t.checked ? it.marcadas.add(k) : it.marcadas.delete(k);
    document.getElementById('pd' + n).textContent = fmt(puntosDev(it)) + ' de ' + fmt(P_DEV) + ' puntos';
    document.getElementById('cab').innerHTML = htmlCabecera();
  }
});
app.addEventListener('click', async ev => {
  const b = ev.target.closest('button, a[data-ir]');
  if (!b) return;
  if (b.hasAttribute('data-tema')) return cambiarTema(b);
  if (b.dataset.ir === 'inicio') {
    ev.preventDefault();
    if (examen && examen.corregido && !examen.guardado) guardarNota(); // no se pierde la nota si sales sin pulsar «Guardar»
    examen = null; return vistaInicio();
  }
  if (b.dataset.empezar) { if (examen && examen.corregido && !examen.guardado) guardarNota(); return empezar(b.dataset.empezar); }
  if (b.hasAttribute('data-guardar')) { guardarNota(); return vistaResultado(); }
  if (b.hasAttribute('data-salir')) {
    if (armar(b, '¿Seguro?')) return;
    examen = null; return vistaInicio();
  }
  if (b.hasAttribute('data-corregir')) {
    const blancas = examen.items.filter(x => !respondida(x)).length;
    const aviso = document.getElementById('aviso');
    if (blancas && armar(b, 'Corregir igualmente', () => { aviso.textContent = ''; })) { aviso.textContent = (blancas === 1 ? 'Te queda 1 pregunta' : 'Te quedan ' + blancas + ' preguntas') + ' sin responder.'; return; }
    return corregir();
  }
  if (b.hasAttribute('data-ver-fallos')) { const l = document.getElementById('lista'); l.hidden = !l.hidden; b.setAttribute('aria-expanded', !l.hidden); return; }
  if (b.hasAttribute('data-copia')) { const c = document.getElementById('copia'); c.hidden = !c.hidden; b.setAttribute('aria-expanded', !c.hidden); return; }
  if (b.hasAttribute('data-vaciar')) {
    if (armar(b, 'Pulsa otra vez para vaciarla')) return;
    store(K('fails'), {}); return vistaInicio();
  }
  if (b.hasAttribute('data-copiar')) {
    const ta = document.getElementById('copiaTxt'), m = document.getElementById('copiaMsg');
    try { await navigator.clipboard.writeText(ta.value); m.textContent = 'Copiado'; } catch (e) { ta.select(); m.textContent = 'Selecciona el texto y cópialo a mano'; }
    return;
  }
  if (b.hasAttribute('data-restaurar')) {
    const m = document.getElementById('copiaMsg');
    try {
      const data = JSON.parse(document.getElementById('copiaTxt').value);
      if (typeof data !== 'object' || Array.isArray(data) || !data) throw 0;
      const limpio = {}; Object.entries(data).forEach(([k, v]) => { if (validas.has(k) && +v > 0) limpio[k] = Math.round(+v); });
      if (!Object.keys(limpio).length) { m.textContent = 'La copia no tiene ninguna pregunta válida; no se ha cambiado nada. Para borrar la lista usa «Vaciar».'; return; }
      store(K('fails'), limpio); vistaInicio('copia');
      document.getElementById('copiaMsg').textContent = Object.keys(limpio).length === 1 ? 'Restaurada 1 pregunta' : 'Restauradas ' + Object.keys(limpio).length + ' preguntas';
    } catch (e) { m.textContent = 'El texto no es una copia válida'; }
  }
});
// Si se cierra la pestaña o el menú cambia de vista (el iframe recibe pagehide, no beforeunload), la nota no se pierde
const guardarAlSalir = () => { if (examen && examen.corregido && !examen.guardado) guardarNota(); };
window.addEventListener('beforeunload', guardarAlSalir);
window.addEventListener('pagehide', guardarAlSalir);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarAlSalir(); });
vistaInicio();

</script>
</body>
</html>
